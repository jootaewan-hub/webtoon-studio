 손목에서 회색·버건디·민트·하늘색·금색 다섯 가닥 냄새 선이 꼬여 올라온다. 의상 색은 본편과 같다. 효과음은 코미디 고딕(Black Han Sans).", "summary": "[트랙2] 가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "19시 13분, 101동 38층."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "칙"}, {"type": "narration", "speaker": "내레이션", "text": "손목에서 다섯 가지 냄새가 땀과 섞여 백화점 1층 화장품 코너 같은 냄새가 났다."}], "flags": ["intimate"], "thumb": "thumbs/6-034.svg"}, {"id": "6-035", "chapter": "6화. 생일", "scene": "S#8 십 분 뒤에 다시 와 (101동 엘리베이터 → 38층 3801호 현관, 10월 16일 금 저녁 7:13)", "width": 800, "height": 1640, "shot": "FS · 뒷모습 · 유진(전경·중), 도겸(후경·중)", "screen": "3801호 현관 설정샷(C4, 현관 중문 앞에서 현관문 쪽). 열린 현관문 너머 엘리베이터 홀의 빛 속에 상자 셋을 낀 도겸이 서 있고, 전경에 그를 맞는 유진의 뒷모습. 가는 끈 두 줄만 걸린 어깨 아래로 등이 허리 끝까지 깊게 파여 척추 골에 센서등 빛이 한 줄 흐르고, 실크가 골반을 물처럼 타고 흘러내리다 양옆 높은 트임으로 긴 다리가 드러난다. 긴 진주 드롭 귀걸이가 흔들리고, 신발장 니치에 화이트머스크 디퓨저.", "summary": "3801호 현관 설정샷(C4, 현관 중문 앞에서 현관문 쪽).", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/6-035.svg"}, {"id": "6-036", "chapter": "6화. 생일", "scene": "S#8 십 분 뒤에 다시 와 (101동 엘리베이터 → 38층 3801호 현관, 10월 16일 금 저녁 7:13)", "width": 800, "height": 760, "shot": "BS · 아이레벨 · 유진(중)", "screen": "정면. 실크가 가슴과 허리를 물처럼 타고 흐르고, 진주 귀걸이가 턱선 아래에서 멈춘다. 입꼬리만 아주 조금 올라간 공손한 웃음, 나른하게 처진 눈은 웃지 않는다. 말풍선 우상.", "summary": "정면.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "여보, 아직 준비가 덜 됐어요. 십 분 뒤에 다시 와요."}], "flags": [], "thumb": "thumbs/6-036.svg"}, {"id": "6-037", "chapter": "6화. 생일", "scene": "S#8 십 분 뒤에 다시 와 (101동 엘리베이터 → 38층 3801호 현관, 10월 16일 금 저녁 7:13)", "width": 800, "height": 1400, "shot": "INS · 아이레벨 · 도겸(상단)", "screen": "세 단. 상단: 닫힌 현관문 앞에서 손가락을 하나씩 접는 도겸(이마의 땀, 상자 셋). 가운데: 0.5초씩 스치는 다섯 개의 플래시 띠, 버건디 벨벳·금색 시퀸·민트 컷아웃·하늘색 니트·은회색 실크 드레스 조각(얼굴 없이 천의 질감만). 하단: 양손에 나눠 꺼내 든 향수병 다섯 개의 뚜껑이 가운데 띠와 같은 색, 같은 순서(버건디·금색·민트·하늘색·회색)로 나란히. 내레이션 박스는 단마다 하나.", "summary": "세 단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "문이 닫혔다. 그는 그제야 색깔을 셌다."}, {"type": "narration", "speaker": "내레이션", "text": "버건디, 금색, 민트, 하늘색, 회색."}, {"type": "narration", "speaker": "내레이션", "text": "주머니 속 향수병 뚜껑과 같은 색이었다. 순서까지 그가 오늘 돈 순서와 같았다."}], "flags": ["intimate"], "thumb": "thumbs/6-037.svg"}, {"id": "6-038", "chapter": "6화. 생일", "scene": "S#8 십 분 뒤에 다시 와 (101동 엘리베이터 → 38층 3801호 현관, 10월 16일 금 저녁 7:13)", "width": 800, "height": 1040, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "101동 엘리베이터 안. 회색·버건디·민트·하늘색·금색 테두리 말풍선 다섯 겹이 그의 머리 위에서 겹쳐 울리고, 그가 고개를 한 번 턴다. 아래 칸에서 B2에 닿은 문이 열리고 그만 내린다, 빈 엘리베이터 안에 다섯 겹 말풍선의 흐린 윤곽만 남는다. 내레이션 박스 상단과 하단.", "summary": "101동 엘리베이터 안.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그리고 다섯 명이 똑같이 말했다."}, {"type": "dialogue", "speaker": "다섯(V.O.)", "text": "십 분 뒤에 다시 와."}, {"type": "narration", "speaker": "내레이션", "text": "그는 그 생각을 엘리베이터에 두고 내렸다. 남의 반복은 잘 들리지 않는 법이었다."}], "flags": [], "thumb": "thumbs/6-038.svg"}, {"id": "6-039", "chapter": "6화. 생일", "scene": "S#9 같은 문장 다섯 개 (101동 아래 지하 2층 연결통로, 10월 16일 금 저녁 7:20)", "width": 800, "height": 1320, "shot": "LS · 아이레벨 · 도겸(중)", "screen": "연결통로 설정샷(C3, 소실점 정면). 폭 3m의 긴 흰 통로, 허리 높이 동 번호 색띠, 천장 등 한 줄 가운데 하나가 깜빡이며 그 아래만 빛이 끊긴다. 통로 한가운데 상자 셋을 끼고 양손에 휴대폰을 쥔 도겸이 작게 서 있고, 통로 끝 분기 벽에 방향 표지판(글자는 식자). 깜빡이는 등 옆에 붓 효과음(East Sea Dokdo).", "summary": "연결통로 설정샷(C3, 소실점 정면).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "19시 20분, 101동 아래 지하 연결 통로. 형광등 하나가 깜빡였다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "지직, 지직"}], "flags": [], "thumb": "thumbs/6-039.svg"}, {"id": "6-040", "chapter": "6화. 생일", "scene": "S#9 같은 문장 다섯 개 (101동 아래 지하 2층 연결통로, 10월 16일 금 저녁 7:20)", "width": 800, "height": 880, "shot": "INS · POV(도겸) · 인물 없음", "screen": "가로 2분할. 좌: 양손의 휴대폰 두 대가 동시에 떨며 진동선이 다섯 겹 퍼진다(왼손 시계와 흉터). 우: 두 화면(가상 UI). 메인폰에 회색 점 말풍선 하나, 세컨폰 대화방 목록에 버건디·민트·하늘색·금색 점 미리보기 넷, 다섯 칸에 같은 문장(식자). 효과음은 붓 효과음(East Sea Dokdo), 좌칸 테두리를 따라 다섯 번.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "손에 쥔 휴대폰 두 대가 동시에 떨었다. 다섯 번."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "지잉 지잉 지잉 지잉 지잉"}, {"type": "narration", "speaker": "내레이션", "text": "다섯 개의 말풍선에 같은 문장이 적혀 있었다."}, {"type": "dialogue", "speaker": "문자(다섯→도겸)", "text": "와인바 '미란'으로 와. 일곱 시 반."}], "flags": [], "thumb": "thumbs/6-040.svg"}, {"id": "6-041", "chapter": "6화. 생일", "scene": "S#9 같은 문장 다섯 개 (101동 아래 지하 2층 연결통로, 10월 16일 금 저녁 7:20)", "width": 800, "height": 600, "shot": "INS · POV(도겸) · 인물 없음", "screen": "메인폰 화면 ECU. 회색 말풍선 하나만 크게, 문장 끝 '와.'(식자)에 시선이 걸리도록 그 주변만 또렷하고 나머지는 흐리다. 화면 유리에 깜빡이는 천장 등이 반사된다. 내레이션 박스 하단.", "summary": "메인폰 화면 ECU.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "토씨 하나 다르지 않았다. 유진은 평소에 반말을 쓰지 않았다."}], "flags": [], "thumb": "thumbs/6-041.svg"}, {"id": "6-042", "chapter": "6화. 생일", "scene": "S#9 같은 문장 다섯 개 (101동 아래 지하 2층 연결통로, 10월 16일 금 저녁 7:20)", "width": 800, "height": 760, "shot": "MS · 아이레벨 · 도겸(중)", "screen": "가로 2분할. 좌: 지상의 흰빛이 한 줄 내려오는 출구 쪽 계단을 보는 도겸(표지판 식자). 우: 어둑하게 꺾이는 상가 쪽 통로를 보는 도겸. 두 칸에서 고개 방향만 다르고, 셔츠 깃 언저리에 옅은 푸른 냉기 선이 감긴다. 내레이션 박스는 칸마다 하나.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "통로의 공기가 갑자기 차가워졌다."}, {"type": "narration", "speaker": "내레이션", "text": "도망치면 4억은 사기가 됐다. 들어가면 아직 연애였다."}], "flags": [], "thumb": "thumbs/6-042.svg"}, {"id": "6-043", "chapter": "6화. 생일", "scene": "S#9 같은 문장 다섯 개 (101동 아래 지하 2층 연결통로, 10월 16일 금 저녁 7:20)", "width": 800, "height": 1200, "shot": "FS · 뒷모습 · 도겸(중)", "screen": "상단 BS: 셔츠 깃을 털고 단추 두 개의 자리를 다시 맞추는 손, 소리 없이 움직이는 입술(점선 속말풍선). 하단: 귓불을 한 번 만지고 상가 쪽 통로로 걸어 들어가는 뒷모습, 깜빡이는 등 아래로 그림자가 길어진다. 내레이션 박스 상단과 하단.", "summary": "상단 BS: 셔츠 깃을 털고 단추 두 개의 자리를 다시 맞추는 손, 소리 없이 움직이는 입술(점선 속말풍선)", "lines": [{"type": "narration", "speaker": "내레이션", "text": "입속으로 첫 문장을 굴려 보았다."}, {"type": "thought", "speaker": "도겸(생각)", "text": "너한테만 하는 얘긴데."}, {"type": "narration", "speaker": "내레이션", "text": "다섯 명 앞에서 동시에 해 본 적은 없지만 못 할 것도 없었다."}], "flags": ["intimate"], "thumb": "thumbs/6-043.svg"}, {"id": "6-044", "chapter": "6화. 생일", "scene": "S#10 소품용 (와인바 '미란' 홀, 10월 16일 금 저녁 7:22)", "width": 800, "height": 760, "shot": "INS · 아이레벨 · 인물 없음", "screen": "가로 2분할. 좌: 정문 원목 문에 걸린 'CLOSED' 팻말(글자는 식자)과 문 위 놋쇠 종, 끝까지 내린 루버 블라인드. 우: 카운터 한가운데 케이크 위에서 타는 초 다섯 개와 그 옆 디캔터, 짙은 보르도가 붉은 펜던트 빛을 머금는다. 셀러 쪽 어둠에 붓 효과음(East Sea Dokdo) 작게.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "와인바 '미란'의 문에는 'CLOSED' 팻말이 걸려 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "디캔터 속 보르도가 숨을 쉬고 있었다. 재즈는 꺼 두었다. 셀러의 컴프레서만 낮게 울었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "웅—"}], "flags": [], "thumb": "thumbs/6-044.svg"}, {"id": "6-045", "chapter": "6화. 생일", "scene": "S#10 소품용 (와인바 '미란' 홀, 10월 16일 금 저녁 7:22)", "width": 800, "height": 840, "shot": "MS · 아이레벨 · 형사 1(좌), 형사 2(우)", "screen": "정문 옆 구석의 둥근 대리석 2인 테이블. 양복 차림 남자 둘이 탄산수 두 잔을 앞에 두고 등을 펴고 앉아, 하나는 카운터를, 하나는 정문을 본다. 붉은 빛이 닿지 않는 가장자리라 얼굴 한쪽에만 셀러의 흰빛이 걸린다. 내레이션 박스 둘을 좌상과 하단에.", "summary": "정문 옆 구석의 둥근 대리석 2인 테이블.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "호수경찰서 지능범죄수사팀이었다."}, {"type": "narration", "speaker": "내레이션", "text": "하린이 지난주에 접수한 고소장에는 녹음 파일 네 개, 자필 확인서 한 장, 카드 명세서, 차량 출입기록, 리스 계약 사항이 붙어 있었고, 경찰은 한강D&C에 사실조회를 마친 뒤였다."}], "flags": [], "thumb": "thumbs/6-045.svg"}, {"id": "6-046", "chapter": "6화. 생일", "scene": "S#10 소품용 (와인바 '미란' 홀, 10월 16일 금 저녁 7:22)", "width": 800, "height": 720, "shot": "INS · 하이 · 하린(우)", "screen": "카운터 상판 위 크림색 무지 종이 쇼핑백(검정 끈, 엠보싱 띠, 입구에 투명 테이프 세 겹). 하린의 가는 손가락이 노란 커터칼로 테이프를 긋는 순간을 정지 화면으로 잡는다. 효과음 글자는 넣지 않고 소리는 내레이션 박스로만 전한다(박스 하단).", "summary": "카운터 상판 위 크림색 무지 종이 쇼핑백(검정 끈, 엠보싱 띠, 입구에 투명 테이프 세 겹).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "사각, 하는 소리가 가게 안에 크게 울렸다."}], "flags": [], "thumb": "thumbs/6-046.svg"}, {"id": "6-047", "chapter": "6화. 생일", "scene": "S#10 소품용 (와인바 '미란' 홀, 10월 16일 금 저녁 7:22)", "width": 800, "height": 1440, "shot": "INS · 하이 · 하린(상단)", "screen": "상단: 하린이 쇼핑백에서 꺼낸 띠지 두른 노란 지폐 다발 열 개를 카운터 위에 두 줄로 쌓는다(양식화된 소품용 5만원권 모양, 도안 없음, 다발 사이로 신문지 끝이 삐져나온다). 가운데: 작은 클러치에서 얇은 금테 타원 안경을 꺼내 쓰는 하린의 옆얼굴. 하단: 넓은 흰 여백. 효과음과 글자 없음.", "summary": "상단: 하린이 쇼핑백에서 꺼낸 띠지 두른 노란 지폐 다발 열 개를 카운터 위에 두 줄로 쌓는다(양식화된 소품", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-047.svg"}, {"id": "6-048", "chapter": "6화. 생일", "scene": "S#10 소품용 (와인바 '미란' 홀, 10월 16일 금 저녁 7:22)", "width": 800, "height": 1600, "shot": "INS · 하이 · 인물 없음", "screen": "띠지 ECU. 노란 지폐 다발을 두른 흰 띠지 끝, 아주 작은 글씨 '소품용'(식자, 작게)만 화면 한가운데에 두고 위아래로 큰 흰 여백을 남긴다. 붉은 펜던트 빛은 띠지 모서리에만 걸린다. 효과음 없음.", "summary": "띠지 ECU.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-048.svg"}, {"id": "6-049", "chapter": "6화. 생일", "scene": "S#10 소품용 (와인바 '미란' 홀, 10월 16일 금 저녁 7:22)", "width": 800, "height": 720, "shot": "MS · 아이레벨 · 미란(좌), 혜숙(중), 세라(우)", "screen": "가로 3분할. 1: 미란이 고개를 젖히고 웃는다(웨이브가 등 뒤로 쏟아지고 눈이 반달). 2: 혜숙이 빨간 손톱의 손으로 입을 가린다(눈가 웃음 주름). 3: 세라가 하이힐을 신은 채 한쪽 종아리를 뒤로 늘인다. 웃음소리는 글자 없이 입 모양으로만.", "summary": "가로 3분할.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-049.svg"}, {"id": "6-050", "chapter": "6화. 생일", "scene": "S#10 소품용 (와인바 '미란' 홀, 10월 16일 금 저녁 7:22)", "width": 800, "height": 1800, "shot": "LS · 아이레벨 · 미란(후경·우), 혜숙(후경·우), 세라(중·우), 하린(중·우), 유진(전경·우)", "screen": "정문 안쪽(C1)에서 본 라인업. 오른쪽 카운터 안쪽을 따라 뒷문 쪽부터 버건디 벨벳(미란), 금색 시퀸(혜숙), 민트 컷아웃(세라), 하늘색 니트(하린), 은회색 실크(유진)가 한 줄로 서서 정문 쪽으로 몸을 돌렸고, 붉은 펜던트 다섯 개가 한 사람에 하나씩 어깨 위로 똑같이 내려앉는다. 정문 쪽 끝의 유진만 웃지 않고, 돈다발을 부채꼴로 펼쳐 띠지가 문 쪽을 보도록 세운다(케이크 촛불이 부채꼴을 아래에서 비춘다). 대표 색은 드레스 색 그대로(버건디 #5E1324, 금색 #CFA950, 민트 #76CDB8, 하늘색 #9EC8EA, 은회색 #C9CCD1), 왼쪽 전경에 구석 테이블 형사 둘의 뒤통수가 흐리게 걸린다. 내레이션 박스는 천장 쪽 여백에 둘, 바닥 쪽 여백에 하나.", "summary": "정문 안쪽(C1)에서 본 라인업.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유진만 웃지 않았다."}, {"type": "narration", "speaker": "내레이션", "text": "다섯 벌의 드레스가 카운터를 따라 일렬로 섰다. 버건디 벨벳, 금색 시퀸, 민트 컷아웃, 하늘색 니트, 은회색 실크."}, {"type": "narration", "speaker": "내레이션", "text": "붉은 조명이 다섯 개의 어깨 위에 똑같이 내려앉았다."}], "flags": [], "thumb": "thumbs/6-050.svg"}, {"id": "6-051", "chapter": "6화. 생일", "scene": "S#10 소품용 (와인바 '미란' 홀, 10월 16일 금 저녁 7:22)", "width": 800, "height": 640, "shot": "INS · 아이레벨 · 유진(중)", "screen": "가로 2분할. 좌: 유진의 손목시계 19:29(식자, 초침이 12 바로 앞). 우: 하얀 손끝이 긴 진주 드롭 귀걸이를 한 번 만져 제자리를 확인한다. 내레이션 박스는 두 칸을 가로질러 하단.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "승무원 시절, 탑승구가 닫히기 1분 전의 정적과 같았다. 다만 이번에는 그녀가 문을 닫는 쪽이었다."}], "flags": [], "thumb": "thumbs/6-051.svg"}, {"id": "6-052", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 760, "shot": "CU · 아이레벨 · 세라(우)", "screen": "가로 2분할. 좌: 정문 위 놋쇠 종이 흔들리고 문이 열리며, 회색·버건디·민트·하늘색·금색 다섯 가닥 냄새 선이 사람보다 먼저 홀 안으로 흘러든다(문간은 아직 비어 있다). 우: 세라가 코를 찡그린다(콧등 주근깨가 모이고 눈은 직선). 종소리는 붓 효과음(East Sea Dokdo), 내레이션 박스 좌상, 말풍선 우하.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "19시 30분, 문에 달린 종이 울렸다."}, {"type": "sfx", "speaker": "SFX(중간, 금색)", "text": "딸랑"}, {"type": "narration", "speaker": "내레이션", "text": "그보다 냄새가 먼저 들어왔다."}, {"type": "dialogue", "speaker": "세라", "text": "다섯 개 다 뿌렸네."}], "flags": [], "thumb": "thumbs/6-052.svg"}, {"id": "6-053", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 1240, "shot": "FS · 아이레벨 · 도겸(중)", "screen": "카운터 안쪽(C2)에서 본 문간. 전경 아래쪽에 부채꼴 돈다발이 흐리게 걸리고, 문간에 선 도겸은 땀에 젖은 셔츠가 등과 가슴에 붙었고 이마가 번들거린다(겨드랑이 상자 셋). 그의 시선이 부채꼴 돈다발에서 다섯 벌의 드레스로, 다시 돈다발로 옮겨 가는 화살표 세 개, 왼쪽 입꼬리가 올라가다 중간에 멈춘 얼굴. 말풍선 우하, 말줄임 간격을 넓게.", "summary": "카운터 안쪽(C2)에서 본 문간.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "다들… 생일 축하해."}], "flags": ["intimate"], "thumb": "thumbs/6-053.svg"}, {"id": "6-054", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 720, "shot": "MS · 아이레벨 · 미란(중), 도겸(전경·좌)", "screen": "가로 2분할. 좌: 미란이 잔에 와인을 따라 카운터 위로 민다, 잔이 그의 앞에서 멈추고 와인이 유리 벽에서 한 번 출렁인다. 우: 잔에 손대지 않는 그의 손(전경, 시계와 흉터) 너머로, 미란의 와인색 손끝이 카운터 위 열린 쇼핑백을 톡 친다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "자기야, 생일 축하해. 다 같이 생일이라 누구 거부터 할까?"}, {"type": "dialogue", "speaker": "미란", "text": "남자 거짓말은 와인이랑 같아. 열어 봐야 알아."}], "flags": [], "thumb": "thumbs/6-054.svg"}, {"id": "6-055", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 520, "shot": "BS · 아이레벨 · 도겸(중)", "screen": "도겸이 두 손을 반쯤 들어 올리며 카운터 쪽으로 몸을 기울인다. 눈을 오래 맞추는 따뜻한 눈, 낮게 깐 목소리의 익숙한 표정. 말풍선은 오른쪽 끝이 화면 테두리에 잘려 나간다.", "summary": "도겸이 두 손을 반쯤 들어 올리며 카운터 쪽으로 몸을 기울인다.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "자기야, 이건 오해야. 너한테만—"}], "flags": [], "thumb": "thumbs/6-055.svg"}, {"id": "6-056", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 1760, "shot": "MS · 아이레벨 · 미란(좌), 혜숙(좌중), 세라(중), 하린(우중), 유진(우)", "screen": "4화 S#16 '다섯 진술' 컷과 같은 프레이밍. 손님 쪽 그의 자리 바로 뒤에서(그는 화면 밖) 카운터를 정면으로 보고, 카운터 상판이 화면 아래를 가로지르며 그 위에 부채꼴 돈다발, 케이크, 디캔터가 놓인다. 다섯 여자가 같은 눈높이로 정면에 나란히, 왼쪽부터 미란·혜숙·세라·하린·유진, 펜던트 하나에 한 사람씩 같은 붉은 빛을 이고 다섯 입이 같은 모양으로 열린다. 대표 색은 드레스(버건디·금색·민트·하늘색·은회색). 다섯 갈래 꼬리를 단 말풍선 하나를 화면 가운데 크게, 아래 여백에 내레이션 박스, 셀러 쪽에 붓 효과음(East Sea Dokdo) 작게.", "summary": "4화 S#16 '다섯 진술' 컷과 같은 프레이밍.", "lines": [{"type": "dialogue", "speaker": "다섯", "text": "너한테만 하는 얘긴데."}, {"type": "narration", "speaker": "내레이션", "text": "연습한 적도 없는데 박자가 맞았다. 컴프레서 소리만 남았다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "웅—"}], "flags": [], "thumb": "thumbs/6-056.svg"}, {"id": "6-057", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 800, "shot": "MS · 하이 · 세라(중), 도겸(전경·좌)", "screen": "세라가 출력물 뭉치를 카운터에 내리친다. 종이가 튀어 오르며 출입 기록 표의 줄들이 보이고(글자는 식자), 포니테일이 한 번 크게 흔들린다. 시선은 그의 얼굴에 직선으로 꽂힌다. 효과음은 붓 효과음(East Sea Dokdo) 크게, 말풍선 우상에서 길게.", "summary": "세라가 출력물 뭉치를 카운터에 내리친다.", "lines": [{"type": "sfx", "speaker": "SFX(대형)", "text": "탁"}, {"type": "dialogue", "speaker": "세라", "text": "센터 출입기록은 거짓말 안 해요. 9월 3일 오후 두 시, 세종 현장. 근데 골프연습장 게이트에 오빠 카드가 찍혔어요. 카드는 어제 정지했고요. 1,870만 원은 오빠 앞으로 내용증명 보냈어요."}], "flags": [], "thumb": "thumbs/6-057.svg"}, {"id": "6-058", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 560, "shot": "BS · 아이레벨 · 도겸(좌), 세라(우)", "screen": "[트랙2] 가로 2분할. 좌: 그의 왼손이 저절로 귓불로 올라간다(반짝이 효과선, 관자놀이 땀방울). 우: 세라가 무표정으로 턱을 들어 그 손을 가리킨다(민트 플랫 배경, 굵은 직선 화살표). 의상 색은 본편과 같다. 말풍선 우상.", "summary": "[트랙2] 가로 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "귓불. 또 만지네."}], "flags": ["intimate"], "thumb": "thumbs/6-058.svg"}, {"id": "6-059", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 1040, "shot": "MS · 로우 · 혜숙(중)", "screen": "혜숙이 카운터 쪽으로 한 발 앞으로 나오자 금색 시퀸이 펜던트 빛을 받아 일제히 반짝인다(비늘 반짝임 효과). 진주 세 줄 위로 턱을 들고, 목소리는 오히려 낮게 가라앉는다. 말풍선 테두리를 가늘고 어둡게, 두 말풍선 사이에 한 박자 간격을 비워 둔다.", "summary": "혜숙이 카운터 쪽으로 한 발 앞으로 나오자 금색 시퀸이 펜던트 빛을 받아 일제히 반짝인다(비늘 반짝임 효과)", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "이 단지에서 내가 모르는 일은 없어. 그 남자만 빼고."}, {"type": "dialogue", "speaker": "혜숙", "text": "근데 이제 그 남자도 알아. 238노 7171. 매일 밤 열 시에 나가서 새벽 네 시에 들어오더라. 현장 야간 점검을 빌린 차로 다니니?"}], "flags": [], "thumb": "thumbs/6-059.svg"}, {"id": "6-060", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 680, "shot": "INS · 하이 · 혜숙(우)", "screen": "가로 2분할. 좌: 클리어파일에서 꺼낸 종이 한 장이 돈다발 옆에 놓인다, 자필 문장 '분양권 전매 대금 일억 오천만 원을 정히 수령함. 한도겸.'(식자, 손글씨체). 우: 빨간 손톱이 서명 위를 톡 짚는다. 말풍선 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "그리고 얘, 이건 네 글씨지?"}], "flags": [], "thumb": "thumbs/6-060.svg"}, {"id": "6-061", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 1080, "shot": "BS · 아이레벨 · 하린(중)", "screen": "하린이 손목의 검정 머리끈으로 긴 생머리를 높이 하나로 묶자 굽었던 등이 펴진다. 얇은 금테 타원 안경 너머 눈이 똑바로 그를 본다, 조문을 외우듯 또박또박. 긴 말풍선을 세 덩이로 끊어 위에서 아래로.", "summary": "하린이 손목의 검정 머리끈으로 긴 생머리를 높이 하나로 묶자 굽었던 등이 펴진다.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "형법 제347조. 사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 10년 이하의 징역 또는 2천만원 이하의 벌금에 처한다. 벌금 상한이 제 학자금이랑 같네요. 근데 오빠는 벌금으로 안 끝나요. 피해액이 4억 1,870만 원이거든요."}], "flags": [], "thumb": "thumbs/6-061.svg"}, {"id": "6-062", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 640, "shot": "BS · 오버숄더(도겸 너머) · 도겸(좌), 하린(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 도겸이 턱을 들며 말을 꺼낸다, 말풍선 끝이 잘린다. 우: 하린이 안경을 밀어 올리며 그 말을 끊는다(이미 맨 위인데도 또). 말풍선 좌상, 우상.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "아버지가 알면—"}, {"type": "dialogue", "speaker": "하린", "text": "경찰이 한강D&C에 사실조회 했어요. 회장님은 따님만 두 분이시래요."}], "flags": [], "thumb": "thumbs/6-062.svg"}, {"id": "6-063", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 1440, "shot": "CU · 아이레벨 · 유진(중)", "screen": "상단 가로 3분할 인서트: ① 하얀 손가락이 오른쪽 귀걸이를 뺀다 ② 왼쪽 귀걸이를 뺀다(1·4화와 반대 순서) ③ 긴 진주 드롭 귀걸이 한 쌍이 돈다발 옆에 나란히 놓이고 진주가 카운터 위에서 작게 구른다. 하단 CU: 유진이 그 어느 때보다 공손하게 웃는다, 입꼬리만 올라가고 나른한 눈은 웃지 않는다. 구르는 소리는 붓 효과음(East Sea Dokdo) 아주 작게, 말풍선 우하.", "summary": "상단 가로 3분할 인서트: ① 하얀 손가락이 오른쪽 귀걸이를 뺀다", "lines": [{"type": "narration", "speaker": "내레이션", "text": "마지막으로 유진이 움직였다."}, {"type": "sfx", "speaker": "SFX(아주 작게)", "text": "또르르"}, {"type": "dialogue", "speaker": "유진", "text": "여보, 생일 축하해요. 아, 당신 생일은 3월이었죠."}], "flags": [], "thumb": "thumbs/6-063.svg"}, {"id": "6-064", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 640, "shot": "CU · 아이레벨 · 도겸(좌), 유진(우)", "screen": "가로 2분할. 좌: 도겸의 입이 열렸다가 닫힌다(위아래 작은 두 칸으로 나눈 같은 얼굴). 우: 같은 웃음의 유진, 존댓말 어미가 길게 늘어지는 말풍선.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "당신은 다섯 명 관리하느라 휴대폰이 두 대 필요했죠. 우리는 단톡방 하나면 되던데요."}], "flags": [], "thumb": "thumbs/6-064.svg"}, {"id": "6-065", "chapter": "6화. 생일", "scene": "S#11 너한테만 하는 얘긴데 (와인바 '미란' 홀, 10월 16일 금 저녁 7:30)", "width": 800, "height": 1360, "shot": "CU · 측면 · 유진(좌), 도겸(우)", "screen": "상단: 카운터 끝을 돌아 나온 유진이 그에게 한 걸음 다가가 귓가에 입술을 댄다, 귓불 바로 옆, 그가 늘 하던 거리. 속삭임 점선 말풍선은 두 얼굴 사이에 작게. 하단 MS: 유진이 몸을 떼고 하얀 손가락으로 구석 테이블을 가리키고, 그 끝에 탄산수 잔 앞의 형사 둘이 흐리게 걸린다. 내레이션 박스 상단, 말풍선 하단 우측.", "summary": "상단: 카운터 끝을 돌아 나온 유진이 그에게 한 걸음 다가가 귓가에 입술을 댄다, 귓불 바로 옆, 그가 늘 ", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그가 그녀들 모두에게 그랬던 거리였다."}, {"type": "whisper", "speaker": "유진(속삭임)", "text": "너한테만 하는 얘긴데요."}, {"type": "dialogue", "speaker": "유진", "text": "저기 저분들, 형사님들이에요."}], "flags": ["intimate"], "thumb": "thumbs/6-065.svg"}, {"id": "6-066", "chapter": "6화. 생일", "scene": "S#12 다섯 개의 뚜껑 (와인바 '미란' 홀, 10월 16일 금 저녁 7:41)", "width": 800, "height": 1240, "shot": "MS · 아이레벨 · 형사 1(우), 도겸(좌)", "screen": "상단 가로 2분할 띠: 좌 구석 테이블에서 형사 둘이 탄산수 잔을 내려놓고 일어서며 의자 다리가 헥사곤 타일을 길게 긁는다, 우 흔들리는 촛불과 케이크 위로 떨어지는 촛농 한 방울. 하단: 형사 1이 도겸 앞에 서서 신분증 지갑을 펴 보인다(휘장·글자 없음), 표정 없는 평평한 얼굴. 의자 효과음은 붓 효과음(East Sea Dokdo)으로 띠를 가로질러 길게, 말풍선 우하.", "summary": "상단 가로 2분할 띠: 좌 구석 테이블에서 형사 둘이 탄산수 잔을 내려놓고 일어서며 의자 다리가 헥사곤 타일", "lines": [{"type": "sfx", "speaker": "SFX(길게, 회색)", "text": "끼이이익"}, {"type": "dialogue", "speaker": "형사 1", "text": "한도겸 씨. 호수경찰서 지능범죄수사팀입니다. 사기 혐의로 체포영장 집행합니다. 변호인을 선임할 수 있고, 진술을 거부할 수 있습니다."}], "flags": [], "thumb": "thumbs/6-066.svg"}, {"id": "6-067", "chapter": "6화. 생일", "scene": "S#12 다섯 개의 뚜껑 (와인바 '미란' 홀, 10월 16일 금 저녁 7:41)", "width": 800, "height": 680, "shot": "BS · 아이레벨 · 도겸(좌), 형사 1(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 도겸은 뒷걸음질 치지 않고 대신 턱을 든다(왼쪽 입꼬리, 땀에 젖은 깃). 우: 형사 1이 눈 한 번 깜빡이지 않고 짧게 받는다. 말풍선 좌상, 우상.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "제가 누군지 아세요? 이 단지, 우리 아버지가—"}, {"type": "dialogue", "speaker": "형사 1", "text": "그건 조사실에서 말씀하세요."}], "flags": ["intimate"], "thumb": "thumbs/6-067.svg"}, {"id": "6-068", "chapter": "6화. 생일", "scene": "S#12 다섯 개의 뚜껑 (와인바 '미란' 홀, 10월 16일 금 저녁 7:41)", "width": 800, "height": 1200, "shot": "INS · 로우 · 형사 2(후경)", "screen": "카운터 상판 높이(C3) 로우 앵글. 형사 2의 손이 그의 재킷 양쪽 주머니를 비워 카운터 위에 차례로 세운다. 메인폰(무광 블랙)과 세컨폰(무광 그레이), 그리고 사각 유리병 다섯 개가 회색·버건디·민트·하늘색·금색 뚜껑 순서로 한 줄(P1), 병 유리에 붉은 펜던트와 촛불이 맺힌다. 내레이션 박스 상단.", "summary": "카운터 상판 높이(C3) 로우 앵글.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "회색, 버건디, 민트, 하늘색, 금색."}], "flags": [], "thumb": "thumbs/6-068.svg"}, {"id": "6-069", "chapter": "6화. 생일", "scene": "S#12 다섯 개의 뚜껑 (와인바 '미란' 홀, 10월 16일 금 저녁 7:41)", "width": 800, "height": 1240, "shot": "MS · 아이레벨 · 미란(좌), 혜숙(좌중), 세라(중), 하린(우중), 유진(우)", "screen": "6-056과 같은 정면 나란히 프레이밍(유진만 카운터 끝 바깥, 그의 옆). 다섯 여자가 동시에, 같은 각도로 자기 드레스를 내려다본다. 화면 아래쪽 상판에 6-068의 뚜껑 줄(회색·버건디·민트·하늘색·금색)이 걸쳐, 위의 다섯 드레스 색과 짝이 맞는다는 것만 보이게 한다(대표 색은 드레스와 뚜껑). 말풍선 좌상.", "summary": "6-056과 같은 정면 나란히 프레이밍(유진만 카운터 끝 바깥, 그의 옆).", "lines": [{"type": "dialogue", "speaker": "미란", "text": "자기, 우리 색깔별로 뿌렸구나."}], "flags": [], "thumb": "thumbs/6-069.svg"}, {"id": "6-070", "chapter": "6화. 생일", "scene": "S#12 다섯 개의 뚜껑 (와인바 '미란' 홀, 10월 16일 금 저녁 7:41)", "width": 800, "height": 1520, "shot": "INS · 아이레벨 · 도겸(중), 형사 1(우)", "screen": "세 단. ① 그가 스스로 두 손목을 내밀자 셔츠 소매가 밀려 올라가며 금장 콤비 시계가 드러난다(초승달 흉터와 한 프레임). ② 형사 1의 차분한 손이 수갑보다 시계를 먼저 풀어 투명 증거물 봉투에 넣는다. ③ 은색 수갑이 조용히 채워진 두 손목, 시계가 있던 자리에 하얀 자국이 남는다. 주변의 다섯 여자와 형사 2는 한 걸음 떨어진 제자리에 그대로 서 있다. 효과음 없음, 내레이션 박스 맨 아래.", "summary": "세 단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "아무도 소리치지 않았고 아무도 그를 밀치지 않았다."}], "flags": [], "thumb": "thumbs/6-070.svg"}, {"id": "6-071", "chapter": "6화. 생일", "scene": "S#13 다음 차례 (지하 2층 주차장 B구역, 10월 16일 금 저녁 8:10)", "width": 800, "height": 1480, "shot": "LS · 아이레벨 · 유진, 미란, 세라, 하린, 혜숙(전경·좌), 리스사 직원(중)", "screen": "B구역 통로 가운데(C2). 견인차의 노란 경광등이 주황 띠 두른 기둥을 돌아가며 핥고, 동쪽 벽 칸의 검정 세단 앞바퀴에 견인 장비가 걸려 있다. 경사로 아래쪽에 흰 경찰차가 서서 붉은·푸른 등을 바닥에 번지게 하고, 클립보드를 든 리스사 직원이 세단 옆에 선다. 전경 왼쪽에 드레스 위로 코트를 걸친 다섯 여자가 나란히 서고, 열린 앞섶으로 버건디·금색·민트·하늘색·은회색이 한 점씩 보인다(대표 색 규칙). 유압 효과음은 붓 효과음(East Sea Dokdo), 내레이션 박스 좌상, 직원 말풍선 우하.", "summary": "B구역 통로 가운데(C2).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "지하 2층 B구역에서는 견인차의 노란 경광등이 기둥을 돌아가며 핥고 있었다."}, {"type": "sfx", "speaker": "SFX(중간, 노랑)", "text": "끼익—"}, {"type": "narration", "speaker": "내레이션", "text": "혜숙이 오후에 전화로 차 위치를 알려 둔 터였다."}, {"type": "dialogue", "speaker": "리스사 직원", "text": "한빛오토리스입니다. 리스료 6개월 연체로 계약 해지돼서 차량 회수합니다."}], "flags": [], "thumb": "thumbs/6-071.svg"}, {"id": "6-072", "chapter": "6화. 생일", "scene": "S#13 다음 차례 (지하 2층 주차장 B구역, 10월 16일 금 저녁 8:10)", "width": 800, "height": 1000, "shot": "INS · 로우 · 유진, 미란, 세라, 하린, 혜숙(후경·흐림)", "screen": "트렁크 안쪽(C1) 바닥 높이. 직원이 연 트렁크의 공구함 안에 렌치 대신 투명 테이프 한 롤, 반듯하게 접힌 크림색 무지 종이 쇼핑백 네 장(P2와 같은 종이와 검정 끈), 띠지 두른 소품용 5만원권 다발 한 묶음(도안 없음)이 놓여 있다. 트렁크 입구 위로 들여다보는 다섯 얼굴이 흐리게 걸리고(코트 앞섶의 다섯 색이 흐린 점으로), 노란 경광등이 테두리를 돈다. 효과음 없음.", "summary": "트렁크 안쪽(C1) 바닥 높이.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-072.svg"}, {"id": "6-073", "chapter": "6화. 생일", "scene": "S#13 다음 차례 (지하 2층 주차장 B구역, 10월 16일 금 저녁 8:10)", "width": 800, "height": 760, "shot": "BS · 아이레벨 · 하린(좌), 유진(우), 미란(우), 세라(우), 혜숙(우)", "screen": "가로 2분할. 좌: 머리를 묶은 하린이 안경을 밀어 올린다, 하늘색 홀터넥 니트가 회색 더플코트 앞섶 사이로 보인다. 우: 나머지 넷이 서로를 본다(시선 화살표가 원을 그리고, 미란 버건디·혜숙 금색·세라 민트·유진 은회색이 앞섶에서 한 점씩). 하단 작은 띠 칸에 접힌 쇼핑백 네 장 INS. 말풍선 좌상, 내레이션 박스 우하.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "다음 차례가 있었네요."}, {"type": "narration", "speaker": "내레이션", "text": "쇼핑백은 넷이었다. 하린을 뺀 숫자였다."}], "flags": [], "thumb": "thumbs/6-073.svg"}, {"id": "6-074", "chapter": "6화. 생일", "scene": "S#13 다음 차례 (지하 2층 주차장 B구역, 10월 16일 금 저녁 8:10)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 리스사 직원(좌), 유진(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 리스사 직원이 클립보드를 든 채 트렁크를 가리키며 묻는다. 우: 유진이 코트 깃을 여미며 담담하게 답한다, 귀걸이 없는 귓불. 말풍선 좌상, 우상.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "리스사 직원", "text": "개인 물품은 어떻게 할까요?"}, {"type": "dialogue", "speaker": "유진", "text": "증거물이에요. 형사님 드리세요."}], "flags": [], "thumb": "thumbs/6-074.svg"}, {"id": "6-075", "chapter": "6화. 생일", "scene": "S#13 다음 차례 (지하 2층 주차장 B구역, 10월 16일 금 저녁 8:10)", "width": 800, "height": 1520, "shot": "LS · 로우 · 도겸(하단·중)", "screen": "상단: 검정 세단의 앞바퀴가 들리고, 차체가 비스듬히 기운 채 견인차에 끌려 출구 경사로를 천천히 오른다(노란 경광등이 차체를 훑고 녹색 바닥에 반사). 하단 CU: 경사로 아래 경찰차 뒷좌석 창에 붙은 도겸의 옆얼굴, 붉은·푸른 빛이 번갈아 얼굴을 지나가고, 그는 차가 아니라 수갑 찬 왼손목의 하얀 시계 자국을 내려다본다. 효과음은 붓 효과음(East Sea Dokdo) 상단에 작게, 내레이션 박스 하단.", "summary": "상단: 검정 세단의 앞바퀴가 들리고, 차체가 비스듬히 기운 채 견인차에 끌려 출구 경사로를 천천히 오른다(노", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "덜컹, 덜컹"}, {"type": "narration", "speaker": "내레이션", "text": "그는 차가 아니라 자기 손목의 하얀 시계 자국을 보고 있었다."}], "flags": [], "thumb": "thumbs/6-075.svg"}, {"id": "6-076", "chapter": "6화. 생일", "scene": "S#13 다음 차례 (지하 2층 주차장 B구역, 10월 16일 금 저녁 8:10)", "width": 800, "height": 680, "shot": "MS · 아이레벨 · 미란(좌), 혜숙(우)", "screen": "가로 2분할. 좌: 미란이 코트 주머니에 손을 넣은 채 경사로를 올려다본다, 붉은 립의 한쪽 입꼬리. 우: 혜숙이 팔짱을 끼며 턱을 든다, 시퀸이 코트 사이에서 노란 경광등에 한 번 반짝인다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "자기 차 간다."}, {"type": "dialogue", "speaker": "혜숙", "text": "얘, 차는 그렇게 빌려 타는 거 아니야."}], "flags": [], "thumb": "thumbs/6-076.svg"}, {"id": "6-077", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 1520, "shot": "LS · 아이레벨 · 미란, 세라, 유진, 하린, 혜숙(전경·뒷모습), 재판장(후경·중), 도겸(후경·우)", "screen": "맨 뒷줄(C1)에서 법대 정면. 왼쪽 측벽 높은 창 네 개로 희고 얇은 겨울빛이 비스듬히 내려와 방청석 바닥에 창 모양을 눕히고, 창 아래 라디에이터 패널. 둘째 줄에 검정과 회색 코트의 다섯 뒷모습이 나란히 앉고, 대표 색이 뒤에서도 한 점씩 보이게 둔다(미란 등받이에 얹은 손의 와인색 손톱, 세라 민트 시계줄, 유진 회색 머플러, 하린 더플 깃 위로 올라온 하늘색 니트 깃, 혜숙 금장 진주 귀걸이). 정면에 세 단 높은 목재 법대와 판사석 하나(서류철과 작은 모니터만, 법봉 없음), 오른쪽 피고인석에 연한 수용복의 등. 정면 벽에 상징·글자 없음. 라디에이터 효과음은 붓 효과음(East Sea Dokdo) 작게, 내레이션 박스 셋을 천장 여백과 바닥 여백에.", "summary": "맨 뒷줄(C1)에서 법대 정면.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "2월의 법정은 높은 창으로 들어온 빛이 희고 얇았다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "똑딱똑딱"}, {"type": "narration", "speaker": "내레이션", "text": "넉 달 전과 달리 다섯 명 모두 검정과 회색 코트였다."}, {"type": "narration", "speaker": "내레이션", "text": "법봉 같은 것은 없었다. 한국 법정에는 원래 그런 게 없었다. 판결은 문장으로 시작해서 문장으로 끝났다."}], "flags": [], "thumb": "thumbs/6-077.svg"}, {"id": "6-078", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 1000, "shot": "MS · 로우 · 재판장(좌), 도겸(우)", "screen": "가로 2분할. 좌: 법대를 아래에서 올려다본 재판장, 판결문을 내려다보며 읽는다(법대 위에는 서류와 모니터뿐). 우: 피고인석의 도겸, 연한 수용복에 이마를 덮은 자란 머리, 무릎 위 왼손목에 희미한 시계 자국이 흉터와 한 프레임에 든다. 재판장 말풍선은 각진 낭독형 테두리로 좌상에서 우칸 위까지 길게.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "재판장", "text": "피고인은 자신이 주식회사 한강디앤씨 대표이사 한정훈의 외아들이라고 행세하였으나, 피고인과 한정훈 사이에는 아무런 관계가 없고 성씨가 같을 뿐이다."}], "flags": [], "thumb": "thumbs/6-078.svg"}, {"id": "6-079", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 760, "shot": "BS · 아이레벨 · 미란(좌), 재판장(우)", "screen": "가로 2분할. 좌: 미란이 작게 코웃음을 친다(버건디 립의 한쪽 입꼬리, 코끝의 짧은 바람선). 우: 재판장은 고개를 들지 않고 다음 문장을 읽는다. 낭독형 말풍선 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "재판장", "text": "피고인은 세신사로 일하는 모 박순옥의 외아들로, 고등학교를 졸업한 뒤 대리운전기사로 일해 왔다."}], "flags": [], "thumb": "thumbs/6-079.svg"}, {"id": "6-080", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 880, "shot": "CU · 아이레벨 · 유진(중)", "screen": "유진의 등 뒤 공기에 그려진 작은 바스락 점선이 중간에서 뚝 끊긴다. 회색 머플러 위 유진의 눈이 한 박자 멈췄다가, 고개가 천천히 뒤로 돌아가기 시작한다(옆얼굴로 넘어가는 순간). 내레이션 박스 둘을 위아래로.", "summary": "유진의 등 뒤 공기에 그려진 작은 바스락 점선이 중간에서 뚝 끊긴다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "등 뒤에서 무언가 바스락거리다 멈췄다."}, {"type": "narration", "speaker": "내레이션", "text": "유진은 그 멈춤을 알았다. 몇 달 전 자기 등 위에서 한 번 멈췄던 박자였다."}], "flags": [], "thumb": "thumbs/6-080.svg"}, {"id": "6-081", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 1600, "shot": "MS · 오버숄더(유진 너머) · 순옥(후경·중), 유진(전경·좌)", "screen": "상단: 유진의 어깨 너머로 빈 줄들 뒤 맨 뒷줄에 희끗한 단발 파마의 여자가 홀로 앉아 있다. 무릎 위에서 흰 손수건을 접던 두껍고 단단한 손이 반쯤 접힌 채 멈춰 있고, 볕과 김에 그을린 둥근 얼굴이 처음으로 정면이다. 가운데 가로 2분할 인서트: ① 짙은 일자 눈썹 ECU ② 회상 플래시, 김 서린 세신실에서 이마와 희끗한 머리만 보이던 세신사(분홍 세신복 소매, 채도를 낮춤). 하단 여백에 점선 테두리 V.O. 말풍선.", "summary": "상단: 유진의 어깨 너머로 빈 줄들 뒤 맨 뒷줄에 희끗한 단발 파마의 여자가 홀로 앉아 있다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유진은 그 손을 알았다. 김 너머로 이마만 보였던 얼굴이 이제 처음으로 정면에 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "짙은 눈썹. 지호의 눈썹이었다."}, {"type": "dialogue", "speaker": "순옥(V.O.)", "text": "아드님이 몇 살이에요."}], "flags": [], "thumb": "thumbs/6-081.svg"}, {"id": "6-082", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 1200, "shot": "CU · 아이레벨 · 유진(좌), 순옥(우)", "screen": "상단 가로 2분할 숏·리버스숏: 두 사람의 눈이 마주친다. 순옥은 고개를 숙이지도 끄덕이지도 않고 입술을 다문다. 하단 INS(C3 의자 높이): 멈춰 있던 두꺼운 손이 손수건을 마저 접는다, 반으로, 다시 반으로, 네 모서리가 정확히 맞는다(두 단계 동작선). 효과음 없음, 내레이션 박스 셋.", "summary": "상단 가로 2분할 숏·리버스숏: 두 사람의 눈이 마주친다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "순옥은 고개를 숙이지도, 끄덕이지도 않았다."}, {"type": "narration", "speaker": "내레이션", "text": "반으로, 다시 반으로."}, {"type": "narration", "speaker": "내레이션", "text": "유진은 앞을 보지 않고 그 손을 끝까지 보았다."}], "flags": ["intimate"], "thumb": "thumbs/6-082.svg"}, {"id": "6-083", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 1400, "shot": "MS · 아이레벨 · 재판장(상단), 하린, 세라, 혜숙(하단)", "screen": "상단: 법대의 재판장, 낭독형 말풍선이 길게 이어진다. 하단 가로 3분할 리액션: 하린이 안경을 밀어 올린다(하늘색 니트 깃), 세라가 숨을 길게 내쉰다(입김선, 민트 시계줄), 혜숙의 손이 입가로 올라갔다가 내려온다(금장 진주 귀걸이).", "summary": "상단: 법대의 재판장, 낭독형 말풍선이 길게 이어진다.", "lines": [{"type": "dialogue", "speaker": "재판장", "text": "피고인은 피해자 5명을 기망하여 합계 4억 원을 교부받고, 피해자의 신용카드를 사용하여 1,870만 원 상당의 재산상 이익을 취득하였다. 피고인은 이 법정에서도 '아버지 회사가 상장되면 갚겠다'고 진술하는 등 반성하는 태도를 보이지 않고, 피해 회복을 위한 노력도 하지 않았다."}], "flags": [], "thumb": "thumbs/6-083.svg"}, {"id": "6-084", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 1240, "shot": "MS · 로우 · 재판장(중)", "screen": "법대를 아래에서 올려다본 정면. 재판장이 판결문의 마지막 줄을 읽는다, 손은 종이 위에만 있다(법봉 없음). 말풍선을 크게 두고 그 아래 넓은 흰 여백, 여백 끝에 내레이션 박스. 효과음 없음.", "summary": "법대를 아래에서 올려다본 정면.", "lines": [{"type": "dialogue", "speaker": "재판장", "text": "주문. 피고인을 징역 3년에 처한다."}, {"type": "narration", "speaker": "내레이션", "text": "그게 끝이었다. 문장이 끝나자 법정은 다음 사건 번호를 불렀다."}], "flags": [], "thumb": "thumbs/6-084.svg"}, {"id": "6-085", "chapter": "6화. 생일", "scene": "S#14 문장으로 끝나는 것 (수원지방법원 형사법정, 2027년 2월 18일 목 오전 10:00)", "width": 800, "height": 1800, "shot": "MS · 측면 · 도겸(상단), 교도관(상단·우)", "screen": "상단(C4 피고인석 옆 로우): 교도관이 그의 팔을 잡고, 일어서는 그가 셔츠 깃을 정리하는 시늉을 한다, 손가락이 깃 없는 둥근 목선을 더듬는다. 방청석 쪽으로는 고개를 돌리지 않은 채 피고인 출입문으로 나간다. 가운데 흰 여백. 하단(C3 맨 뒷줄 의자 높이): 비어 있는 맨 뒷줄, 나무 의자 위에 반듯하게 접힌 흰 면 손수건 하나에만 창빛이 내려앉는다. 효과음 없음, 내레이션 박스는 상단 끝과 하단 위에.", "summary": "상단(C4 피고인석 옆 로우): 교도관이 그의 팔을 잡고, 일어서는 그가 셔츠 깃을 정리하는 시늉을 한다, ", "lines": [{"type": "narration", "speaker": "내레이션", "text": "수용복에는 깃이 없었다. 그는 끝내 방청석을 돌아보지 않았다."}, {"type": "narration", "speaker": "내레이션", "text": "유진이 다시 뒤를 보았을 때 맨 뒷줄은 비어 있었다."}], "flags": [], "thumb": "thumbs/6-085.svg"}, {"id": "6-086", "chapter": "6화. 생일", "scene": "S#15 아무도 오지 않는 십 분 (교도소 정문 앞, 2029년 10월 16일 화 오전 10:00)", "width": 800, "height": 1480, "shot": "LS · 아이레벨 · 도겸(중)", "screen": "정문 앞 설정샷. 높은 회색 담장 아래 철제 정문이 옆으로 육중하게 미끄러져 열리고, 하얗게 데워진 아스팔트 위로 도겸이 갈색 종이 쇼핑백 하나를 들고 걸어 나온다. 노란 은행나무 가로수, 전깃줄 위의 까치 한 마리, 멀리 정류장에서 버스 매연이 흐릿하게 오른다. 정문 기둥 표지판은 빈 면. 효과음 둘은 붓 효과음(East Sea Dokdo), 내레이션 박스 좌상과 하단.", "summary": "정문 앞 설정샷.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "10월의 볕이 교도소 정문 앞 아스팔트를 하얗게 데웠다. 가로수 은행잎이 노랗게 물들어 있었다."}, {"type": "sfx", "speaker": "SFX(대형, 회색)", "text": "그르르릉"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "깍, 깍"}, {"type": "narration", "speaker": "내레이션", "text": "정확히 3년 전 오늘, 그는 다섯 개의 생일 파티에 불려 다녔다."}], "flags": [], "thumb": "thumbs/6-086.svg"}, {"id": "6-087", "chapter": "6화. 생일", "scene": "S#15 아무도 오지 않는 십 분 (교도소 정문 앞, 2029년 10월 16일 화 오전 10:00)", "width": 800, "height": 1000, "shot": "INS · 하이 · 도겸(중)", "screen": "가로 2분할. 좌: 쇼핑백 속, 배터리가 죽은 휴대폰 두 대(무광 블랙과 무광 그레이), 접힌 자국이 그대로인 흰 셔츠 한 장, 얇은 지갑과 양식화된 소품 지폐 몇 장(도안 없음). 우: 그의 엄지가 두 휴대폰의 전원 버튼을 차례로 누르지만 검은 화면이 그대로다(왼손목 하얀 시계 자국과 흉터). 내레이션 박스 셋을 좌상, 좌하, 우하에.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "안에는 배터리가 죽은 휴대폰 두 대와 3년 전의 셔츠 한 장, 지갑에 남은 2만 3천 원이 들어 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "셔츠에서는 아무 냄새도 나지 않았다. 다섯 개의 향은 그사이 다 날아가 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "켜졌어도 올 메시지는 없었다."}], "flags": [], "thumb": "thumbs/6-087.svg"}, {"id": "6-088", "chapter": "6화. 생일", "scene": "S#15 아무도 오지 않는 십 분 (교도소 정문 앞, 2029년 10월 16일 화 오전 10:00)", "width": 800, "height": 920, "shot": "MS · 아이레벨 · 도겸(중)", "screen": "가로 2분할. 좌: 그가 왼쪽을 본다, 빈 길. 우: 오른쪽을 본다, 길 건너에서 다른 출소자를 끌어안고 우는 가족이 작고 흐리게(얼굴 구분 없이) 보이고, 그는 금세 시선을 거둔다. 하단 띠 칸: 정문 옆 화단 가장자리에 선 그의 운동화와, 정류장 전광판 시각 10:02에서 10:12로(식자). 내레이션 박스 하단.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그는 정문 옆 화단 가장자리에 서서 십 분을 기다렸다. 아무도 오지 않았다."}], "flags": [], "thumb": "thumbs/6-088.svg"}, {"id": "6-089", "chapter": "6화. 생일", "scene": "S#15 아무도 오지 않는 십 분 (교도소 정문 앞, 2029년 10월 16일 화 오전 10:00)", "width": 800, "height": 1400, "shot": "LS · 하이 · 도겸(중)", "screen": "상단: 아무도 오지 않는 길, 은행잎 몇 장이 아스팔트 위를 구르고 화단 가장자리에 그가 작게 서 있다. 하단: 정류장에 버스가 서서 앞문을 열고, 갈색 종이 쇼핑백을 든 그의 뒷모습이 계단을 오른다. 문 효과음은 붓 효과음(East Sea Dokdo) 작게, 내레이션 박스 상단과 하단.", "summary": "상단: 아무도 오지 않는 길, 은행잎 몇 장이 아스팔트 위를 구르고 화단 가장자리에 그가 작게 서 있다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "엄마는 오지 않을 것이었다. 그는 그걸 알았다. 아는 척하지 말라고 한 사람은 그였다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "치익"}, {"type": "narration", "speaker": "내레이션", "text": "버스가 왔다. 그는 탔다."}], "flags": [], "thumb": "thumbs/6-089.svg"}, {"id": "6-090", "chapter": "6화. 생일", "scene": "S#16 우리 아버지가 지었어요 (새솔신도시 '그랑블루 레이크' 모델하우스 로비, 2029년 10월 16일 화 오후 3:00)", "width": 800, "height": 1360, "shot": "LS · 아이레벨 · 도겸(후경·중)", "screen": "정문 안쪽(C1) 로비 와이드. 흰 대리석 바닥, 샴페인 골드 몰딩, 가운데 샹들리에 아래 유리 상자 단지 모형, 왼쪽 흰 대리석 안내데스크와 투시도 영상 스크린(글자 없음), 오른쪽 상담석 여덟 테이블과 유선 전화. 어디에도 그림자가 없다. 안쪽 복도 끝 화장실 쪽에서 작은 도겸이 걸어 나온다. 피아노는 음표 효과선, 전화벨은 붓 효과음(East Sea Dokdo) 작게, 내레이션 박스 좌상과 우하.", "summary": "정문 안쪽(C1) 로비 와이드.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "모델하우스 안은 하얀 LED와 샹들리에 빛으로 그림자 하나 없이 밝았다."}, {"type": "sfx", "speaker": "SFX(아주 작게)", "text": "♪"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "따르릉"}, {"type": "narration", "speaker": "내레이션", "text": "피아노 배경음악 사이로 상담석 전화벨이 띄엄띄엄 울렸고, 새 벽지 풀 냄새와 드립커피 냄새가 났다."}], "flags": [], "thumb": "thumbs/6-090.svg"}, {"id": "6-091", "chapter": "6화. 생일", "scene": "S#16 우리 아버지가 지었어요 (새솔신도시 '그랑블루 레이크' 모델하우스 로비, 2029년 10월 16일 화 오후 3:00)", "width": 800, "height": 960, "shot": "MS · 아이레벨 · 도겸(중)", "screen": "화장실 거울(C4) 정면, 가로 2분할. 좌: 3년 묵은 흰 셔츠의 단추 두 개를 푸는 손가락(접힌 자국이 남은 앞섶, 시계 자국과 흉터). 우: 거울 속 그, 셔츠 어깨선이 조금 처져 헐겁고, 볼이 꺼진 얼굴에서 왼쪽 입꼬리가 반 박자 늦게 올라온다. 효과음 없음.", "summary": "화장실 거울(C4) 정면, 가로 2분할.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/6-091.svg"}, {"id": "6-092", "chapter": "6화. 생일", "scene": "S#16 우리 아버지가 지었어요 (새솔신도시 '그랑블루 레이크' 모델하우스 로비, 2029년 10월 16일 화 오후 3:00)", "width": 800, "height": 1240, "shot": "INS · 부감 · 도겸(하단)", "screen": "상단(C2): 유리 상자 속 단지 모형. 손톱만 한 나무들, 성냥갑 같은 흰 동 열여섯 개가 중앙 광장을 고리처럼 둘러싸고 파란 아크릴 호수가 빛난다(레이크시티 더퍼스트의 거울상). 유리에 내려다보는 그의 얼굴이 흐리게 비친다. 하단(C3): 모형 옆 세움 안내판 '피트니스 / 필라테스룸 / 골프연습장 / 사우나'(식자), 그의 시선 화살표가 마지막 단어에서 떨어져 호수 쪽으로 간다. 내레이션 박스 상단.", "summary": "상단(C2): 유리 상자 속 단지 모형.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "손톱만 한 나무들, 성냥갑 같은 동 열여섯 개, 파란 아크릴로 만든 호수."}], "flags": [], "thumb": "thumbs/6-092.svg"}, {"id": "6-093", "chapter": "6화. 생일", "scene": "S#16 우리 아버지가 지었어요 (새솔신도시 '그랑블루 레이크' 모델하우스 로비, 2029년 10월 16일 화 오후 3:00)", "width": 800, "height": 760, "shot": "BS · 아이레벨 · 상담 직원(좌), 도겸(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 서류철을 가슴에 안은 서른 살쯤의 상담 직원이 밝게 웃으며 다가온다. 우: 도겸이 그녀의 눈을 오래 맞춘   const head=`## ${c.id} (${c.chapter||''}${c.scene?' / '+c.scene:''})\n`+(c.shot?`- 샷·앵글·인물: ${c.shot}\n`:'');
  if(tr==='webtoon_real'||tr==='webtoon_adult')return head+`**이미지 프롬프트**\n${t.style||''}\n- 캔버스: ${c.width||800}×${c.height||800} (세로 스크롤 컷)\n- 시대·장소: ${D.style.era||''}\n- 화면·연출: ${scr}\n- 등장인물(외형 고정값):\n${who(c)||'- (인물 없음 또는 실루엣)'}\n- 조명·색: ${D.style.palette_hint||''}\n- 말풍선·글자는 이미지에 넣지 말 것 (레터링은 후공정)${note}\n\n**레터링(후공정)**\n${L||'  - (없음)'}\n\n**금지·수위**\n${neg(c)}\n`;
  if(tr==='shorts')return head+`- 길이: ${dur(c)}초 / 9:16 (1080×1920)\n- 카메라: ${camera(c)}\n- 화면: ${scr}${note}\n- 자막·VO:\n${L||'  - (무음)'}\n- 금지·수위:\n${neg(c)}\n`;
  return head+`- 샷 길이: ${dur(c)}초 @24fps (${Math.round(dur(c)*24)}프레임)\n- 카메라: ${camera(c)}\n- 레이어: BG / 인물 / FX / 레터링\n- 연기·화면: ${scr}${note}\n- 대사(립싱크·VO):\n${L||'  - (없음)'}\n- 인물 시트:\n${who(c)||'- (없음)'}\n- 금지·수위:\n${neg(c)}\n`;
}
function initSelects(){
  const ch=[...new Set(D.cuts.map(c=>c.chapter))];$('#chap').innerHTML='<option value="">전체 장 ('+D.cuts.length+'컷)</option>'+ch.map(c=>`<option>${esc(c)}</option>`).join('');
  const tr=Object.entries((D.tracks||{}).tracks||{});$('#track').innerHTML=tr.map(([k,v])=>`<option value="${k}">${esc(v.title)}</option>`).join('')||'<option value="webtoon_real">실사 웹툰</option>';
}
function renderList(){
  const f=$('#chap').value;
  $('#list').innerHTML=D.cuts.filter(c=>!f||c.chapter===f).map(c=>`<div class="item${sel===c.id?' on':''}" data-id="${c.id}"><img src="../${esc(c.thumb)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div><b>${c.id}</b>${(c.flags||[]).includes('intimate')?'<i class="tag">19</i>':''}${(c.flags||[]).includes('violence')?'<i class="tag">폭력</i>':''}<span>${esc((c.shot?c.shot.split('·')[0].trim()+' · ':'')+(c.summary||c.screen))}</span></div></div>`).join('');
}
function renderMain(){
  const c=D.cuts.find(x=>x.id===sel);if(!c)return;const tr=$('#track').value;
  const renders=Object.keys((D.tracks||{}).tracks||{}).map(k=>`<figure><img src="../renders/${k}/${c.id}.png" alt="" onerror="this.parentElement.style.display='none'"><figcaption>${esc(D.tracks.tracks[k].title)} 결과 · renders/${k}/${c.id}.png</figcaption></figure>`).join('');
  $('#main').innerHTML=`<h2 style="margin:0 0 4px">${c.id} <small class="hint">${esc(c.chapter)} · ${c.width}×${c.height}</small></h2>
  <div class="row"><div class="imgs"><figure><img src="../${esc(c.thumb)}" alt="${esc(c.summary)}"><figcaption>콘티 썸네일 · ${esc(c.thumb)} (같은 이름의 파일로 교체하면 반영)</figcaption></figure>${renders}</div>
  <div>
  <label>장면</label><input type="text" id="f-scene" value="${esc(c.scene||'')}">
  <label>샷 · 앵글 · 인물(위치)  — 예: BS · 오버숄더(정만 너머) · 인턴(중), 정만(좌·전경)</label><input type="text" id="f-shot" value="${esc(c.shot||'')}">
  <label>한 줄 요약</label><input type="text" id="f-summary" value="${esc(c.summary)}">
  <label>세로 높이(px, 폭 800 기준)</label><input type="number" id="f-height" value="${c.height}">
  <label>화면·연출</label><textarea id="f-screen" rows="5">${esc(c.screen)}</textarea>
  <label>대사·내레이션·SFX — 한 줄에 하나, "종류 | 화자 | 내용" (종류: dialogue, narration, sfx, thought, whisper, caption)</label><textarea id="f-lines" rows="6">${esc(linesToText(c.lines))}</textarea>
  <div class="flags"><label>수위 태그</label>${['intimate','violence','self_harm_theme'].map(f=>`<label><input type="checkbox" data-flag="${f}" ${(c.flags||[]).includes(f)?'checked':''}>${f}</label>`).join('')}</div>
  <label>이 트랙 전용 추가 지시 (${esc(((D.tracks.tracks||{})[tr]||{}).title||tr)})</label><textarea id="f-note" rows="3">${esc((c.notes||{})[tr]||'')}</textarea>
  <label>미리보기 — 현재 트랙 프롬프트</label><pre id="pv"></pre>
  </div></div>`;
  const upd=()=>{c.scene=$('#f-scene').value;c.shot=$('#f-shot').value;c.summary=$('#f-summary').value;c.height=+$('#f-height').value||c.height;c.screen=$('#f-screen').value;c.lines=textToLines($('#f-lines').value);c.flags=[...document.querySelectorAll('[data-flag]:checked')].map(e=>e.dataset.flag);c.notes=c.notes||{};c.notes[tr]=$('#f-note').value;$('#pv').textContent=prompt(tr,c);persist();renderList()};
  $('#main').querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',upd));$('#main').querySelectorAll('[data-flag]').forEach(e=>e.addEventListener('change',upd));
  $('#pv').textContent=prompt(tr,c);
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#list').addEventListener('click',e=>{const it=e.target.closest('.item');if(!it)return;sel=it.dataset.id;renderList();renderMain()});
$('#chap').addEventListener('change',renderList);$('#track').addEventListener('change',renderMain);
$('#copy').addEventListener('click',async()=>{const c=D.cuts.find(x=>x.id===sel);if(!c)return toast('컷을 먼저 고르세요');try{await navigator.clipboard.writeText(prompt($('#track').value,c));toast('복사했습니다')}catch(e){toast('복사 실패: 미리보기에서 직접 복사하세요')}});
$('#dlTrack').addEventListener('click',()=>{const tr=$('#track').value;const t=((D.tracks.tracks||{})[tr]||{});download(`${tr}_ALL.md`,`# ${t.title||tr}\n\n${t.brief||''}\n\n`+D.cuts.map(c=>prompt(tr,c)).join('\n'),'text/markdown')});
$('#dlJson').addEventListener('click',()=>download('cuts.json',JSON.stringify(D.cuts,null,2),'application/json'));
$('#load').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(Array.isArray(j))D.cuts=j;else D={...D,...j};persist();initSelects();renderList();toast('불러왔습니다')}catch(err){toast('JSON을 읽지 못했습니다')}});
initSelects();renderList();
if(!D.cuts.length)$('#main').innerHTML='<p class="hint">데이터가 없습니다. 킷 폴더에서 <code>python kit.py editor</code>를 실행해 tools/editor_ready.html을 여시거나, 위의 “불러오기”로 data/cuts.json을 여세요.</p>';
</script>
</body>
</html>
