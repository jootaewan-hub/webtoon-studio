 법 (물결놀이터 벤치, 9월 19일 토 오후 4:02)", "width": 800, "height": 1000, "shot": "MS · 아이레벨 · 유진(좌), 미란(우)", "screen": "위아래 2분할. 위: 미란이 휴대폰을 쥔 채 벤치에서 벌떡 일어나고, 검정 슬릿 롱스커트 자락이 크게 펄럭이는 동작선만 그린다(허리 위 MS, 다리는 벤치 등받이가 가린다). 아래: 앉은 유진의 길고 하얀 손이 미란의 손목을 잡는 INS, 와인색 손톱과 누드 베이지 손톱이 한 프레임에 든다. 말풍선 위칸 우상, 아래칸 좌하(짧고 낮게).", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "B구역. 차 빼러 내려오겠네. 가자."}, {"type": "dialogue", "speaker": "유진", "text": "가지 마세요."}], "flags": ["child_present"], "thumb": "thumbs/4-002.svg"}, {"id": "4-003", "chapter": "4화. 비밀방", "scene": "S#1 뛰지 않는 법 (물결놀이터 벤치, 9월 19일 토 오후 4:02)", "width": 800, "height": 800, "shot": "BS · 아이레벨 · 유진(좌), 미란(우)", "screen": "위아래 2분할 숏·리버스숏. 위: 선 채로 유진을 내려다보는 미란, 스모키 아이 위 눈썹이 올라가고 붉은 입술이 급하게 열린다. 아래: 벤치에 등을 대지 않고 무릎을 모은 유진이 손목을 놓지 않은 채 올려다본다. 말풍선 위칸 우상, 아래칸 좌상.", "summary": "위아래 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "왜. 자기는 안 궁금해?"}, {"type": "dialogue", "speaker": "유진", "text": "궁금해요. 그래서 가면 안 돼요."}], "flags": ["child_present"], "thumb": "thumbs/4-003.svg"}, {"id": "4-004", "chapter": "4화. 비밀방", "scene": "S#1 뛰지 않는 법 (물결놀이터 벤치, 9월 19일 토 오후 4:02)", "width": 800, "height": 1040, "shot": "CU · 아이레벨 · 유진(좌), 미란(우)", "screen": "위아래 2분할. 위: 퍼걸러 그늘이 눈가에 걸린 유진, 입꼬리만 예의 바르게 올라가 있고 나른한 눈은 웃지 않는다, 미란의 손목을 쥔 손에 힘이 일정하다. 긴 말풍선 하나를 좌상에서 내려오게. 아래: 반쯤 숙인 미란이 유진을 내려다보다 한쪽 입꼬리만 비죽 올린다, 머리 위 선글라스가 미끄러질 듯 걸려 있다. 내레이션 박스는 두 칸 경계, 미란 말풍선 우하.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "지금 내려가면 그 사람은 차를 빼고, 웃고, 우리 둘한테 각자 설명할 거예요. 설명은 그 사람이 제일 잘하는 거잖아요."}, {"type": "narration", "speaker": "내레이션", "text": "유진은 웃고 있었다. 눈은 웃지 않았다."}, {"type": "dialogue", "speaker": "미란", "text": "…자기 좀 무섭다."}], "flags": ["child_present"], "thumb": "thumbs/4-004.svg"}, {"id": "4-005", "chapter": "4화. 비밀방", "scene": "S#1 뛰지 않는 법 (물결놀이터 벤치, 9월 19일 토 오후 4:02)", "width": 800, "height": 1040, "shot": "MS · 아이레벨 · 유진(좌), 소이(우·후경), 지호(우·후경)", "screen": "가로 2분할. 좌: 유진이 손목을 쥔 채 담담하게 말한다, 승무원 시절처럼 등이 곧다. 우: 분수 광장 쪽에서 소이와 지호가 물을 뚝뚝 흘리며 벤치로 달려오고, 소이가 팔을 번쩍 들어 외치고 지호는 자랑스럽게 고개를 끄덕인다(물방울 효과선, 아이들은 밝은 낮 톤 그대로). 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "승무원 했었어요. 비상 상황에서는 뛰지 말라고 배웠어요."}, {"type": "dialogue", "speaker": "소이", "text": "엄마! 지호가 평생 내 부하 하기로 했어!"}], "flags": ["child_present"], "thumb": "thumbs/4-005.svg"}, {"id": "4-006", "chapter": "4화. 비밀방", "scene": "S#1 뛰지 않는 법 (물결놀이터 벤치, 9월 19일 토 오후 4:02)", "width": 800, "height": 1000, "shot": "INS · 하이 · 유진(중), 지호(하단)", "screen": "위아래 2분할. 위: 유진의 두 손이 흰 수건으로 지호의 젖은 머리를 감싸 꾹꾹 누른다, 손끝이 떨리지 않는다(아이 얼굴은 수건에 가려 작게). 아래: 벤치 위 유진 휴대폰이 진동선과 함께 켜지고 알림 배너가 뜬다(가상 UI, 문구와 '16:19'는 식자). 효과음은 붓 효과음(East Sea Dokdo) 아래칸에 작게, 내레이션 박스 위칸 우상과 아래칸 좌상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "손이 떨리지 않았다. 그녀는 그게 스스로도 신기했다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "띠링"}, {"type": "narration", "speaker": "내레이션", "text": "네 시 십구 분, 유진의 휴대폰에 알림이 떴다. [더퍼스트 차량알림] 등록차량 출차."}], "flags": ["child_present"], "thumb": "thumbs/4-006.svg"}, {"id": "4-007", "chapter": "4화. 비밀방", "scene": "S#1 뛰지 않는 법 (물결놀이터 벤치, 9월 19일 토 오후 4:02)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 유진(좌), 미란(우)", "screen": "가로 2분할. 좌: 휴대폰 화면을 미란 쪽으로 기울여 보여 주는 유진, 시선은 화면이 아니라 단지 출입구 쪽 먼 곳에 있다. 우: 화면을 들여다본 미란이 입술을 깨물며 혼잣말처럼 묻는다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "나갔네요. 단지 밖으로."}, {"type": "dialogue", "speaker": "미란", "text": "도색 때문일까, 우리 때문일까."}], "flags": ["child_present"], "thumb": "thumbs/4-007.svg"}, {"id": "4-008", "chapter": "4화. 비밀방", "scene": "S#1 뛰지 않는 법 (물결놀이터 벤치, 9월 19일 토 오후 4:02)", "width": 800, "height": 1120, "shot": "MS · 로우 · 유진(좌), 미란(우)", "screen": "가로 2분할. 좌: 유진이 지호 머리의 수건을 고쳐 여미며 담담하게 답한다. 우: 미란이 머리 위 선글라스를 검지로 끌어내려 쓰고 턱을 든다, 렌즈에 바닥분수와 오후 해가 비친다. 아래쪽 여백으로 놀이터 소리가 멀어진다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "둘 다면 좋겠어요."}, {"type": "dialogue", "speaker": "미란", "text": "우리 집 가자. 애들은 우리 엄마가 키즈카페 데려가게 할게. 와인은 내가 딸게."}], "flags": ["child_present"], "thumb": "thumbs/4-008.svg"}, {"id": "4-009", "chapter": "4화. 비밀방", "scene": "S#2 같은 9월 (304동 1204호 거실·식탁, 9월 19일 토 오후 5:30)", "width": 800, "height": 1360, "shot": "LS · 아이레벨 · 유진(좌·후경), 미란(우·후경)", "screen": "위아래 2분할. 위(C1 현관 안쪽): 신발장 위 무화과 리드 디퓨저 너머로 서쪽 창의 버건디 쉬어 커튼을 지난 해에 거실이 통째로 와인색이고, 원목 식탁에 두 여자가 마주 앉아 있다, 식탁과 크림 벽에 창틀 그림자가 길게 눕는다. 아래: 미란의 와인색 손톱이 오프너 손잡이를 돌리고 코르크가 빠지는 ECU. 효과음은 붓 효과음(East Sea Dokdo), 냉장고 쪽 작게와 코르크 옆 크게, 내레이션 박스 위칸 좌상, 말풍선 아래칸 우상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오후 다섯 시 반, 304동 1204호 거실은 서쪽 창으로 든 해 때문에 온통 와인색이었다."}, {"type": "narration", "speaker": "내레이션", "text": "집은 조용했다. 미란의 어머니가 두 아이를 데리고 더퍼스트 클럽 키즈카페로 내려간 뒤였다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "웅… 웅"}, {"type": "dialogue", "speaker": "미란", "text": "남자 거짓말은 와인이랑 같아. 열어 봐야 알아."}, {"type": "sfx", "speaker": "SFX(중간, 크림색)", "text": "퐁"}], "flags": [], "thumb": "thumbs/4-009.svg"}, {"id": "4-010", "chapter": "4화. 비밀방", "scene": "S#2 같은 9월 (304동 1204호 거실·식탁, 9월 19일 토 오후 5:30)", "width": 800, "height": 960, "shot": "INS · 하이 · 유진(좌), 미란(우)", "screen": "C2 식탁 옆에서 내려다본 식탁. 채운 잔 두 개 사이에 휴대폰 두 대가 나란히 누워 같은 9월 달력을 띄우고 있다(가상 UI, 칸 색은 비움). 유진의 길고 하얀 검지가 날짜를 한 칸씩 짚어 내려가고, 미란의 와인색 손톱이 자기 화면의 한 칸을 먼저 톡 짚는다, 긴 창 그림자가 두 화면을 가로지른다. 내레이션 박스 상단, 말풍선은 화면 밖 우상과 좌하.", "summary": "C2 식탁 옆에서 내려다본 식탁.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "두 개의 캘린더 앱이 같은 9월을 띄웠다. 유진은 승무원 시절 탑승객 명단을 대조하던 손으로 날짜를 짚어 내려갔다."}, {"type": "dialogue", "speaker": "미란", "text": "9월 4일 금요일."}, {"type": "dialogue", "speaker": "유진", "text": "현장 야간 점검이요. 새벽 세 시에 들어왔어요."}], "flags": [], "thumb": "thumbs/4-010.svg"}, {"id": "4-011", "chapter": "4화. 비밀방", "scene": "S#2 같은 9월 (304동 1204호 거실·식탁, 9월 19일 토 오후 5:30)", "width": 800, "height": 880, "shot": "CU · 아이레벨 · 미란(중)", "screen": "위아래 2분할. 위: 미란이 화면에서 눈을 떼지 않고 말한다, 반쯤 감긴 스모키 아이. 아래: 손목이 천천히 원을 그리며 잔을 돌리고 붉은 와인이 유리 벽을 타고 올랐다 내려온다, 그 너머에서 붉은 입술만 움직인다. 말풍선 위칸 우상, 아래칸 좌하(작고 낮게).", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "새벽 한 시 이십 분. 우리 가게. 마감하고."}, {"type": "dialogue", "speaker": "미란", "text": "카운터 위에서."}], "flags": ["intimate"], "thumb": "thumbs/4-011.svg"}, {"id": "4-012", "chapter": "4화. 비밀방", "scene": "S#2 같은 9월 (304동 1204호 거실·식탁, 9월 19일 토 오후 5:30)", "width": 800, "height": 720, "shot": "CU · 아이레벨 · 유진(중)", "screen": "유진이 아무것도 묻지 않고 미란의 돌아가는 잔을 본다. 눈동자에 잔 속 와인의 붉은 원이 비치고, 화면 가장자리부터 버건디 #7A1E2E 틴트가 번져 들어온다(다음 회상으로 넘기는 전환). 내레이션 박스 하단.", "summary": "유진이 아무것도 묻지 않고 미란의 돌아가는 잔을 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유진은 묻지 않았다. 묻지 않아도 보였다."}], "flags": [], "thumb": "thumbs/4-012.svg"}, {"id": "4-013", "chapter": "4화. 비밀방", "scene": "S#3 회상 — 카운터 위에서 (와인바 '미란', 9월 4일 금 새벽 1:20)", "width": 800, "height": 1240, "shot": "MS · 측면 · 미란(좌), 도겸(우)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 미란 버건디 #7A1E2E). 원컷 2-029·2-031 재사용, 위아래 2분할. 위: 미란이 카운터를 짚고 가볍게 몸을 띄워 걸터앉자 슬릿이 저절로 갈라지며 허벅지가 붉은 빛 아래 통째로 드러나고, 위쪽 전경에 랙의 잔들이 흐리게 걸린다. 아래: 그녀 허리 뒤 앞치마 끈을 당기는 그의 왼손(시계와 흉터), 매듭이 한 번에 풀린다. 내레이션 박스 위칸 좌상, 효과음은 붓 효과음(East Sea Dokdo) 아래칸 작게.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 미란 버건디 #7A1E2E).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "붉은 조명만 남은 바."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "스륵"}], "flags": ["intimate"], "thumb": "thumbs/4-013.svg"}, {"id": "4-014", "chapter": "4화. 비밀방", "scene": "S#3 회상 — 카운터 위에서 (와인바 '미란', 9월 4일 금 새벽 1:20)", "width": 800, "height": 1360, "shot": "MS · 오버숄더(도겸 너머) · 미란(중), 도겸(전경·실루엣)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 미란 버건디 #7A1E2E). 원컷 2-032 재사용. 오프숄더가 아래로 끌려 내려가고, 그의 넓은 어깨와 뒷머리가 전경 실루엣으로 가슴 앞을 가리며, 그의 손은 그녀의 갈비뼈 옆에 머물고 손목과 시계만 붉은 빛 안에 있다. 고개를 젖히고 웃던 미란의 입이 그의 입술이 쇄골 아래로 내려가는 순간 웃음 모양 그대로 멈춘다(웃음 잔상선 한 줄), 효과음 없음.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 미란 버건디 #7A1E2E).", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/4-014.svg"}, {"id": "4-015", "chapter": "4화. 비밀방", "scene": "S#3 회상 — 카운터 위에서 (와인바 '미란', 9월 4일 금 새벽 1:20)", "width": 800, "height": 1600, "shot": "INS · 로우 · 미란(중)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 미란 버건디 #7A1E2E). 원컷 2-034·2-036 재사용, 위아래 3단. 위: 머리 위 랙의 거꾸로 걸린 잔들이 떨며 울린다, 왼쪽은 띄엄띄엄 오른쪽으로 갈수록 촘촘하게. 가운데: 와인색 손톱의 손바닥이 카운터 원목을 치며 박자를 센다. 아래: 헥사곤 타일 위에서 산산이 깨진 잔 하나와 그 아래 긴 검은 여백, 효과음은 붓 효과음(East Sea Dokdo)으로 쨍그랑만 대형, 내레이션 박스는 맨 아래 여백 가운데.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 미란 버건디 #7A1E2E).", "lines": [{"type": "sfx", "speaker": "SFX(작게→중간, 흰색)", "text": "쨍… 쨍… 쨍, 쨍, 쨍"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "탁, 탁"}, {"type": "sfx", "speaker": "SFX(대형, 적색)", "text": "쨍그랑"}, {"type": "narration", "speaker": "내레이션", "text": "그리고 모든 소리가 멈췄다."}], "flags": [], "thumb": "thumbs/4-015.svg"}, {"id": "4-016", "chapter": "4화. 비밀방", "scene": "S#4 단위 (304동 1204호 식탁, 9월 19일 토 오후 5:40 / 회상: 101동 3801호 침실 통창, 9월 1일 화 밤 10:30)", "width": 800, "height": 600, "shot": "INS · 하이 · 유진(좌), 미란(우)", "screen": "가로 2분할. 좌: 유진의 검지가 자기 캘린더의 9월 1일 칸에서 멈춘다(가상 UI, 칸 색 비움). 우: 미란이 자기 화면의 같은 칸을 내려다보며 고개를 젓는다, 와인색 손톱이 화면 위 허공을 짚는다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "9월 1일 화요일."}, {"type": "dialogue", "speaker": "미란", "text": "그날은 나 못 봤어."}], "flags": ["intimate"], "thumb": "thumbs/4-016.svg"}, {"id": "4-017", "chapter": "4화. 비밀방", "scene": "S#4 단위 (304동 1204호 식탁, 9월 19일 토 오후 5:40 / 회상: 101동 3801호 침실 통창, 9월 1일 화 밤 10:30)", "width": 800, "height": 720, "shot": "CU · 아이레벨 · 유진(중)", "screen": "유진이 잔을 입가까지 들었다가 마시지 않고 그대로 내려놓는다(위아래 잔상 두 겹). 말줄임 간격을 넓게 두고, 화면 오른쪽 가장자리부터 회색 #9A9EA3 틴트가 번져 든다. 말풍선 우상.", "summary": "유진이 잔을 입가까지 들었다가 마시지 않고 그대로 내려놓는다(위아래 잔상 두 겹).", "lines": [{"type": "dialogue", "speaker": "유진", "text": "그날은… 집에 있었어요."}], "flags": ["intimate"], "thumb": "thumbs/4-017.svg"}, {"id": "4-018", "chapter": "4화. 비밀방", "scene": "S#4 단위 (304동 1204호 식탁, 9월 19일 토 오후 5:40 / 회상: 101동 3801호 침실 통창, 9월 1일 화 밤 10:30)", "width": 800, "height": 1440, "shot": "MS · 측면 · 유진(중·실루엣), 도겸(우·실루엣)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 유진 회색 #9A9EA3). 안방 문가(C1)에서 남동 모서리 통창을 대각선으로, 위아래 3단. 위: 통창 가득 호수신도시 야경, 호수 위 가로등 불빛이 길게 흔들린다. 가운데: 그의 엄지가 검은 실크 슬립의 가는 끈을 밀자 끈이 어깨의 둥근 곡선을 타고 미끄러진다(역광 림라이트만). 아래: 천이 가슴에 잠시 걸렸다가 허리, 골반을 지나 발목으로 흘러내려 대리석 위 검은 웅덩이가 된다(몸은 멀리언 그림자와 실루엣, 발목과 바닥의 실크만 또렷), 내레이션 박스 위칸 좌상.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 유진 회색 #9A9EA3).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "밤 열 시 반, 통창 가득 호수신도시 야경."}], "flags": ["intimate"], "thumb": "thumbs/4-018.svg"}, {"id": "4-019", "chapter": "4화. 비밀방", "scene": "S#4 단위 (304동 1204호 식탁, 9월 19일 토 오후 5:40 / 회상: 101동 3801호 침실 통창, 9월 1일 화 밤 10:30)", "width": 800, "height": 1280, "shot": "INS · 로우 · 유진(중·실루엣), 도겸(후경·실루엣)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 유진 회색 #9A9EA3). 남쪽 창턱 로우(C2), 위아래 3단. 위: 그가 그녀를 돌려 세우고 두 손바닥이 차가운 통창에 붙는다, 손끝이 하얘진다. 가운데: 유리 위 숨이 만든 동그란 김이 번졌다 사라지고 다시 번지는 것을 같은 칸에 세 번, 간격을 점점 좁게. 아래: 유리 너머 도시의 불빛이 한꺼번에 초점을 잃은 보케만 남는다, 내레이션 박스는 각 단에 하나씩.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 유진 회색 #9A9EA3).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유리는 차가웠고 등 뒤의 가슴은 뜨거웠다."}, {"type": "narration", "speaker": "내레이션", "text": "간격이 점점 짧아졌다."}, {"type": "narration", "speaker": "내레이션", "text": "도시 전체가 초점을 잃었다."}], "flags": ["intimate"], "thumb": "thumbs/4-019.svg"}, {"id": "4-020", "chapter": "4화. 비밀방", "scene": "S#4 단위 (304동 1204호 식탁, 9월 19일 토 오후 5:40 / 회상: 101동 3801호 침실 통창, 9월 1일 화 밤 10:30)", "width": 800, "height": 1080, "shot": "MS · 하이 · 유진(중)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 유진 회색 #9A9EA3). 위아래 2분할. 위: 바닥에 벗어 던진 그의 바지 주머니가 짧게 두 번 진동한다(진동선 두 줄). 아래: 시트를 어깨까지 덮고 그에게 등을 돌린 채 누운 유진, 통창에 비친 그녀의 얼굴에서 두 눈이 뜨여 있다. 효과음은 붓 효과음(East Sea Dokdo) 회색 작게, 내레이션 박스 아래칸 하단.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 유진 회색 #9A9EA3).", "lines": [{"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "징— 징—"}, {"type": "narration", "speaker": "내레이션", "text": "그녀는 등을 돌린 채 눈을 뜨고 있었다. 그래도, 다시 시작된 줄 알았다."}], "flags": ["intimate"], "thumb": "thumbs/4-020.svg"}, {"id": "4-021", "chapter": "4화. 비밀방", "scene": "S#4 단위 (304동 1204호 식탁, 9월 19일 토 오후 5:40 / 회상: 101동 3801호 침실 통창, 9월 1일 화 밤 10:30)", "width": 800, "height": 800, "shot": "BS · 아이레벨 · 유진(좌), 미란(우)", "screen": "현재로 복귀(틴트가 걷히고 와인색 오후 빛). 위아래 2분할 숏·리버스숏. 위: 한참 만에 입을 연 미란, 돌리던 잔을 멈춘 손목. 아래: 유진이 존댓말 어미를 끝까지 지켜 또박또박 답한다. 말풍선 위칸 우상, 아래칸 좌상.", "summary": "현재로 복귀(틴트가 걷히고 와인색 오후 빛).", "lines": [{"type": "dialogue", "speaker": "미란", "text": "자기는 얼마야?"}, {"type": "dialogue", "speaker": "유진", "text": "2억이요. 친정 돈이에요. 아버지 회사 상장 전 지분 매입이라고 했어요."}], "flags": ["intimate"], "thumb": "thumbs/4-021.svg"}, {"id": "4-022", "chapter": "4화. 비밀방", "scene": "S#4 단위 (304동 1204호 식탁, 9월 19일 토 오후 5:40 / 회상: 101동 3801호 침실 통창, 9월 1일 화 밤 10:30)", "width": 800, "height": 1000, "shot": "MS · 아이레벨 · 미란(중), 유진(좌·전경)", "screen": "위아래 2분할. 위: 미란이 시선을 떨구고 작게 말한 뒤 잔을 단숨에 비운다. 아래: 빈 잔을 식탁에 내려놓으며 웃자고 한쪽 입꼬리를 올리지만 둘 다 웃지 않는다, 전경의 유진 옆얼굴도 굳어 있다. 말풍선 위칸 우상, 아래칸 우하, 내레이션 박스 아래칸 좌하.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "…나는 3천. 가게 리모델링 업체에 대신 처리해 준대서."}, {"type": "dialogue", "speaker": "미란", "text": "자기는 와이프라서 단위가 다르구나."}, {"type": "narration", "speaker": "내레이션", "text": "웃자고 한 말이었는데 둘 다 웃지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/4-022.svg"}, {"id": "4-023", "chapter": "4화. 비밀방", "scene": "S#5 반쪽짜리 문장 (304동 1204호 식탁·베란다, 9월 19일 토 오후 5:50)", "width": 800, "height": 720, "shot": "CU · 아이레벨 · 미란(중)", "screen": "미란이 빈 잔을 내려놓고 몸을 앞으로 기울여 말을 꺼낸다. 말풍선 마지막 글자 뒤가 진동 효과선에 잘려 나가고, 식탁 위 미란의 휴대폰이 진동하며 미끄러진다. 효과음은 붓 효과음(East Sea Dokdo) 작게, 말풍선 우상.", "summary": "미란이 빈 잔을 내려놓고 몸을 앞으로 기울여 말을 꺼낸다.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "그 사람이 나한테 그랬거든. 너한테만…"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "드르르"}], "flags": [], "thumb": "thumbs/4-023.svg"}, {"id": "4-024", "chapter": "4화. 비밀방", "scene": "S#5 반쪽짜리 문장 (304동 1204호 식탁·베란다, 9월 19일 토 오후 5:50)", "width": 800, "height": 760, "shot": "MS · 뒷모습 · 미란(중)", "screen": "[트랙2] 베란다로 나가 전화를 받는 미란의 뒷모습, 휴대폰을 귀에서 한 뼘 떼고 어깨를 움찔한다(관자놀이 옆 큰 땀방울, 코믹 집중선, 크림색 플랫 배경). 전화 너머 어머니 목소리는 들쭉날쭉한 큰 말풍선으로 휴대폰에서 터져 나온다, 의상 색은 본편과 같다. 내레이션 박스 좌상.", "summary": "[트랙2] 베란다로 나가 전화를 받는 미란의 뒷모습, 휴대폰을 귀에서 한 뼘 떼고 어깨를 움찔한다(관자놀이 ", "lines": [{"type": "narration", "speaker": "내레이션", "text": "미란의 휴대폰이 울렸다. 키즈카페의 어머니였다."}, {"type": "dialogue", "speaker": "미란 어머니(전화)", "text": "얘, 지호가 쉬 마렵다는데 여기 화장실 어디냐!"}], "flags": ["intimate"], "thumb": "thumbs/4-024.svg"}, {"id": "4-025", "chapter": "4화. 비밀방", "scene": "S#5 반쪽짜리 문장 (304동 1204호 식탁·베란다, 9월 19일 토 오후 5:50)", "width": 800, "height": 1000, "shot": "MS · 하이 · 유진(중), 미란(후경·실루엣)", "screen": "식탁에 혼자 남은 유진. 맞은편 빈 의자와 빈 잔, 나란히 누운 휴대폰 두 대, 창 너머 베란다의 미란은 작은 실루엣이다. 유진은 자기 잔 가장자리를 손끝으로 한 바퀴 쓸 뿐 움직이지 않고, 식탁 위 허공에 미란이 남긴 빈 말풍선 테두리 하나가 떠 있다. 내레이션 박스 세 개를 위에서 아래로.", "summary": "식탁에 혼자 남은 유진.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유진은 반쪽짜리 문장과 함께 식탁에 남았다."}, {"type": "narration", "speaker": "내레이션", "text": "너한테만."}, {"type": "narration", "speaker": "내레이션", "text": "그다음 말을 알 것 같았다. 알 것 같아서 묻지 않았다."}], "flags": [], "thumb": "thumbs/4-025.svg"}, {"id": "4-026", "chapter": "4화. 비밀방", "scene": "S#5 반쪽짜리 문장 (304동 1204호 식탁·베란다, 9월 19일 토 오후 5:50)", "width": 800, "height": 840, "shot": "BS · 아이레벨 · 유진(좌), 미란(우)", "screen": "위아래 2분할. 위: 돌아온 미란이 의자에 털썩 앉으며 휴대폰을 엎어 놓고 손가락을 접어 세듯 말한다. 아래: 유진이 캘린더 화면의 다음 날 칸을 짚으며 고개를 든다. 말풍선 위칸 우상, 아래칸 좌상.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "부녀회장. 503동 정혜숙. 관리사무소는 그 언니가 꽉 잡고 있어. CCTV든 차량 기록이든."}, {"type": "dialogue", "speaker": "유진", "text": "내일 같이 가요. 열 시에."}], "flags": [], "thumb": "thumbs/4-026.svg"}, {"id": "4-027", "chapter": "4화. 비밀방", "scene": "S#6 깨끗한 휴대폰 (101동 3801호 거실, 9월 19일 토 밤 11:10)", "width": 800, "height": 1360, "shot": "LS · 아이레벨 · 유진(우), 도겸(좌·후경·실루엣)", "screen": "위아래 2분할. 위(C3): 불이 다 꺼진 거실, 통창 너머 불빛만 흰 대리석 바닥에 얇게 깔리고, 아일랜드 식탁 위 따라 놓고 마시지 않은 와인 한 잔이 창빛을 받는다, 그 앞에 유진이 등받이에 기대지 않고 앉아 있다. 아래: 깊은 복도 끝 현관 중문 너머로 도어락 불이 켜지고 도겸의 실루엣이 들어선다, 그의 몸 둘레에 옅은 회색(#9A9EA3) 향 입자 결을 얇게 그린다. 효과음은 붓 효과음(East Sea Dokdo), 가습기는 복도 쪽 작게, 도어락은 아래칸.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "밤 열한 시 십 분, 101동 3801호의 불은 다 꺼져 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "식탁 위에는 따라 놓고 마시지 않은 와인 한 잔이 있었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "쌕… 쌕"}, {"type": "sfx", "speaker": "SFX", "text": "삐리릭"}, {"type": "narration", "speaker": "내레이션", "text": "회색 병의 냄새가 먼저 들어왔다. 오늘은 틀리지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/4-027.svg"}, {"id": "4-028", "chapter": "4화. 비밀방", "scene": "S#6 깨끗한 휴대폰 (101동 3801호 거실, 9월 19일 토 밤 11:10)", "width": 800, "height": 720, "shot": "BS · 아이레벨 · 도겸(좌), 유진(우)", "screen": "가로 2분할. 좌: 거실로 들어서는 도겸이 묻지도 않은 설명부터 늘어놓는다, 이마의 머리 한 가닥과 왼쪽 입꼬리만 올라간 웃음. 우: 유진이 앉은 채 고개만 돌려 공손하게 묻는다. 내레이션 박스는 두 칸 경계, 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "안 잤어? B구역 도색한다고 해서 차 빼느라 혼났어."}, {"type": "narration", "speaker": "내레이션", "text": "묻지도 않은 말이었다."}, {"type": "dialogue", "speaker": "유진", "text": "오늘 현장 일찍 끝났어요?"}], "flags": ["intimate"], "thumb": "thumbs/4-028.svg"}, {"id": "4-029", "chapter": "4화. 비밀방", "scene": "S#6 깨끗한 휴대폰 (101동 3801호 거실, 9월 19일 토 밤 11:10)", "width": 800, "height": 600, "shot": "CU · 아이레벨 · 도겸(좌), 유진(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 도겸이 아일랜드에 메인폰을 내려놓으며 가볍게 답한다. 우: 유진의 나른한 눈이 그를 똑바로 본다, 존댓말 어미를 길게 끈다. 말풍선 좌상, 우하.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "아니, 회의가 길어져서."}, {"type": "dialogue", "speaker": "유진", "text": "아까 현장이라고 하셨잖아요."}], "flags": ["intimate"], "thumb": "thumbs/4-029.svg"}, {"id": "4-030", "chapter": "4화. 비밀방", "scene": "S#6 깨끗한 휴대폰 (101동 3801호 거실, 9월 19일 토 밤 11:10)", "width": 800, "height": 1240, "shot": "MS · 아이레벨 · 도겸(좌·후경), 유진(중)", "screen": "위아래 2분할. 위: 도겸의 왼손이 이마의 머리 가닥을 넘기고 귓불을 만지는 INS(시계와 흉터 한 프레임). 아래: 그가 뒤로 와서 유진의 허리를 두 팔로 감고, 유진이 입꼬리만 올린 채 니트 위의 그 손가락을 하나씩, 아주 공손하게 떼어 낸다. 말풍선 위칸 우상, 내레이션 박스 아래칸 좌상, 유진 말풍선 아래칸 우하.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "현장에서 회의했지."}, {"type": "narration", "speaker": "내레이션", "text": "유진은 웃었다. 눈은 웃지 않았다. 9월 1일과 같은 손, 같은 자리였다. 유진은 그 손을 하나씩 떼어 냈다. 아주 공손하게."}, {"type": "dialogue", "speaker": "유진", "text": "오늘은 피곤해요. 지호가 놀이터에서 친구를 사귀었어요."}], "flags": ["intimate"], "thumb": "thumbs/4-030.svg"}, {"id": "4-031", "chapter": "4화. 비밀방", "scene": "S#6 깨끗한 휴대폰 (101동 3801호 거실, 9월 19일 토 밤 11:10)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 도겸(좌), 유진(우)", "screen": "가로 2분할. 좌: 거실 조명 스위치 쪽으로 걸어가며 대수롭지 않게 묻는 도겸의 옆모습. 우: 유진이 그의 등을 보며 또박또박 답한다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "그래? 누구?"}, {"type": "dialogue", "speaker": "유진", "text": "일곱 살 여자애요. 소이."}], "flags": ["intimate"], "thumb": "thumbs/4-031.svg"}, {"id": "4-032", "chapter": "4화. 비밀방", "scene": "S#6 깨끗한 휴대폰 (101동 3801호 거실, 9월 19일 토 밤 11:10)", "width": 800, "height": 840, "shot": "INS · 아이레벨 · 도겸(중), 유진(우·전경)", "screen": "위아래 2분할. 위: 복도 모서리 기둥의 거실 조명 스위치 앞에서 그의 손가락이 반 뼘 거리에 멈춘다(정지선, 효과음 없음). 아래: 그것을 보는 유진의 눈 ECU, 속눈썹 하나 움직이지 않는다. 그의 말풍선은 등을 돌린 채 한 박자 늦게 작게, 내레이션 박스 아래칸 좌하.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "반 초였다. 유진은 승무원 시절 반 초짜리 표정으로 진상 승객을 골라냈었다."}, {"type": "dialogue", "speaker": "도겸", "text": "…애들은 금방 친해지지."}], "flags": ["intimate"], "thumb": "thumbs/4-032.svg"}, {"id": "4-033", "chapter": "4화. 비밀방", "scene": "S#6 깨끗한 휴대폰 (101동 3801호 거실, 9월 19일 토 밤 11:10)", "width": 800, "height": 1520, "shot": "INS · 하이 · 유진(중)", "screen": "위아래 2분할. 위: 복도 욕실 문틈으로 샤워 소리와 김이 새고, 아일랜드 위에 남은 무광 블랙 메인폰을 유진의 하얀 손이 집어 엄지로 잠금을 푼다(숫자는 그리지 않는다). 아래: 화면 INS 두 장(가상 UI, 글자는 식자), 메시지 목록에는 대화방 둘뿐이고 사진첩에는 아이 사진뿐이다, 화면 빛이 유진의 얼굴을 아래에서 하얗게 비춘다. 맨 아래 여백 뒤 F.O., 효과음은 붓 효과음(East Sea Dokdo) 위칸 작게, 내레이션 박스는 위아래로.", "summary": "위아래 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "쏴아—"}, {"type": "narration", "speaker": "내레이션", "text": "유진은 비밀번호를 알았다. 지호 생일이었다."}, {"type": "narration", "speaker": "내레이션", "text": "메시지에는 유진과 지호 유치원 단체방뿐이었다. 사진첩에는 지호뿐이었다. 깨끗했다."}, {"type": "narration", "speaker": "내레이션", "text": "깨끗한 휴대폰은 결백의 증거가 아니었다. 관리의 증거였다."}], "flags": ["intimate"], "thumb": "thumbs/4-033.svg"}, {"id": "4-034", "chapter": "4화. 비밀방", "scene": "S#7 새로 꿴 실 (503동 2402호 거실, 9월 20일 일 오전 10:00)", "width": 800, "height": 1320, "shot": "LS · 아이레벨 · 유진(좌), 미란(좌), 혜숙(우)", "screen": "현관 홀(C1)에서 콘솔의 백합 꽃꽂이 너머로 본 남향 거실. 반쯤 걷힌 차콜 커튼 사이로 든 아침 빛이 흰 가죽 소파 위에 칼처럼 한 줄 그어져 있고, 사이드보드 오디오에서 첼로 선율이 금빛 음표 효과선으로 흐르며 핸드드립 주전자에서 물이 떨어진다. 유진과 미란이 소파에, 혜숙이 유리 테이블 끝에 걸터앉아 턱을 든다. 날짜 자막 '9월 20일(일)'은 좌상 식자, 효과음은 붓 효과음(East Sea Dokdo) 작게, 내레이션 박스 셋은 좌상에서 아래로.", "summary": "현관 홀(C1)에서 콘솔의 백합 꽃꽂이 너머로 본 남향 거실.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오전 열 시, 503동 2402호 남향 거실에는 커튼이 반쯤 걷혀 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "클래식 FM에서 첼로가 흘렀고, 핸드드립 원두 냄새와 화병의 백합 냄새가 섞여 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "지호와 소이는 더퍼스트 클럽 키즈카페의 일요일 오전반에 맡겼다. 그는 새벽 일곱 시에 골프 접대라며 나갔다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "똑… 똑"}], "flags": [], "thumb": "thumbs/4-034.svg"}, {"id": "4-035", "chapter": "4화. 비밀방", "scene": "S#7 새로 꿴 실 (503동 2402호 거실, 9월 20일 일 오전 10:00)", "width": 800, "height": 1080, "shot": "FS · 로우 · 혜숙(중), 유진(좌·전경)", "screen": "위아래 2분할. 위: 유리 테이블 끝에 걸터앉은 혜숙의 전신, 네이비 저지가 성숙한 가슴과 부드럽게 꺼지는 허리, 넓고 둥근 골반을 한 번도 끊기지 않고 감싸 흐르고, 쇄골 아래 진주 한 줄이 빛줄기를 받는다, 시뇽 아래 날개형 아이라인이 우아하게 꺾인다. 아래: 전경의 유진이 무릎을 모은 채 공손하게 청하고, 혜숙이 혀를 차듯 우아하게 받는다. 내레이션 박스 위칸 우상, 말풍선 아래칸 좌상·우상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "목에는 진주가 한 줄 걸려 있었다."}, {"type": "dialogue", "speaker": "유진", "text": "부녀회장님, 관리사무소 차량 출입 기록을 좀 볼 수 있을까 해서요."}, {"type": "dialogue", "speaker": "혜숙", "text": "얘, 그건 그렇게 하는 거 아니야. 개인정보라 소장도 함부로 못 보여 줘. 무슨 일인데?"}], "flags": ["intimate"], "thumb": "thumbs/4-035.svg"}, {"id": "4-036", "chapter": "4화. 비밀방", "scene": "S#7 새로 꿴 실 (503동 2402호 거실, 9월 20일 일 오전 10:00)", "width": 800, "height": 1280, "shot": "CU · 아이레벨 · 혜숙(중), 유진(좌·전경)", "screen": "위아래 2분할. 위: 미란이 내민 휴대폰 화면 INS, 붉은 조명 아래 버건디 벨벳 소파에 기대 잠든 남자의 짙은 일자 눈썹과 넓은 어깨(3-077과 같은 사진). 아래: 혜숙이 웃을 때처럼 빨간 손톱의 손으로 입을 가리지만 눈은 웃지 않고, 얼굴이 천천히 굳는다(같은 칸에 표정 두 단계 잔상). 내레이션 박스 아래칸 좌상, 낮게 깔린 혜숙 말풍선 우상, 유진 말풍선 좌하.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "웃고 있지 않았다. 목소리가 낮아졌다."}, {"type": "dialogue", "speaker": "혜숙", "text": "…이 사람, 이름이 뭐니."}, {"type": "dialogue", "speaker": "유진", "text": "한도겸이요. 제 남편이에요."}], "flags": [], "thumb": "thumbs/4-036.svg"}, {"id": "4-037", "chapter": "4화. 비밀방", "scene": "S#7 새로 꿴 실 (503동 2402호 거실, 9월 20일 일 오전 10:00)", "width": 800, "height": 800, "shot": "INS · 아이레벨 · 혜숙(중)", "screen": "혜숙의 손가락이 쇄골 아래 진주 목걸이로 올라가 한 알을 쥔다. ECU로 진주 알 사이의 실이 눈에 띄게 하얗게 빛나고, 화면 가장자리부터 금색 #C9A45C 틴트가 번져 든다(다음 회상 전환). 내레이션 박스 상단과 하단.", "summary": "혜숙의 손가락이 쇄골 아래 진주 목걸이로 올라가 한 알을 쥔다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유진은 그때 보았다. 진주 알 사이의 실이 눈에 띄게 하얬다."}, {"type": "narration", "speaker": "내레이션", "text": "최근에 끊어졌다가 다시 꿴 목걸이였다."}], "flags": ["intimate"], "thumb": "thumbs/4-037.svg"}, {"id": "4-038", "chapter": "4화. 비밀방", "scene": "S#8 회상 — 놔둬 (503동 2402호 안방, 9월 2일 수 오후 2:00)", "width": 800, "height": 1400, "shot": "MS · 아이레벨 · 혜숙(중), 도겸(좌·전경)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 혜숙 금색 #C9A45C). 위아래 3단. 위: 침대 끝에 앉아 턱을 든 혜숙의 블라우스 진주 단추를 그의 손가락이 그녀의 숨 한 번에 하나씩 푼다(단추 ECU 셋을 계단식으로). 가운데: 실크가 어깨를 타고 미끄러져 팔꿈치에 걸리고, 피부색 레이스 아래 무게 있는 가슴과 부드럽게 꺼지는 허리가 오후 빛줄기에 금색으로 젖는다. 아래: 골반에 걸려 저절로 내려오지 않는 펜슬스커트, 전경 왼쪽에 차콜 암막 자락이 크게 걸리고 내레이션 박스는 위칸 좌상.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 혜숙 금색 #C9A45C).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "9월 2일 오후 두 시, 안방."}], "flags": ["intimate"], "thumb": "thumbs/4-038.svg"}, {"id": "4-039", "chapter": "4화. 비밀방", "scene": "S#8 회상 — 놔둬 (503동 2402호 안방, 9월 2일 수 오후 2:00)", "width": 800, "height": 1120, "shot": "MS · 뒷모습 · 혜숙(중), 도겸(하단)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 혜숙 금색 #C9A45C). 혜숙이 그를 침대에 눕히고 올라탄 뒷모습, 빛줄기가 맨등과 척추 골만 금색으로 칠하고 나머지는 어둠과 커튼 자락이 가린다. 두 사람 사이에서 흔들리던 진주 목걸이에 그의 손가락 하나가 걸리고, 줄이 끊어지는 순간 진주알이 그의 가슴 위로 쏟아져 튄다(슬로, 알마다 잔상). 효과음은 붓 효과음(East Sea Dokdo) 크게.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 혜숙 금색 #C9A45C).", "lines": [{"type": "sfx", "speaker": "SFX(대형, 흰색)", "text": "툭"}], "flags": ["intimate"], "thumb": "thumbs/4-039.svg"}, {"id": "4-040", "chapter": "4화. 비밀방", "scene": "S#8 회상 — 놔둬 (503동 2402호 안방, 9월 2일 수 오후 2:00)", "width": 800, "height": 1400, "shot": "INS · 로우 · 인물 없음", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 혜숙 금색 #C9A45C). 대리석 바닥 높이 로우, 위아래 2분할. 위: 진주알이 바닥으로 쏟아져 사방으로 튀고 구르며, 침대 위의 혜숙 목소리는 화면 밖 점선 테두리 말풍선으로 내려온다. 아래: 금속 침대 다리에 마지막 한 알이 부딪혀 멈추고 그 뒤로 긴 금빛 여백. 효과음은 붓 효과음(East Sea Dokdo), 또르르를 리듬처럼 길게 늘어놓는다.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 혜숙 금색 #C9A45C).", "lines": [{"type": "sfx", "speaker": "SFX", "text": "타다닥, 타다닥"}, {"type": "dialogue", "speaker": "혜숙(V.O.)", "text": "놔둬."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "또르르, 또르르"}, {"type": "narration", "speaker": "내레이션", "text": "진주 구르는 소리가 그녀의 리듬과 겹쳤다."}, {"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "톡"}], "flags": ["intimate"], "thumb": "thumbs/4-040.svg"}, {"id": "4-041", "chapter": "4화. 비밀방", "scene": "S#9 커튼을 끝까지 (503동 2402호 거실, 9월 20일 일 오전 10:15)", "width": 800, "height": 880, "shot": "CU · 아이레벨 · 혜숙(중)", "screen": "틴트가 걷힌 현재. 혜숙이 진주에서 손을 떼지 않은 채 눈을 내리깐다, 날개형 아이라인 끝이 그늘에 잠긴다. 바닥까지 내려간 목소리를 말풍선 테두리를 낮고 두껍게 해서 보여 주고, 두 말풍선 사이를 띄워 내레이션 박스를 끼운다.", "summary": "틴트가 걷힌 현재.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "1억 5천이야."}, {"type": "narration", "speaker": "내레이션", "text": "목소리가 바닥까지 내려가 있었다."}, {"type": "dialogue", "speaker": "혜숙", "text": "분양권 전매. 석 달만. 남편은 몰라."}], "flags": [], "thumb": "thumbs/4-041.svg"}, {"id": "4-042", "chapter": "4화. 비밀방", "scene": "S#9 커튼을 끝까지 (503동 2402호 거실, 9월 20일 일 오전 10:15)", "width": 800, "height": 1520, "shot": "FS · 아이레벨 · 혜숙(중), 유진(좌·전경), 미란(좌·전경)", "screen": "위아래 2분할. 위: 첼로 소리만 남은 정적 속에 혜숙이 일어나 창가로 걸어가는 뒷모습(느린 걸음, 골반이 크게 움직인다). 아래(C3): 혜숙이 차콜 암막을 한 팔로 끝까지 걷자 빛이 거실 전체로 쏟아지고, 그 역광 속에서 돌아선 혜숙이 두 여자를 내려다본다. 효과음은 붓 효과음(East Sea Dokdo)으로 커튼 레일을 따라, 내레이션 박스 위칸 좌상, 말풍선 아래칸 우상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "거실에 첼로 소리만 남았다."}, {"type": "sfx", "speaker": "SFX(중간)", "text": "촤르르륵"}, {"type": "dialogue", "speaker": "혜숙", "text": "얘들아. 이 단지에서 내가 모르는 일은 없어. 그 남자만 빼고."}], "flags": ["intimate"], "thumb": "thumbs/4-042.svg"}, {"id": "4-043", "chapter": "4화. 비밀방", "scene": "S#9 커튼을 끝까지 (503동 2402호 거실, 9월 20일 일 오전 10:15)", "width": 800, "height": 840, "shot": "MS · 아이레벨 · 혜숙(좌), 미란(우)", "screen": "가로 2분할. 좌: 혜숙이 유리 테이블의 휴대폰을 집어 들고 빨간 손톱으로 화면을 톡톡 넘긴다. 우: 미란이 선글라스를 머리 위로 밀어 올리며 눈을 크게 뜬다. 내레이션 박스 좌칸 하단, 말풍선 좌상·우상.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "부녀회 회장의 손가락이었다."}, {"type": "dialogue", "speaker": "혜숙", "text": "필라테스 오 선생. 걔가 요즘 BMW 남자친구 자랑을 그렇게 하더라. 키 크고 어깨 넓고."}, {"type": "dialogue", "speaker": "미란", "text": "…7시리즈요?"}], "flags": [], "thumb": "thumbs/4-043.svg"}, {"id": "4-044", "chapter": "4화. 비밀방", "scene": "S#9 커튼을 끝까지 (503동 2402호 거실, 9월 20일 일 오전 10:15)", "width": 800, "height": 760, "shot": "CU · 아이레벨 · 혜숙(중)", "screen": "혜숙이 화면에서 눈을 떼지 않고 숫자를 읽듯 짧게 끊어 말한다. 휴대폰 화면 빛이 진주 사이의 하얀 실에 반사된다. 긴 말풍선 하나를 우상에서 아래로, 마지막 문장만 한 줄 떼어 굵게.", "summary": "혜숙이 화면에서 눈을 떼지 않고 숫자를 읽듯 짧게 끊어 말한다.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "검정. 그리고 412동 윤 학생. 로스쿨 다니는 애. 지난주에 남자 셔츠를 원피스처럼 입고 분리수거를 하더라. 남자 셔츠, 남자 사이즈."}], "flags": [], "thumb": "thumbs/4-044.svg"}, {"id": "4-045", "chapter": "4화. 비밀방", "scene": "S#10 출입기록은 거짓말 안 해요 (더퍼스트 클럽 지하 1층 필라테스룸, 9월 20일 일 밤 9:30)", "width": 800, "height": 1520, "shot": "LS · 아이레벨 · 세라(중), 유진(좌·후경), 혜숙(좌·후경)", "screen": "위아래 2분할. 위(C1): 일찍 닫은 클럽, 거울 쪽 다운라이트 한 줄만 켜진 스튜디오에서 세라가 혼자 리포머를 민다, 거울 여섯 장에 같은 동작이 반복되고 빨간 스프링이 일정하게 늘었다 줄어든다. 아래(C3 방향): 유리문이 열리고 유진과 혜숙이 들어서자 세라가 캐리지를 멈춘다, 땀에 젖은 회색 크롭 브라톱이 피부에 들러붙고 구릿빛 복근 위로 땀방울이 한 줄 흐른다, 혜숙이 휴대폰 사진을 내밀고 세라는 한 번 흘끗 볼 뿐이다. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 박스 위칸 좌상과 아래칸 좌하, 말풍선 아래칸 우상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "밤 아홉 시 반, 일요일의 더퍼스트 클럽은 일찍 문을 닫은 뒤였다. 필라테스룸에만 불이 하나 켜져 있었다."}, {"type": "sfx", "speaker": "SFX(중간, 흰색)", "text": "철컥, 철컥"}, {"type": "narration", "speaker": "내레이션", "text": "세라는 오래 보지 않았다."}, {"type": "dialogue", "speaker": "세라", "text": "오빠가 결혼을 했다고요?"}], "flags": ["intimate"], "thumb": "thumbs/4-045.svg"}, {"id": "4-046", "chapter": "4화. 비밀방", "scene": "S#10 출입기록은 거짓말 안 해요 (더퍼스트 클럽 지하 1층 필라테스룸, 9월 20일 일 밤 9:30)", "width": 800, "height": 1240, "shot": "FS · 하이 · 세라(중)", "screen": "위아래 2분할. 위: 세라가 매트로 내려가 다리를 일자로 찢고 상체를 바닥까지 눕혔다가, 일어나 반대쪽을 찢는다(연속 동작 잔상 3단, 포니테일이 매트를 쓴다). 아래: 일어선 세라가 데스크 태블릿을 열며 짧게 끊어 말한다, 화면의 푸른빛이 턱 아래를 비춘다. 내레이션 박스 위칸 우상, 말풍선 위칸 하단(작게, 혼잣말)과 아래칸 우상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "화가 나면 스트레칭을 했다."}, {"type": "dialogue", "speaker": "세라", "text": "호흡, 호흡."}, {"type": "narration", "speaker": "내레이션", "text": "자기 자신에게 한 말이었다."}, {"type": "dialogue", "speaker": "세라", "text": "센터 출입기록은 거짓말 안 해요."}], "flags": ["intimate"], "thumb": "thumbs/4-046.svg"}, {"id": "4-047", "chapter": "4화. 비밀방", "scene": "S#10 출입기록은 거짓말 안 해요 (더퍼스트 클럽 지하 1층 필라테스룸, 9월 20일 일 밤 9:30)", "width": 800, "height": 880, "shot": "INS · 오버숄더(세라 너머) · 세라(좌·전경), 유진(우)", "screen": "가로 2분할. 좌: 태블릿 화면의 카드 태그 기록 목록(가상 UI, 글자는 식자), 세라의 짧은 손톱 검지가 한 줄을 짚는다. 우: 유진이 그 줄을 내려다보며 표정 없이 답한다, 평온한 목소리를 얇고 매끈한 말풍선 테두리로. 말풍선 좌상, 우하, 내레이션 박스 우칸 하단.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "9월 15일 화요일, 21시 52분. B2 연결통로 출입. 등록 세대카드, 101동 3801호."}, {"type": "dialogue", "speaker": "유진", "text": "그날은 현장 야간 점검이라고 들었어요."}, {"type": "narration", "speaker": "내레이션", "text": "유진의 목소리는 평온했다."}], "flags": ["intimate"], "thumb": "thumbs/4-047.svg"}, {"id": "4-048", "chapter": "4화. 비밀방", "scene": "S#10 출입기록은 거짓말 안 해요 (더퍼스트 클럽 지하 1층 필라테스룸, 9월 20일 일 밤 9:30)", "width": 800, "height": 1040, "shot": "CU · 아이레벨 · 세라(중), 유진(후경)", "screen": "위아래 2분할. 위: 세라가 입술을 깨물고 말한다, 직선이던 시선이 한 번 아래로 떨어진다. 아래: 세라가 다른 줄을 짚은 뒤 고개를 들어 거울 벽을 보고, 거울 속에 세라와 그 뒤의 유진이 겹쳐 비친다, 화면 가장자리부터 민트 #7FD1BE 틴트가 번져 든다(다음 회상 전환). 말풍선 위칸 우상, 아래칸 좌상, 내레이션 박스 아래칸 하단.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "시행사 숙소에서 지낸다고 했어요. 회장 아들이니까 마스터키쯤 있는 줄 알았고요."}, {"type": "dialogue", "speaker": "세라", "text": "9월 8일 화요일, 22시 04분. 같은 카드. 그날 마감하고 여기서."}, {"type": "narration", "speaker": "내레이션", "text": "유진은 그녀를 따라 거울을 보았다."}], "flags": ["intimate"], "thumb": "thumbs/4-048.svg"}, {"id": "4-049", "chapter": "4화. 비밀방", "scene": "S#11 회상 — 여덟 개 더 (더퍼스트 클럽 필라테스룸 리포머, 9월 8일 화 밤 10:10)", "width": 800, "height": 1240, "shot": "MS · 측면 · 세라(중·실루엣), 도겸(하단)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 세라 민트 #7FD1BE). 원컷 2-053·2-054 재사용, 위아래 2분할. 위: 캐리지에 누운 그의 위로 세라가 한쪽 다리를 넘겨 올라앉고, 체중을 받은 캐리지가 한 뼘 미끄러진다(전경에 풋바 흐리게). 아래: 땀에 젖은 브라톱 밴드가 걸려 세라가 두 팔을 드는 측면 실루엣, 벗겨지는 천과 들어 올린 팔뚝이 가슴 앞선을 가리고, 바닥 간접광은 등·어깨·쇄골·복근 옆선에만 림라이트를 긋고 앞면은 그늘로 남긴다. 내레이션 박스 위칸 좌상, 효과음은 붓 효과음(East Sea Dokdo).", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 세라 민트 #7FD1BE).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "간접조명만 남은 스튜디오."}, {"type": "sfx", "speaker": "SFX(중간)", "text": "끼익"}], "flags": ["intimate"], "thumb": "thumbs/4-049.svg"}, {"id": "4-050", "chapter": "4화. 비밀방", "scene": "S#11 회상 — 여덟 개 더 (더퍼스트 클럽 필라테스룸 리포머, 9월 8일 화 밤 10:10)", "width": 800, "height": 1360, "shot": "LS · 아이레벨 · 세라(중), 도겸(중·하단)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 세라 민트 #7FD1BE). 원컷 2-055·2-056 재사용, 위아래 2분할. 위(INS): 세라가 레깅스를 직접 밑에서부터 말아 내리고 구릿빛 골반에 붉은 밴드 자국이 남는다(아래는 캐리지 받침이 자른다). 아래(C1 와이드): 거울 벽 여섯 장이 두 사람을 여섯 번 비추고 몸은 거울 사이 세로 이음선에 걸린다, 실물 세라는 뒷모습(곧은 척추, 허리 위 두 보조개)만 보이고, 거울 여섯 장의 상은 이음선과 풋바 그림자에 가슴 높이에서 잘려 얼굴·어깨·포니테일만 또렷하며 그 아래는 역광 그늘로 검게 뭉갠다. 내레이션 박스는 아래칸 거울 위 빈 벽.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 세라 민트 #7FD1BE).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "거울 벽이 두 사람을 여섯 번 비췄다."}], "flags": ["intimate"], "thumb": "thumbs/4-050.svg"}, {"id": "4-051", "chapter": "4화. 비밀방", "scene": "S#11 회상 — 여덟 개 더 (더퍼스트 클럽 필라테스룸 리포머, 9월 8일 화 밤 10:10)", "width": 800, "height": 1440, "shot": "INS · 로우 · 세라(중)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 세라 민트 #7FD1BE). 원컷 2-057~2-059 재사용, 위아래 3단. 위: 풋바에 걸린 세라의 맨발, 레일 위를 메트로놈처럼 앞뒤로 오가는 캐리지, 세라의 짧은 명령 말풍선. 가운데: 일곱 번째에서 숨이 멎은 세라의 측면 실루엣, 떨리는 복근과 그의 옆구리를 죄는 허벅지(효과음 없이 여백). 아래: 캐리지가 천천히 미끄러져 스토퍼에 닿는다(C2 바닥 로우), 효과음은 붓 효과음(East Sea Dokdo).", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 세라 민트 #7FD1BE).", "lines": [{"type": "sfx", "speaker": "SFX(중간)", "text": "끼익, 탁. 끼익, 탁."}, {"type": "dialogue", "speaker": "세라(V.O.)", "text": "여덟 개 더."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "탁"}], "flags": ["intimate"], "thumb": "thumbs/4-051.svg"}, {"id": "4-052", "chapter": "4화. 비밀방", "scene": "S#12 1,870만 (더퍼스트 클럽 필라테스룸, 9월 20일 일 밤 9:45)", "width": 800, "height": 960, "shot": "MS · 아이레벨 · 세라(중), 유진(좌·전경), 혜숙(우·전경)", "screen": "틴트가 걷힌 현재. 세라가 데스크에 기대 팔짱을 끼었다가 한 손을 풀어 손가락을 하나씩 접으며 말하고, 말이 짧아질수록 몸을 한쪽으로 늘인다(옆구리 스트레칭). 전경 좌우에 유진과 혜숙의 어깨. 긴 말풍선 하나를 우상에서 내려오게.", "summary": "틴트가 걷힌 현재.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "제 카드도 그 사람이 써요. 자기 카드는 법인 카드라 개인 결제가 안 된다고. 처음엔 어머니 기일 제사 음식이었어요. 그다음엔 골프 레슨, 호텔, 백화점."}], "flags": [], "thumb": "thumbs/4-052.svg"}, {"id": "4-053", "chapter": "4화. 비밀방", "scene": "S#12 1,870만 (더퍼스트 클럽 필라테스룸, 9월 20일 일 밤 9:45)", "width": 800, "height": 600, "shot": "INS · POV(유진) · 인물 없음", "screen": "세라가 내민 휴대폰의 카드 앱 화면(가상 UI, 로고 없음), 이용 합계 금액이 크게(식자) 뜨고 아래로 사용처 목록 줄이 흐리게 이어진다. 화면 가장자리에 세라의 짧은 손톱 엄지. 내레이션 박스 상단.", "summary": "세라가 내민 휴대폰의 카드 앱 화면(가상 UI, 로고 없음), 이용 합계 금액이 크게(식자) 뜨고 아래로 사", "lines": [{"type": "narration", "speaker": "내레이션", "text": "세라가 앱을 열어 합계를 보였다. 1,870만 원."}], "flags": [], "thumb": "thumbs/4-053.svg"}, {"id": "4-054", "chapter": "4화. 비밀방", "scene": "S#12 1,870만 (더퍼스트 클럽 필라테스룸, 9월 20일 일 밤 9:45)", "width": 800, "height": 760, "shot": "CU · 아이레벨 · 세라(중)", "screen": "세라가 갑자기 고개를 든다, 포니테일이 한 번 튄다. 코끝이 한 번 움직이는 작은 효과선(냄새를 기억하는 몸짓)과 옅은 민트색 공기 결 한 줄. 말풍선 우상.", "summary": "세라가 갑자기 고개를 든다, 포니테일이 한 번 튄다.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "15일 그날, 야간반 회원 한 명한테서 오빠 냄새가 났어요. 민트. 412동이었어요."}], "flags": [], "thumb": "thumbs/4-054.svg"}, {"id": "4-055", "chapter": "4화. 비밀방", "scene": "S#12 1,870만 (더퍼스트 클럽 필라테스룸, 9월 20일 일 밤 9:45)", "width": 800, "height": 680, "shot": "BS · 아이레벨 · 혜숙(좌), 유진(우)", "screen": "가로 2분할. 좌: 혜숙이 고개를 돌려 유진을 본다, 빨간 손톱이 진주 한 알을 굴린다. 우: 같은 순간 유진이 혜숙을 본다. 혜숙의 짧은 말풍선 좌상, 낮게.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "윤 학생."}], "flags": [], "thumb": "thumbs/4-055.svg"}, {"id": "4-056", "chapter": "4화. 비밀방", "scene": "S#13 동일성 입증 (412동 502호 현관·방, 9월 21일 월 밤 8:00)", "width": 800, "height": 1040, "shot": "LS · 아이레벨 · 유진(좌), 세라(우)", "screen": "5층 복도(C4), 엘리베이터 쪽에서 502호 문과 비상계단 문을 본다. 같은 칸 안에 센서등이 켜진 상태와 꺼진 상태를 위아래로 겹쳐 깜박임을 보여 주고, 문 앞에 선 유진과 세라의 그림자가 늘었다 줄어든다. 문이 열리며 노란 스탠드 빛이 복도 바닥에 사다리꼴로 새어 나오고, 어디선가 울리는 탈수 진동은 바닥을 따라 붓 효과음(East Sea Dokdo)으로.", "summary": "5층 복도(C4), 엘리베이터 쪽에서 502호 문과 비상계단 문을 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "밤 여덟 시, 412동 502호 현관 앞 복도에는 센서등이 켜졌다 꺼지기를 반복했다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "우우웅— 덜덜덜"}, {"type": "narration", "speaker": "내레이션", "text": "문이 열리자 책상 스탠드 불빛과 식은 커피 냄새가 새어 나왔다."}], "flags": ["intimate"], "thumb": "thumbs/4-056.svg"}, {"id": "4-057", "chapter": "4화. 비밀방", "scene": "S#13 동일성 입증 (412동 502호 현관·방, 9월 21일 월 밤 8:00)", "width": 800, "height": 760, "shot": "MS · 아이레벨 · 하린(중)", "screen": "현관 안쪽 센서등 아래 문을 연 하린, 오트밀 슬리브리스 골지 니트가 마른 어깨에서 가슴의 볼륨을 따라 얇게 붙어 있다. 세라를 알아보고 금테 타원 안경 너머 눈이 커지고, 그 옆의 유진에게서 시선이 멈춘다. 말풍선 우상, 말줄임 간격 넓게.", "summary": "현관 안쪽 센서등 아래 문을 연 하린, 오트밀 슬리브리스 골지 니트가 마른 어깨에서 가슴의 볼륨을 따라 얇게", "lines": [{"type": "dialogue", "speaker": "하린", "text": "선생님? 그리고… 101동…"}], "flags": ["intimate"], "thumb": "thumbs/4-057.svg"}, {"id": "4-058", "chapter": "4화. 비밀방", "scene": "S#13 동일성 입증 (412동 502호 현관·방, 9월 21일 월 밤 8:00)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 하린(중)", "screen": "[트랙2] 유진이 내민 휴대폰 사진을 본 하린이 안경을 밀어 올리고, 또 밀어 올린다(검지 잔상 두 겹, 집중선, 레몬색 플랫 배경). 안경은 이미 콧등 맨 위에 붙어 있고 관자놀이에 땀방울 하나, 얼굴과 손만 과장하고 니트 색은 본편과 같다. 내레이션 박스 하단.", "summary": "[트랙2] 유진이 내민 휴대폰 사진을 본 하린이 안경을 밀어 올리고, 또 밀어 올린다(검지 잔상 두 겹, 집", "lines": [{"type": "narration", "speaker": "내레이션", "text": "안경은 이미 콧등 맨 위에 있었다. 그녀의 말이 빨라졌다."}], "flags": ["intimate"], "thumb": "thumbs/4-058.svg"}, {"id": "4-059", "chapter": "4화. 비밀방", "scene": "S#13 동일성 입증 (412동 502호 현관·방, 9월 21일 월 밤 8:00)", "width": 800, "height": 1160, "shot": "CU · 아이레벨 · 하린(중)", "screen": "위아래 2분할. 위: 말이 쏟아지는 하린, 긴 말풍선 하나를 빽빽하게 위에서 아래로 꺾어 흐르게. 아래: 말이 끊긴 하린의 시선이 오른쪽 아래 책상으로 미끄러지고, 스탠드 빛 아래 밀려난 자리 그대로인 법전이 보인다, 화면 가장자리부터 하늘색 #9CC7E8 틴트가 번져 든다(다음 회상 전환). 내레이션 박스 아래칸 하단.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "아니요, 잠깐만요, 동명이인일 수도 있고, 사진만으로는 동일성 입증이 안 되고, 그러니까 결혼을 했으면 혼인관계증명서를 떼 봐야, 아니 그건 본인 아니면 못 떼고…"}, {"type": "narration", "speaker": "내레이션", "text": "9월 12일 새벽처럼, 법전은 밀려난 자리에 그대로 있었다."}], "flags": ["intimate"], "thumb": "thumbs/4-059.svg"}, {"id": "4-060", "chapter": "4화. 비밀방", "scene": "S#14 회상 — 한 뼘 안쪽 (412동 502호, 9월 12일 토 새벽 2:00)", "width": 800, "height": 1200, "shot": "MS · 오버숄더(도겸 너머) · 하린(중), 도겸(좌·전경)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 하린 하늘색 #9CC7E8). 원컷 3-014·3-015 재사용, 위아래 2분할. 위: 책상 위에 앉은 하린, 그가 니트를 머리 위로 벗기다 안경에 걸려 얼굴이 천에 반쯤 덮이고 두 사람이 동시에 웃음을 터뜨린다(가슴은 그의 어깨와 늘어진 니트 자락이 가린다). 아래: 하린 시점, 화면 전체가 흐린 보케이고 한 뼘 안쪽의 짙은 일자 눈썹과 턱선만 또렷하다. 효과음은 붓 효과음(East Sea Dokdo) 위칸, 내레이션 박스 아래칸 좌하.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 하린 하늘색 #9CC7E8).", "lines": [{"type": "sfx", "speaker": "SFX", "text": "풉"}, {"type": "narration", "speaker": "내레이션", "text": "흐려진 세상에서 또렷한 건 한 뼘 안쪽뿐이었다."}], "flags": ["intimate"], "thumb": "thumbs/4-060.svg"}, {"id": "4-061", "chapter": "4화. 비밀방", "scene": "S#14 회상 — 한 뼘 안쪽 (412동 502호, 9월 12일 토 새벽 2:00)", "width": 800, "height": 880, "shot": "INS · 오버숄더(하린 너머) · 하린(전경), 도겸(중)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 하린 하늘색 #9CC7E8). 원컷 3-016·3-017 재사용, 가로 3분할. ① 하린의 맨등 너머로 그의 손바닥이 마른 몸에 어울리지 않게 무게 있는 가슴의 곡선을 감싼 실루엣(곡선은 하린의 팔과 어둠이 가린다), 입술이 쇄골을 지나 내려간다. ② 책상 모서리를 움켜쥔 하린의 손. ③ 밀려난 법전 페이지가 부채처럼 넘어간다, 효과음은 붓 효과음(East Sea Dokdo)으로 ③에.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 하린 하늘색 #9CC7E8).", "lines": [{"type": "sfx", "speaker": "SFX", "text": "후루룩"}], "flags": ["intimate"], "thumb": "thumbs/4-061.svg"}, {"id": "4-062", "chapter": "4화. 비밀방", "scene": "S#14 회상 — 한 뼘 안쪽 (412동 502호, 9월 12일 토 새벽 2:00)", "width": 800, "height": 1400, "shot": "LS · 부감 · 하린(중·실루엣), 도겸(중·실루엣)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 하린 하늘색 #9CC7E8). 원컷 3-020·3-024 재사용, 위아래 2분할. 위(C3 부감): 좁은 싱글 침대, 시트가 골반에서 접혀 아래를 가리고 그의 두 손이 하린의 가는 허리를 양쪽에서 잡아 속도를 가르친다(어깨 윤곽에 노란 림라이트만). 아래: 미닫이 너머 소형 냉장고의 표시등이 꺼지고 웅웅선이 끊긴다, 그 아래 넓은 여백. 효과음은 붓 효과음(East Sea Dokdo)으로 '뚝'만 작게, 내레이션 박스 위칸 하단과 아래칸 하단.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 하린 하늘색 #9CC7E8).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그녀는 금방 배웠다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "뚝"}, {"type": "narration", "speaker": "내레이션", "text": "냉장고 모터가 멈추던 순간까지 다 기억났다."}], "flags": ["intimate"], "thumb": "thumbs/4-062.svg"}, {"id": "4-063", "chapter": "4화. 비밀방", "scene": "S#15 물결놀이터 엄마들 (412동 502호 방, 9월 21일 월 밤 8:10)", "width": 800, "height": 1200, "shot": "CU · 아이레벨 · 하린(중)", "screen": "틴트가 걷힌 현재, 위아래 2분할. 위: 하린이 웃는다, 금테 안경 너머 눈이 휘고 귀가 빨갛다. 아래: 같은 얼굴이 웃다가 울기 시작한다, 웃는 입은 그대로인데 안경 아래로 눈물이 흐르고 목소리가 떨린다(말풍선 테두리 떨림선). 말풍선 위칸 우상, 아래칸 좌하.", "summary": "틴트가 걷힌 현재, 위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "2천만 원이요. 학자금 대출금. 석 달에 20%."}, {"type": "dialogue", "speaker": "하린", "text": "제가 그거 유사수신 아니냐고 물어봤어요. 그랬더니 불특정 다수가 아니래요. 특정 한 명이래요. 저요."}], "flags": [], "thumb": "thumbs/4-063.svg"}, {"id": "4-064", "chapter": "4화. 비밀방", "scene": "S#15 물결놀이터 엄마들 (412동 502호 방, 9월 21일 월 밤 8:10)", "width": 800, "height": 1240, "shot": "MS · 아이레벨 · 세라(좌), 하린(중)", "screen": "위아래 2분할. 위: 의자에 앉은 하린의 굽은 등을 세라의 넓은 손바닥이 위에서 아래로 천천히 쓸어내린다(호흡 리듬 곡선 효과선 두 줄). 아래: 하린이 손목의 검정 머리끈을 빼 긴 생머리를 한 손에 모아 높이 묶고, 머리끈이 조여지는 순간 굽었던 등이 펴지며 눈빛이 달라진다. 효과음은 붓 효과음(East Sea Dokdo) 아래칸, 내레이션 박스 위칸 우상과 아래칸 좌상, 말풍선 아래칸 우하.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "필라테스 강사의 손이었다. 호흡, 호흡."}, {"type": "narration", "speaker": "내레이션", "text": "결심한 사람의 손이었다."}, {"type": "sfx", "speaker": "SFX(중간)", "text": "탁"}, {"type": "dialogue", "speaker": "하린", "text": "증거부터 모아야 돼요. 이체 내역, 카톡, 녹음. 그리고 각자 진술서."}], "flags": [], "thumb": "thumbs/4-064.svg"}, {"id": "4-065", "chapter": "4화. 비밀방", "scene": "S#15 물결놀이터 엄마들 (412동 502호 방, 9월 21일 월 밤 8:10)", "width": 800, "height": 880, "shot": "INS · POV(하린) · 하린(좌·하단), 유진(우)", "screen": "가로 2분할. 좌: 하린의 휴대폰 새 채팅방 만들기 화면(가상 UI, 노란 말풍선 메신저 느낌), 이름 칸에서 커서가 깜빡이고 엄지가 멈춰 있다. 우: 책장 옆에 선 유진이 망설임 없이 답한다, 입꼬리만 조금. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "이름을 뭘로 하죠? 그 사람이 혹시라도 봐도 안 들여다볼 걸로."}, {"type": "dialogue", "speaker": "유진", "text": "물결놀이터 엄마들."}], "flags": [], "thumb": "thumbs/4-065.svg"}, {"id": "4-066", "chapter": "4화. 비밀방", "scene": "S#15 물결놀이터 엄마들 (412동 502호 방, 9월 21일 월 밤 8:10)", "width": 800, "height": 560, "shot": "BS · 아이레벨 · 세라(좌), 하린(우)", "screen": "[트랙2] 가로 2분할. 좌: 세라가 팔짱을 낀 채 무표정으로 한 손을 든다(직선 효과선). 우: 하린이 안경을 밀어 올리며 손을 든다(땀방울 하나). 크림색 플랫 배경, 두 얼굴만 과장하고 의상 색은 본편과 같다. 말풍선 좌상, 우상.", "summary": "[트랙2] 가로 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "저 엄마 아닌데요."}, {"type": "dialogue", "speaker": "하린", "text": "저도요."}], "flags": ["intimate"], "thumb": "thumbs/4-066.svg"}, {"id": "4-067", "chapter": "4화. 비밀방", "scene": "S#15 물결놀이터 엄마들 (412동 502호 방, 9월 21일 월 밤 8:10)", "width": 800, "height": 1240, "shot": "CU · 아이레벨 · 유진(상단)", "screen": "위아래 2분할. 위: 유진이 아주 공손한 얼굴로 두 사람을 번갈아 본다, 입꼬리만 올라가고 눈은 웃지 않는다. 아래: 하린의 휴대폰 화면 INS, 단톡방 '물결놀이터 엄마들 (5)'(가상 UI, 식자)에 첫 메시지 말풍선 하나가 올라온다. 말풍선 위칸 우상, 내레이션 박스 아래칸 상단, 메시지는 메신저 서체.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "그래서 좋은 이름이에요. 그 사람은 엄마들 단톡방은 절대 안 들여다봐요."}, {"type": "narration", "speaker": "내레이션", "text": "초대된 사람 다섯 명. 첫 메시지는 혜숙이 보냈다."}, {"type": "dialogue", "speaker": "문자(혜숙→물결놀이터 엄마들)", "text": "얘들아, 화요일 밤 열한 시. 미란이네 가게."}], "flags": [], "thumb": "thumbs/4-067.svg"}, {"id": "4-068", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 1560, "shot": "LS · 아이레벨 · 혜숙(중), 미란(중), 세라(중), 하린(중), 유진(중)", "screen": "정문 안쪽(C1)에서 북서쪽 안으로 본 바. 블라인드는 끝까지 내려갔고 등 뒤 정문 유리에 'CLOSED' 팻말(빈 면)이 걸려 있다. 오른쪽 카운터 위 붉은 펜던트 다섯 개가 일렬로 켜져 스툴에 나란히 앉은 다섯 여자의 머리 위에 붉은 원뿔을 하나씩 떨어뜨리고, 왼쪽 셀러의 차가운 흰빛과 대비된다, 다섯의 대표 색(금색 블라우스, 버건디 와인 병, 민트 집업, 하늘색 셔츠, 회색 니트)이 붉은 빛 속에서도 구분되게. 내레이션 박스 좌상 둘, 셀러 효과음은 붓 효과음(East Sea Dokdo) 작게, 유진 말풍선은 맨 오른쪽 작은 인물에서 우하.", "summary": "정문 안쪽(C1)에서 북서쪽 안으로 본 바.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "밤 열한 시, 와인바 '미란'의 블라인드는 끝까지 내려가 있었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "웅—"}, {"type": "narration", "speaker": "내레이션", "text": "다섯 여자가 카운터에 나란히 앉았다. 그 카운터였다."}, {"type": "dialogue", "speaker": "유진", "text": "그 사람은 지금 어디 있어요?"}], "flags": ["intimate"], "thumb": "thumbs/4-068.svg"}, {"id": "4-069", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 혜숙(좌), 유진(우)", "screen": "가로 2분할. 좌: 혜숙이 빨간 손톱으로 휴대폰 화면을 내리며 읽듯 말한다, 붉은 빛이 진주 사이 하얀 실을 물들인다. 우: 유진이 정면을 본 채 담담하게 덧붙이고, 진주 스터드가 붉게 반짝인다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "경비실 김 반장한테 물어봤어. 22시 14분에 검정 BMW 나갔대."}, {"type": "dialogue", "speaker": "유진", "text": "저한테는 현장 야간 점검이요."}], "flags": ["intimate"], "thumb": "thumbs/4-069.svg"}, {"id": "4-070", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 760, "shot": "MS · 아이레벨 · 미란(좌), 하린(우)", "screen": "가로 2분할. 좌: 미란이 버건디 병의 코르크를 단번에 뽑으며 웃는다, 와인색 손톱과 오프너. 우: 하린이 안경을 밀어 올리고 흰 와인 코스터 다섯 장과 볼펜 다섯 자루를 카드 돌리듯 한 장씩 나눠 준다. 코르크 효과음은 붓 효과음(East Sea Dokdo), 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(중간, 크림색)", "text": "퐁"}, {"type": "dialogue", "speaker": "미란", "text": "오늘 건 내가 쏜다. 그 사람한테 받을 돈에서 깔 거야."}, {"type": "dialogue", "speaker": "하린", "text": "진술서예요. 그 사람이 처음 돈 얘기를 꺼내기 직전에 한 말. 들은 그대로, 토씨 하나 틀리지 말고."}], "flags": ["intimate"], "thumb": "thumbs/4-070.svg"}, {"id": "4-071", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 1080, "shot": "INS · 하이 · 혜숙(하단)", "screen": "위아래 2분할. 위(C2 부감): 원목 카운터 위 붉은 원뿔 다섯 개 아래 엎어진 흰 코스터 다섯 장이 일렬로 놓였고, 각 코스터 위에 각자의 손(빨간 손톱, 와인색 손톱, 짧은 투명 손톱, 잉크 묻은 작은 손, 누드 베이지 손톱)과 볼펜이 머문다. 아래: 맨 왼쪽 코스터를 빨간 손톱이 뒤집어 단정한 만년필체 글씨(식자)가 드러나고, 혜숙이 소리 내어 읽은 뒤 손가락이 진주 목걸이로 올라간다. 볼펜 효과음은 위칸에 다섯 갈래로, 내레이션 박스 아래칸 좌상, 말풍선 아래칸 우하.", "summary": "위아래 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "사각사각"}, {"type": "narration", "speaker": "내레이션", "text": "혜숙이 먼저 뒤집었다. 나이순이었다."}, {"type": "dialogue", "speaker": "혜숙", "text": "너한테만 하는 얘긴데."}], "flags": ["intimate"], "thumb": "thumbs/4-071.svg"}, {"id": "4-072", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 720, "shot": "BS · 오버숄더(혜숙 너머) · 도겸(중), 혜숙(좌·전경)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 혜숙 금색 #C9A45C). 다섯 회상 공통 프레이밍: 왼쪽 전경에 그 여자의 어깨와 뒷머리, 가운데 흰 셔츠(단추 두 개, 소매 걷음) 도겸의 BS, 측면 키라이트 한 줄, 도겸은 왼손으로 귓불을 만지고(시계와 흉터 한 프레임) 왼쪽 입꼬리만 올린 채 입 모양 '너한테만'. 바뀌는 것은 틴트와 배경 소품뿐: 그의 뒤 2402호 현관 콘솔 위에 엎어 놓은 가운 차림 남편 액자와 백합, 오른쪽 끝 현관문, 전경은 혜숙의 올림머리와 옛 실 진주 목걸이(1화 S#9, 1화 콘티 작성 중이라 원컷 번호 없음). 현재의 목소리는 점선 테두리 말풍선으로 좌상.", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 혜숙 금색 #C9A45C).", "lines": [{"type": "dialogue", "speaker": "혜숙(V.O.)", "text": "현관에서. 남편 액자 엎어 놓자마자."}], "flags": ["intimate"], "thumb": "thumbs/4-072.svg"}, {"id": "4-073", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 520, "shot": "BS · 아이레벨 · 미란(중)", "screen": "미란이 자기 코스터를 뒤집는다, 둥글고 큰 글씨(식자)가 드러나고 반쯤 감긴 스모키 아이가 그 글씨를 내려다본다. 붉은 원뿔이 와인브라운 웨이브를 물들인다. 말풍선 우상.", "summary": "미란이 자기 코스터를 뒤집는다, 둥글고 큰 글씨(식자)가 드러나고 반쯤 감긴 스모키 아이가 그 글씨를 내려다", "lines": [{"type": "dialogue", "speaker": "미란", "text": "너한테만 하는 얘긴데."}], "flags": ["intimate"], "thumb": "thumbs/4-073.svg"}, {"id": "4-074", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 720, "shot": "BS · 오버숄더(미란 너머) · 도겸(중), 미란(좌·전경)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 미란 버건디 #7A1E2E). 4-072와 같은 프레이밍·크기·키라이트, 도겸의 의상, 귓불을 만지는 왼손, 왼쪽 입꼬리, 입 모양 '너한테만'도 같다. 바뀌는 것: 그의 오른손에 미란이 따라 준 그 9만 원짜리 잔(붉은 와인이 유리 벽을 타고 내려온다)과 뒤편 랙의 거꾸로 걸린 잔, 전경은 미란의 검은 오프숄더 어깨와 와인브라운 웨이브(원컷 2-023의 의상·잔 재사용, 프레이밍은 공통). 말풍선 좌상(점선 테두리).", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 미란 버건디 #7A1E2E).", "lines": [{"type": "dialogue", "speaker": "미란(V.O.)", "text": "내가 따 준 와인 잔 받으면서. 그거 9만 원짜리였는데."}], "flags": ["intimate"], "thumb": "thumbs/4-074.svg"}, {"id": "4-075", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 520, "shot": "BS · 아이레벨 · 세라(중)", "screen": "세라가 코스터를 뒤집는다, 각진 일자 글씨(식자). 포니테일을 한 번 넘기고 직선 시선으로 글씨를 읽으며, 민트 집업 깃이 붉은 빛 속에서 연하게 빛난다. 말풍선 우상, 짧게.", "summary": "세라가 코스터를 뒤집는다, 각진 일자 글씨(식자).", "lines": [{"type": "dialogue", "speaker": "세라", "text": "너한테만 하는 얘긴데."}], "flags": ["intimate"], "thumb": "thumbs/4-075.svg"}, {"id": "4-076", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 720, "shot": "BS · 오버숄더(세라 너머) · 도겸(중), 세라(좌·전경)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 세라 민트 #7FD1BE). 4-072와 같은 프레이밍·크기·키라이트, 도겸의 의상, 귓불을 만지는 왼손, 왼쪽 입꼬리, 입 모양 '너한테만'도 같다. 바뀌는 것: 전경 세라의 두 손이 그의 두 어깨를 잡아 뒤로 열어 놓은 채이고(어깨 교정하는 손), 뒤편은 거울 벽 이음선과 리포머의 빨간 스프링, 전경은 세라의 하이 포니테일(원컷 2-047·2-048의 의상 재사용, 프레이밍은 공통). 말풍선 좌상(점선 테두리).", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 세라 민트 #7FD1BE).", "lines": [{"type": "dialogue", "speaker": "세라(V.O.)", "text": "자세 잡아 주다가요. 귀 만지길래 어깨 펴 줬더니, 펴지자마자 그 말부터 했어요."}], "flags": ["intimate"], "thumb": "thumbs/4-076.svg"}, {"id": "4-077", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 하린(중), 혜숙(좌), 미란(좌), 세라(좌)", "screen": "[트랙2] 하린이 코스터를 뒤집어 작고 반듯한 글씨(밑줄 두 줄, 식자)를 또박또박 읽는 사이, 옆에 나란히 앉은 혜숙·미란·세라의 얼굴이 동시에 점 눈과 일자 입의 무표정으로 굳는다(세로 집중선, 크림색 플랫 배경). 얼굴과 손만 과장하고 의상 색은 본편과 같다. 말풍선 우상.", "summary": "[트랙2] 하린이 코스터를 뒤집어 작고 반듯한 글씨(밑줄 두 줄, 식자)를 또박또박 읽는 사이, 옆에 나란히", "lines": [{"type": "dialogue", "speaker": "하린", "text": "너한테만 하는 얘긴데."}], "flags": ["intimate"], "thumb": "thumbs/4-077.svg"}, {"id": "4-078", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 720, "shot": "BS · 오버숄더(하린 너머) · 도겸(중), 하린(좌·전경)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 하린 하늘색 #9CC7E8). 4-072와 같은 프레이밍·크기·키라이트, 도겸의 의상, 귓불을 만지는 왼손, 왼쪽 입꼬리, 입 모양 '너한테만'도 같다. 바뀌는 것: 그의 옆 책상 스탠드 아래 펼친 법전(페이지 머리글은 빈 면)과 형광펜 컵, 전경은 하린의 긴 생머리와 오트밀 니트 어깨(3화 책상 장면 원컷 3-005의 의상·소품을 따름, 프레이밍은 공통). 말풍선 좌상(점선 테두리).", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 하린 하늘색 #9CC7E8).", "lines": [{"type": "dialogue", "speaker": "하린(V.O.)", "text": "책상 앞에서요. 법전 펼쳐 놓고. 다음 날 아침에 보니까 펼쳐진 페이지가 사기의 죄였어요. 그땐 웃었어요. 우연인 줄 알고."}], "flags": ["intimate"], "thumb": "thumbs/4-078.svg"}, {"id": "4-079", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 유진(중)", "screen": "마지막으로 유진이 코스터를 뒤집는다, 단정한 글씨(식자). 고개를 숙일 때 진주 스터드가 붉은 조명에 반짝 빛나고(작은 광점), 유진은 글씨를 읽는 동안 다른 네 사람과 달리 표정을 하나도 바꾸지 않는다. 말풍선 우상.", "summary": "마지막으로 유진이 코스터를 뒤집는다, 단정한 글씨(식자).", "lines": [{"type": "dialogue", "speaker": "유진", "text": "너한테만 하는 얘긴데."}], "flags": ["intimate"], "thumb": "thumbs/4-079.svg"}, {"id": "4-080", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 720, "shot": "BS · 오버숄더(유진 너머) · 도겸(중), 유진(좌·전경)", "screen": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 유진 회색 #9A9EA3). 4-072와 같은 프레이밍·크기·키라이트, 귓불을 만지는 왼손, 왼쪽 입꼬리, 입 모양 '너한테만'도 같다. 바뀌는 것: 같은 자리의 도겸이 통창 유리에 비친 상으로 보이고 그 몸 너머로 호수신도시 야경 보케가 겹치며, 그의 오른손이 셔츠 단추를 하나 더 푸는 중이다, 전경은 유진의 흑갈 단발과 진주 스터드, 검은 실크 슬립의 가는 끈(1화 S#6, 1화 콘티 작성 중이라 원컷 번호 없음). 말풍선 좌상(점선 테두리).", "summary": "회상 톤(채도 낮춤, 필름 그레인, 그 남자의 캘린더 색 틴트: 유진 회색 #9A9EA3).", "lines": [{"type": "dialogue", "speaker": "유진(V.O.)", "text": "통창 앞에서요. 셔츠 단추 풀면서."}], "flags": ["intimate"], "thumb": "thumbs/4-080.svg"}, {"id": "4-081", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 1200, "shot": "CU · 아이레벨 · 유진(중)", "screen": "현재. 유진이 와인 잔을 들어 붉은 원뿔 아래 눈높이에 두고, 잔 너머 나른한 눈이 정면을 본다. 말풍선은 우상에 담담하게, 그 아래 화면 하단 절반은 붉은 어둠의 여백으로 비워 정적을 둔다(효과음 없음).", "summary": "현재.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "결혼 6년 동안 열한 번 들었어요."}], "flags": ["intimate"], "thumb": "thumbs/4-081.svg"}, {"id": "4-082", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 880, "shot": "BS · 아이레벨 · 미란(좌), 혜숙(좌)", "screen": "[트랙2] 위아래 2분할. 위: 미란이 잔을 든 채 눈이 점이 되고 입이 세모로 벌어진다(머리 위 물음표 효과선, 핫핑크 플랫 배경). 아래: 혜숙이 빨간 손톱 손으로 입을 가린 채 다른 손으로 검지 하나를 세워 보인다(큰 땀방울, 레몬색 플랫 배경). 얼굴과 손만 과장, 의상 색은 본편과 같다, 말풍선 위칸 우상, 아래칸 우상.", "summary": "[트랙2] 위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "…열한 번?"}, {"type": "dialogue", "speaker": "혜숙", "text": "얘, 우린 한 번씩인데."}], "flags": ["intimate"], "thumb": "thumbs/4-082.svg"}, {"id": "4-083", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 1160, "shot": "MS · 아이레벨 · 혜숙(좌), 미란(좌), 세라(중), 하린(우), 유진(우)", "screen": "위아래 2분할. 위(C2): 다섯이 한 프레임, 미란이 고개를 젖히고 웃음을 터뜨려 웨이브가 등 뒤로 쏟아지고, 세라가 코로 짧게 따라 웃고, 하린이 눈물 맺힌 채 웃고, 혜숙이 손으로 입을 가린다, 맨 오른쪽 유진만 웃지 않는다(다섯의 대표 색 소품이 각자 보이게). 아래: 유진의 CU, 웃음소리 효과음을 배경에 겹친 채 조용히 묻는다. 효과음은 붓 효과음(East Sea Dokdo) 위칸 여러 개, 내레이션 박스 위칸 좌상과 우하, 말풍선 아래칸 우상.", "summary": "위아래 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(중간)", "text": "푸핫"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "큭, 하하"}, {"type": "narration", "speaker": "내레이션", "text": "누군가 웃음을 터뜨렸다. 미란이었다."}, {"type": "narration", "speaker": "내레이션", "text": "유진만 웃지 않았다."}, {"type": "dialogue", "speaker": "유진", "text": "그다음 말도 같았죠?"}], "flags": ["intimate"], "thumb": "thumbs/4-083.svg"}, {"id": "4-084", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 880, "shot": "CU · 아이레벨 · 혜숙(좌), 미란(좌), 세라(중), 하린(우), 유진(우)", "screen": "[트랙2] 가로 5분할 세로 띠. 다섯 얼굴이 같은 각도, 같은 입 모양으로 동시에 입을 연다(입 모양선이 다섯 칸에서 정확히 같은 높이), 다섯 칸을 가로지르는 긴 말풍선 하나에 꼬리 다섯 개. 띠마다 배경을 대표 색 플랫(금색, 버건디, 민트, 하늘색, 회색)으로 칠하고 얼굴만 과장한다, 효과음 없음. 내레이션 박스 상단.", "summary": "[트랙2] 가로 5분할 세로 띠.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "다섯 개의 목소리가 한 박자도 어긋나지 않았다."}, {"type": "dialogue", "speaker": "다섯", "text": "나 사실 아버지랑 사이 안 좋아. 회사 물려받기 싫어."}], "flags": ["intimate"], "thumb": "thumbs/4-084.svg"}, {"id": "4-085", "chapter": "4화. 비밀방", "scene": "S#16 너한테만 하는 얘긴데 (와인바 '미란', 9월 22일 화 밤 11:00)", "width": 800, "height": 1800, "shot": "LS · 아이레벨 · 혜숙(좌), 미란(좌), 세라(중), 하린(우), 유진(우)", "screen": "본편 톤으로 뚝 돌아온다. 위쪽에 C2 카운터 안쪽에서 본 다섯 여자, 웃음이 그대로 굳은 얼굴과 멈춘 손(제자리로 돌아온 미란의 고개, 입을 가린 혜숙의 손), 다섯 개의 붉은 원뿔과 대표 색 소품. 그 아래 긴 붉은 어둠의 여백, 효과음은 셀러 모터 소리 하나만 붓 효과음(East Sea Dokdo) 회색으로 여백 한구석에 아주 작게. 내레이션 박스는 여백이 끝난 맨 아래에 세 단으로.", "summary": "본편 톤으로 뚝 돌아온다.", "lines": [{"type": "sfx", "speaker": "SFX(아주 작게, 회색)", "text": "웅—"}, {"type": "narration", "speaker": "내레이션", "text": "웃음이 뚝 끊겼다. 셀러 모터 소리만 남았다."}, {"type": "narration", "speaker": "내레이션", "text": "한 남자가 다섯 개의 방에서 같은 문장을, 같은 순서로, 같은 표정으로 했다."}, {"type": "narration", "speaker": "내레이션", "text": "그건 고백이 아니었다. 대본이었다."}], "flags": ["intimate"], "thumb": "thumbs/4-085.svg"}, {"id": "4-086", "chapter": "4화. 비밀방", "scene": "S#17 장부 (와인바 '미란' 카운터 뒤 칠판, 9월 22일 화 밤 11:30)", "width": 800, "height": 1080, "shot": "INS · 아이레벨 · 하린(좌)", "screen": "가로 3분할, 같은 칠판을 같은 구도로(칸마다 한 줄씩 늘어난다). ① 카운터 뒤로 간 하린이 칠판의 '오늘의 와인' 목록을 손바닥으로 문질러 지우고 분필을 든다(분필 가루가 붉은 빛에 뜬다). ② 분필이 첫 줄을 쓴다. ③ 둘째 줄이 그 아래 쌓인다. 칠판 글씨는 모두 식자(분필 손글씨체), 효과음은 붓 효과음(East Sea Dokdo) 작게.", "summary": "가로 3분할, 같은 칠판을 같은 구도로(칸마다", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "쓱, 쓱"}, {"type": "dialogue", "speaker": "칠판(분필)", "text": "서유진 2억 — 아버지 회사 상장 전 지분 매입"}, {"type": "dialogue", "speaker": "칠판(분필)", "text": "정혜숙 1억 5천 — 분양권 전매"}], "flags": [], "thumb": "thumbs/4-086.svg"}, {"id": "4-087", "chapter": "4화. 비밀방", "scene": "S#17 장부 (와인바 '미란' 카운터 뒤 칠판, 9월 22일 화 밤 11:30)", "width": 800, "height": 1080, "shot": "INS · 아이레벨 · 인물 없음", "screen": "가로 3분할, 4-086과 같은 칠판 구도로 이어서. ① 셋째 줄. ② 넷째 줄. ③ 다섯째 줄, 큰따옴표까지 또박또박. 줄마다 분필 끝이 마지막 글자에서 잠깐 멈춘다.", "summary": "가로 3분할, 4-086과 같은 칠판 구도로 이어서.", "lines": [{"type": "dialogue", "speaker": "칠판(분필)", "text": "차미란 3천 — 리모델링 업체 대신 처리"}, {"type": "dialogue", "speaker": "칠판(분필)", "text": "윤하린 2천 — 석 달에 20%"}, {"type": "dialogue", "speaker": "칠판(분필)", "text": "오세라 카드 1,870만 — \"내 카드는 법인 카드라\""}], "flags": [], "thumb": "thumbs/4-087.svg"}, {"id": "4-088", "chapter": "4화. 비밀방", "scene": "S#17 장부 (와인바 '미란' 카운터 뒤 칠판, 9월 22일 화 밤 11:30)", "width": 800, "height": 1000, "shot": "INS · 아이레벨 · 하린(우)", "screen": "위아래 2분할. 위: 다섯 줄 아래 분필이 가로줄을 긋고 합계를 쓴다(식자). 아래: 마지막 글자에서 분필이 부러져 반 토막이 카운터 너머로 튀고, 부러진 끝을 쥔 하린의 손가락만 남는다. 효과음은 붓 효과음(East Sea Dokdo) 아래칸 크게, 그 뒤는 여백.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "칠판(분필)", "text": "합계 현금 4억 + 카드 1,870만"}, {"type": "sfx", "speaker": "SFX(대형, 흰색)", "text": "딱"}], "flags": [], "thumb": "thumbs/4-088.svg"}, {"id": "4-089", "chapter": "4화. 비밀방", "scene": "S#17 장부 (와인바 '미란' 카운터 뒤 칠판, 9월 22일 화 밤 11:30)", "width": 800, "height": 1240, "shot": "CU · 아이레벨 · 하린(중)", "screen": "위아래 2분할. 위: 아무도 말하지 않는 정적 위로, 하린이 금테 타원 안경을 벗어 접는다. 아래: 안경을 벗은 얼굴, 초점 없이 가까운 것만 보는 나른하고 어른스러운 눈으로 외운 것을 읽듯 또박또박 말한다(말풍선 테두리를 조문처럼 반듯하게). 내레이션 박스 위칸 좌상, 말풍선 아래칸 우상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "아무도 말하지 않았다. 분위기가 달라졌다. 그녀는 외운 것을 읽듯 또박또박 말했다."}, {"type": "dialogue", "speaker": "하린", "text": "형법 제347조. 사람을 기망하여 재물의 교부를 받거나 재산상의 이익을 취득한 자는 10년 이하의 징역 또는 2천만원 이하의 벌금에 처한다."}], "flags": [], "thumb": "thumbs/4-089.svg"}, {"id": "4-090", "chapter": "4화. 비밀방", "scene": "S#17 장부 (와인바 '미란' 카운터 뒤 칠판, 9월 22일 화 밤 11:30)", "width": 800, "height": 800, "shot": "BS · 아이레벨 · 혜숙(좌), 하린(우)", "screen": "가로 2분할. 좌: 혜숙이 빨간 손톱으로 카운터를 톡 치며 단호하게 말한다. 우: 하린이 접은 안경을 쥔 채 고개를 젓고 말을 천천히 끊어 간다. 말풍선 좌상, 우상(긴 말풍선).", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "그럼 내일 바로 고소해."}, {"type": "dialogue", "speaker": "하린", "text": "지금 고소하면 그 사람은 빌린 거라고 할 거예요. 갚을 거라고. 그럼 민사예요. 사기가 되려면 처음부터 갚을 생각이 없었다는 걸 입증해야 돼요. 기망의 고의요."}], "flags": [], "thumb": "thumbs/4-090.svg"}, {"id": "4-091", "chapter": "4화. 비밀방", "scene": "S#17 장부 (와인바 '미란' 카운터 뒤 칠판, 9월 22일 화 밤 11:30)", "width": 800, "height": 760, "shot": "BS · 아이레벨 · 혜숙(좌), 하린(우)", "screen": "가로 2분할. 좌: 혜숙이 팔짱을 끼며 턱을 든다. 우: 하린이 칠판의 다섯 이름을 등지고 정면을 본다, 뒤로 칠판 장부가 흐리게 걸린다. 말풍선 좌상, 우하.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "그걸 어떻게 입증해."}, {"type": "dialogue", "speaker": "하린", "text": "그 사람이 우리 다섯을 동시에 속이고 있다는 걸, 그 사람 입으로, 한자리에서."}], "flags": [], "thumb": "thumbs/4-091.svg"}, {"id": "4-092", "chapter": "4화. 비밀방", "scene": "S#18 생일 파티 (와인바 '미란' 카운터, 9월 22일 화 밤 11:40)", "width": 800, "height": 760, "shot": "INS · 아이레벨 · 유진(중)", "screen": "가로 2분할. 좌: 유진의 길고 하얀 손가락이 왼쪽 진주 스터드를 뺀다. 우: 같은 구도로 오른쪽. 귓불 옆에 붉은 빛만, 효과음 없이 내레이션 박스 하나가 두 칸 아래를 가로지른다.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "왼쪽, 그리고 오른쪽."}], "flags": [], "thumb": "thumbs/4-092.svg"}, {"id": "4-093", "chapter": "4화. 비밀방", "scene": "S#18 생일 파티 (와인바 '미란' 카운터, 9월 22일 화 밤 11:40)", "width": 800, "height": 1040, "shot": "CU · 아이레벨 · 유진(중)", "screen": "위아래 2분할. 위(C3 상판 로우): 원목 카운터 위에 나란히 내려놓은 작은 진주 두 알이 붉은 조명 아래에서 구르다 멈춘다. 아래: 그 너머 유진이 네 여자를 차례로 보며 낮고 또박또박 말한다, 왼쪽 쇄골 끝 작은 점까지 붉은 빛이 닿는다. 효과음은 붓 효과음(East Sea Dokdo) 위칸 작게, 말풍선 아래칸 우상.", "summary": "위아래 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "딸깍, 딸깍… 또르르"}, {"type": "dialogue", "speaker": "유진", "text": "그 사람은 시간표로 살아요. 그 시간표가 한꺼번에 무너지는 날을 우리가 정하면 돼요."}], "flags": ["intimate"], "thumb": "thumbs/4-093.svg"}, {"id": "4-094", "chapter": "4화. 비밀방", "scene": "S#18 생일 파티 (와인바 '미란' 카운터, 9월 22일 화 밤 11:40)", "width": 800, "height": 1120, "shot": "CU · 아이레벨 · 유진(중), 혜숙(좌·후경), 미란(좌·후경), 세라(우·후경), 하린(우·후경)", "screen": "위아래 2분할. 위: 네 여자의 얼굴이 동시에 유진 쪽으로 돌아간다(같은 방향 잔상선, 각자의 대표 색 소품이 프레임 가장자리에). 아래: 유진이 웃는다, 처음으로 나른한 눈까지 함께 웃는다(4화 내내 웃지 않던 눈과 대비되게 눈매에 따뜻한 하이라이트). 내레이션 박스 아래칸 좌상, 말풍선 우하에 부드럽게.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유진은 웃었다. 이번에는 눈도 웃었다."}, {"type": "dialogue", "speaker": "유진", "text": "같은 날, 같은 시간에, 생일 파티 하죠."}], "flags": [], "thumb": "thumbs/4-094.svg"}, {"id": "4-095", "chapter": "4화. 비밀방", "scene": "S#18 생일 파티 (와인바 '미란' 카운터, 9월 22일 화 밤 11:40)", "width": 800, "height": 1800, "shot": "CU · 아이레벨 · 혜숙(중), 미란(중), 세라(중), 하린(중), 유진(중)", "screen": "회차 마지막 컷. 세로 긴 칸을 다섯 개의 가로 띠로 나눠 위에서부터 혜숙, 미란, 세라, 하린, 유진의 얼굴을 하나씩 두고, 띠마다 붉은 펜던트 원뿔 하나가 정수리에서 떨어지며 대표 색(금색 블라우스 깃, 버건디 와인 잔 가장자리, 민트 집업 깃, 하늘색 셔츠 깃, 회색 니트 깃)이 턱 아래에 한 줄씩만 남는다. 다섯 모두 정면, 네 얼굴은 입을 다문 결심한 표정이고 맨 아래 유진만 눈까지 웃고 있다. 움직임선 없는 정지 프레임(필름이 멈춘 듯한 미세한 프레임 테두리), 맨 아래는 붉은 어둠으로 F.O., 효과음과 글자 없음.", "summary": "회차 마지막 컷.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/4-095.svg"}, {"id": "5-001", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 1560, "shot": "LS · 아이레벨 · 유진(후경·우)", "screen": "위아래 2단. 위(C1): 블라인드가 반쯤 내려온 아침의 빈 바, 틈으로 든 햇빛이 카운터 상판에 흰 줄을 긋고 카운터 끝에서 유진이 A4 다섯 장을 나란히 편다(작은 뒷모습). 아래 INS(C2 부감): 흰 줄이 가로지르는 종이 위로 형광펜 다섯 자루가 하나씩 굴러가 각 장 앞에 멈춘다(회색·버건디·민트·하늘색·금색, 잔상선). 효과음은 붓 효과음(East Sea Dokdo), 내레이션 박스 위칸 좌상·아래칸 우하.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오전 열 시의 와인바 '미란'은 블라인드를 반쯤 내린 채 잠들어 있었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "웅웅—"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "또르르"}, {"type": "narration", "speaker": "내레이션", "text": "회색, 버건디, 민트, 하늘색, 금색. 각자 손에 잡히는 대로 집은 색이었다. 그게 그 남자의 캘린더 색과 똑같다는 건 이 가게 안의 누구도 몰랐다."}], "flags": ["intimate"], "thumb": "thumbs/5-001.svg"}, {"id": "5-002", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 1040, "shot": "MS · 아이레벨 · 유진(중), 미란(좌), 세라(좌·전경), 하린(우), 혜숙(우·전경)", "screen": "카운터 안쪽(C2)에서 본 다섯 사람. 가운데 선 유진이 손끝을 카운터에 가지런히 모으고, 스툴의 네 사람이 각자 형광펜 하나씩을 쥐고 있다(미란 버건디, 세라 민트, 하린 하늘색, 혜숙 금색, 유진 앞에 회색). 블라인드의 흰 줄이 다섯 얼굴을 가로로 자르고, 유진의 눈은 웃지 않는다. 말풍선 중상, 내레이션 우하.", "summary": "카운터 안쪽(C2)에서 본 다섯 사람.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "시작할게요."}, {"type": "narration", "speaker": "내레이션", "text": "유진의 목소리는 기내 방송처럼 고르고 공손했다."}], "flags": ["intimate"], "thumb": "thumbs/5-002.svg"}, {"id": "5-003", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 600, "shot": "INS · 하이 · 세라(좌), 미란(우)", "screen": "가로 2분할. 좌: 세라가 내려놓은 게이트 기록 출력물, '101동 3801호' 줄마다 민트 밑줄(글자는 식자). 우: 빈 와인잔을 돌리던 미란의 손목이 멈추고, 반쯤 감긴 눈이 종이에 박힌다. 내레이션 좌칸 상단, 말풍선 좌하·우상.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "커뮤니티센터 출입 게이트 기록이었다."}, {"type": "dialogue", "speaker": "세라", "text": "카드 찍은 시간이에요. 9월 3일, 세종 현장 간다던 날. 오후 두 시 골프연습장, 네 시 사우나."}, {"type": "dialogue", "speaker": "미란", "text": "그날 나한테 세종에서 영상통화 했는데. 배경이 초록색이더라. 골프 매트였네, 자기야."}], "flags": ["intimate"], "thumb": "thumbs/5-003.svg"}, {"id": "5-004", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 600, "shot": "INS · 하이 · 혜숙(좌), 하린(우)", "screen": "가로 2분할. 좌: 혜숙이 클리어파일 속 차량 출입기록의 숫자를 빨간 손톱으로 두드린다(진주가 흔들림, 숫자는 식자). 우: 안경 너머로 종이를 보는 하린, 귀 끝이 붉다. 효과음은 붓 효과음(East Sea Dokdo) 작게, 내레이션 좌칸 상단, 말풍선 좌하·우상.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "관리사무소 차량 출입기록이었다. 소장에게 부녀회 이름으로 '주차 민원 조사'라고 둘러대고 뽑아 온 것이었다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "톡톡"}, {"type": "dialogue", "speaker": "혜숙", "text": "검정 BMW, 238노 7171. 매일 밤 열 시 전후로 나가서 새벽 네 시 넘어 들어와. 거의 하루도 안 빠져."}, {"type": "dialogue", "speaker": "하린", "text": "현장 야간 점검이요. 저한테도 그렇게 말했어요."}], "flags": ["intimate"], "thumb": "thumbs/5-004.svg"}, {"id": "5-005", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 1080, "shot": "MS · 아이레벨 · 혜숙(중), 유진(좌·후경)", "screen": "위아래 2단. 위: 혜숙이 서류 사본 한 장을 더 꺼내 카운터에 밀어 놓는다(날개형 아이라인 아래 웃지 않는 눈). 아래 INS: 소유자 칸의 '한빛오토리스'(식자)에 금색 형광펜 동그라미, 그 아래는 아무 소리 없는 여백. 말풍선 위칸·아래칸 우상, 내레이션 아래칸 상단과 하단.", "summary": "위아래 2단.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "얘, 그리고 이거."}, {"type": "narration", "speaker": "내레이션", "text": "차량 등록 사항이었다."}, {"type": "dialogue", "speaker": "혜숙", "text": "회장님 아들이 차를 빌려 타니?"}, {"type": "narration", "speaker": "내레이션", "text": "아무도 대답하지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/5-005.svg"}, {"id": "5-006", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 1200, "shot": "MS · 아이레벨 · 세라(좌), 혜숙(우)", "screen": "[트랙2] 세로 3단. ① 세라가 일어나 카운터 모서리를 잡고 한쪽 종아리를 길게 늘인다(일자 입, 핏대 표시). ② 혜숙이 세라 의자 옆의 로고 없는 퀼팅 체인 백을 집어 안감을 뒤집고 박음질을 손톱으로 짚는다(돋보기 효과선). ③ 세라의 반대쪽 종아리가 마저 늘어난다(같은 표정, 큰 땀방울). 크림·레몬 플랫 배경, 효과음은 코미디 고딕(Black Han Sans), 내레이션 ①칸 좌상, 말풍선 ②칸 우상.", "summary": "[트랙2] 세로 3단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "화가 나면 나오는 동작이었다."}, {"type": "dialogue", "speaker": "혜숙", "text": "얘, 그건 그렇게 하는 거 아니야. 박음질이 이렇게 삐뚤면 안 돼."}, {"type": "sfx", "speaker": "SFX(작게, 민트)", "text": "쭈욱"}], "flags": ["intimate"], "thumb": "thumbs/5-006.svg"}, {"id": "5-007", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 760, "shot": "BS · 아이레벨 · 하린(중)", "screen": "하린이 안경을 밀어 올리고 노트북을 넷 쪽으로 돌린다(빈 문서 창, 가상 UI). 귀가 먼저 붉어지고, 긴 말풍선 하나가 우상에서 아래로 꺾여 숨 쉴 틈 없이 흐른다. 내레이션 좌상에 작게.", "summary": "하린이 안경을 밀어 올리고 노트북을 넷 쪽으로 돌린다(빈 문서 창, 가상 UI).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "말이 빨라졌다."}, {"type": "dialogue", "speaker": "하린", "text": "증거가 세 가지 필요해요. 녹음, 이체 내역, 자필 서명. 대화 당사자가 녹음하는 건 통신비밀보호법 위반이 아니에요. 그 사람이 지금도 거짓말을 하고 있다는 걸 지금 목소리로 받아 내야 돼요."}], "flags": ["intimate"], "thumb": "thumbs/5-007.svg"}, {"id": "5-008", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 1400, "shot": "INS · 하이 · 유진(중)", "screen": "위아래 2단. 위(C2 부감): 유진의 손이 다섯 장 위에 일주일 표를 그리고 칸마다 색을 칠해 빈칸을 메운다(손의 잔상 셋, 요일은 식자). 아래 BS: 고개를 든 유진, 처진 눈매가 서늘하고 입술만 고르게 움직인다. 내레이션 위칸, 말풍선 아래칸 좌상·우하.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "승무원 시절 비행 스케줄표를 짜던 손이었다. 서른 명의 휴식 시간과 이착륙 시각을 한 장에 맞추던 손에게 남자 하나의 일주일은 어렵지 않았다."}, {"type": "dialogue", "speaker": "유진", "text": "그 사람 약점은 하나예요. 자기가 관리하는 줄 아는 거."}, {"type": "dialogue", "speaker": "유진", "text": "그 사람이 우리를 관리했죠. 이제 우리가 그 사람을 관리합니다. 빈 시간이 하나도 없게. 다른 데 갈 틈이 없게."}], "flags": ["intimate"], "thumb": "thumbs/5-008.svg"}, {"id": "5-009", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 560, "shot": "BS · 아이레벨 · 미란(좌), 유진(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 잔을 내려놓고 턱을 괸 미란. 우: 차량 기록의 금요일 줄을 손끝으로 짚어 내려가다 멈추는 유진(탑승객 명단을 대조하던 손). 말풍선 좌상, 우상.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "끝은 언제야?"}, {"type": "dialogue", "speaker": "유진", "text": "10월 16일 금요일, 저녁 일곱 시. 금요일 일곱 시엔 꼭 단지 안에 있어요. 열 시에 나가기 전에."}], "flags": ["intimate"], "thumb": "thumbs/5-009.svg"}, {"id": "5-010", "chapter": "5화. 역관리", "scene": "S#1 다섯 자루의 형광펜 (퍼스트 애비뉴 1층 와인바 '미란' 홀, 9월 23일 수 오전 10:00)", "width": 800, "height": 1480, "shot": "MS · 로우 · 유진(중), 미란(전경), 세라(전경), 하린(전경), 혜숙(전경)", "screen": "카운터 상판 높이(C3) 로우 앵글. 전경에 작전표와 버건디·민트·하늘색·금색 형광펜을 쥔 네 손이 흐리게 걸리고, 그 너머 유진이 회색 형광펜 뚜껑을 닫으며 정면을 본다. 카운터 아래 식기세척기 초록 표시등이 꺼진다. 효과음은 붓 효과음(East Sea Dokdo), 말풍선 중상.", "summary": "카운터 상판 높이(C3) 로우 앵글.", "lines": [{"type": "sfx", "speaker": "SFX(작게, 초록)", "text": "삐—"}, {"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "딸깍"}, {"type": "dialogue", "speaker": "유진", "text": "지금부터 그 사람 일정은 우리가 짭니다."}], "flags": ["intimate"], "thumb": "thumbs/5-010.svg"}, {"id": "5-011", "chapter": "5화. 역관리", "scene": "S#2 4초 (더퍼스트 클럽 지하 1층 안내데스크, 9월 24일 목 오전 7:02)", "width": 800, "height": 1160, "shot": "LS · 아이레벨 · 세라(우)", "screen": "데스크 안쪽(C4)에서 본 B1 홀. 왼쪽 유리벽 너머 골프 타석에서 첫 공이 그물을 때리고, 게이트에 주민 한 명이 카드를 댄다(옆에 연휴 운영 안내 게시물). 오른쪽 데스크의 세라가 모니터 한 대를 자기 쪽으로 꺾는다. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 좌상 둘.", "summary": "데스크 안쪽(C4)에서 본 B1 홀.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "추석 연휴 첫날이었다. 단지의 절반은 고향으로 빠져나갔고, 남은 절반은 운동을 했다."}, {"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "삑"}, {"type": "sfx", "speaker": "SFX(중간)", "text": "퍽"}, {"type": "narration", "speaker": "내레이션", "text": "오전 일곱 시의 더퍼스트 클럽 지하 1층에서는 고무 매트와 소독약 냄새가 났다."}], "flags": ["intimate"], "thumb": "thumbs/5-011.svg"}, {"id": "5-012", "chapter": "5화. 역관리", "scene": "S#2 4초 (더퍼스트 클럽 지하 1층 안내데스크, 9월 24일 목 오전 7:02)", "width": 800, "height": 640, "shot": "INS · 아이레벨 · 인물 없음", "screen": "가로 2분할. 좌: 게이트 기록 모니터 맨 아랫줄 '101동 3801호 07:02 통과'(식자, 푸른빛). 우: 같은 시각 미란의 휴대폰 메신저(가상 UI), 와인잔을 든 손 프로필 옆 그의 메시지 한 줄(식자). 칸마다 내레이션 하나.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "101동 3801호 세대카드가 07시 02분에 게이트를 통과했다."}, {"type": "narration", "speaker": "내레이션", "text": "같은 시각 그가 미란에게 보낸 메시지는 '추석에도 현장ㅠ 회장 아들은 명절이 없다'였다."}], "flags": ["intimate"], "thumb": "thumbs/5-012.svg"}, {"id": "5-013", "chapter": "5화. 역관리", "scene": "S#2 4초 (더퍼스트 클럽 지하 1층 안내데스크, 9월 24일 목 오전 7:02)", "width": 800, "height": 560, "shot": "CU · 하이 · 세라(중)", "screen": "세라의 두 엄지가 자판을 빠르게 친다(잔상선). 꺼진 화면 가장자리에 콧등 주근깨와 일자로 다문 입이 비친다. 메시지 말풍선(가상 UI)은 위쪽.", "summary": "세라의 두 엄지가 자판을 빠르게 친다(잔상선).", "lines": [{"type": "dialogue", "speaker": "문자(세라→도겸)", "text": "오빠, 토요일 밤 열 시. 스튜디오 말고 우리 집."}], "flags": ["intimate"], "thumb": "thumbs/5-013.svg"}, {"id": "5-014", "chapter": "5화. 역관리", "scene": "S#2 4초 (더퍼스트 클럽 지하 1층 안내데스크, 9월 24일 목 오전 7:02)", "width": 800, "height": 760, "shot": "INS · POV(세라) · 세라(하단)", "screen": "메신저 화면(가상 UI). 4초 뒤 케틀벨 프로필의 답장이 올라오고 테두리에 진동선. 아래 여백에 화면 빛을 받은 세라의 턱선. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 상단.", "summary": "메신저 화면(가상 UI).", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "띵"}, {"type": "narration", "speaker": "내레이션", "text": "답장은 4초 만에 왔다."}, {"type": "dialogue", "speaker": "문자(도겸→세라)", "text": "ㅇㅋ 너한테만 시간 빼 둘게."}], "flags": ["intimate"], "thumb": "thumbs/5-014.svg"}, {"id": "5-015", "chapter": "5화. 역관리", "scene": "S#3 간식 당번표 (몽타주 — 단톡방 '물결놀이터 엄마들'과 공유 시트, 9월 24일 목 밤)", "width": 800, "height": 760, "shot": "MS · 아이레벨 · 세라(좌), 미란(중), 하린(우)", "screen": "가로 3분할. ① TXT: 단톡방 화면(가상 UI), 민트 소매 끝의 엄지가 'ㅇㅋ' 캡처를 올린다. ② 영업 중인 와인바, 붉은 펜던트 아래 미란이 오프너를 쥔 채 엄지로 메시지를 친다. ③ 스탠드의 노란 원 안에서 하린이 법전 옆 휴대폰을 두 엄지로 친다(붉은 귀). 내레이션 ①칸 상단, 메시지 말풍선 ②③칸 상단.", "summary": "가로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "세라는 캡처를 단톡방 '물결놀이터 엄마들'에 올렸다."}, {"type": "dialogue", "speaker": "문자(미란→도겸)", "text": "자기, 금요일 마감 후. 딴 데 가면 죽어."}, {"type": "dialogue", "speaker": "문자(하린→도겸)", "text": "오빠, 일요일 새벽 두 시에 판례 같이 봐 줘요."}], "flags": [], "thumb": "thumbs/5-015.svg"}, {"id": "5-016", "chapter": "5화. 역관리", "scene": "S#3 간식 당번표 (몽타주 — 단톡방 '물결놀이터 엄마들'과 공유 시트, 9월 24일 목 밤)", "width": 800, "height": 600, "shot": "INS · 아이레벨 · 인물 없음", "screen": "가로 3분할. 세 휴대폰 화면(가상 UI)에 보낸 시각과 답장 시각이 나란히, 차이는 모두 5초
