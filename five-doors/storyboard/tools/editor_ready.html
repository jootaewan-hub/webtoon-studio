<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹툰 킷 편집기</title>
<style>
:root{--bg:#F1F2F4;--panel:#fff;--text:#1C1F26;--muted:#5D6470;--line:#D3D7DD;--acc:#2F6FDE;--warn:#C93A46}
@media (prefers-color-scheme: dark){:root{--bg:#14171C;--panel:#1E2228;--text:#E8EAEE;--muted:#9AA1AC;--line:#343A44;--acc:#6F9BFF}}
*{box-sizing:border-box}body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 12px 0 0}
button,select,input[type=file]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.app{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 54px)}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}.list{max-height:40vh}}
.list{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
.item{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.item.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.item img{width:54px;height:54px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#fff}
.item b{font-size:13px}.item span{display:block;font-size:12px;color:var(--muted);line-height:1.35;max-height:2.7em;overflow:hidden}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;background:var(--warn);color:#fff;margin-left:4px}
.main{overflow:auto;padding:16px}
.row{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:16px}
@media (max-width:1100px){.row{grid-template-columns:1fr}}
.imgs{display:flex;flex-direction:column;gap:10px}
.imgs figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px}
.imgs img{width:100%;display:block;background:#fff}
.imgs figcaption{font-size:12px;color:var(--muted);margin-top:4px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
textarea{min-height:90px;line-height:1.5}
.flags label{display:inline-flex;gap:4px;align-items:center;margin-right:12px;color:var(--text);font-size:13px}
pre{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;line-height:1.5;max-height:340px;overflow:auto}
.hint{font-size:12px;color:var(--muted)}
#toast{position:fixed;right:16px;bottom:16px;background:#1C1F26;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s}
</style>
</head>
<body>
<header>
<h1>웹툰 킷 편집기</h1>
<select id="chap"></select>
<select id="track"></select>
<button id="copy" class="pri">이 컷 프롬프트 복사</button>
<button id="dlTrack">트랙 전체 프롬프트(.md)</button>
<button id="dlJson">cuts.json 내려받기</button>
<label style="margin:0" class="hint">불러오기 <input type="file" id="load" accept=".json"></label>
</header>
<div class="app"><nav class="list" id="list"></nav><main class="main" id="main"><p class="hint">왼쪽에서 컷을 고르세요.</p></main></div>
<div id="toast"></div>

 앱 화면은 베끼지 않는다.", "summary": "검정 가죽 운전석 시트 위에 무광 블랙 메인폰과 무광 그레이 세컨폰이 나란히 놓여 있고, 화면 위로 노란 말", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/0-003.svg"}, {"id": "1-001", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#1 관리란 결국 (지하 2층 주차장 B구역, 9월 1일 화 새벽 5:10)", "width": 800, "height": 1400, "shot": "LS · 하이 · 도겸(중·후경)", "screen": "B구역 통로를 위에서 비스듬히 내려다본다. 직관등이 한 줄 건너 하나씩 꺼져 주황 띠를 두른 기둥 줄이 띄엄띄엄 밝고, 동쪽 벽 칸에 로고 없는 검정 대형 세단이 트렁크를 통로 쪽으로 열어 두었다. 그 앞에 형광 연두 조끼를 입은 도겸의 작은 형체, 젖은 바닥에 직관등 빛이 길게 번지고 천장 제트팬이 어둡게 돈다. 효과음은 붓 효과음(East Sea Dokdo)으로 제트팬 옆, 내레이션 박스 좌상, 시각 자막 '9월 1일(화) 새벽 5:10' 우상 식자.", "summary": "B구역 통로를 위에서 비스듬히 내려다본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "새벽 다섯 시 십 분, 지하 2층 B구역에는 형광등이 반만 켜져 있었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "웅웅—"}], "flags": [], "thumb": "thumbs/1-001.svg"}, {"id": "1-002", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#1 관리란 결국 (지하 2층 주차장 B구역, 9월 1일 화 새벽 5:10)", "width": 800, "height": 760, "shot": "MS · 아이레벨 · 도겸(좌)", "screen": "가로 2분할. 좌: 트렁크 실내등 아래 도겸이 형광 연두 조끼를 벗어 둘둘 만다. 눈 밑이 어둡고 슬릭 백에서 이마로 머리 한 가닥이 흘러내렸으며, 걷어 올린 흰 셔츠 소매 아래 핏줄 선 팔뚝과 금장 콤비 시계가 보인다. 우: 말아 쥔 조끼를 접이식 전동킥보드 옆 틈에 쑤셔 넣는 손. 내레이션 박스 좌칸 상단.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오늘 밤 네 콜, 십일만 사천 원."}], "flags": ["intimate"], "thumb": "thumbs/1-002.svg"}, {"id": "1-003", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#1 관리란 결국 (지하 2층 주차장 B구역, 9월 1일 화 새벽 5:10)", "width": 800, "height": 1040, "shot": "INS · 부감 · 인물 없음", "screen": "트렁크 안쪽(C1)에서 본 검정 공구함, 왼손(시계와 흉터)이 뚜껑을 막 들어 올렸다. 스펀지 홈에 렌치 대신 똑같은 사각 유리병 다섯 개가 나란히 누워 있다. 라벨 없음, 연노랑 액체, 뚜껑만 회색 #9A9EA3·버건디 #7A1E2E·민트 #7FD1BE·하늘색 #9CC7E8·금색 #C9A45C. 트렁크 실내등이 유리에 따뜻하게 맺히고 그 위로 녹회색 직관등이 차갑게 겹친다. 효과음은 붓 효과음(East Sea Dokdo) 작게, 내레이션 박스 위아래 둘.", "summary": "트렁크 안쪽(C1)에서 본 검정 공구함, 왼손(시계와 흉터)이 뚜껑을 막 들어 올렸다.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "덜컥"}, {"type": "narration", "speaker": "내레이션", "text": "렌치 대신 향수병 kdo) 우칸에 작게.", "summary": "가로 3분할.", "lines": [{"type": "dialogue", "speaker": "지호", "text": "아빠, 할아버지는 왜 우리 집에 안 와?"}, {"type": "dialogue", "speaker": "도겸", "text": "할아버지는 아주 먼 데서 큰 건물 짓고 계셔."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "툭"}], "flags": ["child_present"], "thumb": "thumbs/1-015.svg"}, {"id": "1-016", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#3 석 달만 (101동 3801호 거실·부엌과 아일랜드 식탁, 9월 1일 화 아침 7:00)", "width": 800, "height": 640, "shot": "BS · 오버숄더(도겸 너머) · 유진(중)", "screen": "유진이 실 끝을 정리하며 고개를 들어 남편을 똑바로 본다. 나른하게 처진 눈매, 도톰한 뮤트 로즈레드 입술은 움직이지 않을 만큼만 열린다. 전경에 도겸의 회색 티 어깨와 귀. 유진 말풍선 중상, 도겸 말풍선은 전경 쪽 좌하(꼬리는 화면 밖).", "summary": "유진이 실 끝을 정리하며 고개를 들어 남편을 똑바로 본다.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "엄마가 물어보셨어요. 그 지분 건."}, {"type": "dialogue", "speaker": "도겸", "text": "아버지 회사 상장 전이라 지분이 묶였어. 석 달만."}], "flags": ["child_present"], "thumb": "thumbs/1-016.svg"}, {"id": "1-017", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#3 석 달만 (101동 3801호 거실·부엌과 아일랜드 식탁, 9월 1일 화 아침 7:00)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 유진(좌), 도겸(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 유진, 표정 변화 없이 공손한 입 모양, 진주 스터드가 아침 빛에 작게 반짝인다. 우: 도겸, 눈을 오래 맞추며 고개를 살짝 기울이고 왼쪽 입꼬리만 올린다. 말풍선 좌상, 우하.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "석 달 전에도 석 달이라고 하셨어요."}, {"type": "dialogue", "speaker": "도겸", "text": "이번엔 진짜야."}], "flags": ["child_present"], "thumb": "thumbs/1-017.svg"}, {"id": "1-018", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#3 석 달만 (101동 3801호 거실·부엌과 아일랜드 식탁, 9월 1일 화 아침 7:00)", "width": 800, "height": 720, "shot": "MS · 아이레벨 · 유진(중), 지호(좌)", "screen": "유진이 대답 대신 물티슈로 지호의 입가를 닦는다. 지호는 눈을 찡그리고, 유진의 얼굴은 아이 쪽으로 기울어 앞머리에 반쯤 가린다. 뒤쪽 통창의 아침 빛이 식탁 위 물컵에 하얗게 맺힌다. 내레이션 박스 좌상과 하단.", "summary": "유진이 대답 대신 물티슈로 지호의 입가를 닦는다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "친정 돈 2억이었다. 장인은 아직 모른다고 했다. 장모는 알았다."}, {"type": "narration", "speaker": "내레이션", "text": "장모는 매달 물었고, 아내는 매달 그 질문을 식탁 위로 옮겨 왔다."}], "flags": ["child_present"], "thumb": "thumbs/1-018.svg"}, {"id": "1-019", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#3 석 달만 (101동 3801호 거실·부엌과 아일랜드 식탁, 9월 1일 화 아침 7:00)", "width": 800, "height": 1200, "shot": "MS · 로우 · 유진(좌), 도겸(우)", "screen": "위아래 2분할. 위: 의자에서 일어서며 내려다보는 유진, 아침 빛줄기가 옆얼굴을 가르고 눈은 웃지 않는데 입꼬리만 아주 조금 올라가 있다(말풍선 중상). 아래: 프라이팬 손잡이를 쥔 채 멈춘 도겸의 CU, 눈이 허공의 무언가를 읽듯 고정되고 얼굴 옆 허공에 반투명한 회색 캘린더 칸 하나가 겹쳐 뜬다('22:30 집' 식자). 내레이션 박스는 아래 칸 하단.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "오늘 지호는 엄마가 데려가서 재운대요."}, {"type": "narration", "speaker": "내레이션", "text": "도겸은 머릿속 캘린더의 회색 칸을 다시 확인했다. 밤 10시 30분, 집."}], "flags": ["child_present"], "thumb": "thumbs/1-019.svg"}, {"id": "1-020", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#4 모퉁이 (단지 정문 앞 셔틀버스 정류장, 9월 1일 화 아침 7:30)", "width": 800, "height": 1200, "shot": "LS · 아이레벨 · 도겸(우·전경)", "screen": "정문 앞 정류장. 노란 셔틀버스가 서 있고 뒤로 상가 퍼스트 애비뉴의 2층 건물과 동쪽 대로의 낮은 아침 햇빛이 보인다. 버스 창 하나에 작은 손바닥이 납작하게 붙어 있다(아이 얼굴은 유리 반사로 흐리게). 전경 오른쪽에서 도겸이 손을 흔든다. 내레이션 박스 좌상, 시각 자막 '아침 7:30' 우상 식자.", "summary": "정문 앞 정류장.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "일곱 시 반, 노란 셔틀버스가 단지 정문 앞에 섰다."}], "flags": [], "thumb": "thumbs/1-020.svg"}, {"id": "1-021", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#4 모퉁이 (단지 정문 앞 셔틀버스 정류장, 9월 1일 화 아침 7:30)", "width": 800, "height": 480, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "손을 흔드는 도겸, 왼쪽 입꼬리만 올라간 웃음에 아침 볕을 받아 눈이 가늘어진다. 흔드는 손바닥이 얼굴 옆에서 잔상 두 겹. 버스 출발 효과음은 붓 효과음(East Sea Dokdo)으로 화면 밖 좌측에서.", "summary": "손을 흔드는 도겸, 왼쪽 입꼬리만 올라간 웃음에 아침 볕을 받아 눈이 가늘어진다.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "부릉—"}], "flags": [], "thumb": "thumbs/1-021.svg"}, {"id": "1-022", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#4 모퉁이 (단지 정문 앞 셔틀버스 정류장, 9월 1일 화 아침 7:30)", "width": 800, "height": 480, "shot": "LS · 아이레벨 · 인물 없음", "screen": "노란 버스의 뒤꽁무니가 대로 모퉁이를 돌아 사라진다. 빈 정류장, 아스팔트 위에 긴 아침 그림자만 남는다.", "summary": "노란 버스의 뒤꽁무니가 대로 모퉁이를 돌아 사라진다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/1-022.svg"}, {"id": "1-023", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#4 모퉁이 (단지 정문 앞 셔틀버스 정류장, 9월 1일 화 아침 7:30)", "width": 800, "height": 760, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "1-021과 같은 각도, 같은 크기의 같은 얼굴. 웃음이 꺼졌다. 입꼬리가 내려오고 눈이 졸린 듯 무표정해진다. 화면 아래 전경에서 바지 주머니에서 꺼내는 무광 그레이 세컨폰 모서리가 아침 빛을 받는다. 말풍선·효과음 없이 여백.", "summary": "1-021과 같은 각도, 같은 크기의 같은 얼굴.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/1-023.svg"}, {"id": "1-024", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 1240, "shot": "MS · 아이레벨 · 도겸(중)", "screen": "앞유리 바깥에서 본 운전석(엠블럼·로고 없는 검정 대형 세단, 단색 그릴). 직관등 불빛이 앞유리 위에 길쭉하게 번지고, 멀리 출구 경사로를 출근 차 헤드라이트가 긁고 지나간다. 에어컨 바람에 이마의 머리 한 가닥이 흔들리고, 도겸이 검정 가죽 시트에 깊이 기대 세컨폰을 든다. 화면 위쪽 가운데에 큰 자막 '관리의 기술'(Gowun Batang 굵게, 식자) 자리, 타이어 효과음은 붓 효과음(East Sea Dokdo)으로 경사로 쪽에 작게, 내레이션 박스 셋은 좌상·좌하·우하.", "summary": "앞유리 바깥에서 본 운전석(엠블럼·로고 없는 검정 대형 세단, 단색 그릴).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오전 아홉 시 십 분, 지하 2층 B구역."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "끼이익—"}, {"type": "narration", "speaker": "내레이션", "text": "검정 BMW의 운전석이 그의 사무실이었다. 에어컨을 약하게 틀어 두면 가죽 시트에서 아직 새 차 냄새가 났다."}, {"type": "narration", "speaker": "내레이션", "text": "리스 차의 장점이었다. 다 갚기 전까지는 영원히 새 차였다."}], "flags": [], "thumb": "thumbs/1-024.svg"}, {"id": "1-025", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 1400, "shot": "INS · 아이레벨 · 도겸(하단)", "screen": "위아래 2분할. 위(도겸 시점): 세컨폰의 가상 UI 메신저 프로필 전환 화면, 엄지가 옆으로 넘길 때마다 카드가 바뀐다(와인잔을 든 손, 케틀벨, 펼쳐 놓은 원서, 골프장 그린 네 장을 잔상으로 가로로 흘리고, 카드 테두리에 버건디·민트·하늘색·금색 얇은 띠). 아래: 가로 4분할 띠, 화면 빛을 받은 같은 얼굴이 네 번(나른한 눈, 진지한 눈, 다정한 눈, 공손한 눈) 미세하게 바뀐다. 규칙 자막은 위 칸 좌상 식자, 내레이션 박스는 위 칸 하단과 아래 칸 하단.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "규칙 1. 프로필을 섞지 말 것."}, {"type": "narration", "speaker": "내레이션", "text": "세컨폰의 카카오톡에는 얼굴이 넷 있었다. 와인잔을 든 손, 케틀벨, 펼쳐 놓은 원서, 골프장 그린."}, {"type": "narration", "speaker": "내레이션", "text": "미란에게는 와인, 세라에게는 운동, 하린에게는 책, 혜숙에게는 골프. 그는 엄지로 프로필을 넘기며 같은 남자를 네 번 갈아입었다."}], "flags": [], "thumb": "thumbs/1-025.svg"}, {"id": "1-026", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 1040, "shot": "INS · POV(도겸) · 인물 없음", "screen": "가로 2분할. 좌: 키보드 상용구 설정 화면(가상 UI), 'ㄴㅎ' 칸 옆에 '너한테만 하는 얘긴데'(식자), 엄지가 저장을 누른다. 우: 하늘색 테두리의 하린 대화창(원서 프로필), 입력칸의 'ㄴㅎ'이 노란 말풍선 문장으로 펼쳐지고 전송 화살표가 눌린다. 규칙 자막은 좌칸 좌상 식자, 내레이션 박스는 좌칸 하단, 메시지 글자는 우칸 화면 안에 식자.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "규칙 2. 문장은 하나만 쓸 것."}, {"type": "narration", "speaker": "내레이션", "text": "그는 키보드 상용구에 'ㄴㅎ'을 등록해 두었다. ㄴㅎ을 치면 문장이 저절로 완성됐다. 너한테만 하는 얘긴데."}, {"type": "dialogue", "speaker": "문자(도겸→하린)", "text": "너한테만 하는 얘긴데, 오늘 너 생각 많이 났어."}], "flags": [], "thumb": "thumbs/1-026.svg"}, {"id": "1-027", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 760, "shot": "INS · POV(도겸) · 인물 없음", "screen": "가로 2분할, 1-026 우칸과 같은 구도를 두 번 반복한다. 좌: 민트 테두리 세라 대화창(케틀벨 프로필). 우: 버건디 테두리 미란 대화창(와인 프로필). 칸마다 같은 문장, 같은 위치의 노란 말풍선, 같은 전송 화살표. 효과음은 붓 효과음(East Sea Dokdo)으로 1-026 우칸부터 이어지는 계단식 세 개.", "summary": "가로 2분할, 1-026 우칸과 같은 구도를 두 번 반복한다.", "lines": [{"type": "dialogue", "speaker": "문자(도겸→세라)", "text": "너한테만 하는 얘긴데, 오늘 너 생각 많이 났어."}, {"type": "dialogue", "speaker": "문자(도겸→미란)", "text": "너한테만 하는 얘긴데, 오늘 너 생각 많이 났어."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "슝, 슝, 슝"}], "flags": [], "thumb": "thumbs/1-027.svg"}, {"id": "1-028", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 640, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "[트랙2] 크림색 플랫 배경에 반짝이 효과선. 도겸이 세컨폰 화면(세 대화방 목록에서 노란 숫자 '1' 세 개가 차례로 퐁퐁 사라지는 잔상)을 얼굴 옆에 들고 만족스럽게 눈을 반달로 휜다, 왼쪽 입꼬리만 크게 올라간다. 얼굴과 손만 과장하고 셔츠 색은 본편과 같다. 내레이션 박스 둘은 하단에 차분한 본편 서체로(장면과 어긋나게).", "summary": "[트랙2] 크림색 플랫 배경에 반짝이 효과선.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "전송, 전송, 전송. 숫자 '1' 세 개가 차례로 사라졌다."}, {"type": "narration", "speaker": "내레이션", "text": "효율은 정직했다. 사람은 그렇지 않았지만."}], "flags": [], "thumb": "thumbs/1-028.svg"}, {"id": "1-029", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 1800, "shot": "LS · 아이레벨 · 도겸(중)", "screen": "세로 5분할 빠른 컷. ① 동 연결통로(C3) 소실점 정면, 폭 3m의 긴 흰 통로와 허리 높이 동 번호별 색띠, 천장 형광등형 등 한 줄, 세컨폰을 보며 빠르게 걷는 도겸(통로 어디에도 하늘이 없다). ② 304동 3호기 안, 천장 돔 CCTV에 '고장' 스티커(식자), 도겸은 고개를 들지 않는다. ③ 207동 화물용 엘리베이터, 보호용 담요 덮인 벽에 등을 기댄 도겸. ④ 412동 B2 홀 옆 철문 비상계단을 두 칸씩 오르는 다리, 이어 2층 엘리베이터 버튼을 누르는 손가락. ⑤ 503동 B2 홀, 버튼 '24'(식자)를 누르는 시계 찬 왼손. 칸마다 우상에 작은 동 번호 식자, 규칙 자막은 ① 좌상, 내레이션 박스는 ①·③·⑤ 칸 좌측에 짧게.", "summary": "세로 5분할 빠른 컷.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "규칙 3. 지상으로 다니지 말 것."}, {"type": "narration", "speaker": "내레이션", "text": "레이크시티 더퍼스트의 열다섯 개 동은 지하 2층 주차장에서 통로로 이어져 있었다. 하늘을 보지 않으면 얼굴을 볼 사람도 없었다."}, {"type": "narration", "speaker": "내레이션", "text": "304동은 3호기를 탔다. 그 엘리베이터의 CCTV는 7월부터 고장이었다. 207동은 화물용. 412동은 비상계단으로 2층까지 걸어 올라간 다음 탔다. 503동은 지하 2층에서 곧장. 24층에서 서는 사람은 거의 없었다."}, {"type": "narration", "speaker": "내레이션", "text": "동마다 다른 통로, 다른 버튼, 다른 향. 그는 이 단지를 손바닥처럼 알았다. 남의 손바닥이었지만."}], "flags": [], "thumb": "thumbs/1-029.svg"}, {"id": "1-030", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 1240, "shot": "INS · 하이 · 도겸(중)", "screen": "위아래 2분할. 위: 상가 퍼스트 애비뉴 1층 북쪽 무인택배함, 한 칸이 열리고 상자 송장의 수령인 칸 '한 실장'(식자)이 보인다. 아래: 상자 안 비닐에 싸인 로고 없는 블랙 퀼팅 체인 백(금색 체인)과 글자·로고 없는 흰 인증 카드, 짧고 깨끗한 손톱이 상자에 붙은 중국어 송장을 긁어 떼어 바지 주머니에 넣는다(시계와 흉터 같은 프레임). 규칙 자막은 위 칸 좌상 식자, 내레이션 박스는 위 칸 하단과 아래 칸 좌상·우하.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "규칙 4. 선물은 가볍게, 영수증은 없이."}, {"type": "narration", "speaker": "내레이션", "text": "정오, 단지 상가 '퍼스트 애비뉴'의 무인택배함. 수령인 이름은 '한 실장'이었다."}, {"type": "narration", "speaker": "내레이션", "text": "정품 인증 카드도 들어 있었다. 인증 카드까지 가짜였다."}, {"type": "narration", "speaker": "내레이션", "text": "세라에게 줄 가방이었다. 세라는 가방의 무게를 모를 것이다. 그녀가 아는 무게는 덤벨뿐이었다."}], "flags": [], "thumb": "thumbs/1-030.svg"}, {"id": "1-031", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 1200, "shot": "LS · 아이레벨 · 도겸(전경·좌), 순옥(후경·우)", "screen": "더퍼스트 클럽 B1 중앙 복도(C4), 복도를 따라 본다. 오른쪽 여탕 입구 유리문 틈으로 하얀 김이 새어 나와 바닥을 기고(쑥과 락스 냄새를 김 위의 가는 물결선으로), 맞은편에서 수건을 가득 실은 카트가 굴러온다. 카트를 미는 사람은 분홍 세신복에 망사 헤어캡을 쓴 예순 남짓의 작고 다부진 여자. 전경의 도겸은 세컨폰을 보며 걸어온다. 규칙 자막 좌상 식자, 시각 자막 '오후 3:00' 우상, 내레이션 박스 둘은 하단.", "summary": "더퍼스트 클럽 B1 중앙 복도(C4), 복도를 따라 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "규칙 5. 아는 척하지 말 것."}, {"type": "narration", "speaker": "내레이션", "text": "오후 세 시, 커뮤니티센터 '더퍼스트 클럽' 지하 1층 복도."}, {"type": "narration", "speaker": "내레이션", "text": "박순옥이었다."}], "flags": [], "thumb": "thumbs/1-031.svg"}, {"id": "1-032", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 1240, "shot": "MS · 측면 · 순옥(좌), 도겸(우)", "screen": "위아래 2분할. 위: 측면 투샷, 카트와 도겸이 1미터 거리에서 엇갈리는 순간. 순옥은 수건 더미를, 도겸은 휴대폰을 내려다보고 두 사람의 짙은 일자 눈썹이 같은 높이에서 스친다. 아래: 수건 모서리를 반듯하게 누르는 순옥의 굵고 따뜻한 손 INS(손톱은 짧고 물에 불어 하얗다). 내레이션 박스는 위 칸 좌상, 도겸 V.O. 말풍선은 아래 칸에 점선 테두리(목소리만, 2년 전 톤), 마지막 내레이션 박스는 아래 칸 하단.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "2년 전 그가 한 말이 있었다."}, {"type": "dialogue", "speaker": "도겸(V.O.)", "text": "엄마, 아는 척하지 마."}, {"type": "narration", "speaker": "내레이션", "text": "그가 한 말 가운데 유일하게 지켜진 말이었다. 지키는 쪽은 그가 아니었다."}], "flags": [], "thumb": "thumbs/1-032.svg"}, {"id": "1-033", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#5 관리의 기술 (지하 2층 B구역 운전석 → 동 연결통로 → 상가 '퍼스트 애비뉴' 무인택배함 → 더퍼스트 클럽 B1 복도, 9월 1일 화 낮)", "width": 800, "height": 1000, "shot": "LS · 뒷모습 · 도겸(전경·중), 순옥(후경·좌)", "screen": "복도 가운데, 도겸의 뒷모습이 앞으로 걸어가고 그 뒤 화면 깊숙이 카트와 분홍 세신복의 등이 반대 방향으로 멀어진다. 두 사람 사이 복도가 점점 길어지게 원근을 깊게 잡는다. 카트 효과음은 붓 효과음(East Sea Dokdo)으로 점점 작게 세 번, 내레이션 박스 하단 가운데.", "summary": "복도 가운데, 도겸의 뒷모습이 앞으로 걸어가고 그 뒤 화면 깊숙이 카트와 분홍 세신복의 등이 반대 방향으로 ", "lines": [{"type": "sfx", "speaker": "SFX(작게→아주 작게)", "text": "덜컹, 덜컹, 덜컹"}, {"type": "narration", "speaker": "내레이션", "text": "규칙 5는 다섯 개 중 가장 쉬운 규칙이었다."}], "flags": [], "thumb": "thumbs/1-033.svg"}, {"id": "1-034", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#6 하와이에서도 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:30)", "width": 800, "height": 1600, "shot": "LS · 아이레벨 · 유진(중·실루엣)", "screen": "C1 안방 문가에서 남동 모서리 통창을 대각선으로 본다. 실내등 없이 두 면 유리 가득 호수신도시 야경이 빽빽하게 깜박이고, 호수 위로 가로등 불빛이 길게 늘어져 흔들린다. 남쪽 창 앞에 검은 슬립의 유진이 곧은 자세로 서 있는 역광 실루엣, 어깨와 잘록한 허리, 골반의 윤곽에만 금빛 림라이트. 바닥 흰 대리석에 야경이 길게 비친다. 내레이션 박스 좌상·우하, 시각 자막 '밤 10:30' 우상 식자, 냉장고 효과음은 붓 효과음(East Sea Dokdo) 아주 작게 문 쪽에.", "summary": "C1 안방 문가에서 남동 모서리 통창을 대각선으로 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "밤 열 시 반, 침실의 불은 꺼져 있었고 통창이 조명을 대신했다."}, {"type": "narration", "speaker": "내레이션", "text": "에어컨은 꺼져 있었고, 방 안에는 샤워 직후의 습기와 재스민 향 바디오일 냄새가 남아 있었다. 아이가 외가에 간 집은 이상할 만큼 조용했다. 냉장고 모터 소리까지 들렸다."}, {"type": "sfx", "speaker": "SFX(아주 작게, 회색)", "text": "우웅—"}], "flags": ["intimate"], "thumb": "thumbs/1-034.svg"}, {"id": "1-035", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#6 하와이에서도 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:30)", "width": 800, "height": 1240, "shot": "FS · 측면 · 유진(중), 도겸(후경·좌·실루엣)", "screen": "창가에 선 유진의 전신 측면. 가는 끈 두 줄이 좁은 어깨에 걸리고, 검은 실크가 등을 따라 떨어지다 허리에서 한 번 조여졌다가 둥근 골반을 그대로 짚고 허벅지 중간에서 끝난다. 가슴의 묵직한 곡선과 긴 다리 위에서 실크가 숨 쉴 때마다 미세하게 흔들리고(얇은 잔상선), 샤워 직후의 피부에 야경 보케가 점점이 맺힌다. 후경 문가 어둠 속에서 셔츠 단추를 하나씩 풀며 다가오는 도겸의 실루엣. 내레이션 박스 좌상·좌하.", "summary": "창가에 선 유진의 전신 측면.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "아침의 샴페인색이 아니었다. 검은색이었다."}, {"type": "narration", "speaker": "내레이션", "text": "승무원 시절의 곧은 자세가 그대로였다."}], "flags": ["intimate"], "thumb": "thumbs/1-035.svg"}, {"id": "1-036", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#6 하와이에서도 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:30)", "width": 800, "height": 800, "shot": "MS · 뒷모습 · 도겸(전경·실루엣), 유진(중)", "screen": "도겸의 등 뒤에서. 그가 셔츠 단추를 풀며 유진의 등 쪽으로 다가가고, 유진은 돌아보지 않은 채 유리에 비친 그를 본다(유리 속 두 사람의 상이 야경 위에 희미하게 겹친다). 유진 말풍선 우상(유리 속 그녀의 입 쪽으로 꼬리), 도겸 말풍선 좌하 짧게.", "summary": "도겸의 등 뒤에서.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "오늘도 현장이었어요?"}, {"type": "dialogue", "speaker": "도겸", "text": "응."}], "flags": ["intimate"], "thumb": "thumbs/1-036.svg"}, {"id": "1-037", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#6 하와이에서도 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:30)", "width": 800, "height": 1040, "shot": "BS · 오버숄더(유진 너머) · 도겸(중)", "screen": "4화 회상에서 같은 구도로 반복할 컷. 왼쪽 전경에 유진의 맨어깨와 검은 슬립 끈, 흑갈색 단발 끝이 크게 걸리고, 그 너머 통창 유리에 비친 도겸이 화면 가운데에 버스트로 선다. 셔츠는 단추가 반쯤 풀려 넓은 가슴이 드러나 있고, 왼손으로 귓불을 만지며(금장 콤비 시계와 초승달 흉터가 귓가에서 한 프레임) 왼쪽 입꼬리만 올린다, 눈은 유리 속 그녀의 눈을 오래 맞춘다. 그의 얼굴과 셔츠 위로 도시의 금빛 보케가 겹쳐 비친다(유리 속 상이라 좌우가 뒤집힌다). 말풍선 우상, 테두리 얇게 낮은 목소리 톤.", "summary": "4화 회상에서 같은 구도로 반복할 컷.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "너한테만 하는 얘긴데… 나 사실 아버지랑 사이 안 좋아. 회사 물려받기 싫어."}], "flags": ["intimate"], "thumb": "thumbs/1-037.svg"}, {"id": "1-038", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#6 하와이에서도 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:30)", "width": 800, "height": 1200, "shot": "MS · 아이레벨 · 유진(중), 도겸(전경·우)", "screen": "위아래 2분할. 위: 유리에 비친 유진의 얼굴, 나른하게 처진 눈이 움직이지 않고 입술만 공손하게 열린다(말풍선 중상). 아래: 유진이 돌아선다. 야경이 그녀의 등 뒤로 물러나며 금빛 림라이트가 단발 윤곽, 깊은 쇄골, 가슴의 둥근 윗선에 걸리고 얼굴은 역광으로 반쯤 어둡다(눈만 반짝). 전경 오른쪽에 도겸의 풀린 셔츠 자락. 아래 칸 말풍선 중상, 내레이션 박스 하단.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "그 얘기, 하와이에서도 하셨어요."}, {"type": "dialogue", "speaker": "유진", "text": "우리 마지막으로 언제 했는지 기억하세요?"}, {"type": "narration", "speaker": "내레이션", "text": "끝까지 존댓말이었다."}], "flags": ["intimate"], "thumb": "thumbs/1-038.svg"}, {"id": "1-039", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#6 하와이에서도 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:30)", "width": 800, "height": 1400, "shot": "INS · 로우 · 유진(중), 도겸(상단·좌)", "screen": "세로 3분할. ① 작은 칸: 도겸이 입을 열었다가 닫는다(이마의 머리 한 가닥, 반 박자 늦은 깜빡임). ② 그를 똑바로 보는 유진의 옆얼굴과 귓불, 흰 손가락이 왼쪽 진주 스터드를 먼저 빼고 이어 오른쪽(작은 잔상 칸으로 순서 표시). ③ C2 창턱 높이 로우 앵글, 흰 대리석 창턱 위에 진주 두 알이 차례로 놓이고 유리 너머 야경 보케가 크게 번진다. 효과음은 붓 효과음(East Sea Dokdo) 두 개를 ③ 칸에, 내레이션 박스는 ① 하단과 ③ 하단.", "summary": "세로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "도겸은 대답을 고르다 놓쳤다."}, {"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "딸깍, 딸깍"}, {"type": "narration", "speaker": "내레이션", "text": "그것이 그녀가 결정적인 순간에만 하는 동작이라는 것을 그는 6년 동안 몰랐다."}], "flags": ["intimate"], "thumb": "thumbs/1-039.svg"}, {"id": "1-040", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#6 하와이에서도 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:30)", "width": 800, "height": 1080, "shot": "MS · 측면 · 유진(좌), 도겸(우)", "screen": "유진이 그의 풀린 셔츠 자락을 움켜쥐고 당긴다. 두 사람의 측면 실루엣이 통창 앞에서 맞닿고, 입술이 닿는 선에만 야경의 금빛이 걸린다. 셔츠 자락을 쥔 하얀 손(누드 베이지 손톱)이 화면 아래 전경에 크게. 그의 목덜미에 따뜻한 붉은 기가 오르는 것을 림라이트 색으로만 표시한다. 내레이션 박스 좌상·우하.", "summary": "유진이 그의 풀린 셔츠 자락을 움켜쥐고 당긴다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "손이 차가웠다. 입술은 더 차가웠다."}, {"type": "narration", "speaker": "내레이션", "text": "그런데 그 냉기에 오히려 그의 목덜미가 달아올랐다."}], "flags": ["intimate"], "thumb": "thumbs/1-040.svg"}, {"id": "1-041", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#7 유리 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:40, 연속)", "width": 800, "height": 720, "shot": "INS · 아이레벨 · 유진(중), 도겸(전경)", "screen": "가로 2분할. 좌: 그의 왼손바닥이 검은 실크 위로 그녀의 잘록한 허리를 감싼다(시계와 흉터 같은 프레임, 실크 주름에 야경 하이라이트). 우: 엄지가 슬립 끈을 밀자 끈이 어깨의 둥근 곡선을 타고 미끄러진다. 효과음은 붓 효과음(East Sea Dokdo) 우칸에 작게, 내레이션 박스 좌칸 하단.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "실크 아래에서 체온이 얇게 올라왔다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "스륵"}], "flags": ["intimate"], "thumb": "thumbs/1-041.svg"}, {"id": "1-042", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#7 유리 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:40, 연속)", "width": 800, "height": 1600, "shot": "MS · 아이레벨 · 유진(중·실루엣)", "screen": "위에서 아래로 틸트 다운하듯 세로로 이어지는 한 컷. 맨 위: 반대편 끈은 유진의 손가락이 직접 내린다. 가운데: 검은 천이 가슴의 곡선에 잠시 걸렸다가 허리로, 골반으로 흘러내린다(가슴 앞은 그의 어깨 실루엣과 멀리언 그림자가 가리고, 몸은 림라이트 윤곽만). 아래: 발목을 지나 흰 대리석 바닥에 검은 실크가 둥글게 고인다(맨발 두 쌍과 야경 반사). 내레이션 박스는 맨 아래 검은 웅덩이 옆.", "summary": "위에서 아래로 틸트 다운하듯 세로로 이어지는 한 컷.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "바닥에 검은 웅덩이가 생겼다."}], "flags": ["intimate"], "thumb": "thumbs/1-042.svg"}, {"id": "1-043", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#7 유리 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:40, 연속)", "width": 800, "height": 1400, "shot": "MS · 아이레벨 · 유진(중·실루엣), 도겸(전경·좌·실루엣)", "screen": "야경 앞에 선 유진의 맨몸, 희고 긴 역광 실루엣. 남쪽 통창의 검정 멀리언 하나가 몸통 한가운데를 세로로 지나고, 림라이트가 긴 목, 깊게 팬 쇄골, 잘록한 허리, 둥근 골반의 바깥선만 그린다. 왼쪽 전경 도겸의 손 실루엣이 그녀의 옆구리에서 위로 올라가고, 가슴 정면은 그의 손등 윤곽과 어둠이 가린다. 검정 멀리언 하나가 목 아래부터 골반 아래까지 몸통 가운데를 세로로 덮고, 프레임 아래쪽은 허리선에서 창턱 그림자로 끊는다. 내레이션 박스 우상.", "summary": "야경 앞에 선 유진의 맨몸, 희고 긴 역광 실루엣.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "쇄골이 깊게 패어 있었고, 가슴은 그가 기억하던 것보다 묵직하게 그의 손바닥을 채웠다."}], "flags": ["intimate"], "thumb": "thumbs/1-043.svg"}, {"id": "1-044", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#7 유리 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:40, 연속)", "width": 800, "height": 520, "shot": "CU · 측면 · 도겸(좌), 유진(우)", "screen": "그의 입술이 쇄골에서 어깨로, 목선으로 올라가는 세 위치를 옅은 잔상으로 한 칸에. 유진은 고개를 조금 젖히고 눈을 감았으며 도톰한 입술이 열려 숨이 짧은 선으로 새어 나온다. 내레이션 박스 하단.", "summary": "그의 입술이 쇄골에서 어깨로, 목선으로 올라가는 세 위치를 옅은 잔상으로 한 칸에.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유진의 숨이 처음으로 흐트러졌다."}], "flags": ["intimate"], "thumb": "thumbs/1-044.svg"}, {"id": "1-045", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#7 유리 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:40, 연속)", "width": 800, "height": 1400, "shot": "MS · 측면 · 유진(중), 도겸(좌)", "screen": "세로 3분할. ① 그가 그녀의 허리를 잡아 돌려 세운다(회전 잔상선). ② C2 창턱 높이, 유리에 바짝 붙은 카메라: 두 손바닥이 통창에 붙고 손끝이 하얘진다, 손바닥 둘레에 김이 옅게 핀다. ③ 측면: 차가운 유리와 그의 가슴 사이에서 그녀의 등이 활처럼 휜다. 몸 앞면은 유리에 닿아 남동 모서리 유리 이음선과 멀리언이 가리고, 그의 가슴과 그녀의 등만 림라이트로 빛난다. 내레이션 박스는 ③ 상단.", "summary": "세로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유리는 차가웠고 그의 가슴은 뜨거웠다."}], "flags": ["intimate"], "thumb": "thumbs/1-045.svg"}, {"id": "1-046", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#7 유리 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:40, 연속)", "width": 800, "height": 1000, "shot": "INS · 뒷모습 · 유진(중), 도겸(하단)", "screen": "위아래 2분할. 위: 그녀의 매끈한 등, 그의 입술이 등뼈 마디를 하나씩 세며 내려가다 허리의 오목한 곳에서 멈춘다(화면 아래 경계가 허리선). 아래: 유진의 손이 뒤로 뻗어 그의 손목(시계와 흉터)을 잡아 끌어간다. 손목과 시계까지만 보이고, 그 앞은 창턱 그림자 속으로 사라진다. 내레이션 박스 아래 칸 하단.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "6년 동안 그녀가 먼저 길을 가르쳐 준 적은 없었다."}], "flags": ["intimate"], "thumb": "thumbs/1-046.svg"}, {"id": "1-047", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#7 유리 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:40, 연속)", "width": 800, "height": 720, "shot": "INS · 아이레벨 · 인물 없음", "screen": "C2 창턱 높이에서 유리만 본다. 가로 3분할: 하얀 김이 동그랗게 번졌다가 사라지고, 다시 번진다. 칸 사이 간격(검은 틈)을 왼쪽에서 오른쪽으로 갈수록 좁혀 리듬이 짧아지는 것을 보여 준다. 유리 너머 야경 보케. 효과음 없이 내레이션 박스만 상단과 하단.", "summary": "C2 창턱 높이에서 유리만 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "리듬은 처음엔 느렸다."}, {"type": "narration", "speaker": "내레이션", "text": "번지고, 사라지고. 간격이 점점 짧아졌다."}], "flags": ["intimate"], "thumb": "thumbs/1-047.svg"}, {"id": "1-048", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#7 유리 (101동 3801호 안방 통창 앞, 9월 1일 화 밤 10:40, 연속)", "width": 800, "height": 1240, "shot": "INS · 측면 · 유진(중·실루엣), 도겸(실루엣)", "screen": "세로 3분할, 배경 전체에 창 너머 고속도로 불빛이 길게 흐른다. ① 유리를 짚은 그녀의 손등 위로 그의 손이 겹쳐 깍지를 낀다(두 손 실루엣, 시계). ② 유리 위에서 미끄러졌다가 다시 붙는 손바닥, 손바닥 자국이 길게 끌린다. ③ 등의 골을 따라 흐르는 땀 한 줄기에 야경이 한 점 맺힌다. 효과음은 붓 효과음(East Sea Dokdo) ② 칸에 작게.", "summary": "세로 3분할, 배경 전체에 창 너머 고속도로 불빛이 길게 흐른다.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "끼— 익"}], "flags": ["intimate"], "thumb": "thumbs/1-048.svg"}, {"id": "1-049", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#8 세 걸음 (101동 3801호 안방 침대, 9월 1일 화 밤 10:50, 연속)", "width": 800, "height": 1000, "shot": "MS · 하이 · 유진(중), 도겸(하단)", "screen": "위아래 2분할. 위: 바닥의 검은 슬립 웅덩이를 지나 침대로 가는 맨발 두 쌍, 발 잔상은 세 걸음뿐. 아래: 유진이 그를 킹 침대에 밀어 눕히고 그 위로 올라온다, 흰 시트가 그녀의 허리 아래에 감기고 등과 어깨만 야경 림라이트. 내레이션 박스 위 칸 좌상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "침대까지는 다섯 걸음이었다. 두 사람은 세 걸음 만에 닿았다."}], "flags": ["intimate"], "thumb": "thumbs/1-049.svg"}, {"id": "1-050", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#8 세 걸음 (101동 3801호 안방 침대, 9월 1일 화 밤 10:50, 연속)", "width": 800, "height": 600, "shot": "CU · 앙각 · 유진(중), 도겸(하단)", "screen": "아래에서 올려다본 구도. 흑갈색 단발 웨이브가 커튼처럼 흘러내려 두 얼굴을 가리고, 머리카락 틈으로 야경 빛이 금실처럼 새어 든다. 그녀의 얼굴은 보이지 않고 머리카락 끝이 그의 이마에 닿아 흔들린다. 가슴께는 머리카락과 어둠이 가린다.", "summary": "아래에서 올려다본 구도.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/1-050.svg"}, {"id": "1-051", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#8 세 걸음 (101동 3801호 안방 침대, 9월 1일 화 밤 10:50, 연속)", "width": 800, "height": 560, "shot": "INS · 하이 · 유진(상단), 도겸(하단)", "screen": "그녀의 하얀 두 손이 그의 두 손목을 매트리스에 누른다. 금장 콤비 시계가 흰 시트 주름 속에 파묻히고 초승달 흉터만 시트 밖으로 보인다. 내레이션 박스 상단.", "summary": "그녀의 하얀 두 손이 그의 두 손목을 매트리스에 누른다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "속도는 그녀가 정했다. 그는 따라갔다."}], "flags": ["intimate"], "thumb": "thumbs/1-051.svg"}, {"id": "1-052", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#8 세 걸음 (101동 3801호 안방 침대, 9월 1일 화 밤 10:50, 연속)", "width": 800, "height": 720, "shot": "CU · 측면 · 유진(좌), 도겸(우)", "screen": "역광 측면. 유진이 소리 없이 그의 어깨에 이를 댄다. 감은 눈, 이마에 붙은 젖은 머리칼, 시트가 그녀의 어깨 아래를 덮고 둘의 윤곽에만 야경 림라이트. 효과음 없이, 내레이션 박스 하단.", "summary": "역광 측면.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "마지막 순간 유진은 소리를 내지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/1-052.svg"}, {"id": "1-053", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#8 세 걸음 (101동 3801호 안방 침대, 9월 1일 화 밤 10:50, 연속)", "width": 800, "height": 1600, "shot": "LS · 아이레벨 · 인물 없음", "screen": "화면 전체가 통창 밖 야경. 호수 위 가로등, 고속도로 불빛, 아파트 창들이 한꺼번에 번져 커다란 금빛·청색 보케 원으로 녹아내린다(완전 아웃포커스). 아래쪽으로 갈수록 검정 그라데이션으로 F.O., 내레이션 박스는 보케 한가운데.", "summary": "화면 전체가 통창 밖 야경.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "도시 전체가 초점을 잃었다."}], "flags": ["intimate"], "thumb": "thumbs/1-053.svg"}, {"id": "1-054", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#8 세 걸음 (101동 3801호 안방 침대, 9월 1일 화 밤 10:50, 연속)", "width": 800, "height": 1240, "shot": "INS · 로우 · 인물 없음", "screen": "F.I. 위아래 2분할. 위: C2 창턱 높이에서 본 통창, 손바닥 자국 두 개와 동그란 김 자국이 천천히 줄어든다(같은 자리 세 단계 잔상). 아래: 대리석 바닥에 벗어 던진 차콜 슬랙스, 주머니가 떨리며 천 사이로 세컨폰 화면 빛이 샌다. 냉장고 효과음은 위 칸, 진동 효과음은 아래 칸에 붓 효과음(East Sea Dokdo). 내레이션 박스 위 칸 좌상, 아래 칸 우하.", "summary": "F.I.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그리고 정적이 왔다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "우웅—"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "징— 징—"}, {"type": "narration", "speaker": "내레이션", "text": "세컨폰이었다."}], "flags": ["intimate"], "thumb": "thumbs/1-054.svg"}, {"id": "1-055", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#8 세 걸음 (101동 3801호 안방 침대, 9월 1일 화 밤 10:50, 연속)", "width": 800, "height": 880, "shot": "MS · 하이 · 도겸(좌), 유진(우·뒷모습)", "screen": "도겸이 상체를 일으켜 바닥의 바지 쪽으로 팔을 뻗으며 짧게 말한다. 오른쪽에는 그에게 등을 돌린 채 시트를 어깨까지 덮고 누운 유진, 흐트러진 단발과 맨어깨만 보인다. 말풍선 좌상 작게, 내레이션 박스 둘은 하단에 간격 두고.", "summary": "도겸이 상체를 일으켜 바닥의 바지 쪽으로 팔을 뻗으며 짧게 말한다.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "현장."}, {"type": "narration", "speaker": "내레이션", "text": "아무도 묻지 않았다."}, {"type": "narration", "speaker": "내레이션", "text": "그는 그녀가 잠들었다고 생각했다."}], "flags": ["intimate"], "thumb": "thumbs/1-055.svg"}, {"id": "1-056", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#8 세 걸음 (101동 3801호 안방 침대, 9월 1일 화 밤 10:50, 연속)", "width": 800, "height": 1400, "shot": "CU · 아이레벨 · 유진(중)", "screen": "전경에 베개 위 유진의 뒷머리와 맨어깨가 어둡게 걸리고, 그 너머 통창 유리에 그녀의 얼굴이 야경과 겹쳐 비친다. 두 눈이 또렷하게 뜨여 있다. 나른한 눈매, 움직이지 않는 입술. 효과음·말풍선 없이 아래 여백을 크게.", "summary": "전경에 베개 위 유진의 뒷머리와 맨어깨가 어둡게 걸리고, 그 너머 통창 유리에 그녀의 얼굴이 야경과 겹쳐 비", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/1-056.svg"}, {"id": "1-057", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#9 증거는 안에 (503동 2402호 현관과 거실, 9월 2일 수 오후 2:00)", "width": 800, "height": 1400, "shot": "LS · 아이레벨 · 인물 없음", "screen": "C1 현관 홀에서 본다. 전경에 짙은 월넛 콘솔(흰 대리석 상판), 왼쪽 백합 꽃꽂이와 오른쪽 가운 차림 남편 액자, 위 벽에 둥근 금테 거울. 그 너머 거실은 어둡고, 한 뼘 열린 차콜 암막 커튼 틈으로 들어온 햇빛이 대리석 바닥 위에 금빛 칼날처럼 한 줄 누워 있으며 그 빛 안에서 먼지가 돈다. TV 위 둥근 벽시계. 효과음은 붓 효과음(East Sea Dokdo)으로 벽시계 옆, 창 밖 쪽에 아주 작게 둘. 내레이션 박스 좌상, 날짜 자막 '9월 2일(수) 오후 2:00' 우상 식자.", "summary": "C1 현관 홀에서 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오후 두 시, 503동 2402호 거실의 암막 커튼은 한 뼘만 열려 있었다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "째깍, 째깍"}, {"type": "sfx", "speaker": "SFX(아주 작게)", "text": "위잉— 맴—"}], "flags": [], "thumb": "thumbs/1-057.svg"}, {"id": "1-058", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#9 증거는 안에 (503동 2402호 현관과 거실, 9월 2일 수 오후 2:00)", "width": 800, "height": 1000, "shot": "MS · 아이레벨 · 도겸(좌), 혜숙(우)", "screen": "위아래 2분할. 위: 24층 홀 쪽, 2402호 문 앞에서 벨로 뻗은 도겸의 왼손 검지(시계와 흉터)가 버튼 앞에서 멈추고, 문이 안쪽으로 먼저 열린다. 아래: 열린 문틈의 혜숙, 날개형 아이라인 눈매로 위에서 아래로 그를 훑으며 빨간 손톱 검지를 입술 앞에 세운다. 문틈으로 백합 꽃가루가 금빛 입자로 흘러나오고 그의 목덜미의 금색 향 입자와 섞인다. 효과음은 붓 효과음(East Sea Dokdo) 위 칸, 내레이션 박스 위 칸 좌상, 말풍선 아래 칸 우상.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "콘솔 위 백합 꽃꽂이에서 진한 꽃가루 냄새가 났다. 도겸은 그 냄새 위에 금색 향수를 얹고 서 있었다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "철컥"}, {"type": "dialogue", "speaker": "혜숙", "text": "얘, 벨은 누르지 마. 옆집이 귀가 밝아."}], "flags": ["intimate"], "thumb": "thumbs/1-058.svg"}, {"id": "1-059", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#9 증거는 안에 (503동 2402호 현관과 거실, 9월 2일 수 오후 2:00)", "width": 800, "height": 1400, "shot": "FS · 로우 · 혜숙(중)", "screen": "현관 안쪽에서 약간 올려다본 혜숙의 전신. 아이보리 실크가 풍만한 가슴의 곡선에 얇게 감겨 숨 쉴 때마다 빛을 바꾸고(같은 자리 하이라이트 두 단계), 단추 하나가 평소보다 더 풀려 쇄골 위 진주 목걸이가 드러난다. 검정 펜슬스커트가 넓고 둥근 골반과 허벅지를 빈틈없이 감싸다 무릎 아래에서 좁아지고, 얇은 스타킹의 매끈한 종아리. 낮은 시뇽에서 몇 가닥이 흘러내렸고 무게중심이 낮다. 내레이션 박스 우하.", "summary": "현관 안쪽에서 약간 올려다본 혜숙의 전신.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "마흔두 살의 몸은 서두르는 법이 없었다."}], "flags": ["intimate"], "thumb": "thumbs/1-059.svg"}, {"id": "1-060", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#9 증거는 안에 (503동 2402호 현관과 거실, 9월 2일 수 오후 2:00)", "width": 800, "height": 1040, "shot": "INS · 하이 · 혜숙(중)", "screen": "위아래 2분할. 위: 대리석 현관 한가운데 벗어 둔 갈색 로퍼, 혜숙이 혀를 차며 그것을 집어 짙은 월넛 신발장 안에 넣고 문을 닫는다(빨간 손톱, 말풍선 우상). 아래: 지나가며 콘솔 위 액자를 손가락 하나로 엎는 손 ECU, 가운 입은 남편 사진(얼굴은 흐리게)이 흰 대리석 상판에 얼굴을 묻는다. 효과음은 붓 효과음(East Sea Dokdo) 아래 칸, 내레이션 박스 위 칸 하단과 아래 칸 하단.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "얘, 신발은 거기 두는 거 아니야."}, {"type": "narration", "speaker": "내레이션", "text": "증거는 늘 안에 넣는 것이었다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "탁"}, {"type": "narration", "speaker": "내레이션", "text": "가운을 입은 남편이 대리석에 얼굴을 묻었다. 전등 스위치를 끄는 것 같은 손짓이었다."}], "flags": [], "thumb": "thumbs/1-060.svg"}, {"id": "1-061", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#9 증거는 안에 (503동 2402호 현관과 거실, 9월 2일 수 오후 2:00)", "width": 800, "height": 1040, "shot": "BS · 오버숄더(혜숙 너머) · 도겸(중)", "screen": "4화 회상에서 같은 구도로 반복할 컷. 왼쪽 전경에 혜숙의 낮은 시뇽과 흘러내린 머리 몇 가닥, 진주 목걸이가 걸린 목덜미, 아이보리 실크 어깨, 엎어진 액자 위에 아직 얹힌 빨간 손톱 검지가 크게 걸린다. 그 너머 화면 가운데 버스트의 도겸이 왼손으로 귓불을 만지며(시계와 흉터 같은 프레임) 왼쪽 입꼬리만 올리고, 눈을 오래 맞춘다. 등 뒤 거실의 금빛 칼날이 그의 흰 셔츠 옆선에 걸린다. 말풍선 우상, 낮은 목소리 톤.", "summary": "4화 회상에서 같은 구도로 반복할 컷.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "너한테만 하는 얘긴데. 나 사실 아버지랑 사이 안 좋아. 회사 물려받기 싫어."}], "flags": ["intimate"], "thumb": "thumbs/1-061.svg"}, {"id": "1-062", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#9 증거는 안에 (503동 2402호 현관과 거실, 9월 2일 수 오후 2:00)", "width": 800, "height": 1200, "shot": "BS · 아이레벨 · 혜숙(좌), 도겸(우)", "screen": "위아래 2분할. 위(가로 2분할 숏·리버스숏): 좌는 손으로 입을 가리고 웃는 혜숙(눈가 웃음 주름, 아이라인), 우는 한쪽 눈썹을 올리며 웃는 도겸. 말풍선 좌상, 우하. 아래: 대답 대신 그의 손을 잡고 안방 쪽 복도로 걷는 혜숙의 뒷모습, 골반이 크게 느리게 움직이고 맞잡은 손의 빨간 손톱과 그의 시계가 금빛을 받는다. 아래 칸은 말 없이.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "그래서 나 같은 아줌마한테 오는 거니?"}, {"type": "dialogue", "speaker": "도겸", "text": "누나가 무슨 아줌마야."}], "flags": ["intimate"], "thumb": "thumbs/1-062.svg"}, {"id": "1-063", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 1240, "shot": "MS · 아이레벨 · 혜숙(중), 도겸(좌·전경)", "screen": "위아래 2분할. 위: C2 안방 문가에서 본 어두운 안방, 한 뼘 열린 커튼 틈의 빛줄기가 퀸 침대 머리맡 벽을 비스듬히 가른다. 침대 끝에 걸터앉은 혜숙이 턱을 들고, 전경의 도겸이 그녀 앞에 선다. 아래(가로 2분할 INS): 좌는 블라우스 첫 진주 단추를 서둘러 비트는 그의 손가락, 우는 빨간 손톱 검지가 그의 손등을 톡 치는 순간. 내레이션 박스 위 칸 좌상, 효과음은 붓 효과음(East Sea Dokdo) 우칸, 말풍선 우칸 상단.", "summary": "위아래 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "안방 커튼도 한 뼘만 열려 있었다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "톡"}, {"type": "dialogue", "speaker": "혜숙", "text": "천천히. 얘, 그건 그렇게 하는 거 아니야."}], "flags": ["intimate"], "thumb": "thumbs/1-063.svg"}, {"id": "1-064", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 1240, "shot": "INS · 아이레벨 · 혜숙(중)", "screen": "세로 3분할. ①② 진주 단추가 하나씩 풀린다. 칸마다 그녀의 가슴이 숨 한 번만큼 오르내리는 선(같은 자리, 다른 높이)을 두어 박자를 맞춘다. ③ 실크가 둥근 어깨를 타고 미끄러져 팔꿈치에 걸리고, 피부색 레이스가 드러난다. 빛줄기가 쇄골과 레이스 윗선, 진주 목걸이에만 금빛으로 걸린다. 내레이션 박스는 ① 좌상.", "summary": "세로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그는 진주 단추를 하나씩, 그녀가 숨을 한 번 쉴 때마다 하나씩 풀었다."}], "flags": ["intimate"], "thumb": "thumbs/1-064.svg"}, {"id": "1-065", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 1240, "shot": "INS · 뒷모습 · 혜숙(중), 도겸(전경·손)", "screen": "일어선 혜숙의 등 뒤. 오른쪽 전경에 차콜 암막 커튼 자락이 크게 걸린다. 위: 스커트 지퍼가 길게 내려간다(지퍼 선을 화면 위에서 아래로 길게 늘인다). 아래: 골반에 걸려 내려오지 않는 펜슬스커트를 그의 두 손이 골반 아래로 밀어 내린다. 넓고 부드러운 엉덩이의 곡선과 얇은 스타킹을 빛줄기가 비스듬히 가른다. 효과음은 붓 효과음(East Sea Dokdo)을 지퍼 선을 따라 길게, 내레이션 박스 좌상·좌하.", "summary": "일어선 혜숙의 등 뒤.", "lines": [{"type": "sfx", "speaker": "SFX(중간, 금색)", "text": "지이이익—"}, {"type": "narration", "speaker": "내레이션", "text": "지퍼가 내려가는 소리가 길었다."}, {"type": "narration", "speaker": "내레이션", "text": "펜슬스커트는 골반에 걸려 저절로 내려오지 않았다. 그 곡선은 넓고 부드러웠다."}], "flags": ["intimate"], "thumb": "thumbs/1-065.svg"}, {"id": "1-066", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 1400, "shot": "MS · 뒷모습 · 혜숙(중), 도겸(하단)", "screen": "등 쪽에서. 혜숙이 그를 침대에 밀어 눕히고 무릎으로 그를 타고 올라온다. 뒤로 돌린 한 손 끝에서 피부색 레이스가 대리석 바닥으로 떨어지고(낙하 잔상), 맨 등과 넓은 골반의 윤곽이 빛줄기 속에 있다. 그녀의 상반신이 무게를 싣고 그의 가슴 위로 천천히 내려앉는 기울기, 앞은 그녀의 등과 어둠이 가린다. 흰 시트가 그녀의 허리 아래를 감싸고, 골반은 시트 주름의 윤곽으로만 보인다.", "summary": "등 쪽에서.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/1-066.svg"}, {"id": "1-067", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 840, "shot": "INS · 하이 · 혜숙(중), 도겸(하단)", "screen": "가로 3분할. 그녀의 빨간 손톱 손이 그의 손(시계와 흉터)을 집어 ① 자기 허리에, ② 등에, ③ 그다음은 화면 밖으로 하나씩 옮겨 놓는다. 세 칸 모두 같은 구도로 손의 위치만 바뀐다. 내레이션 박스는 ③ 칸에 위아래 둘.", "summary": "가로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "지시하는 손이었다."}, {"type": "narration", "speaker": "내레이션", "text": "서두르지 않는 손이었다."}], "flags": ["intimate"], "thumb": "thumbs/1-067.svg"}, {"id": "1-068", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 1040, "shot": "INS · 측면 · 혜숙(중), 도겸(하단)", "screen": "세로 3분할. ① 두 사람 사이에서 흔들리는 진주 목걸이, 차가운 알 하나가 그의 맨가슴에 닿는다. ② 그의 손가락 하나가 목걸이에 걸린다. ③ 빛줄기 속에서 혜숙이 몸을 뒤로 젖히는 측면 실루엣(목선과 턱, 팽팽해진 진주 줄만 금빛). 효과음은 붓 효과음(East Sea Dokdo), ③ 칸 줄 위에 작게.", "summary": "세로 3분할.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "툭"}], "flags": ["intimate"], "thumb": "thumbs/1-068.svg"}, {"id": "1-069", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 1800, "shot": "INS · 로우 · 인물 없음", "screen": "슬로모션. 위: 끊어진 줄에서 진주알이 쏟아져 그의 가슴 위에서 튀어 오르고, 빛줄기를 지나며 하나하나 금빛으로 반짝인다(가슴 부위는 진주알과 빛 번짐으로만). 아래: 대리석 바닥 높이 로우 앵글, 침대 아래로 떨어진 진주알들이 사방으로 튀고 흩어진다. 효과음은 붓 효과음(East Sea Dokdo) 대형으로 아래 칸에 흩뿌리고, 내레이션 박스 하단.", "summary": "슬로모션.", "lines": [{"type": "sfx", "speaker": "SFX(대형, 흰색)", "text": "타다닥, 타다닥"}, {"type": "narration", "speaker": "내레이션", "text": "우박 같은 소리가 바닥 위로 흩어졌다."}], "flags": ["intimate"], "thumb": "thumbs/1-069.svg"}, {"id": "1-070", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 1400, "shot": "MS · 측면 · 혜숙(중), 도겸(하단)", "screen": "세로 3분할. ① 위에서 내려다보며 손으로 입을 가리고 웃는 혜숙, 목에는 빈 줄만 남았다(말풍선 우상). ② 바닥에서 아직 굴러가는 마지막 진주알들 INS. ③ 빛줄기가 그녀의 맨 등 위로 옮겨 와 땀이 맺힌 척추 골을 금색으로 칠하고, 서두르려는 그의 허리를 그녀의 손이 눌러 멈춰 세운다(시트가 허리 아래를 덮는다). 효과음은 붓 효과음(East Sea Dokdo) ② 칸, 내레이션 박스 ② 하단과 ③ 하단.", "summary": "세로 3분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "놔둬."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "또르르, 또르르"}, {"type": "narration", "speaker": "내레이션", "text": "그 소리가 그녀의 리듬과 겹쳤다."}, {"type": "narration", "speaker": "내레이션", "text": "그녀는 느리게 시작해 아주 조금씩만 속도를 올렸다."}], "flags": ["intimate"], "thumb": "thumbs/1-070.svg"}, {"id": "1-071", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 1400, "shot": "CU · 측면 · 혜숙(중), 도겸(하단)", "screen": "세로 3분할. ① 숨이 거칠어진 그의 입을 그녀의 손바닥이 막는다, 빨간 손톱, 그녀의 입꼬리(말풍선 우상, 속삭임 톤). ② 그녀의 허벅지가 그의 옆구리를 조이는 INS(시트 위 허벅지 바깥선과 스타킹 끝). ③ 빛줄기 속 측면 실루엣, 등이 활처럼 휘었다가 그의 위로 천천히 접히고, 그녀가 그의 입을 막은 자기 손등에 대고 긴 숨을 뱉는다. 내레이션 박스 ③ 하단.", "summary": "세로 3분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "옆집이 귀가 밝아."}, {"type": "narration", "speaker": "내레이션", "text": "그 말을 한 사람이 먼저 무너졌다."}], "flags": ["intimate"], "thumb": "thumbs/1-071.svg"}, {"id": "1-072", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#10 진주 (503동 2402호 안방, 9월 2일 수 오후 2:10)", "width": 800, "height": 760, "shot": "INS · 로우 · 인물 없음", "screen": "대리석 바닥 높이. 마지막 진주알 하나가 가는 금속 침대 다리에 부딪혀 멈춘다. 위쪽 여백 끝에 침대 위 벽시계의 초침만 작게. 효과음은 붓 효과음(East Sea Dokdo) 둘, 톡은 진주 옆에, 초침은 위쪽에 아주 작게.", "summary": "대리석 바닥 높이.", "lines": [{"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "톡"}, {"type": "sfx", "speaker": "SFX(아주 작게)", "text": "째깍, 째깍"}], "flags": ["intimate"], "thumb": "thumbs/1-072.svg"}, {"id": "1-073", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#11 1억 5천 (503동 2402호 안방, 9월 2일 수 오후 4:00)", "width": 800, "height": 1200, "shot": "MS · 하이 · 혜숙(중), 도겸(하단)", "screen": "위에서 비스듬히 본 침대. 노랗게 기운 빛줄기가 벽에서 내려와 혜숙의 맨어깨와 등 위쪽에 걸쳐 있고, 그녀는 시트를 등 가운데까지 덮은 채 그의 가슴 위에 엎드려 턱을 괴고 있다(가슴은 그의 몸에 닿아 보이지 않는다). 침대 아래 대리석에 흩어진 진주알 몇 개가 빛을 받는다. 시각 자막 '오후 4:00' 좌상 식자, 내레이션 박스 좌상, 말풍선 우상(나른한 낮은 톤).", "summary": "위에서 비스듬히 본 침대.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "빛줄기는 어느새 벽에서 내려와 그녀의 어깨에 걸쳐 있었다."}, {"type": "dialogue", "speaker": "혜숙", "text": "그 분양권 얘기, 다시 해 봐."}], "flags": ["intimate"], "thumb": "thumbs/1-073.svg"}, {"id": "1-074", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#11 1억 5천 (503동 2402호 안방, 9월 2일 수 오후 4:00)", "width": 800, "height": 1000, "shot": "CU · 하이 · 도겸(중)", "screen": "베개에 머리를 둔 도겸이 가슴 위의 그녀를 내려다보며 눈을 오래 맞추고 낮게 말한다. 문장 끝에서 왼손이 귓불로 올라간다(시계와 흉터 같은 프레임). 긴 말풍선 하나를 화면 우상에서 하단으로 꺾어 흐르게 배치.", "summary": "베개에 머리를 둔 도겸이 가슴 위의 그녀를 내려다보며 눈을 오래 맞추고 낮게 말한다.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "아버지 회사가 다음 달에 분양하는 단지야. 로열층 물량을 내가 빼 줄 수 있어. 분양권 전매, 석 달만. 프리미엄 붙으면 바로 넘겨."}], "flags": ["intimate"], "thumb": "thumbs/1-074.svg"}, {"id": "1-075", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#11 1억 5천 (503동 2402호 안방, 9월 2일 수 오후 4:00)", "width": 800, "height": 520, "shot": "BS · 아이레벨 · 혜숙(좌), 도겸(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 혜숙이 빨간 손톱으로 그의 가슴을 톡톡 두드리며 숫자를 묻는다, 눈은 그의 얼굴을 위에서 아래로 읽는다. 우: 도겸, 짧고 가볍게, 왼쪽 입꼬리. 말풍선 좌상, 우하.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "얼마라고 했지?"}, {"type": "dialogue", "speaker": "도겸", "text": "1억 5천."}], "flags": ["intimate"], "thumb": "thumbs/1-075.svg"}, {"id": "1-076", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#11 1억 5천 (503동 2402호 안방, 9월 2일 수 오후 4:00)", "width": 800, "height": 520, "shot": "BS · 아이레벨 · 혜숙(좌), 도겸(우)", "screen": "가로 2분할, 1-075와 같은 구도. 좌: 혜숙의 목소리가 한 톤 낮아지고 아이라인 아래 눈이 웃지 않는다. 우: 도겸이 바로 받는다. 말풍선 좌상, 우하.", "summary": "가로 2분할, 1-075와 같은 구도.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "남편은 몰라야 돼."}, {"type": "dialogue", "speaker": "도겸", "text": "당연하지."}], "flags": ["intimate"], "thumb": "thumbs/1-076.svg"}, {"id": "1-077", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#11 1억 5천 (503동 2402호 안방, 9월 2일 수 오후 4:00)", "width": 800, "height": 880, "shot": "CU · 로우 · 혜숙(중)", "screen": "그의 가슴 위에서 턱을 든 혜숙을 아래에서 올려다본다. 손으로 입을 가리고 웃다가 손을 내리며 단정하게 말한다. 노란 빛이 맨어깨와 흘러내린 머리 몇 가닥에 걸리고, 목은 비어 있다. 가슴 앞은 그의 어깨와 시트가 가린다. 말풍선 중상.", "summary": "그의 가슴 위에서 턱을 든 혜숙을 아래에서 올려다본다.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "이 단지에서 내가 모르는 일은 없어. 내일 보낼게."}], "flags": ["intimate"], "thumb": "thumbs/1-077.svg"}, {"id": "1-078", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#12 마흔네 번째 (503동 2402호 안방 바닥, 9월 2일 수 오후 4:25)", "width": 800, "height": 600, "shot": "INS · 아이레벨 · 혜숙(우)", "screen": "가로 2분할. 좌: 침대 위 벽 작은 벽시계 ECU, 바늘이 4시 25분. 우: 혜숙이 벌떡 일어나 바닥의 블라우스를 낚아채 어깨에 걸친다, 풀린 시뇽이 흔들린다. 말풍선 우상, 빠른 톤.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "얘, 다섯 시에 부녀회 회의야. 얼른."}], "flags": [], "thumb": "thumbs/1-078.svg"}, {"id": "1-079", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#12 마흔네 번째 (503동 2402호 안방 바닥, 9월 2일 수 오후 4:25)", "width": 800, "height": 1400, "shot": "LS · 부감 · 혜숙(좌), 도겸(우)", "screen": "[트랙2] C2 위 부감. 대리석 바닥을 크림색 플랫 면으로 단순화하고 진주알은 흰 점으로 흩뿌린다. 반쯤 걸친 옷차림의 두 사람이 무릎을 꿇고 바닥을 기며 진주를 줍는다. 혜숙은 손바닥에 모으며 입술을 움직여 세고, 도겸은 침대 다리 쪽으로 엉덩이를 든 채 팔을 뻗는다. 등신과 의상 색은 본편과 같고 얼굴만 과장(땀방울, 동그란 눈). 내레이션 박스는 상단에 본편 서체, 혜숙의 속삭임 말풍선은 작게 좌하.", "summary": "[트랙2] C2 위 부감.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그다음 오 분 동안 시행사 회장의 외아들과 503동 부녀회장은 반쯤 걸친 옷차림으로 무릎을 꿇고 대리석 바닥을 기며 진주알을 주웠다."}, {"type": "whisper", "speaker": "혜숙(속삭임)", "text": "마흔하나, 마흔둘, 마흔셋."}], "flags": ["intimate"], "thumb": "thumbs/1-079.svg"}, {"id": "1-080", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#12 마흔네 번째 (503동 2402호 안방 바닥, 9월 2일 수 오후 4:25)", "width": 800, "height": 640, "shot": "MS · 아이레벨 · 혜숙(좌), 도겸(우)", "screen": "가로 2분할. 좌: 오므린 손바닥 가득한 진주를 내려다보며 미간을 좁힌 혜숙(빨간 손톱). 우: 대리석에 뺨을 대고 침대 밑을 들여다보는 도겸, 접어 올린 소매의 팔이 바닥을 짚는다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "하나 모자라."}, {"type": "dialogue", "speaker": "도겸", "text": "침대 밑에 들어갔겠지."}], "flags": [], "thumb": "thumbs/1-080.svg"}, {"id": "1-081", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#12 마흔네 번째 (503동 2402호 안방 바닥, 9월 2일 수 오후 4:25)", "width": 800, "height": 1200, "shot": "INS · 하이 · 혜숙(상단), 도겸(하단)", "screen": "위아래 2분할. 위: 진주를 쥔 손을 털고 일어서는 혜숙, 시계를 다시 흘끗 본다(말풍선 우상). 아래: 바닥을 짚은 도겸의 왼팔 ECU, 접어 올린 흰 셔츠 소맷단 주름 사이에 하얀 진주 한 알이 박혀 있다. 금장 콤비 시계와 흉터가 같은 프레임, 낮은 빛줄기 끝이 진주에 작은 하이라이트를 찍는다. 효과음 없이, 내레이션 박스 아래 칸 하단.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "됐어, 하나쯤."}, {"type": "narration", "speaker": "내레이션", "text": "마흔네 번째 진주는 그가 접어 올린 셔츠 소맷단 안에 들어가 있었다. 아무도 몰랐다."}], "flags": [], "thumb": "thumbs/1-081.svg"}, {"id": "1-082", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#13 아버님께 (503동 2402호 현관, 9월 2일 수 오후 4:38)", "width": 800, "height": 1040, "shot": "MS · 아이레벨 · 도겸(좌), 혜숙(우)", "screen": "현관. 신발장에서 꺼낸 로퍼에 발을 넣는 도겸의 품에 혜숙이 보자기에 싼 네모난 상자를 안긴다. 뒤 콘솔 위 액자는 아직 엎어진 채, 백합 옆. 혜숙은 다른 손으로 풀린 머리를 귀 뒤로 넘기고 있다. 말풍선 우상, 밝고 빠른 톤.", "summary": "현관.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "추석 선물. 한우야. 아버님 갖다 드려."}], "flags": [], "thumb": "thumbs/1-082.svg"}, {"id": "1-083", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#13 아버님께 (503동 2402호 현관, 9월 2일 수 오후 4:38)", "width": 800, "height": 480, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "상자를 받아 든 도겸의 얼굴. 고개를 조금 숙이며 왼쪽 입꼬리만 올린다, 눈은 상자를 보지 않는다.", "summary": "상자를 받아 든 도겸의 얼굴.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/1-083.svg"}, {"id": "1-084", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#13 아버님께 (503동 2402호 현관, 9월 2일 수 오후 4:38)", "width": 800, "height": 640, "shot": "INS · 하이 · 도겸(중)", "screen": "보자기 매듭을 쥔 왼손 ECU, 금장 콤비 시계와 초승달 흉터가 매듭 바로 위에 한 프레임으로 들어온다. 현관 다운라이트가 매듭 위에 작게 맺힌다. 내레이션 박스 위아래 둘, 둘째 박스는 간격을 크게 둔다.", "summary": "보자기 매듭을 쥔 왼손 ECU, 금장 콤비 시계와 초승달 흉터가 매듭 바로 위에 한 프레임으로 들어온다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그의 아버지는 해외 현장에 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "지도에 없는 해외 현장에."}], "flags": [], "thumb": "thumbs/1-084.svg"}, {"id": "1-085", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#13 아버님께 (503동 2402호 현관, 9월 2일 수 오후 4:38)", "width": 800, "height": 720, "shot": "MS · 아이레벨 · 도겸(중)", "screen": "24층 홀 쪽에서 본 2402호 현관문. 문이 닫히며 틈으로 새던 노란 빛이 가늘어져 사라지고, 문 앞에 보자기 상자를 오른쪽 옆구리에 낀 도겸이 혼자 남는다. 회색 석재 타일 벽과 대리석 바닥, 아직 꺼져 있는 홀 센서등. 효과음은 붓 효과음(East Sea Dokdo) 문틀 옆.", "summary": "24층 홀 쪽에서 본 2402호 현관문.", "lines": [{"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "철컥"}], "flags": [], "thumb": "thumbs/1-085.svg"}, {"id": "1-086", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 1040, "shot": "MS · 아이레벨 · 도겸(중)", "screen": "천장 센서등이 켜지며 홀이 밝아진다. 나란한 엘리베이터 두 대, 문 위 붉은 숫자만 깜박인다. 도겸이 보자기 상자를 오른쪽 옆구리에 끼고 왼손으로 아래쪽 화살표 버튼을 누른다. 그의 목덜미에서 금빛 향 입자와 백합 꽃가루가 라벤더 빛 연무 사이로 섞여 오른다. 효과음은 붓 효과음(East Sea Dokdo)으로 천장 등 옆, 시각 자막 '오후 4:40' 우상 식자, 내레이션 박스 좌상·우하.", "summary": "천장 센서등이 켜지며 홀이 밝아진다.", "lines": [{"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "지잉"}, {"type": "narration", "speaker": "내레이션", "text": "라벤더 방향제 냄새 사이로 그의 목덜미에 묻은 혜숙의 향수와 백합 꽃가루 냄새가 섞여 올라왔다."}, {"type": "narration", "speaker": "내레이션", "text": "지하 2층, 그리고 BMW. 다음 색은 버건디였다."}], "flags": [], "thumb": "thumbs/1-086.svg"}, {"id": "1-087", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 440, "shot": "INS · 아이레벨 · 인물 없음", "screen": "가로 3분할. 엘리베이터 문 위 붉은 층수 표시가 1, 2, 3으로 올라간다(숫자는 식자, 같은 구도 세 칸). 내레이션 박스 하단에 가로로 길게.", "summary": "가로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "누군가 아래에서 엘리베이터를 타고 올라오는 중이었다. 24층에서 서는 사람은 거의 없었다."}], "flags": [], "thumb": "thumbs/1-087.svg"}, {"id": "1-088", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 560, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "가로 3분할. 좌: 붉은 숫자 15, 16, 17(세 단계 잔상). 중: 숫자를 올려다보는 도겸의 눈, 관자놀이에 땀 한 줄. 우: 셔츠 단추 하나를 채웠다가 다시 푸는 손가락(두 단계 잔상, 시계와 흉터). 내레이션 박스 우칸 하단.", "summary": "가로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "두 개를 푸는 것이 그의 얼굴이었다."}], "flags": ["intimate"], "thumb": "thumbs/1-088.svg"}, {"id": "1-089", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 400, "shot": "INS · 아이레벨 · 인물 없음", "screen": "가로 3분할. 붉은 숫자 21, 22, 23. 마지막 칸에서 숫자가 멈추고 문 위 도착등이 켜진다. 효과음은 붓 효과음(East Sea Dokdo)으로 마지막 칸에만.", "summary": "가로 3분할.", "lines": [{"type": "sfx", "speaker": "SFX(중간, 흰색)", "text": "띵"}], "flags": [], "thumb": "thumbs/1-089.svg"}, {"id": "1-090", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 1200, "shot": "FS · POV(도겸) · 고미숙(좌), 남정애(중), 백지연(우)", "screen": "엘리베이터 문이 양옆으로 열리며 안의 밝은 흰 빛이 홀 대리석으로 쏟아진다. 그 빛 속에 50대 여자 셋이 나란히 서 있다. 맨 앞 왼쪽 고미숙은 '부녀회 회의 자료'(표지 식자) 파일 뭉치를 가슴에 안았고, 가운데 남정애는 떡집 상자를 두 손으로 들었고(상자 틈에서 참기름 냄새 물결선), 오른쪽 백지연은 단지 소식지 사진을 찍으려던 듯 휴대폰 카메라를 켜 들고 있다. 세 얼굴이 같은 순간 굳는다. 효과음·말풍선 없이.", "summary": "엘리베이터 문이 양옆으로 열리며 안의 밝은 흰 빛이 홀 대리석으로 쏟아진다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/1-090.svg"}, {"id": "1-091", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 640, "shot": "INS · 아이레벨 · 도겸(중)", "screen": "가로 4분할, 세 사람의 시선이 옮겨 가는 순서대로. ① 풀린 셔츠 단추 두 개와 쇄골. ② 땀에 젖은 관자놀이와 이마의 머리 한 가닥. ③ 오른쪽 옆구리에 낀 한우 보자기 상자. ④ 2402호 현관문(호수 판 식자). 칸 사이를 얇은 점선 화살표로 잇는다. 효과음 없이.", "summary": "가로 4분할, 세 사람의 시선이 옮겨 가는 순서대로.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/1-091.svg"}, {"id": "1-092", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 480, "shot": "CU · 아이레벨 · 고미숙(중)", "screen": "[트랙2] 크림색 플랫 배경에 집중선. 파일 뭉치를 안은 채 한 손으로 입을 가리는 고미숙, 눈이 동그래지고 돋보기 안경줄이 흔들린다. 화면 양 끝에 남정애와 백지연의 반쪽 얼굴도 같은 표정으로 굳어 있다. 얼굴과 손만 과장하고 의상 색은 본편과 같다. 말풍선 중상.", "summary": "[트랙2] 크림색 플랫 배경에 집중선.", "lines": [{"type": "dialogue", "speaker": "고미숙", "text": "어머."}], "flags": [], "thumb": "thumbs/1-092.svg"}, {"id": "1-093", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 남정애(좌), 백지연(우)", "screen": "가로 2분할. 좌: 떡 상자를 고쳐 들며 고개를 갸웃하는 남정애, 한쪽 눈썹이 올라간다(말풍선 좌상). 우: 백지연의 휴대폰 렌즈 ECU, 검은 렌즈 유리에 홀 조명과 흰 셔츠의 작은 실루엣이 비친다.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "남정애", "text": "회장님 댁에서 나오시는 거예요?"}], "flags": [], "thumb": "thumbs/1-093.svg"}, {"id": "1-094", "chapter": "1화. 너한테만 하는 얘긴데", "scene": "S#14 어머. (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:40)", "width": 800, "height": 1600, "shot": "LS · 아이레벨 · 도겸(전경·좌), 고미숙(후경·좌), 남정애(후경·중), 백지연(후경·우)", "screen": "회차 끝 훅, 2화 2-001과 같은 구도. C4 2402호 문 앞에서 엘리베이터 쪽을 본다. 전경 왼쪽에 도겸의 등과 오른쪽 옆구리에 낀 보자기 상자가 크게 걸리고, 비어 있는 왼손이 천천히 귓불로 올라가는 중이다(접어 올린 소매 아래 팔꿈치가 들리고 손끝이 귓불에 닿기 직전, 소맷단 속 진주는 보이지 않는다, 시계가 홀 조명에 반짝). 열린 엘리베이터 문 안에서 쏟아지는 흰 빛 속에 세 여자가 정지해 서 있다. 좌 고미숙은 파일 뭉치를 안았고, 중 남정애는 떡집 상자, 우 백지연은 휴대폰 렌즈를 그의 가슴께로 겨눈다. 빛이 대리석 바닥에 길게 쏟아져 도겸의 그림자가 화면 앞쪽으로 늘어지고, 문 위 붉은 숫자는 '24'(식자). 효과음과 말풍선 없이 정지 화면처럼, 아래 여백을 크게 둔다.", "summary": "회차 끝 훅, 2화 2-001과 같은 구도.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/1-094.svg"}, {"id": "2-001", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#1 열린 채 멈춘 문 (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:41)", "width": 800, "height": 1240, "shot": "LS · 아이레벨 · 도겸(전경·좌), 고미숙(후경·좌), 남정애(후경·중), 백지연(후경·우)", "screen": "1화 마지막 컷을 2402호 문 앞(C4)에서 다시 잡는다. 도겸의 등과 옆구리에 낀 보자기 상자가 전경에 크게 걸리고, 열린 엘리베이터 문 안에서 쏟아지는 흰 빛 속에 50대 여자 셋이 정지해 서 있다. 천장 센서등이 한 번 더 밝아지며 흰 섬광 링이 생긴다. 붓 효과음(East Sea Dokdo)을 천장 등 옆에, 내레이션 박스는 좌상.", "summary": "1화 마지막 컷을 2402호 문 앞(C4)에서 다시 잡는다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "엘리베이터 문은 열린 채로 멈춰 있었다. 아무도 닫힘 버튼을 누르지 않았다."}, {"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "지잉"}], "flags": [], "thumb": "thumbs/2-001.svg"}, {"id": "2-002", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#1 열린 채 멈춘 문 (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:41)", "width": 800, "height": 760, "shot": "MS · 아이레벨 · 고미숙(좌), 남정애(중), 백지연(우)", "screen": "가로 3분할. 좌: '부녀회 회의 자료' 파일 뭉치를 가슴에 안은 고미숙(돋보기 안경줄), 중: 떡집 상자 뚜껑 틈으로 김이 가늘게 새는 남정애, 우: 휴대폰 렌즈를 도겸의 가슴께에 겨눈 백지연(렌즈 유리에 풀린 단추 두 개가 비친다). 칸마다 아래쪽에 이름·직책 캡션 자리(식자). 내레이션 박스 두 개를 1칸과 3칸 위에 나눠 얹는다.", "summary": "가로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "세 사람의 얼굴은 단지 소식지에서 본 적이 있었다. 파일을 안은 사람은 부녀회 총무 고미숙, 떡 상자는 감사 남정애, 휴대폰은 홍보 담당 백지연이었다."}, {"type": "narration", "speaker": "내레이션", "text": "세 사람 모두 그를 몰랐다. 3,012세대는 그런 숫자였다."}], "flags": ["intimate"], "thumb": "thumbs/2-002.svg"}, {"id": "2-003", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#1 열린 채 멈춘 문 (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:41)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 도겸(좌), 남정애(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 도겸이 이마의 머리 한 가닥을 넘기고 왼손으로 귓불을 만지며 허리를 숙인다(눈은 공손하게 내리깔고 왼쪽 입꼬리만 살짝). 우: 남정애가 떡 상자를 고쳐 들며 한쪽 눈썹을 올리고 고개를 기울인다. 말풍선 좌상, 우상.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "어머니 심부름 왔습니다."}, {"type": "dialogue", "speaker": "남정애", "text": "어머님이 누구신데요?"}], "flags": [], "thumb": "thumbs/2-003.svg"}, {"id": "2-004", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#1 열린 채 멈춘 문 (503동 24층 엘리베이터 홀, 9월 2일 수 오후 4:41)", "width": 800, "height": 440, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "[트랙2] 입이 반쯤 열린 채 멈춘 얼굴. 흰 단색 배경에 집중선, 눈동자가 점으로 줄고 관자놀이에 큰 땀방울 두 개, mb": "thumbs/2-011.svg"}, {"id": "2-012", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#2 거울 속의 남자 (503동 엘리베이터 안, 9월 2일 수 오후 4:42)", "width": 800, "height": 680, "shot": "CU · 오버숄더(도겸 너머) · 도겸(중)", "screen": "거울 속 얼굴. 왼쪽 입꼬리가 올라갔다가 중간에서 멈추고 눈썹 사이가 아주 조금 좁아진다. 귓불에서 손이 천천히 내려온다. 내레이션 박스 두 개를 위아래로.", "summary": "거울 속 얼굴.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "혜숙은 그의 어머니가 그가 고등학생 때 돌아가신 줄 알았다. 그래서 망설임 없이 없는 권사님을 하나 만들어 주었다."}, {"type": "narration", "speaker": "내레이션", "text": "거짓말을 할 줄 아는 여자였다. 그는 그 점이 마음에 들었고, 동시에 조금 불안했다."}], "flags": [], "thumb": "thumbs/2-012.svg"}, {"id": "2-013", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#2 거울 속의 남자 (503동 엘리베이터 안, 9월 2일 수 오후 4:42)", "width": 800, "height": 760, "shot": "INS · 아이레벨 · 순옥(우·실루엣)", "screen": "가로 2분할. 좌: 층수 표시가 24에서 23, 22로 내려간다(숫자는 식자, 붉은 LED). 우: 같은 시각 지하 1층, 하얀 김 속에서 분홍 세신복 소매와 이태리타월을 감은 굵은 손만 흐릿하게 움직인다(얼굴 없음, 손님 몸 없음). 내레이션 박스는 두 칸에 하나씩.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "어머니 심부름 왔습니다. 그 문장에서 사실은 '어머니'라는 단어 하나뿐이었다."}, {"type": "narration", "speaker": "내레이션", "text": "그 어머니는 지금 이 단지의 지하 1층에서 남의 등을 밀고 있었다."}], "flags": [], "thumb": "thumbs/2-013.svg"}, {"id": "2-014", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#2 거울 속의 남자 (503동 엘리베이터 안, 9월 2일 수 오후 4:42)", "width": 800, "height": 600, "shot": "INS · POV(도겸) · 인물 없음", "screen": "무광 그레이 세컨폰 캘린더 화면. 9월 4일 금요일 01:00 칸이 버건디 #7A1E2E 블록으로 채워져 있다(글자는 식자, 가상 UI). 화면 아래 가장자리에 도겸의 왼손 엄지와 흉터가 걸린다.", "summary": "무광 그레이 세컨폰 캘린더 화면.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "엘리베이터가 내려가는 동안 그는 세컨폰을 열었다. 금요일 새벽 한 시, 버건디."}], "flags": [], "thumb": "thumbs/2-014.svg"}, {"id": "2-015", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#3 간판 꺼진 와인바 (퍼스트 애비뉴 1층 와인바 '미란', 9월 4일 금 새벽 1:20)", "width": 800, "height": 1400, "shot": "LS · 아이레벨 · 미란(후경·우)", "screen": "정문 안쪽(C1)에서 본 빈 바. 블라인드는 내려가 있고, 오른쪽 카운터 위 붉은 펜던트 세 개만 좁은 원뿔을 떨어뜨리며, 왼쪽 벨벳 소파와 셀러의 차가운 흰빛이 깊어진다. 원뿔 안 카운터 끝에서 미란이 잔을 닦는 작은 실루엣. 붓
