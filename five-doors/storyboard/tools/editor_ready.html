에서.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/2-033.svg"}, {"id": "2-034", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#5 코스 (와인바 '미란' 카운터 위, 9월 4일 금 새벽 1:45)", "width": 800, "height": 760, "shot": "INS · 앙각 · 미란(하단)", "screen": "위아래 2분할. 위: 머리 위 랙에 거꾸로 걸린 잔들이 떨리며 울린다. 처음엔 띄엄띄엄, 같은 칸 안에서 오른쪽으로 갈수록 촘촘해진다. 아래: 미란의 손바닥이 카운터 원목을 치며 박자를 센다(와인색 손톱). 효과음은 붓 효과음(East Sea Dokdo), 쨍은 위칸, 탁은 아래칸.", "summary": "위아래 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(작게→중간, 흰색)", "text": "쨍… 쨍… 쨍, 쨍, 쨍"}, {"type": "sfx", "speaker": "SFX", "text": "탁, 탁"}, {"type": "dialogue", "speaker": "미란", "text": "자기, 박자 놓쳤어."}], "flags": ["intimate"], "thumb": "thumbs/2-034.svg"}, {"id": "2-035", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#5 코스 (와인바 '미란' 카운터 위, 9월 4일 금 새벽 1:45)", "width": 800, "height": 960, "shot": "ECU · 측면 · 미란(좌), 도겸(우)", "screen": "가로 3분할. 1: 미란의 관자놀이에 맺힌 땀방울. 2: 그의 흰 셔츠 깃에 번지는 붉은 립스틱. 3: 미란이 고개를 한껏 젖히는 측면 실루엣(목선과 턱만 붉게). 내레이션 박스는 3칸을 가로지른다.", "summary": "가로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그는 그녀가 친 박자로 돌아갔다."}, {"type": "narration", "speaker": "내레이션", "text": "미란의 웃음이 숨으로 바뀌고, 숨이 길고 낮은 소리로 바뀌었다."}], "flags": ["intimate"], "thumb": "thumbs/2-035.svg"}, {"id": "2-036", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#5 코스 (와인바 '미란' 카운터 위, 9월 4일 금 새벽 1:45)", "width": 800, "height": 1600, "shot": "INS · 로우 · 인물 없음", "screen": "C3 상판 끝 로우 앵글. 위: 랙 끝의 잔 하나가 미끄러져 허공에 뜬다(효과음 없음, 위아래로 긴 여백). 아래: 헥사곤 타일 위에서 산산이 깨진 잔과 떨어진 앞치마가 한 화면에 놓인다. 깨지는 소리만 붓 효과음(East Sea Dokdo) 대형.", "summary": "C3 상판 끝 로우 앵글.", "lines": [{"type": "sfx", "speaker": "SFX(대형, 적색)", "text": "쨍그랑"}], "flags": ["intimate"], "thumb": "thumbs/2-036.svg"}, {"id": "2-037", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#5 코스 (와인바 '미란' 카운터 위, 9월 4일 금 새벽 1:45)", "width": 800, "height": 1000, "shot": "MS · 하이 · 미란(중)", "screen": "정적. 미란이 카운터에 이마를 대고 한참 숨을 고른다. 흐트러진 머리가 상판에 퍼지고, 땀이 맺힌 맨등과 어깨만 붉은 원뿔 안에 있다(상판 아래는 어둠). 카운터 아래 식기세척기 초록 표시등이 깜박이고, 효과음 두 개를 작게 두고, 말풍선은 우하에 낮은 목소리 톤으로.", "summary": "정적.", "lines": [{"type": "sfx", "speaker": "SFX(작게, 금색)", "text": "뿌우우— (끊김)"}, {"type": "sfx", "speaker": "SFX(작게, 초록)", "text": "삐, 삐, 삐"}, {"type": "dialogue", "speaker": "미란", "text": "잔 하나, 4만 2천 원. 자기 앞으로 달아 놓는다."}], "flags": ["intimate"], "thumb": "thumbs/2-037.svg"}, {"id": "2-038", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#6 숨김 앨범 (와인바 '미란' 벨벳 소파, 9월 4일 금 새벽 2:20)", "width": 800, "height": 1080, "shot": "MS · 아이레벨 · 도겸(후경·중), 미란(전경·우)", "screen": "소파 옆(C4) 앉은 눈높이. 버건디 벨벳 소파에 다리를 넓게 벌리고 등을 기댄 채 잠든 도겸, 팔걸이에 늘어진 왼손목의 시계. 전경에서는 블라우스를 끌어올린 미란이 쪼그려 깨진 잔을 쓰레받기에 쓸어 담는다. 내레이션 박스 좌상.", "summary": "소파 옆(C4) 앉은 눈높이.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "도겸은 벨벳 소파에 등을 기대고 앉았다가 이 분 만에 잠들었다. 대리운전 네 콜 뒤의 잠이었다."}], "flags": [], "thumb": "thumbs/2-038.svg"}, {"id": "2-039", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#6 숨김 앨범 (와인바 '미란' 벨벳 소파, 9월 4일 금 새벽 2:20)", "width": 800, "height": 600, "shot": "MS · 아이레벨 · 미란(좌), 도겸(우)", "screen": "미란이 그의 잠든 얼굴 앞에 쪼그려 앉아 휴대폰을 든다. 반쯤 감긴 눈으로 그의 얼굴을 오래 본다. 이마에 흘러내린 머리 한 가닥, 셔츠 단추 두 개, 짙은 눈썹.", "summary": "미란이 그의 잠든 얼굴 앞에 쪼그려 앉아 휴대폰을 든다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/2-039.svg"}, {"id": "2-040", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#6 숨김 앨범 (와인바 '미란' 벨벳 소파, 9월 4일 금 새벽 2:20)", "width": 800, "height": 640, "shot": "INS · POV(미란) · 도겸(중)", "screen": "가로 2분할. 좌: 휴대폰 설정 화면에서 플래시 끔, 셔터음 끔 토글을 엄지가 차례로 민다(가상 UI, 글자는 식자). 우: 화면 속 잠든 얼굴. 셔터 효과음은 회색 작은 글씨로만 표시해 '소리가 없음'을 보여 준다.", "summary": "가로 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(아주 작게, 회색)", "text": "찰칵"}], "flags": [], "thumb": "thumbs/2-040.svg"}, {"id": "2-041", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#6 숨김 앨범 (와인바 '미란' 벨벳 소파, 9월 4일 금 새벽 2:20)", "width": 800, "height": 880, "shot": "CU · 아이레벨 · 미란(중)", "screen": "휴대폰 화면 빛이 미란의 얼굴을 아래에서 하얗게 비춘다. 사진이 '숨김 앨범' 폴더로 들어가는 화면이 전경에 흐리게 걸리고, 붉은 립의 입꼬리가 아주 조금 올라간다. 내레이션 박스 하단.", "summary": "휴대폰 화면 빛이 미란의 얼굴을 아래에서 하얗게 비춘다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "남자 거짓말은 와인이랑 같았다. 열어 봐야 알았다. 그녀는 그 사진을 숨김 앨범에 넣었다."}], "flags": [], "thumb": "thumbs/2-041.svg"}, {"id": "2-042", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#7 22:04 (더퍼스트 클럽 지하 1층 필라테스룸 데스크, 9월 8일 화 밤 10:10)", "width": 800, "height": 1360, "shot": "LS · 아이레벨 · 세라(후경·중)", "screen": "남동 모서리(C1)에서 대각선으로 본 스튜디오. 천장은 꺼지고 거울 벽 아래 LED가 바닥을 하얗게 핥으며, 리포머 여섯 대가 나란히 누워 있다. 세라가 리포머 레일에 소독 스프레이를 뿌리며 몸을 숙이자 포니테일이 어깨를 친다. 환기구 효과음은 붓 효과음(East Sea Dokdo) 작게, 내레이션 박스 좌상.", "summary": "남동 모서리(C1)에서 대각선으로 본 스튜디오.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "밤 열 시 십 분, 더퍼스트 클럽 지하 1층 필라테스룸의 천장 조명은 꺼져 있었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "쉬이—"}], "flags": ["intimate"], "thumb": "thumbs/2-042.svg"}, {"id": "2-043", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#7 22:04 (더퍼스트 클럽 지하 1층 필라테스룸 데스크, 9월 8일 화 밤 10:10)", "width": 800, "height": 720, "shot": "MS · 측면 · 세라(중)", "screen": "레일을 닦는 세라의 측면. 피부처럼 붙은 레깅스가 허벅지와 골반 선을 그대로 따르고, 크롭 브라톱 아래 구릿빛 복근이 갈라져 있다. 입술이 박자에 맞춰 움직이고, 숫자 말풍선은 작게 네 개로 쪼개 리듬감을 준다.", "summary": "레일을 닦는 세라의 측면.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "하나, 둘, 셋, 넷."}], "flags": ["intimate"], "thumb": "thumbs/2-043.svg"}, {"id": "2-044", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#7 22:04 (더퍼스트 클럽 지하 1층 필라테스룸 데스크, 9월 8일 화 밤 10:10)", "width": 800, "height": 640, "shot": "INS · POV(세라) · 인물 없음", "screen": "가로 2분할. 좌: 데스크 모니터 출입 기록 창 맨 아랫줄 '22:04 B2 연결통로 출입'(글자는 식자, 푸른빛). 우: 세라의 휴대폰 문자 화면, 22:04 '도착' 한 단어(손글씨체는 쓰지 않고 메신저 서체).", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "문자(도겸→세라)", "text": "도착"}], "flags": ["intimate"], "thumb": "thumbs/2-044.svg"}, {"id": "2-045", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#7 22:04 (더퍼스트 클럽 지하 1층 필라테스룸 데스크, 9월 8일 화 밤 10:10)", "width": 800, "height": 840, "shot": "CU · 아이레벨 · 세라(중)", "screen": "모니터의 푸른빛을 받은 세라의 얼굴. 짙은 일자 눈썹 사이가 한 번 좁아졌다가 풀리고, 마우스를 쥔 손이 모니터 전원을 끈다. 화면이 꺼지며 얼굴의 푸른빛이 사라진다. 내레이션 박스 두 개, 두 번째는 생각 톤.", "summary": "모니터의 푸른빛을 받은 세라의 얼굴.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "B2 연결통로 문은 입주민 카드가 있어야 열렸다. 그는 시행사 숙소에서 지낸다고 했다."}, {"type": "narration", "speaker": "내레이션", "text": "시행사 아들이니까 마스터키쯤 있겠지."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "딸깍"}], "flags": ["intimate"], "thumb": "thumbs/2-045.svg"}, {"id": "2-046", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#8 레슨 (필라테스룸, 9월 8일 화 밤 10:15)", "width": 800, "height": 1080, "shot": "MS · 아이레벨 · 도겸(후경·좌), 세라(전경·우)", "screen": "유리문이 열리고 민트 향이 먼저 들어온다(옅은 민트색 공기 결 효과선 한 줄). 전경 옷걸이에 로고 없는 퀼팅 체인 백과 민트 집업이 걸려 있고, 문간의 도겸이 왼쪽 입꼬리만 올려 웃는다. 데스크에 기댄 세라가 팔짱을 끼고 말한다, 말풍선 우상에 두 개 연달아.", "summary": "유리문이 열리고 민트 향이 먼저 들어온다(옅은 민트색 공기 결 효과선 한 줄).", "lines": [{"type": "dialogue", "speaker": "세라", "text": "가방 잘 들고 다녀요. 회원님들이 다 물어봐요."}, {"type": "dialogue", "speaker": "세라", "text": "늦었어요. 호흡, 호흡. 숨 차 보여요."}], "flags": ["intimate"], "thumb": "thumbs/2-046.svg"}, {"id": "2-047", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#8 레슨 (필라테스룸, 9월 8일 화 밤 10:15)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 도겸(좌), 세라(우)", "screen": "[트랙2] 가로 2분할. 좌: 도겸이 머리 가닥을 넘기며 귓불을 만진다(손에 작은 반짝이 효과선). 우: 세라가 그의 두 어깨를 잡아 뒤로 확 연다, 직선 효과선과 무표정, 도겸 등이 일자로 펴진다. 의상 색은 본편과 같다.", "summary": "[트랙2] 가로 2분할.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "현장 들렀다 왔어."}, {"type": "dialogue", "speaker": "세라", "text": "귀 왜 만져요? 자세 무너져요."}], "flags": ["intimate"], "thumb": "thumbs/2-047.svg"}, {"id": "2-048", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#8 레슨 (필라테스룸, 9월 8일 화 밤 10:15)", "width": 800, "height": 680, "shot": "BS · 오버숄더(세라 너머) · 도겸(중), 세라(우·전경)", "screen": "가로 2분할 숏·리버스숏. 좌: 어깨가 펴진 채 세라의 눈을 오래 보며 낮게 말하는 도겸. 우: 세라가 한쪽 눈썹도 움직이지 않고 짧게 받는다.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "너한테만 하는 얘긴데. 나 사실 아버지랑 사이 안 좋아. 회사 물려받기 싫어."}, {"type": "dialogue", "speaker": "세라", "text": "그럼 받지 마요. 짧게 말해요. 용건."}], "flags": ["intimate"], "thumb": "thumbs/2-048.svg"}, {"id": "2-049", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#8 레슨 (필라테스룸, 9월 8일 화 밤 10:15)", "width": 800, "height": 720, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "도겸이 눈을 내리깔고 목소리를 낮춘다. 짙은 눈썹이 조금 처지고, 흘러내린 머리 한 가닥이 눈가에 그늘을 만든다. 말풍선 중하.", "summary": "도겸이 눈을 내리깔고 목소리를 낮춘다.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "이번 주가 어머니 기일이야. 납골당 꽃이랑 제사 음식 맞춰야 하는데, 내 카드는 법인 카드라 개인 결제가 안 돼."}], "flags": ["intimate"], "thumb": "thumbs/2-049.svg"}, {"id": "2-050", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#8 레슨 (필라테스룸, 9월 8일 화 밤 10:15)", "width": 800, "height": 560, "shot": "CU · 아이레벨 · 세라(중)", "screen": "세라가 대답하지 않는다. 직선이던 시선이 그의 얼굴에서 잠깐 아래로 떨어지고, 입술이 한 번 다물린다. 내레이션 박스 상단.", "summary": "세라가 대답하지 않는다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "고등학생 때 어머니를 잃었다는 남자였다."}], "flags": ["intimate"], "thumb": "thumbs/2-050.svg"}, {"id": "2-051", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#8 레슨 (필라테스룸, 9월 8일 화 밤 10:15)", "width": 800, "height": 760, "shot": "MS · 아이레벨 · 세라(좌), 도겸(우)", "screen": "가로 2분할. 좌: 세라가 체인 백에서 지갑을 꺼내 카드 한 장을 그의 가슴팍으로 던지고, 도겸이 가슴 앞에서 받는다(카드 궤적 효과선). 우: 세라가 턱으로 리포머를 가리킨다. 말풍선 좌상, 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "카드 줘요? 써요. 대신 갚아요. 비밀번호는 문자로 보낼게요."}, {"type": "dialogue", "speaker": "세라", "text": "누워요. 레슨."}], "flags": ["intimate"], "thumb": "thumbs/2-051.svg"}, {"id": "2-052", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#9 여덟 개 더 (필라테스룸 리포머, 9월 8일 화 밤 10:25)", "width": 800, "height": 760, "shot": "INS · 로우 · 세라(좌), 도겸(우)", "screen": "가로 2분할. 좌: 바닥 높이(C2)에서 세라의 손이 캐리지 아래 빨간 스프링 두 개를 건다, 붓 효과음(East Sea Dokdo) 둘. 우: 캐리지에 누운 도겸의 갈비뼈 위에 넓은 손바닥이 놓인다(셔츠 위). 말풍선 우상.", "summary": "가로 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(중간, 흰색)", "text": "철컥, 철컥"}, {"type": "dialogue", "speaker": "세라", "text": "들이쉬고. 내쉬고. 갈비뼈 닫아요."}], "flags": ["intimate"], "thumb": "thumbs/2-052.svg"}, {"id": "2-053", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#9 여덟 개 더 (필라테스룸 리포머, 9월 8일 화 밤 10:25)", "width": 800, "height": 880, "shot": "MS · 측면 · 세라(중), 도겸(하단)", "screen": "세라가 한쪽 다리를 넘겨 그의 위에 올라앉는다. 체중을 받은 캐리지가 레일 위로 한 뼘 미끄러지고 빨간 스프링이 늘어난다. 전경에 풋바가 흐리게 걸린다.", "summary": "세라가 한쪽 다리를 넘겨 그의 위에 올라앉는다.", "lines": [{"type": "sfx", "speaker": "SFX(중간)", "text": "끼익"}], "flags": ["intimate"], "thumb": "thumbs/2-053.svg"}, {"id": "2-054", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#9 여덟 개 더 (필라테스룸 리포머, 9월 8일 화 밤 10:25)", "width": 800, "height": 1320, "shot": "MS · 측면 · 세라(중·실루엣), 도겸(하단)", "screen": "그가 브라톱 밑단을 잡아 끌어올리고, 땀에 젖은 밴드가 피부에 달라붙자 세라가 두 팔을 들어 돕는다. 포니테일이 천을 빠져나오며 등을 철썩 친다. 벗겨지는 천과 들어 올린 팔뚝이 가슴 앞선을 가리고, 바닥 간접광은 측면에서만 들어와 등·어깨·쇄골·복근 옆선에만 림라이트를 긋고 앞면은 그늘로 남긴다. 효과음은 등 쪽 붓 효과음(East Sea Dokdo).", "summary": "그가 브라톱 밑단을 잡아 끌어올리고, 땀에 젖은 밴드가 피부에 달라붙자 세라가 두 팔을 들어 돕는다.", "lines": [{"type": "sfx", "speaker": "SFX(중간)", "text": "철썩"}], "flags": ["intimate"], "thumb": "thumbs/2-054.svg"}, {"id": "2-055", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#9 여덟 개 더 (필라테스룸 리포머, 9월 8일 화 밤 10:25)", "width": 800, "height": 800, "shot": "INS · 측면 · 세라(중), 도겸(하단)", "screen": "가로 2분할. 좌: 레깅스 허리 밴드를 당기는 그의 손을 세라의 손이 탁 쳐 낸다. 우: 세라가 직접 레깅스를 골반 아래로 말아 내리고, 구릿빛 허리 양옆과 골반뼈 선에 붉은 밴드 자국이 남는다. 그의 엄지가 그 자국을 따라 허벅지 바깥 근육까지 간다(아래는 캐리지 받침이 자른다).", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "밑에서부터. 말아서."}], "flags": ["intimate"], "thumb": "thumbs/2-055.svg"}, {"id": "2-056", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#9 여덟 개 더 (필라테스룸 리포머, 9월 8일 화 밤 10:25)", "width": 800, "height": 1600, "shot": "LS · 아이레벨 · 세라(중), 도겸(중·하단)", "screen": "남동 모서리(C1)에서 본 와이드. 거울 벽 여섯 장이 두 사람을 여섯 번 비추고, 몸은 거울 사이 세로 이음선에 걸린다. 실물 세라는 카메라에 뒷모습(곧은 척추, 허리 위 두 개의 오목한 보조개, 흔들리는 포니테일)만 보이고 허리 아래는 캐리지 받침이 가린다. 거울 여섯 장의 상은 이음선과 풋바 그림자에 가슴 높이에서 잘려 얼굴·어깨·포니테일과 그의 손만 또렷하고, 가슴 아래는 바닥 간접광의 역광 그늘로 검게 뭉갠다. 세라는 거울 속 자기를 본다. 내레이션 박스 두 개를 거울 위쪽 빈 벽에.", "summary": "남동 모서리(C1)에서 본 와이드.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "거울 벽이 두 사람을 여섯 번 비췄다."}, {"type": "narration", "speaker": "내레이션", "text": "몸은 늘 그녀의 일이었다. 오늘 밤은 그녀의 것이었다."}], "flags": ["intimate"], "thumb": "thumbs/2-056.svg"}, {"id": "2-057", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#9 여덟 개 더 (필라테스룸 리포머, 9월 8일 화 밤 10:25)", "width": 800, "height": 920, "shot": "INS · 로우 · 세라(중)", "screen": "위아래 2분할. 위: 풋바에 걸린 세라의 맨발과 레일 위를 앞뒤로 미끄러지는 캐리지, 효과음은 메트로놈처럼 일정한 간격으로. 아래: 프레임 위 경계를 명치 아래에 둔다. 땀이 복근의 굴곡을 따라 흐르고, 그녀의 허리를 붙잡은 그의 손목을 세라가 잡아 골반 위로 옮긴다(시계와 흉터). 말풍선 위칸 우상(짧게 끊긴 숨), 아래칸 좌하.", "summary": "위아래 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(중간)", "text": "끼익, 탁. 끼익, 탁."}, {"type": "dialogue", "speaker": "세라", "text": "들이쉬고… 내쉬고."}, {"type": "dialogue", "speaker": "세라", "text": "여덟 개 더."}], "flags": ["intimate"], "thumb": "thumbs/2-057.svg"}, {"id": "2-058", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#9 여덟 개 더 (필라테스룸 리포머, 9월 8일 화 밤 10:25)", "width": 800, "height": 720, "shot": "CU · 측면 · 도겸(좌), 세라(우)", "screen": "가로 2분할. 좌: 도겸의 입술이 소리 없이 숫자를 센다. 우: 일곱 번째에서 세라의 숨이 멎는다(눈을 꼭 감고 입술이 벌어진 채 정지, 복근이 떨리고 허벅지가 그의 옆구리를 죈다). 우칸은 효과음 없이 여백.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그는 셌다. 그녀는 세지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/2-058.svg"}, {"id": "2-059", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#9 여덟 개 더 (필라테스룸 리포머, 9월 8일 화 밤 10:25)", "width": 800, "height": 1240, "shot": "CU · 측면 · 세라(중)", "screen": "위아래 2분할. 위: 마지막 세트를 끝낸 사람처럼 세라가 고개를 젖히고 길게 숨을 뱉는다, 젖은 잔머리가 이마에 붙어 있다. 아래: 캐리지가 천천히 미끄러져 스토퍼에 닿는다(C2 로우). 붓 효과음(East Sea Dokdo), 환기구 바람 소리만 남는다.", "summary": "위아래 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(길게, 흰색)", "text": "후우"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "탁"}, {"type": "narration", "speaker": "내레이션", "text": "땀이 식으며 등이 서늘해졌다."}], "flags": ["intimate"], "thumb": "thumbs/2-059.svg"}, {"id": "2-060", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#10 아무것도 없는 얼굴 (필라테스룸, 9월 8일 화 밤 10:58)", "width": 800, "height": 1560, "shot": "LS · 아이레벨 · 도겸(중), 세라(전경·우)", "screen": "리포머 끝에 걸터앉은 도겸이 바지 주머니에서 진동하는 휴대폰을 꺼내 엄지로 넘긴다. 거울 여섯 장 속의 그 여섯 명이 동시에 표정을 지운다(여섯 얼굴 모두 무표정, 눈에 빛이 없다). 전경에는 세라의 어깨와 포니테일 끝만. 진동 효과음은 붓 효과음(East Sea Dokdo) 작게.", "summary": "리포머 끝에 걸터앉은 도겸이 바지 주머니에서 진동하는 휴대폰을 꺼내 엄지로 넘긴다.", "lines": [{"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "징—"}, {"type": "narration", "speaker": "내레이션", "text": "거울 여섯 장 속의 남자 여섯 명이 동시에 표정을 지웠다. 아무것도 없는 얼굴이었다."}], "flags": [], "thumb": "thumbs/2-060.svg"}, {"id": "2-061", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#10 아무것도 없는 얼굴 (필라테스룸, 9월 8일 화 밤 10:58)", "width": 800, "height": 640, "shot": "CU · 아이레벨 · 세라(좌), 도겸(우)", "screen": "가로 2분할. 좌: 처음 보는 얼굴을 보는 세라의 눈, 동공이 조금 커지고 입술이 다물린다. 우: 도겸이 셔츠를 걸치며 일어서고 문 쪽으로 돌아선다, 민트 향 효과선이 문틈으로 빠져나간다. 내레이션 박스는 좌칸, 말풍선은 우칸.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "세라는 그런 얼굴을 처음 봤다."}, {"type": "dialogue", "speaker": "도겸", "text": "현장."}], "flags": ["intimate"], "thumb": "thumbs/2-061.svg"}, {"id": "2-062", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#10 아무것도 없는 얼굴 (필라테스룸, 9월 8일 화 밤 10:58)", "width": 800, "height": 1160, "shot": "FS · 아이레벨 · 세라(중)", "screen": "빈 스튜디오. 민트 집업을 걸친 세라가 맨발로 매트 위에 서서 한쪽 팔을 머리 위로 넘겨 옆구리를 길게 늘인다. 같은 칸 안에 반대쪽, 다시 반대쪽 동작을 잔상처럼 겹친다(연속 동작 3단). 내레이션 박스 상단.", "summary": "빈 스튜디오.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그녀는 마음이 불편할 때 스트레칭을 했다."}], "flags": [], "thumb": "thumbs/2-062.svg"}, {"id": "2-063", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#10 아무것도 없는 얼굴 (필라테스룸, 9월 8일 화 밤 10:58)", "width": 800, "height": 760, "shot": "INS · POV(세라) · 인물 없음", "screen": "다시 켠 데스크 모니터. 출입 기록 맨 아랫줄에 새 줄 '22:58 B2 연결통로 출입'(글자는 식자), 그 위로 22:04 줄이 그대로 있다. 화면 반사에 세라의 실루엣이 희미하게 비친다.", "summary": "다시 켠 데스크 모니터.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그는 밖으로 나가지 않았다. 단지 안으로 더 깊이 들어갔다."}], "flags": [], "thumb": "thumbs/2-063.svg"}, {"id": "2-064", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 1360, "shot": "LS · 아이레벨 · 순옥(중)", "screen": "열탕 턱(C1)에서 김 너머로 본 세신 코너. 천장 둥근 등이 흐린 달처럼 떠 있고, 순옥이 세신대에 뜨거운 물을 두 바가지 끼얹은 뒤 새 비닐을 편다. 화면 앞쪽 3분의 1은 두꺼운 김. 펌프와 바가지 효과음은 붓 효과음(East Sea Dokdo).", "summary": "열탕 턱(C1)에서 김 너머로 본 세신 코너.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오전 열한 시, 더퍼스트 클럽 지하 1층 여탕 세신실은 김으로 하얗게 차 있었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "쿨렁쿨렁"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "딱"}], "flags": [], "thumb": "thumbs/2-064.svg"}, {"id": "2-065", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 960, "shot": "INS · 부감 · 순옥(우), 유진(중·뒷모습)", "screen": "회상 톤(가장자리 흐린 비네트, 채도 낮춤). 세신대에 말없이 엎드린 젊은 여자의 흰 등과 흑갈 웨이브 단발 끝만, 허리 아래는 수건. 그 등을 미는 순옥의 손이 손가락을 펴고 힘을 뺀 모양이다. 내레이션 박스 두 개.", "summary": "회상 톤(가장자리 흐린 비네트, 채도 낮춤).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "2년 동안 이 세신대에 단지의 등이 다 누웠다. 101동 펜트하우스의 젊은 며느리는 격주 화요일에 왔다. 며느리는 말이 없었다."}, {"type": "narration", "speaker": "내레이션", "text": "순옥은 그 등을 밀 때마다 손에서 힘을 뺐다. 며느리는 이 세신사가 시어머니라는 걸 몰랐다."}], "flags": [], "thumb": "thumbs/2-065.svg"}, {"id": "2-066", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 1080, "shot": "MS · 하이 · 세라(중), 순옥(우)", "screen": "현재. 세라가 엎드린다. 구릿빛 등이 수건처럼 반듯하고 날개뼈가 선명하며, 허리 아래는 흰 수건이 덮는다. 세라는 팔에 뺨을 대고 반대쪽을 본다(얼굴이 순옥에게 안 보인다). 이태리타월을 감은 순옥의 손이 어깻죽지에 닿고, 말풍선은 좌상에서 좌하로 두 개, 내레이션은 그 사이 중앙.", "summary": "현재.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "이모, 오늘 세게요."}, {"type": "narration", "speaker": "내레이션", "text": "손님들은 세신대에 엎드리면 말이 많아졌다. 얼굴이 보이지 않으면 사람은 고해를 했다."}, {"type": "dialogue", "speaker": "세라", "text": "이모, 저 남자 생겼어요. 회장님 아들. 이 단지 지은 회사요."}], "flags": [], "thumb": "thumbs/2-066.svg"}, {"id": "2-067", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 1560, "shot": "CU · 아이레벨 · 순옥(중)", "screen": "김 사이로 드러난 순옥의 옆얼굴. 짙은 일자 눈썹, 늘 다문 얇은 입술, 시선은 등에만 있다. 화면 하단 전경에 어깻죽지를 밀어 내려가는 굵은 손(손마디가 굵고 손톱은 물에 불어 하얗다)이 멈추지 않는다. 2년 전 아들의 전화 목소리는 점선 말풍선으로 위에서 내려오고, 내레이션 박스들이 그 앞뒤를 감싼다.", "summary": "김 사이로 드러난 순옥의 옆얼굴.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "순옥의 손은 멈추지 않았다. 2년 전, 이 단지 세신사 자리에 이력서를 냈다고 말했을 때 아들은 전화기 너머에서 한참 말이 없다가 이렇게만 말했다."}, {"type": "dialogue", "speaker": "도겸(전화)", "text": "엄마, 아는 척하지 마. 거기선 내가 회장님 아들이야."}, {"type": "narration", "speaker": "내레이션", "text": "순옥은 그 말을 수건처럼 반듯하게 접어 넣어 두었다. 이 단지에 회장님 아들이 하나뿐이겠는가. 그녀는 그렇게 생각하기로 했다."}], "flags": ["intimate"], "thumb": "thumbs/2-067.svg"}, {"id": "2-068", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 600, "shot": "BS · 하이 · 세라(좌), 순옥(우)", "screen": "가로 2분할. 좌: 팔에 뺨을 댄 세라가 들뜬 눈으로 말한다. 우: 순옥의 입만 짧게 움직이고 눈은 내려가 있다. 말풍선 좌상, 우상(작게).", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "가방도 사 줬어요. 샤넬. 회원님들이 다 물어봐요."}, {"type": "dialogue", "speaker": "순옥", "text": "좋겠네."}], "flags": [], "thumb": "thumbs/2-068.svg"}, {"id": "2-069", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 880, "shot": "INS · 아이레벨 · 인물 없음", "screen": "회상 컷(짧게, 채도 낮춤). 탈의실 옷장 앞 고리에 걸린 로고 없는 블랙 퀼팅 체인 백, 금색 체인이 걸리는 순간 가볍게 흔들린다. 효과음은 얇은 붓 효과음(East Sea Dokdo), 내레이션 박스 두 개.", "summary": "회상 컷(짧게, 채도 낮춤).", "lines": [{"type": "sfx", "speaker": "SFX(작게, 금색)", "text": "찰랑"}, {"type": "narration", "speaker": "내레이션", "text": "순옥은 탈의실 옷장 앞에 걸려 있던 그 가방을 본 적이 있었다. 체인이 너무 가벼워서 걸 때마다 찰랑 소리가 났다."}, {"type": "narration", "speaker": "내레이션", "text": "사십 년 동안 남의 옷장 앞을 지나다닌 사람은 가방이 내는 소리를 알았다. 진짜는 그렇게 가볍게 울지 않았다."}], "flags": [], "thumb": "thumbs/2-069.svg"}, {"id": "2-070", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 720, "shot": "INS · 부감 · 순옥(중), 세라(하단)", "screen": "이태리타월이 날갯죽지를 지나 척추를 따라 내려간다. 비닐 위로 물이 흐르고 김이 손목에 감긴다. 세라의 말풍선 두 개는 화면 밖 좌측에서.", "summary": "이태리타월이 날갯죽지를 지나 척추를 따라 내려간다.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "너한테만 하는 얘긴데, 그러더라고요. 아버지랑 사이 안 좋대요."}, {"type": "dialogue", "speaker": "세라", "text": "어머니는 고등학교 때 돌아가셨대요. 이번 주가 기일이래서 제 카드로 제사 음식 했어요."}], "flags": [], "thumb": "thumbs/2-070.svg"}, {"id": "2-071", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 920, "shot": "CU · 아이레벨 · 순옥(중)", "screen": "위아래 2분할. 위: 순옥의 손이 아주 잠깐 등 위에 머물고 입이 열린다, 말끝을 흐린다. 아래: 김 속 순옥의 얼굴, 코에서 짧은 바람이 새어 나온다(입꼬리는 움직이지 않는다). 세라의 대답은 화면 밖 좌상 말풍선, 붓 효과음(East Sea Dokdo)은 코끝 옆에 아주 작게.", "summary": "위아래 2분할.", "lines": [{"type": "dialogue", "speaker": "순옥", "text": "…기일이 언젠데."}, {"type": "dialogue", "speaker": "세라", "text": "이번 토요일이요."}, {"type": "narration", "speaker": "내레이션", "text": "이번 토요일에 순옥은 아침 여섯 시부터 밤 여섯 시까지 이 자리에 서 있을 예정이었다. 제사상을 받을 사람은 그날 남의 등 마흔 개를 밀 것이다."}, {"type": "sfx", "speaker": "SFX(아주 작게)", "text": "픽"}], "flags": [], "thumb": "thumbs/2-071.svg"}, {"id": "2-072", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 세라(좌), 순옥(우)", "screen": "[트랙2] 가로 2분할. 좌: 세라가 고개를 돌려 눈을 동그랗게 뜬다(물음표 효과선, 크림색 플랫 배경). 우: 순옥이 눈을 내린 채 무표정으로 짧게 답한다(입만 작게). 의상 색은 본편과 같다. 말풍선 좌상, 우상.", "summary": "[트랙2] 가로 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "이모, 웃었어요?"}, {"type": "dialogue", "speaker": "순옥", "text": "때가 많이 나와서."}], "flags": [], "thumb": "thumbs/2-072.svg"}, {"id": "2-073", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#11 엎드리면 고해 (더퍼스트 클럽 지하 1층 여탕 세신실, 9월 9일 수 오전 11:00)", "width": 800, "height": 560, "shot": "INS · 하이 · 순옥(중), 세라(하단)", "screen": "순옥이 타월 쥔 손에 힘을 준다. 손등 힘줄과 손목 파스, 등 위 타월 아래로 굵은 압력선. 세라의 '아야' 말풍선이 화면 밖 좌측에서 튀고, 웃음 섞인 흔들림 효과선.", "summary": "순옥이 타월 쥔 손에 힘을 준다.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "아야!"}], "flags": [], "thumb": "thumbs/2-073.svg"}, {"id": "2-074", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#12 엇갈리는 두 등 (여탕 세신실 입구, 9월 9일 수 오전 11:38)", "width": 800, "height": 1000, "shot": "MS · 아이레벨 · 세라(좌), 미란(우)", "screen": "김 속. 수건을 두르고 나가는 세라와, 유리 미닫이를 열고 들어오는 미란이 마주친다. 두 사람 다 수건 위로 어깨와 쇄골만 보인다. 시각 캡션은 좌상 박스, 세라 말풍선 좌.", "summary": "김 속.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "열한 시 삼십팔 분."}, {"type": "dialogue", "speaker": "세라", "text": "어, 사장님."}], "flags": ["intimate"], "thumb": "thumbs/2-074.svg"}, {"id": "2-075", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#12 엇갈리는 두 등 (여탕 세신실 입구, 9월 9일 수 오전 11:38)", "width": 800, "height": 520, "shot": "BS · 아이레벨 · 미란(중)", "screen": "미란이 반달 눈으로 웃으며 턱으로 세신대 쪽을 가리킨다. 방수팩 휴대폰을 쥔 손. 말풍선 우상.", "summary": "미란이 반달 눈으로 웃으며 턱으로 세신대 쪽을 가리킨다.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "쌤도 세신 받아?"}], "flags": [], "thumb": "thumbs/2-075.svg"}, {"id": "2-076", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#12 엇갈리는 두 등 (여탕 세신실 입구, 9월 9일 수 오전 11:38)", "width": 800, "height": 640, "shot": "MS · 측면 · 세라(좌), 미란(우)", "screen": "두 사람이 고개를 까딱하고 엇갈린다. 세라의 포니테일과 미란의 올린 머리가 김 속에서 반대 방향으로 멀어진다. 내레이션 박스 상단.", "summary": "두 사람이 고개를 까딱하고 엇갈린다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "두 사람은 고개를 까딱하고 엇갈렸다. 와인바 사장과 필라테스 강사. 단지 안에서 서로 아는 건 딱 그만큼이었다."}], "flags": [], "thumb": "thumbs/2-076.svg"}, {"id": "2-077", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#12 엇갈리는 두 등 (여탕 세신실 입구, 9월 9일 수 오전 11:38)", "width": 800, "height": 1040, "shot": "MS · 뒷모습 · 순옥(중), 세라(좌·후경), 미란(우·후경)", "screen": "세신 코너에 선 순옥의 등 너머로, 멀어지는 세라의 등과 다가오는 미란의 실루엣이 김 속에 좌우로 갈라져 있다. 순옥은 젖은 이태리타월을 쥔 채 두 쪽을 번갈아 본다. 내레이션 박스 하단.", "summary": "세신 코너에 선 순옥의 등 너머로, 멀어지는 세라의 등과 다가오는 미란의 실루엣이 김 속에 좌우로 갈라져 있", "lines": [{"type": "narration", "speaker": "내레이션", "text": "순옥은 두 사람의 등을 다 알았다. 그리고 지금은 그보다 조금 더 알았다."}], "flags": [], "thumb": "thumbs/2-077.svg"}, {"id": "2-078", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 1240, "shot": "MS · 하이 · 미란(중), 순옥(우)", "screen": "새 비닐을 갈자 김이 크게 일고, 미란이 웃으며 엎드린다. 곡선이 많은 등, 허리선 위 등 아래쪽에 카운터 모서리에 눌린 붉은 자국이 희미하다. 순옥의 타월이 그 자국을 피해 옆으로 돈다. 시각 캡션 좌상, 말풍선은 미란 머리 쪽 좌하.", "summary": "새 비닐을 갈자 김이 크게 일고, 미란이 웃으며 엎드린다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "열한 시 사십 분."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "하하"}, {"type": "dialogue", "speaker": "미란", "text": "이모, 나 남자 생겼다?"}], "flags": ["intimate"], "thumb": "thumbs/2-078.svg"}, {"id": "2-079", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 560, "shot": "INS · 하이 · 순옥(중), 미란(하단)", "screen": "미란의 견갑골 위에서 순옥의 손이 아주 조금 느려진다(같은 칸 안에서 손의 잔상 간격이 좁아진다). 미란의 말풍선은 화면 밖.", "summary": "미란의 견갑골 위에서 순옥의 손이 아주 조금 느려진다(같은 칸 안에서 손의 잔상 간격이 좁아진다).", "lines": [{"type": "dialogue", "speaker": "미란", "text": "회장님 아들이야. 이 단지 지은 회사."}], "flags": ["intimate"], "thumb": "thumbs/2-079.svg"}, {"id": "2-080", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 1120, "shot": "CU · 아이레벨 · 순옥(중)", "screen": "김 속 순옥의 얼굴. 말끝을 흐리는 짧은 대답 뒤, 같은 문장이 들려오자 눈이 등에서 떨어지지 않은 채 고정된다. 미란의 말풍선은 화면 밖 좌상, 내레이션 박스 두 개를 하단에.", "summary": "김 속 순옥의 얼굴.", "lines": [{"type": "dialogue", "speaker": "순옥", "text": "…그래."}, {"type": "dialogue", "speaker": "미란", "text": "너한테만 하는 얘긴데, 그러더라. 아버지랑 사이 안 좋대."}, {"type": "narration", "speaker": "내레이션", "text": "사십 분 만에 같은 문장이었다. 순서도 같았다. 토씨 하나 다르지 않았다."}, {"type": "narration", "speaker": "내레이션", "text": "아들은 어릴 때도 받아쓰기를 잘했다."}], "flags": ["intimate"], "thumb": "thumbs/2-080.svg"}, {"id": "2-081", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 600, "shot": "BS · 하이 · 미란(좌), 순옥(우)", "screen": "가로 2분할. 좌: 팔에 턱을 괸 미란이 고개만 비스듬히 돌려 묻는다(순옥 얼굴은 보지 못한다). 우: 순옥이 시선을 내린 채 짧게 받는다.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "어머니는 고등학교 때 돌아가셨대. 짠하지, 이모?"}, {"type": "dialogue", "speaker": "순옥", "text": "…짠하네."}], "flags": ["intimate"], "thumb": "thumbs/2-081.svg"}, {"id": "2-082", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 720, "shot": "CU · 하이 · 미란(중)", "screen": "비닐에 뺨을 댄 미란의 옆얼굴, 반쯤 감긴 눈과 기대에 찬 입꼬리. 3년 전 다짐을 넘은 사람의 가벼운 목소리. 말풍선 상단에 길게.", "summary": "비닐에 뺨을 댄 미란의 옆얼굴, 반쯤 감긴 눈과 기대에 찬 입꼬리.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "우리 가게 리모델링도 자기가 해 준대. 아버지 회사 협력업체라 싸게. 나 그래서 3천 보냈잖아. 이모, 나 이번엔 잘 고른 것 같지?"}], "flags": ["intimate"], "thumb": "thumbs/2-082.svg"}, {"id": "2-083", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 1360, "shot": "MS · 하이 · 순옥(우), 미란(하단)", "screen": "순옥이 대답 대신 바가지로 뜨거운 물을 떠 미란의 등에 붓는다. 김이 확 올라와 두 사람 사이를 하얗게 가리고, 화면 위쪽 절반이 김으로 찬다. 효과음은 붓 효과음(East Sea Dokdo) 대형, 내레이션 박스는 김 속에 떠 있게.", "summary": "순옥이 대답 대신 바가지로 뜨거운 물을 떠 미란의 등에 붓는다.", "lines": [{"type": "sfx", "speaker": "SFX(대형, 흰색)", "text": "촤아"}, {"type": "narration", "speaker": "내레이션", "text": "어떤 대답은 김 속에서만 할 수 있었다. 순옥은 아무 말도 하지 않았다. 그것이 그녀의 대답이었다."}], "flags": ["intimate"], "thumb": "thumbs/2-083.svg"}, {"id": "2-084", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 880, "shot": "MS · 하이 · 미란(중), 순옥(우)", "screen": "미란이 세신대 옆 선반으로 팔을 뻗어 방수팩에 든 휴대폰을 집고, 엄지로 몇 번 넘긴 뒤 화면을 순옥 쪽으로 돌린다. 미란은 엎드린 채 팔만 들어 올린다(수건 그대로). 말풍선 두 개 좌상.", "summary": "미란이 세신대 옆 선반으로 팔을 뻗어 방수팩에 든 휴대폰을 집고, 엄지로 몇 번 넘긴 뒤 화면을 순옥 쪽으로", "lines": [{"type": "dialogue", "speaker": "미란", "text": "얼굴은 절대 못 찍게 해. 근데 손은 찍었지."}, {"type": "dialogue", "speaker": "미란", "text": "손 예쁘지, 이모? 자기도 봐 봐."}], "flags": ["intimate"], "thumb": "thumbs/2-084.svg"}, {"id": "2-085", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 760, "shot": "INS · POV(순옥) · 인물 없음", "screen": "방수팩의 물방울 너머 휴대폰 화면. 2-028과 같은 사진: 붉은 조명, 맨어깨, 그 위에 얹힌 남자의 손, 손목의 금빛 시계. 김이 화면 가장자리를 흐리게 덮는다.", "summary": "방수팩의 물방울 너머 휴대폰 화면.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "붉은 조명. 맨어깨. 그 위에 얹힌 남자의 손. 그리고 손목의 금빛 시계."}], "flags": ["intimate"], "thumb": "thumbs/2-085.svg"}, {"id": "2-086", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 480, "shot": "ECU · 아이레벨 · 순옥(중)", "screen": "순옥의 눈. 작고 처진 눈의 동공에 붉은 화면이 비친다. 짙은 일자 눈썹은 움직이지 않는다.", "summary": "순옥의 눈.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "순옥은 그 시계를 알았다. 지하 1층 복도에서 1미터 거리로 엇갈릴 때마다, 휴대폰을 쥔 그 손목에서 번쩍이던 시계였다."}], "flags": ["intimate"], "thumb": "thumbs/2-086.svg"}, {"id": "2-087", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#13 같은 문장, 같은 순서 (여탕 세신실, 9월 9일 수 오전 11:40)", "width": 800, "height": 1200, "shot": "INS · POV(순옥) · 인물 없음", "screen": "화면 확대. 시계 바로 아래, 엄지와 검지 사이의 작은 연분홍 초승달 흉터 하나만 크게 남고 주변은 붉게 흐려진다. 효과음 없음, 흉터 아래로 긴 여백. 내레이션 박스는 맨 위에 작게.", "summary": "화면 확대.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그리고 시계 아래, 엄지와 검지 사이의 작은 초승달 모양 흉터."}], "flags": ["intimate"], "thumb": "thumbs/2-087.svg"}, {"id": "2-088", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#14 찬물 대야 (회상, 동네 목욕탕 보일러실, 2001년 겨울 밤)", "width": 800, "height": 1080, "shot": "LS · 아이레벨 · 도겸(중)", "screen": "보일러 화구의 주황 불빛, 그 위에서 끓는 주전자의 김. 일곱 살 도겸이 왼손을 감싸 쥐고 울며 주저앉는다(화상은 그리지 않고 감싼 손만). 비명 효과음은 붓 효과음(East Sea Dokdo), 내레이션 박스 좌상.", "summary": "보일러 화구의 주황 불빛, 그 위에서 끓는 주전자의 김.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "일곱 살 겨울, 동네 목욕탕 보일러실에서 끓는 주전자를 잡았던 손이었다."}, {"type": "sfx", "speaker": "SFX(대형, 적색)", "text": "으아앙"}], "flags": [], "thumb": "thumbs/2-088.svg"}, {"id": "2-089", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#14 찬물 대야 (회상, 동네 목욕탕 보일러실, 2001년 겨울 밤)", "width": 800, "height": 880, "shot": "MS · 하이 · 순옥(좌), 도겸(우)", "screen": "젊은 순옥(36)이 무릎을 꿇고 아이의 손을 찬물 대야에 담근다. 같은 짙은 일자 눈썹, 덜 굽은 등. 아이는 얼굴을 찡그리고 울고, 순옥은 이를 악문 채 손목을 놓지 않는다. 내레이션 박스 하단.", "summary": "젊은 순옥(36)이 무릎을 꿇고 아이의 손을 찬물 대야에 담근다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "순옥은 그 손을 찬물 대야에 한 시간 동안 담그고 있었다."}], "flags": [], "thumb": "thumbs/2-089.svg"}, {"id": "2-090", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#14 찬물 대야 (회상, 동네 목욕탕 보일러실, 2001년 겨울 밤)", "width": 800, "height": 560, "shot": "INS · 부감 · 순옥(중), 도겸(중)", "screen": "물속. 굵은 어른 손이 작은 왼손을 감싸 쥐고 있고, 엄지와 검지 사이가 물 아래에서 흔들린다. 수면에 주황 불빛이 일렁인다.", "summary": "물속.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/2-090.svg"}, {"id": "2-091", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#14 찬물 대야 (회상, 동네 목욕탕 보일러실, 2001년 겨울 밤)", "width": 800, "height": 1240, "shot": "MS · 아이레벨 · 순옥(좌), 도겸(우)", "screen": "시간 경과 디졸브(같은 구도의 겹침). 아이가 울다 지쳐 순옥의 무릎에 뺨을 대고 잠들었고, 순옥의 한 손은 아직 대야 속에서 아이의 손을 쥐고 있다. 보일러 불빛이 사그라져 있다. 내레이션 박스 하단.", "summary": "시간 경과 디졸브(같은 구도의 겹침).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "아이가 울다 지쳐 잠들 때까지 놓지 않았다."}], "flags": [], "thumb": "thumbs/2-091.svg"}, {"id": "2-092", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#15 처음으로 씻긴 손 (여탕 세신실, 9월 9일 수 오전 11:42)", "width": 800, "height": 640, "shot": "INS · 하이 · 순옥(중), 미란(하단)", "screen": "미란의 등 한가운데에서 멈춘 이태리타월. 순옥의 굵은 손등에 힘줄이 서 있고, 타월 아래 비닐 위 물방울만 움직인다. 내레이션 박스 상단.", "summary": "미란의 등 한가운데에서 멈춘 이태리타월.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "이태리타월이 미란의 등 한가운데에서 멈췄다."}], "flags": [], "thumb": "thumbs/2-092.svg"}, {"id": "2-093", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#15 처음으로 씻긴 손 (여탕 세신실, 9월 9일 수 오전 11:42)", "width": 800, "height": 1120, "shot": "LS · 로우 · 순옥(우), 미란(중)", "screen": "세신대 머리 쪽(C2) 로우 앵글. 김이 천천히 내려앉아 공기가 투명해지고, 서 있는 순옥과 엎드린 미란, 선반의 휴대폰이 선명해진다. 펌프 효과음만 작게 반복, 붓 효과음(East Sea Dokdo).", "summary": "세신대 머리 쪽(C2) 로우 앵글.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "김이 천천히 내려앉았다. 펌프 소리만 계속 돌았다."}, {"type": "sfx", "speaker": "SFX(작게, 반복, 회색)", "text": "쿨렁… 쿨렁…"}], "flags": [], "thumb": "thumbs/2-093.svg"}, {"id": "2-094", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#15 처음으로 씻긴 손 (여탕 세신실, 9월 9일 수 오전 11:42)", "width": 800, "height": 520, "shot": "BS · 하이 · 미란(중)", "screen": "엎드린 채 팔에 뺨을 대고 있던 미란이 고개를 반쯤 든다. 순옥의 얼굴은 프레임 밖이다. 말풍선 작게 좌상.", "summary": "엎드린 채 팔에 뺨을 대고 있던 미란이 고개를 반쯤 든다.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "이모?"}], "flags": [], "thumb": "thumbs/2-094.svg"}, {"id": "2-095", "chapter": "2화. 영업 끝난 바, 마감 후 스튜디오", "scene": "S#15 처음으로 씻긴 손 (여탕 세신실, 9월 9일 수 오전 11:42)", "width": 800, "height": 1800, "shot": "CU · 아이레벨 · 순옥(중)", "screen": "회차 끝 훅. 김이 걷힌 투명한 공기 속 순옥의 얼굴이 정면으로 움직이지 않는다. 짙은 일자 눈썹, 다문 입술, 젖은 볼, 눈은 아무 데도 보지 않는다. 화면 아래로 이태리타월을 감은 손이 등 위에 멈춘 채 걸리고, 효과음 없이 위아래 긴 여백, 내레이션 박스는 얼굴 아래 한가운데.", "summary": "회차 끝 훅.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "순옥은 그 손을 알았다. 서른두 해 전, 처음으로 씻긴 손이었다."}], "flags": ["intimate"], "thumb": "thumbs/2-095.svg"}, {"id": "3-001", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 1200, "shot": "LS · 하이 · 하린(좌·후경)", "screen": "방 문가(C1)에서 남쪽 창을 본다. 방은 어둡고 왼쪽 책상 위 스탠드의 노란 원 안에만 하린의 굽은 등과 법전이 떠 있으며, 오른쪽 싱글 침대는 빛 바깥 어둠에 잠겨 있다. 반쯤 올린 흰 롤 블라인드 아래 남색 창 너머로 공원 가로등 점과 돌다 멈춘 스프링클러 물줄기가 희미하다. 내레이션 박스 좌상, 효과음은 붓 효과음(East Sea Dokdo)으로 우측 주방 쪽 벽에 작게.", "summary": "방 문가(C1)에서 남쪽 창을 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "새벽 한 시 오십 분, 412동 502호에는 책상 스탠드 하나만 켜져 있었다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "웅웅—"}], "flags": ["intimate"], "thumb": "thumbs/3-001.svg"}, {"id": "3-002", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 520, "shot": "CU · 측면 · 하린(중)", "screen": "금테 타원 안경 너머 나른하게 반쯤 감긴 눈이 같은 판례 한 줄에 고정되어 있고, 아랫입술을 살짝 문다. 얇은 법전 종이가 스탠드 빛에 반투명하게 비치고, 손가락 사이 노란 형광펜은 뚜껑이 닫힌 채다. 전경 왼쪽에 식은 아메리카노 컵 가장자리와 형광펜 컵(하늘색 한 자루 포함)이 흐리게 걸린다. 내레이션 우상.", "summary": "금테 타원 안경 너머 나른하게 반쯤 감긴 눈이 같은 판례 한 줄에 고정되어 있고, 아랫입술을 살짝 문다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "윤하린은 같은 판례를 사십 분째 읽고 있었다. 글자는 눈으로 들어오는데 머리에 남지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/3-002.svg"}, {"id": "3-003", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 600, "shot": "INS · 아이레벨 · 도겸(좌·전경), 하린(우)", "screen": "가로 2분할. 좌: 현관 도어락 액정을 누르는 긴 손가락, 숫자는 그리지 않고 빛나는 칸 네 개만, 왼손 손목의 금장 콤비 시계와 엄지·검지 사이 분홍 초승달 흉터가 한 프레임에 든다. 우: 하린이 바퀴 의자를 밀고 반쯤 일어섰다가 도로 앉아 형광펜을 고쳐 쥐는 모습(잔상선 한 줄), 귀 끝이 벌써 붉다. 효과음은 붓 효과음(East Sea Dokdo)으로 좌측 패널 위에 계단식, 내레이션은 우하.", "summary": "가로 2분할.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "삐, 삐, 삐, 삐"}, {"type": "narration", "speaker": "내레이션", "text": "스물다섯 해 동안 그녀를 '여자'로 대한 사람은 한도겸이 처음이었다."}], "flags": ["intimate"], "thumb": "thumbs/3-003.svg"}, {"id": "3-004", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 1000, "shot": "FS · 아이레벨 · 도겸(중)", "screen": "현관 센서등 아래, 네이비 재킷을 팔에 걸친 도겸이 한 손으로 구두 뒤축을 벗는다. 슬릭 백에서 이마로 머리 한 가닥이 흘러내렸고, 단추 두 개 풀린 흰 셔츠 소매 아래 핏줄 선 팔뚝과 시계가 보인다. 그의 몸 주변에 옅은 회색 연무 선(남의 차 방향제와 식은 담배)을 아주 얇게 그어 냄새를 시각화한다. 말풍선 우상, 내레이션 좌하.", "summary": "현관 센서등 아래, 네이비 재킷을 팔에 걸친 도겸이 한 손으로 구두 뒤축을 벗는다.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "아직 안 잤어?"}, {"type": "narration", "speaker": "내레이션", "text": "하린은 그것을 현장 냄새라고 불렀다. 실은 남의 차 냄새였다. 그는 밤마다 남의 차를 몰았다."}], "flags": ["intimate"], "thumb": "thumbs/3-004.svg"}, {"id": "3-005", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 640, "shot": "BS · 오버숄더(도겸 너머) · 하린(좌), 도겸(우·전경)", "screen": "가로 2분할. 좌: 하린은 판례에서 눈을 떼지 않은 채 형광펜 끝으로 같은 줄을 짚으며 대답한다, 말풍선 좌상. 우: 의자 뒤에 선 도겸이 두 손을 하린의 맨어깨에 얹고 정수리 너머로 법전을 내려다본다, 왼쪽 입꼬리만 조금 올라간 얼굴, 말풍선 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "내일 형법 스터디라서요. 오빠는 현장 끝났어요?"}, {"type": "dialogue", "speaker": "도겸", "text": "응. 아버지 회사 현장은 밤에 봐야 보여. 낮엔 다들 연기하거든."}], "flags": ["intimate"], "thumb": "thumbs/3-005.svg"}, {"id": "3-006", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 600, "shot": "INS · 하이 · 하린(중)", "screen": "가로 3분할 인서트. ① 얇은 오트밀 골지 니트가 마른 어깨에서 가슴께로 내려가며 둥근 굴곡을 따라 팽팽하게 당겨진 골 결. ② 도겸의 엄지가 뾰족한 쇄골 끝을 천천히 누르는 ECU, 스탠드 빛에 쇄골 그림자가 깊다. ③ 하린의 노란 형광펜이 판례 위에 의도와 다르게 길게 미끄러진 줄. 효과음은 붓 효과음(East Sea Dokdo), ③ 패널을 가로지르게.", "summary": "가로 3분할 인서트.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "쭉—"}], "flags": ["intimate"], "thumb": "thumbs/3-006.svg"}, {"id": "3-007", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 560, "shot": "CU · 측면 · 도겸(좌), 하린(우)", "screen": "가로 2분할. 좌: 하린의 귓바퀴 바로 옆까지 내려온 도겸의 입술과 낮게 깐 눈, 숨이 닿는 거리, 말풍선은 작은 속삭임형 좌상. 우: 정면을 향한 채 눈만 옆으로 굴린 하린, 입술이 먼저 열리고 목소리가 뒤따르는 표정, 말풍선 우하에 말줄임 간격을 넓게.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "공부하는 사람 방해하면 안 되는데."}, {"type": "dialogue", "speaker": "하린", "text": "방해… 하셔도 돼요."}], "flags": ["intimate"], "thumb": "thumbs/3-007.svg"}, {"id": "3-008", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 560, "shot": "CU · 아이레벨 · 하린(중)", "screen": "말해 놓고 귀가 새빨갛게 달아오른 하린이 안경을 밀어 올리며 형광펜을 흔들어 손짓한다. 눈썹은 팔자로 올라가고 입은 쉬지 않는다. 긴 말풍선 하나를 화면 오른쪽 위에서 아래로 꺾어 흐르게 배치해 숨 쉴 틈이 없게 보이게 한다.", "summary": "말해 놓고 귀가 새빨갛게 달아오른 하린이 안경을 밀어 올리며 형광펜을 흔들어 손짓한다.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "아니, 그러니까 제 말은, 오늘 분량은 거의 끝났고, 스터디는 열 시라서, 지금 자도 일곱 시간은…"}], "flags": ["intimate"], "thumb": "thumbs/3-008.svg"}, {"id": "3-009", "chapter": "3화. 첫 연애", "scene": "S#1 하린의 새벽 (412동 502호, 9월 12일 토 새벽 1:50)", "width": 800, "height": 1000, "shot": "MS · 뒷모습 · 하린(중), 도겸(후경)", "screen": "도겸이 왼쪽 입꼬리만 올려 웃으며 허리를 숙여 하린의 목덜미에 입술을 댄다. 하린의 말풍선 꼬리가 '…' 지점에서 뚝 잘려 패널 테두리 밖으로 밀려나고, 그녀의 어깨가 움찔 솟는다. 스탠드 빛이 둘의 옆선만 노랗게 남기고 나머지는 어둡다. 아래쪽 여백을 크게 둔다.", "summary": "도겸이 왼쪽 입꼬리만 올려 웃으며 허리를 숙여 하린의 목덜미에 입술을 댄다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/3-009.svg"}, {"id": "3-010", "chapter": "3화. 첫 연애", "scene": "S#2 단추 (412동 502호 책상 앞, 9월 12일 토 새벽 2:00)", "width": 800, "height": 680, "shot": "MS · 아이레벨 · 하린(좌), 도겸(우)", "screen": "하린이 먼저 바퀴 의자를 돌려 그와 마주 본다. 앉은 눈높이 바로 앞에 그의 셔츠 앞섶이 있고, 하린이 두 손을 들어 세 번째 단추를 잡지만 손가락 사이에서 미끄러진다. 도겸은 내려다보며 기다린다. 효과음은 붓 효과음(East Sea Dokdo), 의자 바퀴 옆에 작게.", "summary": "하린이 먼저 바퀴 의자를 돌려 그와 마주 본다.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "드르륵"}], "flags": ["intimate"], "thumb": "thumbs/3-010.svg"}, {"id": "3-011", "chapter": "3화. 첫 연애", "scene": "S#2 단추 (412동 502호 책상 앞, 9월 12일 토 새벽 2:00)", "width": 800, "height": 480, "shot": "INS · 하이 · 하린(좌), 도겸(우)", "screen": "가로 2분할. 좌: 네 번째 단추 끝이 구멍을 찾지 못하고 헤매는 가는 손가락, 형광펜 잉크 자국과 펜 굳은살. 우: 시계와 흉터가 함께 보이는 도겸의 큰 왼손이 그 손을 감싸 쥐고, 둘이 단추를 하나씩 같이 푼다.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/3-011.svg"}, {"id": "3-012", "chapter": "3화. 첫 연애", "scene": "S#2 단추 (412동 502호 책상 앞, 9월 12일 토 새벽 2:00)", "width": 800, "height": 840, "shot": "MS · 로우 · 도겸(중), 하린(전경)", "screen": "셔츠 앞섶이 벌어지며 넓고 평평한 가슴이 스탠드 불빛에 노랗게 드러난다. 하린의 손바닥이 그 한가운데에 납작하게 놓이고, 손바닥 둘레로 박동 파문선이 두 겹 퍼진다. 효과음은 붓 효과음(East Sea Dokdo), 손바닥 위에 두 번 크게. 내레이션 좌하.", "summary": "셔츠 앞섶이 벌어지며 넓고 평평한 가슴이 스탠드 불빛에 노랗게 드러난다.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "쿵. 쿵."}, {"type": "narration", "speaker": "내레이션", "text": "심장이 손바닥을 밀어 올렸다. 자기 것인지 그의 것인지 헷갈렸다."}], "flags": ["intimate"], "thumb": "thumbs/3-012.svg"}, {"id": "3-013", "chapter": "3화. 첫 연애", "scene": "S#2 단추 (412동 502호 책상 앞, 9월 12일 토 새벽 2:00)", "width": 800, "height": 520, "shot": "CU · 아이레벨 · 도겸(좌), 하린(우)", "screen": "가로 2분할. 좌: 긴 눈을 오래 맞추는 도겸, 이마의 머리 가닥, 낮은 목소리의 작은 말풍선. 우: 붉어진 볼과 귀, 안경 너머 젖은 눈으로 고개를 저었다가 끄덕이는 하린, 말풍선 우하.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "괜찮아?"}, {"type": "dialogue", "speaker": "하린", "text": "괜찮은 게 아니라… 좋아요."}], "flags": ["intimate"], "thumb": "thumbs/3-013.svg"}, {"id": "3-014", "chapter": "3화. 첫 연애", "scene": "S#2 단추 (412동 502호 책상 앞, 9월 12일 토 새벽 2:00)", "width": 800, "height": 760, "shot": "MS · 오버숄더(도겸 너머) · 하린(중), 도겸(좌·전경)", "screen": "도겸이 니트 밑단을 쥐고 올리고 하린이 두 팔을 든다. 니트가 머리를 빠져나가다 안경에 걸려 얼굴이 천에 반쯤 덮이고, 하프업이 풀려 긴 생머리가 흘러내린다, 가슴은 도겸의 어깨와 늘어진 니트 자락이 가린다. 니트 아래로 드러난 하린의 입과 도겸의 옆얼굴이 동시에 웃음을 터뜨린다. 효과음은 붓 효과음(East Sea Dokdo)으로 둘 사이에.", "summary": "도겸이 니트 밑단을 쥐고 올리고 하린이 두 팔을 든다.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "풉"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "큭"}], "flags": ["intimate"], "thumb": "thumbs/3-014.svg"}, {"id": "3-015", "chapter": "3화. 첫 연애", "scene": "S#2 단추 (412동 502호 책상 앞, 9월 12일 토 새벽 2:00)", "width": 800, "height": 600, "shot": "INS · POV(하린) · 도겸(우)", "screen": "가로 2분할. 좌(C2 상판 높이): 도겸의 손가락이 얇은 금테 타원 안경을 접어 법전 위에 올려놓는 INS, 스탠드 갓이 위에 걸린다. 우: 하린 시점, 화면 전체가 흐린 보케이고 한 뼘 안쪽의 짙은 일자 눈썹, 턱선, 벌어진 입술의 숨만 또렷하다. 내레이션은 흐린 영역 위 좌하.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "세상이 흐려졌다. 하린에게 또렷한 것은 이제 한 뼘 안쪽뿐이었다."}], "flags": ["intimate"], "thumb": "thumbs/3-015.svg"}, {"id": "3-016", "chapter": "3화. 첫 연애", "scene": "S#2 단추 (412동 502호 책상 앞, 9월 12일 토 새벽 2:00)", "width": 800, "height": 1000, "shot": "FS · 측면 · 하린(좌), 도겸(우)", "screen": "도겸이 하린을 번쩍 들어 책상 위에 앉히고, 밀려난 법전이 페이지를 부채처럼 펼치며 넘어간다. 전경의 스탠드 갓과 형광펜 컵이 하린의 가슴 앞을 가리고, 맨등에는 스탠드 열기의 노란 하이라이트, 허벅지 아래는 차가운 상판의 푸른 반사로 대비한다. 효과음은 붓 효과음(East Sea Dokdo), 법전 위로 흩날리게.", "summary": "도겸이 하린을 번쩍 들어 책상 위에 앉히고, 밀려난 법전이 페이지를 부채처럼 펼치며 넘어간다.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "후루룩"}, {"type": "narration", "speaker": "내레이션", "text": "맨등에 스탠드 열기가 닿았고, 허벅지 밑으로 상판의 냉기가 올라왔다."}], "flags": ["intimate"], "thumb": "thumbs/3-016.svg"}, {"id": "3-017", "chapter": "3화. 첫 연애", "scene": "S#2 단추 (412동 502호 책상 앞, 9월 12일 토 새벽 2:00)", "width": 800, "height": 880, "shot": "INS · 오버숄더(하린 너머) · 하린(전경), 도겸(중)", "screen": "가로 3분할. ① 하린의 맨등과 날개뼈 너머로 그의 손바닥이 옆구리에서 가슴의 둥근 곡선을 감싼 실루엣, 곡선은 하린의 팔과 어둠이 가리고 그의 입술은 쇄골에서 곡선을 따라 내려간다. ② 책상 모서리를 움켜쥔 하린의 손 옆으로 노란 형광펜이 데구루루 굴러 떨어지고, 반바지가 허벅지를 따라 미끄러져 발목에 걸린다. ③ 그의 손바닥은 무릎 위에 머물고, 하린의 손이 그의 허리띠를 잡아당겨 버클이 법전 모서리에 부딪힌다. 효과음은 붓 효과음(East Sea Dokdo), ② 작게, ③ 크게.", "summary": "가로 3분할.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "데구루루"}, {"type": "sfx", "speaker": "SFX(대형)", "text": "딱"}], "flags": ["intimate"], "thumb": "thumbs/3-017.svg"}, {"id": "3-018", "chapter": "3화. 첫 연애", "scene": "S#3 그림자 (412동 502호 싱글 침대, 9월 12일 토 새벽 2:20)", "width": 800, "height": 1000, "shot": "LS · 부감 · 하린(중·실루엣), 도겸(중·실루엣)", "screen": "침대 머리맡 위(C3)에서 내려다본 좁은 싱글 침대. 빛 원 가장자리에서 도겸이 누운 채 하린을 자기 위로 끌어올리고, 두 몸은 흐트러진 연한 시트와 어둠 속 윤곽으로만 보인다. 바닥에 오트밀 니트와 흰 셔츠, 회색 반바지가 흩어져 있다. 효과음은 붓 효과음(East Sea Dokdo), 책상 쪽에서 침대 쪽으로 이어지게.", "summary": "침대 머리맡 위(C3)에서 내려다본 좁은 싱글 침대.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "삐걱— 삐걱"}, {"type": "narration", "speaker": "내레이션", "text": "그다음은 순서가 없었다."}], "flags": ["intimate"], "thumb": "thumbs/3-018.svg"}, {"id": "3-019", "chapter": "3화. 첫 연애", "scene": "S#3 그림자 (412동 502호 싱글 침대, 9월 12일 토 새벽 2:20)", "width": 800, "height": 600, "shot": "CU · 앙각 · 하린(중), 도겸(하단)", "screen": "아래에서 올려다본 구도. 긴 검은 생머리가 커튼처럼 쏟아져 두 얼굴을 다 가리고, 머리카락 틈으로 스탠드 빛이 가는 금실처럼 새어 든다. 얼굴은 보이지 않고 머리카락 끝이 그의 쇄골 위에서 흔들린다.", "summary": "아래에서 올려다본 구도.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/3-019.svg"}, {"id": "3-020", "chapter": "3화. 첫 연애", "scene": "S#3 그림자 (412동 502호 싱글 침대, 9월 12일 토 새벽 2:20)", "width": 800, "height": 760, "shot": "MS · 측면 · 하린(중·실루엣), 도겸(하단·실루엣)", "screen": "역광 측면 실루엣. 도겸의 두 손이 하린의 가는 허리를 양쪽에서 잡고 있고, 시트가 골반에서 접혀 아래를 가린다. 하린의 어깨 윤곽에 노란 림라이트만 얹히고, 손가락 사이 압력선으로 '느리게'의 박자를 보여 준다. 내레이션 두 개를 위아래로 간격 두고 배치.", "summary": "역광 측면 실루엣.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "느리게. 조금 더."}, {"type": "narration", "speaker": "내레이션", "text": "원래 배우는 건 잘했다."}], "flags": ["intimate"], "thumb": "thumbs/3-020.svg"}, {"id": "3-021", "chapter": "3화. 첫 연애", "scene": "S#3 그림자 (412동 502호 싱글 침대, 9월 12일 토 새벽 2:20)", "width": 800, "height": 1400, "shot": "LS · 아이레벨 · 인물 없음", "screen": "서쪽 벽 아이보리 벽지와 코르크 보드 위에 스탠드가 만든 두 사람의 그림자만 크게 겹쳐 있다. 그림자가 크게 커졌다가 작아지는 것을 같은 컷 안에 세 겹 잔상으로 그려 리듬이 빨라지는 것을 보여 준다. 하단 전경에 침대 프레임 가장자리만 어둡게 걸린다. 글자 없이 여백.", "summary": "서쪽 벽 아이보리 벽지와 코르크 보드 위에 스탠드가 만든 두 사람의 그림자만 크게 겹쳐 있다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/3-021.svg"}, {"id": "3-022", "chapter": "3화. 첫 연애", "scene": "S#3 그림자 (412동 502호 싱글 침대, 9월 12일 토 새벽 2:20)", "width": 800, "height": 520, "shot": "ECU · 하이 · 하린(좌), 도겸(우)", "screen": "가로 2분할. 좌: 하린의 이마에서 떨어진 땀방울이 그의 넓은 가슴에 맺히는 ECU, 빛을 받아 노랗게. 우: 무언가 말하려다 그의 맨어깨를 깨문 하린의 옆얼굴, 감은 눈과 흐트러진 머리칼, 볼이 붉다.", "summary": "가로 2분할.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "하아—"}], "flags": ["intimate"], "thumb": "thumbs/3-022.svg"}, {"id": "3-023", "chapter": "3화. 첫 연애", "scene": "S#3 그림자 (412동 502호 싱글 침대, 9월 12일 토 새벽 2:20)", "width": 800, "height": 600, "shot": "MS · 측면 · 하린(좌·실루엣)", "screen": "가로 2분할. 좌: 스탠드 빛을 등진 측면 실루엣으로 하린의 등이 활처럼 휜다, 목선과 턱의 각도만 또렷하고 몸은 검은 형체로 남긴다. 우: 시트 끝에서 발가락이 오므라들었다가 풀리는 INS, 두 동작을 위아래 작은 칸으로.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/3-023.svg"}, {"id": "3-024", "chapter": "3화. 첫 연애", "scene": "S#3 그림자 (412동 502호 싱글 침대, 9월 12일 토 새벽 2:20)", "width": 800, "height": 1400, "shot": "MS · 하이 · 하린(중), 도겸(중)", "screen": "상단: 열린 미닫이 너머 어두운 주방의 소형 냉장고, 표시등 하나가 꺼지고 웅웅선이 끊긴다, 그 아래 넓은 흰 여백. 하단: 시트를 어깨까지 덮은 하린이 그의 가슴에 엎드려 귀를 대고 있고, 그의 왼손이 그녀 등 위에 얹혀 시계가 희미하게 빛난다, 창밖 멀리 오토바이 불빛 한 줄. 효과음은 붓 효과음(East Sea Dokdo), 냉장고 '뚝'만 작게, 심장 소리는 점점 작아지는 세 글자, 내레이션 하단 가운데.", "summary": "상단: 열린 미닫이 너머 어두운 주방의 소형 냉장고, 표시등 하나가 꺼지고 웅웅선이 끊긴다, 그 아래 넓은 ", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "뚝"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "쿵… 쿵…… 쿵"}, {"type": "narration", "speaker": "내레이션", "text": "이게 연애라는 것이구나. 판례에는 없는 감각이었다."}], "flags": ["intimate"], "thumb": "thumbs/3-024.svg"}, {"id": "3-025", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 1200, "shot": "LS · 아이레벨 · 하린(좌), 도겸(우·후경)", "screen": "방 문가(C1). 창밖 하늘이 남색에서 잿빛으로 묽어지고 스탠드는 여전히 노랗다. 왼쪽 책상 의자에 그의 흰 셔츠만 입은 하린이 앉아 맨다리 두 개를 의자 밖으로 길게 뻗고, 노트북 화면에 상환 일정표와 통장 잔액 20,000,000원(식자)이 떠 있다. 오른쪽 침대에는 시트를 허리까지 덮은 도겸이 천장을 보고 누워 있다. 효과음은 붓 효과음(East Sea Dokdo), 창밖 위쪽에 작게.", "summary": "방 문가(C1).", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "삑, 삑"}, {"type": "narration", "speaker": "내레이션", "text": "학자금 대출로 받은 2천만 원이 통장에 그대로 있었다. 이자는 매달 꼬박꼬박 빠져나갔다."}], "flags": ["intimate"], "thumb": "thumbs/3-025.svg"}, {"id": "3-026", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 760, "shot": "MS · 부감 · 도겸(중), 하린(우·후경)", "screen": "침대 위(C3)에서 본 도겸. 맨가슴 위에 얹은 왼손 손목에서 시계가 반짝 빛나고(작은 광점), 흉터가 함께 보인다. 하린은 화면 오른쪽 위 작게, 노트북을 본 채 등을 돌리고 대답한다. 말풍선 좌상(도겸), 우상(하린) 작게.", "summary": "침대 위(C3)에서 본 도겸.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "하린아."}, {"type": "dialogue", "speaker": "하린", "text": "네."}], "flags": ["intimate"], "thumb": "thumbs/3-026.svg"}, {"id": "3-027", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 600, "shot": "CU · 아이레벨 · 도겸(중)", "screen": "고개만 그녀 쪽으로 돌린 도겸, 눈을 오래 맞추는 따뜻한 긴 눈, 이마의 머리 한 가닥. 처음 듣는 낮은 목소리이므로 말풍선을 작고 테두리 얇게 하고 주변을 비운다. 효과음 없음.", "summary": "고개만 그녀 쪽으로 돌린 도겸, 눈을 오래 맞추는 따뜻한 긴 눈, 이마의 머리 한 가닥.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "너한테만 하는 얘긴데."}], "flags": ["intimate"], "thumb": "thumbs/3-027.svg"}, {"id": "3-028", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 800, "shot": "MS · 오버숄더(하린 너머) · 도겸(중), 하린(좌·전경)", "screen": "하린이 의자를 돌려 무릎을 모으고 그를 본다(셔츠 어깨가 한쪽으로 흘러내린 뒷모습 전경). 도겸은 천장과 그녀를 번갈아 보며 담담하게 말하고, 하린은 진술이 끝날 때까지 입을 다문다. 말풍선 두 개를 위아래로, 두 번째 끝의 '20%'를 조금 굵게.", "summary": "하린이 의자를 돌려 무릎을 모으고 그를 본다(셔츠 어깨가 한쪽으로 흘러내린 뒷모습 전경).", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "나 사실 아버지랑 사이 안 좋아. 회사 물려받기 싫어."}, {"type": "dialogue", "speaker": "도겸", "text": "그래서 내 돈으로 따로 굴리는 게 있어. 아버지 쪽 사람들 모르게. 석 달에 20%."}], "flags": ["intimate"], "thumb": "thumbs/3-028.svg"}, {"id": "3-029", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 680, "shot": "CU · 아이레벨 · 하린(중)", "screen": "상단 작은 INS: 법전 위에 접힌 채 놓인 금테 타원 안경. 하단: 하린이 안경을 밀어 올리려다 손가락이 콧등의 안경 자국에서 허공을 짚고, 그 손을 내리지 못한 채 말이 빨라진다. 긴 말풍선 하나를 빽빽하게.", "summary": "상단 작은 INS: 법전 위에 접힌 채 놓인 금테 타원 안경.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "석 달에 20%면 연 80%예요. 그거 유사수신 아니에요? 원금 보장한다고 불특정 다수한테 돈 받으면 유사수신행위법 위반이고, 그러니까…"}], "flags": ["intimate"], "thumb": "thumbs/3-029.svg"}, {"id": "3-030", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 800, "shot": "MS · 로우 · 도겸(중)", "screen": "첫 말풍선은 누운 채, 두 번째 말풍선은 그가 몸을 일으키는 동작에 맞춰 위로 올라간다. 맨어깨와 쇄골에 스탠드 불빛이 얹히고 창의 잿빛이 반대편 윤곽을 만든다. 그는 하린을 똑바로 본다.", "summary": "첫 말풍선은 누운 채, 두 번째 말풍선은 그가 몸을 일으키는 동작에 맞춰 위로 올라간다.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "불특정 다수 아니야."}, {"type": "dialogue", "speaker": "도겸", "text": "특정 한 명. 너."}], "flags": ["intimate"], "thumb": "thumbs/3-030.svg"}, {"id": "3-031", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 600, "shot": "CU · 아이레벨 · 하린(중)", "screen": "웃음이 터져 눈이 감긴 하린, 같은 칸 오른쪽에 웃음이 멈칫 굳은 얼굴을 잔상처럼 겹친다. 굳은 쪽 입에서 질문이 나온다. 말풍선 우하.", "summary": "웃음이 터져 눈이 감긴 하린, 같은 칸 오른쪽에 웃음이 멈칫 굳은 얼굴을 잔상처럼 겹친다.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "오빠는 회장님 아들인데 왜 제 돈이 필요해요?"}], "flags": ["intimate"], "thumb": "thumbs/3-031.svg"}, {"id": "3-032", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 880, "shot": "MS · 아이레벨 · 도겸(우), 하린(좌·전경)", "screen": "도겸이 침대에 앉아 무릎에 팔을 걸치고 설명하다가, 두 번째 말에서 턱으로 노트북 화면을 가리킨다(전경 하린 어깨 너머 노트북의 상환 일정표). 표정은 진지하고 왼쪽 입꼬리는 올라가지 않는다. 말풍선 두 개 위아래.", "summary": "도겸이 침대에 앉아 무릎에 팔을 걸치고 설명하다가, 두 번째 말에서 턱으로 노트북 화면을 가리킨다(전경 하린", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "아버지 돈 쓰면 아버지 사람 되는 거야. 난 내 돈으로 하고 싶어. 근데 지금 내 돈이 다 묶였어. 아버지 회사 상장 전이라 지분이 묶였어. 석 달만."}, {"type": "dialogue", "speaker": "도겸", "text": "그거 이자 나가잖아. 석 달이면 2천이 2천4백 돼. 이자 갚고도 남아. 너 변호사 될 때까지, 나는 니 뒤에서 이런 거나 해 주고 싶어."}], "flags": ["intimate"], "thumb": "thumbs/3-032.svg"}, {"id": "3-033", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 760, "shot": "LS · 하이 · 도겸(우), 하린(좌)", "screen": "도겸이 다시 누워 천장을 보며 툭 던지듯 말한다. 하린은 의자에 앉아 셔츠 소매를 손등까지 끌어내린 채 휴대폰을 집는다. 둘 사이 바닥에 흩어진 옷가지가 빛 원 경계에 걸린다. 말풍선 우상, 내레이션 좌하.", "summary": "도겸이 다시 누워 천장을 보며 툭 던지듯 말한다.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "싫으면 안 해도 돼. 진짜로."}, {"type": "narration", "speaker": "내레이션", "text": "하린은 법을 공부하는 사람이었다. 그래서 알았다. 이체는 계약이 아니다."}], "flags": ["intimate"], "thumb": "thumbs/3-033.svg"}, {"id": "3-034", "chapter": "3화. 첫 연애", "scene": "S#4 너한테만 하는 얘긴데 (412동 502호, 9월 12일 토 새벽 4:50)", "width": 800, "height": 1600, "shot": "INS · 하이 · 하린(중)", "screen": "상단 가로 2분할: 좌 은행 앱 지문 인식 버튼에 닿는 엄지, 우 화면 '받는 분 한도겸 / 20,000,000원 / 이체 완료'(가상 UI, 식자). 그 아래 넓은 흰 여백. 하단에 내레이션 박스 하나만 둔다. 효과음 없음.", "summary": "상단 가로 2분할: 좌 은행 앱 지문 인식 버튼에 닿는 엄지, 우 화면 '받는 분 한도겸 / 20,000,0", "lines": [{"type": "narration", "speaker": "내레이션", "text": "알면서 했다. 그게 첫 연애였다."}], "flags": ["intimate"], "thumb": "thumbs/3-034.svg"}, {"id": "3-035", "chapter": "3화. 첫 연애", "scene": "S#5 사기와 공갈의 죄 (412동 502호 현관 / 책상, 9월 12일 토 새벽 5:30 → 오전 9:00)", "width": 800, "height": 760, "shot": "FS · 아이레벨 · 도겸(우), 하린(좌·후경)", "screen": "현관. 맨가슴에 네이비 재킷만 걸친 도겸이 구두를 신으며 어깨 너머로 말한다. 방 문가에 그의 셔츠만 입은 하린이 셔츠 깃을 여미고 서 있다. 말풍선 우상.", "summary": "현관.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "현장 아침 점검. 셔츠 요."}], "flags": ["intimate"], "thumb": "thumbs/3-054.svg"}, {"id": "3-055", "chapter": "3화. 첫 연애", "scene": "S#11 회원님, 향수 뭐 써요? (더퍼스트 클럽 지하 1층 필라테스룸, 9월 15일 화 밤 9:00)", "width": 800, "height": 640, "shot": "ECU · 측면 · 세라(좌), 하린(우)", "screen": "가로 2분할. 좌: 상체를 숙여 하린의 쇄골께에 얼굴을 가져간 세라, 코가 한 번 움직이는 순간(코 옆 짧은 동작선 하나), 말풍선 좌하. 우: 리포머에 누운 하린이 안경 너머로 눈을 두 번 깜빡이며 대답한다, 말풍선 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "회원님, 향수 뭐 써요?"}, {"type": "dialogue", "speaker": "하린", "text": "저요? 저 향수 안 뿌리는데요."}], "flags": ["intimate"], "thumb": "thumbs/3-055.svg"}, {"id": "3-056", "chapter": "3화. 첫 연애", "scene": "S#11 회원님, 향수 뭐 써요? (더퍼스트 클럽 지하 1층 필라테스룸, 9월 15일 화 밤 9:00)", "width": 800, "height": 520, "shot": "CU · 아이레벨 · 세라(중)", "screen": "세라가 고개를 살짝 기울이고 직선 시선으로 하린을 내려다본다. 웃음기 없는 입, 거울 속 같은 얼굴이 뒤에 겹친다. 말풍선 우상, 앞의 말줄임표를 길게.", "summary": "세라가 고개를 살짝 기울이고 직선 시선으로 하린을 내려다본다.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "…이상하다. 우리 오빠 냄새랑 똑같은데."}], "flags": ["intimate"], "thumb": "thumbs/3-056.svg"}, {"id": "3-057", "chapter": "3화. 첫 연애", "scene": "S#11 회원님, 향수 뭐 써요? (더퍼스트 클럽 지하 1층 필라테스룸, 9월 15일 화 밤 9:00)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 하린(좌), 세라(우)", "screen": "[트랙2] 가로 2분할. 좌: 안경이 비뚤어지고 땀방울이 튀며 두 손을 휘젓는 하린, 말풍선이 꼬리를 물고 이어진다, 효과음은 코미디 고딕(Black Han Sans). 우: 납작한 무표정으로 한 마디 툭 던지는 세라, 단색 배경. 의상 색은 본편과 같게.", "summary": "[트랙2] 가로 2분할.", "lines": [{"type": "dialogue", "speaker": "하린", "text": "흔한 향인가 봐요. 요즘 니치 향수 다 비슷하잖아요, 우디에 시트러스, 아니 이건 민트인가, 아무튼 요즘 다들…"}, {"type": "dialogue", "speaker": "세라", "text": "흔한 향 아니에요. 오빠가 이거 한국에 몇 병 없다고 했거든요."}], "flags": ["intimate"], "thumb": "thumbs/3-057.svg"}, {"id": "3-058", "chapter": "3화. 첫 연애", "scene": "S#11 회원님, 향수 뭐 써요? (더퍼스트 클럽 지하 1층 필라테스룸, 9월 15일 화 밤 9:00)", "width": 800, "height": 1000, "shot": "FS · 아이레벨 · 세라(중), 하린(우·전경)", "screen": "세라가 일어서서 고개를 옆으로 길게 꺾어 목을 늘이고, 같은 칸 아래쪽에 반대편으로 늘이는 동작을 이어 그린다. 거울 여섯 장이 그 스트레칭을 여섯 번 비추고, 전경의 하린은 리포머에 누운 채 영문을 모르고 올려다본다. 세라가 다시 걸어 나가며 한 마디, 말풍선 type": "dialogue", "speaker": "지호", "text": "다섯 살."}], "flags": ["child_present"], "thumb": "thumbs/3-069.svg"}, {"id": "3-070", "chapter": "3화. 첫 연애", "scene": "S#14 부하 (물결놀이터, 9월 19일 토 오후 3:40)", "width": 800, "height": 680, "shot": "MS · 로우 · 소이(좌), 지호(우)", "screen": "[트랙2] 턱을 치켜든 소이가 팔짱을 낀 채 선고하듯 말하고, 지호는 눈에 별이 박힌 감격한 얼굴로 두 주먹을 쥔다. 다음 순간 둘이 분수 속으로 뛰어드는 잔상을 오른쪽 아래 작게. 효과음은 코미디 고딕(Black Han Sans).", "summary": "[트랙2] 턱을 치켜든 소이가 팔짱을 낀 채 선고하듯 말하고, 지호는 눈에 별이 박힌 감격한 얼굴로 두 주먹", "lines": [{"type": "dialogue", "speaker": "소이", "text": "나 일곱 살. 그럼 너 내 부하."}, {"type": "narration", "speaker": "내레이션", "text": "지호는 십 분 만에 부하가 되었다."}], "flags": ["child_present"], "thumb": "thumbs/3-070.svg"}, {"id": "3-071", "chapter": "3화. 첫 연애", "scene": "S#14 부하 (물결놀이터, 9월 19일 토 오후 3:40)", "width": 800, "height": 800, "shot": "MS · 아이레벨 · 미란(중)", "screen": "옆 벤치에서 미란이 고개를 젖히고 웃는다, 와인브라운 빈티지 웨이브가 등 뒤로 쏟아지고 선글라스는 머리 위. 흰 오프숄더 블라우스와 검정 롱스커트는 앉은 MS로 단정하게 보여 주고 가슴·허벅지 인서트는 쓰지 않는다. 웃을 때만 반달이 되는 눈, 말풍선 우상.", "summary": "옆 벤치에서 미란이 고개를 젖히고 웃는다, 와인브라운 빈티지 웨이브가 등 뒤로 쏟아지고 선글라스는 머리 위.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "자기 아들이야? 우리 딸이 부하 삼았네. 미안해, 얘가 조직을 좋아해."}], "flags": ["child_present"], "thumb": "thumbs/3-071.svg"}, {"id": "3-072", "chapter": "3화. 첫 연애", "scene": "S#14 부하 (물결놀이터, 9월 19일 토 오후 3:40)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 유진(좌), 미란(우)", "screen": "가로 2분할. 좌: 등받이에 기대지 않고 무릎을 모아 비스듬히 앉은 유진이 입꼬리만 올려 답한다, 말풍선 좌상. 우: 미란이 선글라스를 고쳐 얹으며 손을 내밀 듯 자기소개를 한다, 말풍선 우상.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "괜찮아요. 지호가 누나를 좋아하네요."}, {"type": "dialogue", "speaker": "미란", "text": "소이야. 차소이. 나는 미란. 퍼스트 애비뉴에서 와인바 해. '미란', 내 이름 그대로."}], "flags": ["child_present"], "thumb": "thumbs/3-072.svg"}, {"id": "3-073", "chapter": "3화. 첫 연애", "scene": "S#14 부하 (물결놀이터, 9월 19일 토 오후 3:40)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 유진(좌), 미란(우)", "screen": "가로 2분할. 좌: 유진이 기억을 더듬는 짧은 시선 위로 들고 말한다, 말풍선 좌상. 우: 미란이 101동 쪽을 턱으로 가리키며 부러운 듯 웃 9.svg"}, {"id": "3-090", "chapter": "3화. 첫 연애", "scene": "S#16 수화기 너머, 그리고 하늘에서 (물결놀이터 벤치 / 하늘, 9월 19일 토 오후 4:00)", "width": 800, "height": 720, "shot": "LS · 앙각 · 인물 없음", "screen": "가로등 아래(C3)에서 올려다본 스피커와 맑은 하늘, 프레임 가장자리로 둘러선 동들의 꼭대기. 안내방송 말풍선은 각진 방송형 테두리로 스피커에서 길게 내려온다.", "summary": "가로등 아래(C3)에서 올려다본 스피커와 맑은 하늘, 프레임 가장자리로 둘러선 동들의 꼭대기.", "lines": [{"type": "dialogue", "speaker": "안내방송", "text": "관리사무소에서 알려드립니다. 오늘 오후 다섯 시부터 지하 2층 주차장 B구역 바닥 도색 작업이 있사오니, 해당 구역 차량은 오후 네 시 삼십 분까지 이동해 주시기 바랍니다. 다시 한번 알려드립니다…"}], "flags": ["child_present"], "thumb": "thumbs/3-090.svg"}, {"id": "3-091", "chapter": "3화. 첫 연애", "scene": "S#16 수화기 너머, 그리고 하늘에서 (물결놀이터 벤치 / 하늘, 9월 19일 토 오후 4:00)", "width": 800, "height": 520, "shot": "CU · 앙각 · 유진(우)", "screen": "가로 2분할. 좌: 유진 휴대폰 스피커 ECU, 같은 방송 말풍선이 반 박자 늦게 작고 흐린 테두리로 겹쳐 나온다. 우: 휴대폰을 귀에 댄 채 유진이 천천히 고개를 들어 하늘을 본다. 내레이션 하단 가로로.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "안내방송(전화)", "text": "…관리사무소에서 알려드립니다…"}, {"type": "narration", "speaker": "내레이션", "text": "하늘에서 한 번. 수화기 속에서 반 박자 늦게 한 번. 메아리처럼."}], "flags": ["child_present"], "thumb": "thumbs/3-091.svg"}, {"id": "3-092", "chapter": "3화. 첫 연애", "scene": "S#16 수화기 너머, 그리고 하늘에서 (물결놀이터 벤치 / 하늘, 9월 19일 토 오후 4:00)", "width": 800, "height": 1800, "shot": "ELS · 부감 · 유진(중), 미란(중)", "screen": "상공 약 80m(C4), 남동쪽에서 북서쪽으로. 화면 한가운데 놀이터와 바닥분수, 벤치의 두 여자가 점처럼 작고, 열다섯 개 동이 놀이터를 빙 둘러싸고 서서 3,012세대의 창문이 오후 빛에 한꺼번에 반짝인다. 화면 아래 호수, 지하 B구역 위치의 지상은 아무 표시 없이 둔다. 내레이션은 동들 사이 하늘 여백에 한 줄씩 끊어 세 단으로.", "summary": "상공 약 80m(C4), 남동쪽에서 북서쪽으로.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "현장도 아니었다. 회의실도 아니었다. 그는 이 단지 안에 있었다. 저 창문들 중 하나 안에."}], "flags": ["child_present"], "thumb": "thumbs/3-092.svg"}, {"id": "3-093", "chapter": "3화. 첫 연애", "scene": "S#16 수화기 너머, 그리고 하늘에서 (물결놀이터 벤치 / 하늘, 9월 19일 토 오후 4:00)", "width": 800, "height": 480, "shot": "CU · 아이레벨 · 미란(중)", "screen": "미란이 휴대폰을 귀에 바짝 붙이고 입을 연다. 목소리가 갈라지는 것을 말풍선 테두리의 잔금(갈라진 선)으로 보여 준다. 말풍선 우상.", "summary": "미란이 휴대폰을 귀에 바짝 붙이고 입을 연다
