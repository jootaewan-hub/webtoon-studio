일 밤 아홉 시 반, 101동 3801호 통창에는 호수공원 산책로 가로등이 점점이 떠 있었다."}, {"type": "narration", "speaker": "내레이션", "text": "추석이라 지호는 외갓집에 보냈다."}], "flags": ["intimate"], "thumb": "thumbs/5-023.svg"}, {"id": "5-024", "chapter": "5화. 역관리", "scene": "S#5 녹음기 앞의 아내 (101동 3801호 거실, 9월 25일 금 밤 9:30)", "width": 800, "height": 1200, "shot": "FS · 측면 · 유진(좌), 도겸(우)", "screen": "펜던트 빛 아래 유진의 측면 전신. 실크가 깊은 쇄골에서 묵직한 가슴을 타고 흘러 허리에서 조였다가 골반에서 퍼지고, 긴 다리 위로 하이라이트가 미끄러진다. 단추 두 개를 푼 도겸이 다가와 한 팔로 허리를 감고(시계와 흉터), 유진은 그 손을 내려다보기만 한다. 내레이션 하단.", "summary": "펜던트 빛 아래 유진의 측면 전신.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "유진은 그 손을 떼어 내지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/5-024.svg"}, {"id": "5-025", "chapter": "5화. 역관리", "scene": "S#5 녹음기 앞의 아내 (101동 3801호 거실, 9월 25일 금 밤 9:30)", "width": 800, "height": 1120, "shot": "MS · 아이레벨 · 유진(중), 도겸(중)", "screen": "위아래 2단. 위: 유진이 그를 소파로 밀어 앉히고 무릎 위에 옆으로 걸터앉는다(곧은 등, 비스듬히 모은 긴 다리). 아래 INS: 전경에 크게 걸린 과일 바구니, 사과와 배 사이 휴대폰의 녹음 타이머가 돈다(식자), 너머의 두 사람은 흐리게. 내레이션 아래칸 하단.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "식탁 위 과일 바구니 안에서 휴대폰 녹음기가 돌고 있었다."}], "flags": ["intimate"], "thumb": "thumbs/5-025.svg"}, {"id": "5-026", "chapter": "5화. 역관리", "scene": "S#5 녹음기 앞의 아내 (101동 3801호 거실, 9월 25일 금 밤 9:30)", "width": 800, "height": 640, "shot": "BS · 아이레벨 · 유진(중), 도겸(좌)", "screen": "유진이 그의 셔츠 깃을 한 번 털어 주며 묻고, 도겸은 눈을 감은 채 그녀의 목덜미에 코를 묻고 답한다(왼쪽 입꼬리). 유진의 얼굴은 바구니 쪽을 향하고 눈은 웃지 않는다. 말풍선 우상, 좌하.", "summary": "유진이 그의 셔츠 깃을 한 번 털어 주며 묻고, 도겸은 눈을 감은 채 그녀의 목덜미에 코를 묻고 답한다(왼쪽", "lines": [{"type": "dialogue", "speaker": "유진", "text": "여보, 아버님 회사 상장은 언제예요?"}, {"type": "dialogue", "speaker": "도겸", "text": "내년 봄. 너한테만 하는 얘긴데, 주관사가 바뀌었어. 그래서 좀 밀린 거야."}], "flags": ["intimate"], "thumb": "thumbs/5-026.svg"}, {"id": "5-027", "chapter": "5화. 역관리", "scene": "S#5 녹음기 앞의 아내 (101동 3801호 거실, 9월 25일 금 밤 9:30)", "width": 800, "height": 560, "shot": "CU · 아이레벨 · 유진(좌), 도겸(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 공손한 어미를 길게 끄는 유진(입꼬리만 조금). 우: 목덜미에서 얼굴을 든 도겸이 망설임 없이 답한다. 말풍선 좌상, 우하.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "유진", "text": "그럼 우리 친정 돈도 봄에 정리되겠네요."}, {"type": "dialogue", "speaker": "도겸", "text": "당연하지."}], "flags": ["intimate"], "thumb": "thumbs/5-027.svg"}, {"id": "5-028", "chapter": "5화. 역관리", "scene": "S#5 녹음기 앞의 아내 (101동 3801호 거실, 9월 25일 금 밤 9:30)", "width": 800, "height": 1080, "shot": "ECU · 측면 · 유진(중), 도겸(좌)", "screen": "위아래 2단. 위 ECU: 유진의 뮤트 로즈레드 입술이 그의 귓불에 닿는다. 아래 MS: 그의 무릎에서 일어서는 유진, 실크가 다리로 곧게 떨어지고 내려다보는 얼굴은 공손하다. 내레이션 위칸 우상, 말풍선 아래칸 우상.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그가 거짓말할 때 만지는 바로 그 자리였다."}, {"type": "dialogue", "speaker": "유진", "text": "오늘은 피곤해요. 당신 추석 밤에도 열 시에 현장 나가셔야죠."}], "flags": ["intimate"], "thumb": "thumbs/5-028.svg"}, {"id": "5-029", "chapter": "5화. 역관리", "scene": "S#5 녹음기 앞의 아내 (101동 3801호 거실, 9월 25일 금 밤 9:30)", "width": 800, "height": 1000, "shot": "BS · 아이레벨 · 도겸(좌)", "screen": "가로 2분할. 좌: 소파에 깊이 기댄 도겸이 왼쪽 입꼬리만 올려 웃는다. 우: 시간 경과, 빈 소파와 과일 바구니, 녹음 중인 휴대폰 위로 단톡방 알림 배너가 켜진다(21:52, 가상 UI). 내레이션 좌칸 하단과 우칸 상단.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "아내가 자기를 아낀다고 믿는 얼굴이었다."}, {"type": "narration", "speaker": "내레이션", "text": "21시 52분, 단톡방에 혜숙의 한 줄이 올라왔다."}, {"type": "dialogue", "speaker": "문자(혜숙→단톡방)", "text": "출차."}], "flags": ["intimate"], "thumb": "thumbs/5-029.svg"}, {"id": "5-030", "chapter": "5화. 역관리", "scene": "S#6 내 가게, 내 순서 (와인바 '미란' 홀, 9월 26일 토 새벽 1:10)", "width": 800, "height": 1240, "shot": "LS · 아이레벨 · 미란(후경·우)", "screen": "정문 안쪽(C1)에서 본 마감 후의 바. 블라인드 너머 상가 거리는 불이 다 꺼졌고 정문 유리에 연휴 영업 팻말이 등을 보인다. 붉은 펜던트 세 개의 원뿔 안 카운터 끝에 미란의 작은 실루엣, 왼쪽 안쪽 셀러 옆에 오크 와인 상자들. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 좌상 둘.", "summary": "정문 안쪽(C1)에서 본 마감 후의 바.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "연휴에도 문을 연 건 미란의 고집이었다. 영업이 끝난 와인바에는 붉은 펜던트 조명 세 개만 켜져 있었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "우웅—"}, {"type": "narration", "speaker": "내레이션", "text": "와인 셀러의 컴프레서가 낮게 떨었고, 오크통 냄새와 식은 치즈 냄새가 공기 아래쪽에 고여 있었다."}], "flags": [], "thumb": "thumbs/5-030.svg"}, {"id": "5-031", "chapter": "5화. 역관리", "scene": "S#6 내 가게, 내 순서 (와인바 '미란' 홀, 9월 26일 토 새벽 1:10)", "width": 800, "height": 600, "shot": "INS · 하이 · 미란(손)", "screen": "가로 2분할. 좌: 단톡방 화면(가상 UI), 00:58 혜숙의 한 줄. 우: 셀러 옆 보르도 병들 사이 빈 와인 상자에 휴대폰을 눕히고 와인색 손톱이 녹음 버튼을 누른다(빨간 점). 효과음은 붓 효과음(East Sea Dokdo) 아주 작게.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "문자(혜숙→단톡방)", "text": "입차."}, {"type": "sfx", "speaker": "SFX(아주 작게)", "text": "톡"}], "flags": [], "thumb": "thumbs/5-031.svg"}, {"id": "5-032", "chapter": "5화. 역관리", "scene": "S#6 내 가게, 내 순서 (와인바 '미란' 홀, 9월 26일 토 새벽 1:10)", "width": 800, "height": 1400, "shot": "FS · 로우 · 미란(중)", "screen": "카운터 상판 높이에서 올려다본 미란. 끈을 한 번 더 조이자 버건디 저지가 가슴 아래에서 엇갈려 무거운 가슴을 받치고, 잘록한 허리를 졸라맨 뒤 골반을 따라 흐르다 허벅지 앞에서 갈라진다. 뒤쪽 스틸 뒷문 틈으로 복도의 형광빛 한 줄이 열린다. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 우상.", "summary": "카운터 상판 높이에서 올려다본 미란.", "lines": [{"type": "sfx", "speaker": "SFX(중간, 회색)", "text": "철컥"}, {"type": "narration", "speaker": "내레이션", "text": "문이 열렸다."}], "flags": ["intimate"], "thumb": "thumbs/5-032.svg"}, {"id": "5-033", "chapter": "5화. 역관리", "scene": "S#6 내 가게, 내 순서 (와인바 '미란' 홀, 9월 26일 토 새벽 1:10)", "width": 800, "height": 960, "shot": "MS · 측면 · 도겸(좌), 미란(우)", "screen": "위아래 2단. 위: 들어온 도겸이 늘 하던 대로 미란의 허리를 잡아 카운터 쪽으로 몬다. 아래: 미란이 굽을 박고 서서 손바닥으로 그의 가슴을 밀어 바 스툴에 앉힌다(반쯤 감긴 눈, 붉은 립의 미소). 내레이션 위칸 우하, 말풍선 아래칸 우상.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "미란은 몰리지 않았다."}, {"type": "dialogue", "speaker": "미란", "text": "오늘은 내 가게, 내 순서야. 자기야."}], "flags": [], "thumb": "thumbs/5-033.svg"}, {"id": "5-034", "chapter": "5화. 역관리", "scene": "S#6 내 가게, 내 순서 (와인바 '미란' 홀, 9월 26일 토 새벽 1:10)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 미란(좌), 도겸(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 미란이 따른 잔을 손목으로 한 바퀴 돌려 그의 손에 쥐여 준다. 우: 잔을 단숨에 비우고 이마의 머리 한 가닥을 넘기는 도겸. 말풍선 좌상, 우하.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "자기, 리모델링 업체 언제 들어와?"}, {"type": "dialogue", "speaker": "도겸", "text": "다음 주. 너한테만 하는 얘긴데, 업체 사장이 아버지 쪽 사람이라 단가를 반으로 깎았어."}], "flags": [], "thumb": "thumbs/5-034.svg"}, {"id": "5-035", "chapter": "5화. 역관리", "scene": "S#6 내 가게, 내 순서 (와인바 '미란' 홀, 9월 26일 토 새벽 1:10)", "width": 800, "height": 1040, "shot": "MS · 아이레벨 · 미란(중), 도겸(우·전경)", "screen": "위아래 2단. 위 가로 2분할: 손바닥을 내미는 미란 / 빈 잔을 내려놓으며 왼쪽 입꼬리만 올리는 도겸. 아래: 미란이 고개를 젖히고 소리 내어 웃는다, 웨이브가 등 뒤로 쏟아지고 웃음 끝에 눈이 한 번 셀러 쪽으로 간다. 말풍선 위칸 좌상·우상, 효과음은 붓 효과음(East Sea Dokdo).", "summary": "위아래 2단.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "그럼 영수증 보여 줘."}, {"type": "dialogue", "speaker": "도겸", "text": "다음 주에."}, {"type": "sfx", "speaker": "SFX(중간, 적색)", "text": "하하하"}], "flags": [], "thumb": "thumbs/5-035.svg"}, {"id": "5-036", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 1240, "shot": "MS · 측면 · 미란(중), 도겸(하단)", "screen": "위아래 2단. 위: 웃음 그대로 미란이 스툴 위 그의 무릎에 올라앉고, 랩 자락이 갈라져 풍만한 허벅지가 붉게 드러난다(하이힐이 발걸이에 걸림). 아래 INS: 그가 늘 풀어 두는 두 개 아래, 세 번째 단추부터 와인색 손톱이 하나씩 푼다(손의 잔상 셋, 단추마다 숨 효과선). 효과음은 붓 효과음(East Sea Dokdo), 내레이션 아래칸 우하.", "summary": "위아래 2단.", "lines": [{"type": "sfx", "speaker": "SFX(중간)", "text": "끼이익"}, {"type": "narration", "speaker": "내레이션", "text": "단추 하나에 숨 한 번."}], "flags": ["intimate"], "thumb": "thumbs/5-036.svg"}, {"id": "5-037", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 1080, "shot": "MS · 오버숄더(미란 너머) · 미란(전경), 도겸(중)", "screen": "가로 2분할. 좌: 셔츠가 그의 어깨에서 미끄러지고 미란의 입술이 쇄골에서 가슴 쪽으로 천천히 내려간다(쇄골에 립 자국). 우: 원피스 끈으로 뻗던 그의 손목을 미란이 잡아 카운터 위에 내려놓는다(시계와 흉터). 말풍선 우칸 상단, 낮고 짧게.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "미란", "text": "손은 거기."}], "flags": ["intimate"], "thumb": "thumbs/5-037.svg"}, {"id": "5-038", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 1160, "shot": "INS · 아이레벨 · 미란(중)", "screen": "위아래 2단. 위: 미란이 허리 옆 끈 끝을 직접 당긴다(매듭이 풀리는 ECU). 아래: 랩 원피스가 한 겹씩 풀려 어깨에서 흘러내리고, 팔꿈치에 걸린 저지 자락이 가슴 앞을 가린다, 어깨와 쇄골만 붉은 원뿔 안에 있다. 효과음은 붓 효과음(East Sea Dokdo).", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그녀가 직접 끈을 당겼다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "스르륵"}], "flags": ["intimate"], "thumb": "thumbs/5-038.svg"}, {"id": "5-039", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 1560, "shot": "MS · 오버숄더(도겸 너머) · 미란(중), 도겸(전경·실루엣)", "screen": "그의 어깨와 뒷머리가 전경 실루엣으로 그녀의 가슴 앞을 가리고, 위쪽에 랙의 잔들이 흐리게 걸린다. 붉은 빛이 둥근 어깨와 가슴의 무거운 윗선에 고이고, 미란이 그의 목을 끌어안아 체중을 싣는다. 그의 어깨 너머 반쯤 감긴 눈이 셀러 옆 와인 상자를 한 번 확인하고 돌아온다(눈동자에 작은 붉은 점). 내레이션 위아래.", "summary": "그의 어깨와 뒷머리가 전경 실루엣으로 그녀의 가슴 앞을 가리고, 위쪽에 랙의 잔들이 흐리게 걸린다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "붉은 조명이 드러난 어깨와 가슴의 둥근 무게 위에 고였다."}, {"type": "narration", "speaker": "내레이션", "text": "그의 숨이 그녀의 가슴골에 부딪혔다."}], "flags": ["intimate"], "thumb": "thumbs/5-039.svg"}, {"id": "5-040", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 1200, "shot": "INS · 측면 · 미란(중·실루엣), 도겸(하단·실루엣)", "screen": "세로 3단. ① 그의 어깨를 짚은 그녀의 손바닥과 어깨선의 붉은 역광 실루엣. 속도를 올리려는 그를 손바닥이 눌러 멈춘다(가슴 아래는 프레임 밖). ② 셀러 유리문에 비친 흐린 붉은 형체 둘, 병목들이 미세하게 떨린다. ③ 그의 귀에 붙은 붉은 입술 ECU, 숨 효과선만. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 ①칸 좌상과 ③칸 우하.", "summary": "세로 3단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "다시 느리게. 다시."}, {"type": "sfx", "speaker": "SFX(작게, 금색)", "text": "짤랑, 짤랑"}, {"type": "sfx", "speaker": "SFX(아주 작게)", "text": "하아—"}, {"type": "narration", "speaker": "내레이션", "text": "말은 하지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/5-040.svg"}, {"id": "5-041", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 600, "shot": "INS · 뒷모습 · 미란(중), 도겸(손)", "screen": "그의 손바닥이 미란의 맨등을 타고 내려가다 허리의 오목한 곳에서 멈춘다(시계와 흉터, 펴진 채 정지한 손가락). 붉은 하이라이트가 척추 골을 따라 흐르고 흘러내린 저지가 허리 아래를 덮는다. 내레이션 하단.", "summary": "그의 손바닥이 미란의 맨등을 타고 내려가다", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그녀가 허락한 데까지였다."}], "flags": ["intimate"], "thumb": "thumbs/5-041.svg"}, {"id": "5-042", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 1320, "shot": "MS · 로우 · 미란(중·뒷모습), 도겸(후경)", "screen": "상판 높이(C3) 로우 앵글, 상판이 두 사람의 허리 아래를 자른다. 위: 미란이 그를 스툴에서 끌어내려 카운터에 기대 세우고 앞에서 허리를 끌어당긴다(그녀의 뒷모습). 아래 ECU: 붉은 빛에 반짝이는 맨등의 땀방울, 젖은 머리 몇 가닥. 효과음은 붓 효과음(East Sea Dokdo) 작게, 내레이션 상단과 하단.", "summary": "상판 높이(C3) 로우 앵글, 상판이 두 사람의 허리 아래를 자른다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "이번에는 그녀가 앞에서 그의 허리를 끌어당겼다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "학, 학"}, {"type": "narration", "speaker": "내레이션", "text": "숨이 짧아졌다."}], "flags": ["intimate"], "thumb": "thumbs/5-042.svg"}, {"id": "5-043", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 640, "shot": "INS · 로우 · 미란(손)", "screen": "가로 3분할. ① 카운터 가장자리를 움켜쥔 미란의 손, 위쪽에 그의 뒷머리를 당기는 다른 손의 손가락. ② C3 상판 끝, 잔 하나가 밀려가다 가장자리 직전에서 멈춘다. ③ 어둠 속 바 스툴 하나가 타일 위로 넘어간다. 효과음은 ③칸 붓 효과음(East Sea Dokdo), 내레이션 ③칸 하단.", "summary": "가로 3분할.", "lines": [{"type": "sfx", "speaker": "SFX(대형, 적색)", "text": "와당탕"}, {"type": "narration", "speaker": "내레이션", "text": "스툴 하나가 넘어가는 소리가 났고 아무도 줍지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/5-043.svg"}, {"id": "5-044", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 1640, "shot": "CU · 측면 · 미란(중), 도겸(좌·실루엣)", "screen": "위아래로 긴 컷. 위: 검은 여백에 내레이션 하나. 가운데: 미란이 그의 맨어깨에 이를 대고 눈을 꼭 감은 채 길게 떤다(관자놀이의 땀, 등의 잔떨림 선, 효과음 없음). 아래: 붉은 펜던트 하나가 한 번 출렁이고 빛 원뿔이 기운다, 그 아래 여백에 내레이션.", "summary": "위아래로 긴 컷.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "리듬이 빨라졌다가, 그녀가 정한 순간에 뚝 끊겼다."}, {"type": "narration", "speaker": "내레이션", "text": "붉은 조명이 한 번 출렁이는 것 같았다."}], "flags": ["intimate"], "thumb": "thumbs/5-044.svg"}, {"id": "5-045", "chapter": "5화. 역관리", "scene": "S#7 손은 거기 (와인바 '미란' 바 스툴·카운터, 9월 26일 토 새벽, S#6에서 연속)", "width": 800, "height": 1360, "shot": "MS · 하이 · 미란(중), 도겸(하단)", "screen": "위아래 2단. 위: 정적. 그의 가슴에 이마를 댄 미란의 머리칼을 그가 쓸어내리고(셔츠 깃의 붉은 립), 미란은 대답 대신 셀러 쪽을 본다. 아래 INS: 빈 와인 상자 틈에서 휴대폰 화면이 붉게 깜빡인다, '녹음 00:41:12'(식자). 효과음은 붓 효과음(East Sea Dokdo) 작게, 말풍선 위칸 좌상, 내레이션 위칸 상단과 아래칸 하단.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그다음은 조용했다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "우웅—"}, {"type": "dialogue", "speaker": "도겸", "text": "자기, 오늘 왜 이렇게 다정해?"}, {"type": "narration", "speaker": "내레이션", "text": "남자 거짓말은 와인이랑 같았다. 열어 봐야 알았다. 그녀는 이미 코르크를 따 놓았다."}], "flags": ["intimate"], "thumb": "thumbs/5-045.svg"}, {"id": "5-046", "chapter": "5화. 역관리", "scene": "S#8 네 글씨 (503동 2402호 거실, 10월 1일 목 오후 3:00)", "width": 800, "height": 1200, "shot": "LS · 아이레벨 · 혜숙(후경·중)", "screen": "거실 TV 앞(C3) 낮은 눈높이. 커튼 틈 가을볕이 대리석에 긴 사다리꼴을 눕히고, 흰 소파와 유리 테이블, 멀리 콘솔의 백합이 빛 가장자리에 걸린다(빛 속의 꽃가루). 사다리꼴 끝에 창을 등진 혜숙의 실루엣. 전기톱은 끊긴 두 덩어리의 붓 효과음(East Sea Dokdo), 내레이션 좌상.", "summary": "거실 TV 앞(C3) 낮은 눈높이.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오후 세 시의 2402호는 거실 커튼을 반만 걷어 두었다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "위이잉— 위잉"}], "flags": ["intimate"], "thumb": "thumbs/5-046.svg"}, {"id": "5-047", "chapter": "5화. 역관리", "scene": "S#8 네 글씨 (503동 2402호 거실, 10월 1일 목 오후 3:00)", "width": 800, "height": 1480, "shot": "FS · 아이레벨 · 혜숙(중)", "screen": "위아래 2단. 위: 볕 안에 선 혜숙의 전신, 와인색 저지가 가슴의 둥근 무게를 받아 내고 허리에서 잘록하게 접혔다가 엉덩이 곡선을 따라 무릎까지 팽팽하게 내려간다. 아래 ECU: 쇄골 위의 진주 44알, 알 사이 새 실이 하얗고 한 알씩 차가운 하이라이트가 구른다. 내레이션 아래칸 좌측에 세로로.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "목에는 진주를 걸었다. 지난번 이 집 안방에서 끊어졌던 그 목걸이였다."}, {"type": "narration", "speaker": "내레이션", "text": "새 실에 다시 꿴 마흔네 알이 쇄골 위에서 차갑게 굴렀다."}], "flags": ["intimate"], "thumb": "thumbs/5-047.svg"}, {"id": "5-048", "chapter": "5화. 역관리", "scene": "S#8 네 글씨 (503동 2402호 거실, 10월 1일 목 오후 3:00)", "width": 800, "height": 1120, "shot": "MS · 아이레벨 · 혜숙(우), 도겸(좌)", "screen": "전경에 유리 테이블 위 만년필과 종이 한 장. 흰 소파에 깊이 기댄 도겸 앞, 혜숙이 옆이 아니라 맞은편 테이블 끝에 걸터앉아 턱을 들고 그녀의 무릎이 그의 무릎 사이로 들어간다. 빨간 손톱이 종이를 그 쪽으로 민다. 말풍선 우상.", "summary": "전경에 유리 테이블 위 만년필과 종이 한 장.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "얘, 세무사가 그러는데 전매 대금은 받았다는 확인서가 있어야 한대. 우리 남편이 나중에 물어보면 곤란하잖니."}], "flags": ["intimate"], "thumb": "thumbs/5-048.svg"}, {"id": "5-049", "chapter": "5화. 역관리", "scene": "S#8 네 글씨 (503동 2402호 거실, 10월 1일 목 오후 3:00)", "width": 800, "height": 1240, "shot": "INS · 하이 · 혜숙(좌), 도겸(우)", "screen": "세로 3단. ① 종이를 읽는 그의 손(문장, 금액, 날짜, 서명란은 식자). ② 펜을 들기 전, 혜숙의 검지가 그의 셔츠 깃을 쓸어내리고 숙인 상체에서 진주가 쏟아지듯 흔들린다. ③ 만년필 끝이 서명란을 지나간다(손글씨 식자, Nanum Pen Script). 내레이션 ③칸 상단.", "summary": "세로 3단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그는 썼다. 분양권 전매 대금 일억 오천만 원을 정히 수령함. 한도겸."}], "flags": ["intimate"], "thumb": "thumbs/5-049.svg"}, {"id": "5-050", "chapter": "5화. 역관리", "scene": "S#8 네 글씨 (503동 2402호 거실, 10월 1일 목 오후 3:00)", "width": 800, "height": 560, "shot": "BS · 아이레벨 · 도겸(좌), 혜숙(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 만년필을 쥔 채 눈을 오래 맞추는 도겸(왼쪽 입꼬리). 우: 손으로 입을 가리고 웃는 혜숙, 눈은 종이를 본다. 말풍선 좌상, 우상.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "너한테만 하는 얘긴데, 이거 원래 안 써 주는 거야."}, {"type": "dialogue", "speaker": "혜숙", "text": "알아. 그러니까 고맙지."}], "flags": ["intimate"], "thumb": "thumbs/5-050.svg"}, {"id": "5-051", "chapter": "5화. 역관리", "scene": "S#8 네 글씨 (503동 2402호 거실, 10월 1일 목 오후 3:00)", "width": 800, "height": 1400, "shot": "MS · 하이 · 혜숙(중), 도겸(중)", "screen": "전경에 만년필과 서명된 종이를 또렷하게, 그 너머 두 사람은 흐리게. 그가 그녀의 허리를 끌고 혜숙은 끌려가 준다, 그의 입술이 진주 아래 목과 쇄골 사이로 내려온다. 혜숙은 눈을 감고 입술만 움직여 숫자를 센다(입 모양 세 단계 잔상). 내레이션 상단 둘.", "summary": "전경에 만년필과 서명된 종이를 또렷하게, 그 너머 두 사람은 흐리게.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "혜숙은 끌려가 주었다."}, {"type": "narration", "speaker": "내레이션", "text": "그녀는 눈을 감고 숫자를 셌다."}], "flags": ["intimate"], "thumb": "thumbs/5-051.svg"}, {"id": "5-052", "chapter": "5화. 역관리", "scene": "S#8 네 글씨 (503동 2402호 거실, 10월 1일 목 오후 3:00)", "width": 800, "height": 600, "shot": "CU · 측면 · 혜숙(좌), 도겸(우)", "screen": "가로 2분할. 좌: 열에서 눈을 뜬 혜숙이 빨간 손톱의 검지를 그의 입술 사이에 끼워 넣는다(진주가 그의 턱 아래에서 흔들림). 우: 검지를 문 채 올려다보는 도겸. 말풍선 좌상(낮고 우아하게), 우하(작게).", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "얘, 그건 그렇게 하는 거 아니야. 오늘은 여기까지."}, {"type": "dialogue", "speaker": "도겸", "text": "누님."}], "flags": ["intimate"], "thumb": "thumbs/5-052.svg"}, {"id": "5-053", "chapter": "5화. 역관리", "scene": "S#8 네 글씨 (503동 2402호 거실, 10월 1일 목 오후 3:00)", "width": 800, "height": 1520, "shot": "MS · 아이레벨 · 혜숙(중), 도겸(좌)", "screen": "위아래 2단. 위: 손가락을 거두며 웃는 혜숙, 혀끝으로 아랫입술을 훑고 왼쪽 입꼬리를 올리며 일어서는 도겸. 아래: 현관문이 닫힌 뒤 혜숙 혼자 확인서를 클리어파일에 넣는다, 웃음기가 빠진 얼굴, 볕이 발치에서 끊긴다. 효과음은 붓 효과음(East Sea Dokdo), 말풍선 위칸 우상과 아래칸 우하(낮게 깔린 굵은 테두리).", "summary": "위아래 2단.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "나이 들면 아껴 먹는 거야."}, {"type": "narration", "speaker": "내레이션", "text": "얼굴에 아쉬움이 남아 있었지만 그건 이기고 있는 남자의 아쉬움이었다."}, {"type": "sfx", "speaker": "SFX(중간, 회색)", "text": "철컥"}, {"type": "dialogue", "speaker": "혜숙", "text": "얘, 이제 네 글씨다."}], "flags": ["intimate"], "thumb": "thumbs/5-053.svg"}, {"id": "5-054", "chapter": "5화. 역관리", "scene": "S#9 1,870 (207동 803호 원룸, 10월 3일 토 밤 11:00)", "width": 800, "height": 1200, "shot": "LS · 아이레벨 · 세라(중)", "screen": "현관 안쪽(C1)에서 본 열 걸음짜리 원룸. 머리맡 간접등이 벽을 주황으로 물들이고, 창 너머 베란다의 흰 세탁기가 탈수로 덜컹거린다. 방 가운데 세라가 요가 매트를 펼친다(폼롤러, 작은 케틀벨, 행거의 민트 집업). 거울은 어디에도 없다. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 좌상 둘.", "summary": "현관 안쪽(C1)에서 본 열 걸음짜리 원룸.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "207동 803호는 열 걸음이면 끝나는 방이었다."}, {"type": "sfx", "speaker": "SFX(중간, 회색)", "text": "덜컹덜컹"}, {"type": "narration", "speaker": "내레이션", "text": "베란다에서는 세탁기가 탈수를 돌리며 덜컹거렸고, 방 안에는 유칼립투스 근육 연고와 섬유유연제 냄새가 섞여 있었다."}], "flags": ["intimate"], "thumb": "thumbs/5-054.svg"}, {"id": "5-055", "chapter": "5화. 역관리", "scene": "S#9 1,870 (207동 803호 원룸, 10월 3일 토 밤 11:00)", "width": 800, "height": 1200, "shot": "FS · 측면 · 세라(중)", "screen": "위아래 2단. 위: 매트 위 세라의 측면 전신, 민트 브라톱이 높고 탄탄한 가슴을 받치고 복근의 결에 간접등 음영, 레깅스가 골반뼈에서 허벅지 안쪽까지 한 줄로 조인다. 아래 INS: 왼손목 스마트워치 '음성 메모 녹음 중'(가상 UI, 식자). 내레이션 아래칸 하단.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "왼쪽 손목의 스마트워치에서는 음성 메모가 돌고 있었다."}], "flags": ["intimate"], "thumb": "thumbs/5-055.svg"}, {"id": "5-056", "chapter": "5화. 역관리", "scene": "S#9 1,870 (207동 803호 원룸, 10월 3일 토 밤 11:00)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 세라(좌), 도겸(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 들어서는 그를 보자마자 짧게 말하는 세라(직선 시선, 일자 입). 우: 이마의 머리 한 가닥을 넘기며 그녀의 맨허리를 잡는 도겸. 말풍선 좌상, 우상.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "오빠, 카드 이번 달까지 1,870이야."}, {"type": "dialogue", "speaker": "도겸", "text": "다음 달에 한 번에 정리할게. 너한테만 하는 얘긴데, 법인 카드 한도가 아버지 결재라서 그래."}], "flags": ["intimate"], "thumb": "thumbs/5-056.svg"}, {"id": "5-057", "chapter": "5화. 역관리", "scene": "S#9 1,870 (207동 803호 원룸, 10월 3일 토 밤 11:00)", "width": 800, "height": 1040, "shot": "MS · 하이 · 세라(중), 도겸(하단)", "screen": "위아래 2단. 위: 세라가 한 번 끄덕이며 손목의 워치를 흘깃 본다. 아래: 두 손바닥으로 그의 가슴을 밀어 매트에 눕히고 위에서 내려다본다, 포니테일 끝이 어깨를 친다. 말풍선 아래칸 좌상.", "summary": "위아래 2단.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "호흡, 호흡. 오늘은 내가 세요."}], "flags": ["intimate"], "thumb": "thumbs/5-057.svg"}, {"id": "5-058", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 1160, "shot": "MS · 하이 · 세라(중), 도겸(하단)", "screen": "위아래 2단. 위: 세라가 그의 셔츠를 걷어 올려 머리 위로 벗기고, 넓고 평평한 가슴이 주황 빛에 드러난다. 아래 INS: 뒤집힌 셔츠 소매에 그의 두 팔이 묶인 듯 걸려 머리 위에 머문다(시계와 흉터), 세라의 손은 풀지 않고 떠난다. 내레이션 아래칸 하단.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "세라는 그 팔을 풀어 주지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/5-058.svg"}, {"id": "5-059", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 1440, "shot": "MS · 측면 · 세라(중·실루엣), 도겸(하단)", "screen": "위아래 2단. 위: 그의 골반 위에 걸터앉은 세라가 브라톱 밑단을 쥐고 단번에 끌어올린다, 측면 빛이 갈비뼈와 복근에 금빛 선을 긋는다. 아래 INS: 땀에 젖어 짙어진 민트 천이 갈비뼈를 따라 말려 올라가고, 가슴 앞은 들어 올린 팔과 천, 그늘이 가린다. 효과음은 붓 효과음(East Sea Dokdo).", "summary": "위아래 2단.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "스륵"}], "flags": ["intimate"], "thumb": "thumbs/5-059.svg"}, {"id": "5-060", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 1560, "shot": "MS · 측면 · 세라(중·실루엣), 도겸(하단)", "screen": "천이 머리를 빠져나가고 포니테일이 등 뒤로 떨어지며 날개뼈를 친다. 벗겨진 천을 쥔 채 내리는 팔뚝이 가슴 앞선을 가리고, 측면 주황 빛이 구릿빛 어깨·쇄골·오르내리는 복근 옆선에만 하이라이트를 남기며 앞면은 그늘(전경에 흐린 폼롤러). 세라가 소매가 감긴 그의 손을 끌어다 자기 허리에 얹고 손등을 한 번 눌러 고정한다. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 상단과 하단.", "summary": "천이 머리를 빠져나가고 포니테일이 등 뒤로 떨어지며 날개뼈를 친다.", "lines": [{"type": "sfx", "speaker": "SFX(중간)", "text": "철썩"}, {"type": "narration", "speaker": "내레이션", "text": "구릿빛 어깨, 단단한 가슴의 곡선, 숨 쉴 때마다 오르내리는 복근."}, {"type": "narration", "speaker": "내레이션", "text": "딱 거기까지만 허락했다."}], "flags": ["intimate"], "thumb": "thumbs/5-060.svg"}, {"id": "5-061", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 880, "shot": "CU · 측면 · 세라(좌), 도겸(우)", "screen": "위아래 2단. 위: 몸을 숙인 세라가 그의 귓가에 숨을 내쉬고, 젖은 포니테일 끝이 그의 가슴을 쓸고 지나간다. 아래: 몸을 낮추며 코치처럼 낮고 일정하게 말하는 입술과 턱선. 말풍선 아래칸 좌상, 우하.", "summary": "위아래 2단.", "lines": [{"type": "dialogue", "speaker": "세라", "text": "들이마시고."}, {"type": "dialogue", "speaker": "세라", "text": "내쉬고."}], "flags": ["intimate"], "thumb": "thumbs/5-061.svg"}, {"id": "5-062", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 600, "shot": "INS · 측면 · 세라(중·실루엣), 도겸(하단)", "screen": "가로 4분할의 같은 구도. 스마트워치 심박 숫자가 칸마다 오른다(식자). 세라는 어깨·턱선 실루엣만 메트로놈 같은 같은 간격으로 낮아졌다 높아진다(가슴 아래는 프레임 밖). 4칸에서 그가 박자를 앞당기려 들썩이자 그녀의 손바닥이 그의 어깨를 매트에 붙드는 압력선. 내레이션은 네 칸 위를 가로지른다.", "summary": "가로 4분할의 같은 구도.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그녀가 숫자를 셌다. 넷에 내려가고 넷에 올라왔다."}], "flags": ["intimate"], "thumb": "thumbs/5-062.svg"}, {"id": "5-063", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 800, "shot": "INS · 로우 · 세라(중)", "screen": "매트 높이(C2), 전경의 매트 끝과 폼롤러가 아래를 가린다. 그 너머 레깅스가 허벅지에서 말려 벗겨지고(골반뼈 옆 붉은 밴드 자국), 위쪽 손목의 워치가 녹음 중 빨간 점으로 깜빡이자 세라의 눈이 그것을 한 번 확인한다. 내레이션 상단.", "summary": "매트 높이(C2), 전경의 매트 끝과 폼롤러가 아래를 가린다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "레깅스가 허벅지에서 벗겨져 나가는 동안에도 카운트는 흐트러지지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/5-063.svg"}, {"id": "5-064", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 440, "shot": "ECU · 측면 · 세라(중)", "screen": "쇄골의 오목한 곳에 맺힌 땀 한 방울이 가슴 사이 골로 흘러내리기 시작하는 순간(쇄골과 가슴 윗선까지만, 아래는 그늘). 효과음 없이 정지.", "summary": "쇄골의 오목한 곳에 맺힌 땀 한 방울이 가슴 사이 골로 흘러내리기 시작하는 순간(쇄골과 가슴 윗선까지만, 아", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/5-064.svg"}, {"id": "5-065", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 1400, "shot": "MS · 측면 · 세라(중·실루엣), 도겸(하단)", "screen": "세라가 상체를 뒤로 젖혀 그의 정강이를 짚는다, 목선에서 골반까지 활 같은 측면 실루엣에 림라이트만(뒤로 젖힌 팔과 흘러내린 포니테일이 가슴 앞선을 가리고, 림라이트는 등·어깨·쇄골·복근 옆선에만, 전경에 침대 모서리). 자세가 바뀌는 순간 그의 턱이 들린다. 그녀는 눈을 감지 않고 자기 각도를 아는 얼굴로 천장 한 점을 본다. 내레이션 위쪽 빈 벽에.", "summary": "세라가 상체를 뒤로 젖혀 그의 정강이를 짚는다, 목선에서 골반까지 활 같은 측면 실루엣에 림라이트만(뒤로 젖", "lines": [{"type": "narration", "speaker": "내레이션", "text": "자세가 바뀌자 그의 숨이 끊겼다."}, {"type": "narration", "speaker": "내레이션", "text": "거울 하나 없는 방에서 그녀는 자기 몸이 지금 어떤 각도인지 정확히 알았다. 매일 거울 벽 앞에서 남의 골반 각도를 고쳐 주는 사람이었다."}], "flags": ["intimate"], "thumb": "thumbs/5-065.svg"}, {"id": "5-066", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 1160, "shot": "INS · 아이레벨 · 세라(우)", "screen": "위아래 2단. 위: 베란다 창 너머 세탁기 드럼이 탈수 정점으로 흔들리고 진동선이 방바닥까지 번진다. 아래 CU: 숫자를 짧게 끊던 세라의 입술이 벌어진 채 멈춘다(턱과 입술만 주황 빛). 효과음은 위칸만 붓 효과음(East Sea Dokdo) 대형, 아래칸은 여백, 내레이션 하단.", "summary": "위아래 2단.", "lines": [{"type": "sfx", "speaker": "SFX(대형, 회색)", "text": "덜컹덜컹덜컹"}, {"type": "narration", "speaker": "내레이션", "text": "세라의 카운트가 셋, 둘, 하나로 짧아졌고, 마지막 소리는 숫자가 아니었다."}], "flags": ["intimate"], "thumb": "thumbs/5-066.svg"}, {"id": "5-067", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 520, "shot": "INS · 측면 · 세라(중), 도겸(손)", "screen": "가로 2분할. 좌: 갈라진 복근이 길게 떨린다(잔떨림 선, 배꼽 아래는 그늘). 우: 그녀의 허리를 붙들던 그의 손(소매가 감긴 손목, 시계와 흉터)에서 힘이 빠져 손가락이 펴진다.", "summary": "가로 2분할.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/5-067.svg"}, {"id": "5-068", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 1240, "shot": "MS · 로우 · 세라(중), 도겸(중)", "screen": "매트 높이(C2), 전경의 폼롤러와 매트 끝이 허리 아래를 가린다. 세탁기가 멈춘 방이 넓어 보이고, 매트 옆에 젖은 브라톱과 말린 레깅스가 흩어져 있다. 그는 천장을 보며 웃고, 그녀는 그의 가슴 위에 엎드려 있다(맨등, 젖은 포니테일, 허리 위 두 보조개). 내레이션 좌상, 말풍선 우상.", "summary": "매트 높이(C2), 전경의 폼롤러와 매트 끝이 허리 아래를 가린다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "방이 갑자기 넓어진 것처럼 조용했다."}, {"type": "dialogue", "speaker": "도겸", "text": "너 진짜 최고다."}], "flags": ["intimate"], "thumb": "thumbs/5-068.svg"}, {"id": "5-069", "chapter": "5화. 역관리", "scene": "S#10 오늘은 내가 세요 (207동 803호 원룸 요가 매트 위, 10월 3일 토 밤, S#9에서 연속)", "width": 800, "height": 1200, "shot": "INS · 하이 · 세라(손)", "screen": "위아래 2단. 위: 엎드린 세라가 왼손목을 든다, 워치 화면 '음성 메모 52:08 / 심박수 168'(가상 UI, 식자). 아래: 엄지가 녹음을 저장하고 파일 이름을 '바나나 우유'로 바꾼다(식자), 화면 빛이 콧등 주근깨를 비춘다. 내레이션 위칸 우상, 아래칸 하단.", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "운동으로 치면 고강도 인터벌이었다."}, {"type": "narration", "speaker": "내레이션", "text": "그녀는 녹음을 저장하고 파일 이름을 '바나나 우유'로 바꿨다."}], "flags": ["intimate"], "thumb": "thumbs/5-069.svg"}, {"id": "5-070", "chapter": "5화. 역관리", "scene": "S#11 네 모서리 (더퍼스트 클럽 지하 1층 여탕 세신실, 10월 5일 월 오전 11:00)", "width": 800, "height": 1240, "shot": "LS · 아이레벨 · 유진(중), 순옥(우), 혜숙(좌·전경)", "screen": "열탕 턱(C1)에서 김 너머로 본 세신 코너. 세신대에 엎드린 유진의 흰 등(허리 아래 수건)을 순옥이 이태리타월로 견갑골에서 허리까지 한 번에 길게 민다. 전경 왼쪽에 머리에 수건을 올린 혜숙의 어깨, 화면 앞 3분의 1은 두꺼운 김. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 좌상과 우하.", "summary": "열탕 턱(C1)에서 김 너머로 본 세신 코너.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "세신실의 김이 형광등 빛을 뿌옇게 풀어 놓았다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "쪼르르"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "탁"}, {"type": "narration", "speaker": "내레이션", "text": "등을 미는 손은 두껍고 따뜻했다."}], "flags": [], "thumb": "thumbs/5-070.svg"}, {"id": "5-071", "chapter": "5화. 역관리", "scene": "S#11 네 모서리 (더퍼스트 클럽 지하 1층 여탕 세신실, 10월 5일 월 오전 11:00)", "width": 800, "height": 560, "shot": "MS · 아이레벨 · 혜숙(좌), 유진(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 열탕 가장자리의 혜숙이 머리 위 수건을 고치며 묻는다(김 너머 어깨까지). 우: 팔에 뺨을 댄 유진이 눈만 떠서 답한다(입꼬리만 조금). 말풍선 좌상, 우하.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "혜숙", "text": "얘, 케이크는 어디서 맞췄니?"}, {"type": "dialogue", "speaker": "유진", "text": "다섯 개 다 따로요. 생일이니까요."}], "flags": [], "thumb": "thumbs/5-071.svg"}, {"id": "5-072", "chapter": "5화. 역관리", "scene": "S#11 네 모서리 (더퍼스트 클럽 지하 1층 여탕 세신실, 10월 5일 월 오전 11:00)", "width": 800, "height": 760, "shot": "INS · 하이 · 순옥(손), 유진(하단)", "screen": "위아래 2단. 위: 등 위의 굵은 손이 반 박자 늦게 내려간다(잔상 간격이 한 칸 벌어짐). 아래: 순옥이 대야 물을 등에 끼얹고 김이 일어난다. 내레이션 위칸 상단, 효과음은 아래칸 붓 효과음(East Sea Dokdo).", "summary": "위아래 2단.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "등 위의 손이 반 박자 늦게 내려갔다. 유진은 알아채지 못했다."}, {"type": "sfx", "speaker": "SFX(중간, 흰색)", "text": "촤아"}], "flags": [], "thumb": "thumbs/5-072.svg"}, {"id": "5-073", "chapter": "5화. 역관리", "scene": "S#11 네 모서리 (더퍼스트 클럽 지하 1층 여탕 세신실, 10월 5일 월 오전 11:00)", "width": 800, "height": 1120, "shot": "CU · 아이레벨 · 순옥(중), 유진(하단)", "screen": "김 너머 낮게 숙인 이마와 희끗한 머리만 보이는 순옥, 아래 얼굴은 김에 잠긴다. 화면 아래쪽에 고개를 조금 돌린 유진의 옆얼굴(나른한 눈매가 김 쪽을 향함). 내레이션 상단, 말풍선 중앙과 하단.", "summary": "김 너머 낮게 숙인 이마와 희끗한 머리만 보이는 순옥, 아래 얼굴은 김에 잠긴다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "세신사가 처음으로 입을 열었다."}, {"type": "dialogue", "speaker": "순옥", "text": "아드님이 몇 살이에요?"}, {"type": "dialogue", "speaker": "유진", "text": "다섯 살이요. 아빠를 많이 닮았어요."}], "flags": [], "thumb": "thumbs/5-073.svg"}, {"id": "5-074", "chapter": "5화. 역관리", "scene": "S#11 네 모서리 (더퍼스트 클럽 지하 1층 여탕 세신실, 10월 5일 월 오전 11:00)", "width": 800, "height": 1000, "shot": "INS · 하이 · 순옥(손), 유진(하단)", "screen": "세로 3단 같은 구도. ① 등 한가운데에서 타월 감은 손이 멈춘다(손등 힘줄, 파스). ② 그대로, 물방울만 비닐을 굴러 내려가고 팔 위 유진의 손가락이 한 번 접힌다. ③ 손이 다시 움직인다. 효과음 없음, 내레이션 ①②칸 사이, 말풍선 ③칸 김 속에 작게.", "summary": "세로 3단 같은 구도.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "손이 멈췄다. 이번에는 유진도 알았다. 한 박자, 두 박자. 손은 다시 움직였다."}, {"type": "dialogue", "speaker": "순옥", "text": "등이 많이 뭉쳤네요."}], "flags": [], "thumb": "thumbs/5-074.svg"}, {"id": "5-075", "chapter": "5화. 역관리", "scene": "S#11 네 모서리 (더퍼스트 클럽 지하 1층 여탕 세신실, 10월 5일 월 오전 11:00)", "width": 800, "height": 1480, "shot": "INS · 부감 · 순옥(손), 유진(중)", "screen": "세신 코너 위(C3) 부감. 순옥의 굵은 손이 흰 수건을 반으로, 다시 반으로 접어(두 단계) 네 모서리가 맞은 수건을 유진의 등 위에 얹는다. 옆 선반에 바가지와 쑥 비누. 김이 내려앉아 공기가 투명해지고 수건 아래로 긴 여백. 내레이션 상단과 하단.", "summary": "세신 코너 위(C3) 부감.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그게 전부였다."}, {"type": "narration", "speaker": "내레이션", "text": "네 모서리가 정확히 맞아 있었다. 유진은 그 손이 수건 모서리를 맞추던 모양을 오래 기억하게 될 줄 몰랐다."}], "flags": [], "thumb": "thumbs/5-075.svg"}, {"id": "5-076", "chapter": "5화. 역관리", "scene": "S#12 안경을 벗지 않는 밤 (412동 502호, 10월 6일 화 밤 9:00)", "width": 800, "height": 1240, "shot": "LS · 아이레벨 · 하린(중)", "screen": "방 문가(C1)에서 창을 본다. 창에 첫 가을비가 비스듬히 긋고, 스탠드의 노란 원 안에 법전과 형사소송법 문제집, 노트북. 원 안에 선 하린의 하늘색 니트가 마른 어깨선을 드러낸 채 가슴의 볼륨에 팽팽하게 걸리고, 짧은 치마 아래 허벅지가 하얗게 뜬다. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 좌상 둘.", "summary": "방 문가(C1)에서 창을 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "밤 아홉 시, 412동 502호 창문에 그해 첫 가을비가 비스듬히 그어졌다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "쏴아—"}, {"type": "narration", "speaker": "내레이션", "text": "프린터에서 막 나온 종이의 토너 냄새와 식은 믹스커피 냄새가 났다."}], "flags": ["intimate"], "thumb": "thumbs/5-076.svg"}, {"id": "5-077", "chapter": "5화. 역관리", "scene": "S#12 안경을 벗지 않는 밤 (412동 502호, 10월 6일 화 밤 9:00)", "width": 800, "height": 1040, "shot": "FS · 아이레벨 · 도겸(중), 하린(전경·좌)", "screen": "위아래 2단. 위 INS: 노트북 녹음 앱의 파형이 빗소리에 잔물결을 그린다(가상 UI). 아래: 현관 센서등 아래 들어선 도겸, 젖은 머리칼에 빗방울, 손에 든 크림색 쇼핑백의 입구가 투명 테이프 세 겹으로 번들거린다. 효과음은 붓 효과음(East Sea Dokdo) 아주 작게, 내레이션 아래칸 하단.", "summary": "위아래 2단.", "lines": [{"type": "sfx", "speaker": "SFX(아주 작게)", "text": "지지직"}, {"type": "narration", "speaker": "내레이션", "text": "그가 들어왔다."}], "flags": [], "thumb": "thumbs/5-077.svg"}, {"id": "5-078", "chapter": "5화. 역관리", "scene": "S#12 안경을 벗지 않는 밤 (412동 502호, 10월 6일 화 밤 9:00)", "width": 800, "height": 920, "shot": "MS · 아이레벨 · 하린(좌), 도겸(우)", "screen": "하린이 그를 맞자마자 상환 안내문을 내민다(원형 마크, 글자는 식자). 안경 너머 큰 눈, 붉은 귀 끝, 말이 빨라져 긴 말풍선이 오른쪽으로 꺾여 줄달음친다. 쇼핑백을 든 채 내려다보는 도겸. 말풍선 좌상에서 우하로, 내레이션 하단 작게.", "summary": "하린이 그를 맞자마자 상환 안내문을 내민다(원형 마크, 글자는 식자).", "lines": [{"type": "dialogue", "speaker": "하린", "text": "오빠, 이거 봐요. 학자금 상환 독촉이에요. 이번 달 안에 안 갚으면 연체 등록돼요. 연체 등록되면 변호사 시험 끝나고 채용할 때도—"}, {"type": "narration", "speaker": "내레이션", "text": "말이 점점 빨라졌다."}], "flags": [], "thumb": "thumbs/5-078.svg"}, {"id": "5-079", "chapter": "5화. 역관리", "scene": "S#12 안경을 벗지 않는 밤 (412동 502호, 10월 6일 화 밤 9:00)", "width": 800, "height": 1120, "shot": "INS · 하이 · 하린(좌), 도겸(우)", "screen": "위아래 2단. 위: 그의 왼손 검지가 하린의 입술에 닿아 앞 컷 말풍선의 꼬리가 뚝 끊긴다(시계와 흉터). 아래(C2): 그가 쇼핑백을 법전 옆, 스탠드 아래에 내려놓는다, 테이프가 번들거린다. 말풍선 아래칸 우상, 낮게.", "summary": "위아래 2단.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "5천만 원이야. 은행 거래 기록 남으면 아버지 쪽에 걸려. 한 달 뒤에 열어."}], "flags": ["intimate"], "thumb": "thumbs/5-079.svg"}, {"id": "5-080", "chapter": "5화. 역관리", "scene": "S#12 안경을 벗지 않는 밤 (412동 502호, 10월 6일 화 밤 9:00)", "width": 800, "height": 1240, "shot": "CU · 아이레벨 · 하린(중)", "screen": "하린이 검지로 안경을 밀어 올린다, 이미 맨 위인데도. 렌즈에 스탠드의 노란 원과 그의 손이 작게 비치고, 반쯤 감긴 눈이 렌즈 너머에서 또렷해진다. 내레이션 얼굴 둘레, 말풍선 하단.", "summary": "하린이 검지로 안경을 밀어 올린다, 이미 맨 위인데도.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "9월 12일 새벽, 그는 그녀의 안경을 벗겨 법전 위에 접어 놓았었다. 오늘 그녀는 안경을 벗지 않았다."}, {"type": "narration", "speaker": "내레이션", "text": "렌즈 너머로 그의 손이 어디로 가는지 다 보고 싶었다."}, {"type": "dialogue", "speaker": "하린", "text": "왜 한 달 뒤예요?"}], "flags": [], "thumb": "thumbs/5-080.svg"}, {"id": "5-081", "chapter": "5화. 역관리", "scene": "S#12 안경을 벗지 않는 밤 (412동 502호, 10월 6일 화 밤 9:00)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 도겸(좌), 하린(우)", "screen": "가로 2분할 숏·리버스숏. 좌: 머리 한 가닥을 넘기고 왼손으로 귓불을 만지며 눈을 맞추는 도겸(시계와 흉터). 우: 귓불의 그 손을 안경 너머로 보는 하린. 말풍선 좌상, 우하.", "summary": "가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "너한테만 하는 얘긴데, 지금 아버지 쪽에 감사가 들어와 있어. 한 달만 묵혀. 그다음엔 네 맘대로 해."}, {"type": "dialogue", "speaker": "하린", "text": "약속해요."}], "flags": [], "thumb": "thumbs/5-081.svg"}, {"id": "5-082", "chapter": "5화. 역관리", "scene": "S#12 안경을 벗지 않는 밤 (412동 502호, 10월 6일 화 밤 9:00)", "width": 800, "height": 1560, "shot": "MS · 측면 · 하린(좌), 도겸(우)", "screen": "세로 3단. ① 짧게 답하며 그녀를 끌어당기는 도겸. ② 하린이 먼저 그의 목에 팔을 감고 발끝을 세워 아랫입술을 물었다가 천천히 놓는다(입술 ECU, 금테가 그의 뺨에 닿음). ③ 니트 밑단으로 내려오는 그의 손등을 하린의 가는 손이 꾹 눌러 멈춘다. 말풍선 ①칸 우상·③칸 좌하, 내레이션 ②칸 상단.", "summary": "세로 3단.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "약속."}, {"type": "narration", "speaker": "내레이션", "text": "이번에는 하린이 먼저 그의 목에 팔을 감았다."}, {"type": "dialogue", "speaker": "하린", "text": "오늘은 공부해야 돼요. 내일 형소법 쪽지시험이에요."}], "flags": ["intimate"], "thumb": "thumbs/5-082.svg"}, {"id": "5-083", "chapter": "5화. 역관리", "scene": "S#13 휘파람 (412동 5층 복도와 계단, 10월 6일 화 밤 9:20)", "width": 800, "height": 640, "shot": "MS · 아이레벨 · 도겸(중)", "screen": "502호 현관에서 돌아선 도겸이 아쉽다는 듯 웃는다(왼쪽 입꼬리). 닫히는 문틈 너머 복도 센서등이 켜지고, 입가에서 휘파람 첫 음표 효과가 흘러나온다. 효과음은 붓 효과음(East Sea Dokdo) 작게.", "summary": "502호 현관에서 돌아선 도겸이 아쉽다는 듯 웃는다(왼쪽 입꼬리).", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "휘—"}], "flags": [], "thumb": "thumbs/5-083.svg"}, {"id": "5-084", "chapter": "5화. 역관리", "scene": "S#13 휘파람 (412동 5층 복도와 계단, 10월 6일 화 밤 9:20)", "width": 800, "height": 1120, "shot": "LS · 뒷모습 · 도겸(중)", "screen": "5층 복도(C4). 502호 문 앞을 지나 비상계단 문으로 걸어가는 가벼운 뒷모습, 한 손은 주머니에. 휘파람 음표가 어깨 위로 흘러 계단 문 쪽으로 늘어지고, 복도 끝 창에 빗줄기. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 하단.", "summary": "5층 복도(C4).", "lines": [{"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "휘— 휘휘—"}, {"type": "narration", "speaker": "내레이션", "text": "이기고 있는 남자의 휘파람이었다."}], "flags": [], "thumb": "thumbs/5-084.svg"}, {"id": "5-085", "chapter": "5화. 역관리", "scene": "S#13 휘파람 (412동 5층 복도와 계단, 10월 6일 화 밤 9:20)", "width": 800, "height": 840, "shot": "INS · 부감 · 도겸(하단)", "screen": "계단실을 위에서 내려다본 나선 구도. 층마다 센서등이 켜지며 난간을 쥔 손(시계)과 젖은 로퍼가 계단참을 빠르게 돈다. 계단창의 빗줄기가 굵고 음표는 아래로 갈수록 작아진다. 효과음은 붓 효과음(East Sea Dokdo).", "summary": "계단실을 위에서 내려다본 나선 구도.", "lines": [{"type": "sfx", "speaker": "SFX(아주 작게)", "text": "휘—"}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "쏴아—"}], "flags": [], "thumb": "thumbs/5-085.svg"}, {"id": "5-086", "chapter": "5화. 역관리", "scene": "S#13 휘파람 (412동 5층 복도와 계단, 10월 6일 화 밤 9:20)", "width": 800, "height": 560, "shot": "LS · 아이레벨 · 인물 없음", "screen": "다시 텅 빈 5층 복도, 502호 문은 닫혀 있다. 센서등이 꺼지며 화면이 한 톤 어두워지고 끝 창의 빗소리만 남는다. 효과음은 붓 효과음(East Sea Dokdo) 작게.", "summary": "다시 텅 빈 5층 복도, 502호 문은 닫혀 있다.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "딸깍"}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "쏴아—"}], "flags": [], "thumb": "thumbs/5-086.svg"}, {"id": "5-087", "chapter": "5화. 역관리", "scene": "S#14 열지 않은 봉투 (412동 502호, 10월 6일 화 밤 9:21)", "width": 800, "height": 1040, "shot": "MS · 아이레벨 · 하린(중)", "screen": "위아래 2단. 위: 도어락을 잠그고 문에 등을 댄 하린(아직 붉은 귀). 아래: 쇼핑백 끈을 두 손으로 들어 올리자 가는 손목이 묵직하게 처지고 어깨가 한쪽으로 기운다. 효과음은 위칸 붓 효과음(East Sea Dokdo), 내레이션 아래칸 하단.", "summary": "위아래 2단.", "lines": [{"type": "sfx", "speaker": "SFX(중간)", "text": "철컥"}, {"type": "narration", "speaker": "내레이션", "text": "묵직했다. 5만원권 천 장이면 대략 1킬로그램. 손목에 걸리는 무게가 계산과 비슷했다."}], "flags": [], "thumb": "thumbs/5-087.svg"}, {"id": "5-088", "chapter": "5화. 역관리", "scene": "S#14 열지 않은 봉투 (412동 502호, 10월 6일 화 밤 9:21)", "width": 800, "height": 560, "shot": "INS · 하이 · 하린(손)", "screen": "C2 상판 높이. 테이프 끝을 긁던 짧은 손톱이 멈춘다(형광펜 잉크 묻은 손가락, 조금 들린 테이프 끝). 옆에 노트북 녹음 파형이 작게 보인다. 내레이션 상단과 하단.", "summary": "C2 상판 높이.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "열지 않은 봉투가 증거로는 더 깨끗했다."}, {"type": "narration", "speaker": "내레이션", "text": "그가 '5천만 원'이라고 말한 목소리는 이미 노트북 안에 있었다."}], "flags": [], "thumb": "thumbs/5-088.svg"}, {"id": "5-089", "chapter": "5화. 역관리", "scene": "S#14 열지 않은 봉투 (412동 502호, 10월 6일 화 밤 9:21)", "width": 800, "height": 1080, "shot": "MS · 뒷모습 · 하린(중)", "screen": "하린이 머리끈을 입에 물고 하프업을 풀어 긴 생머리를 높이 하나로 질끈 묶는다. 굽어 있던 등이 곧게 펴지고, 스탠드 빛이 드러난 목덜미와 마른 어깨를 노랗게 덮는다. 창의 빗줄기가 그 너머로 비스듬하다. 내레이션 하단.", "summary": "하린이 머리끈을 입에 물고 하프업을 풀어 긴 생머리를 높이 하나로 질끈 묶는다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "결심할 때 하는 일이었다."}], "flags": [], "thumb": "thumbs/5-089.svg"}, {"id": "5-090", "chapter": "5화. 역관리", "scene": "S#14 열지 않은 봉투 (412동 502호, 10월 6일 화 밤 9:21)", "width": 800, "height": 1000, "shot": "INS · POV(하린) · 인물 없음", "screen": "휴대폰 카메라 화면(가상 UI) 안의 구도: 스탠드 아래 법전 옆에 세운 크림색 쇼핑백, 번들거리는 테이프. 가장자리에 셔터 버튼과 엄지. 효과음은 붓 효과음(East Sea Dokdo), 내레이션 하단.", "summary": "휴대폰 카메라 화면(가상 UI) 안의 구도: 스탠드 아래 법전 옆에 세운 크림색 쇼핑백, 번들거리는 테이프.", "lines": [{"type": "sfx", "speaker": "SFX(작게, 흰색)", "text": "찰칵"}, {"type": "narration", "speaker": "내레이션", "text": "법전 옆, 테이프가 번들거리는 백화점 쇼핑백."}], "flags": [], "thumb": "thumbs/5-090.svg"}, {"id": "5-091", "chapter": "5화. 역관리", "scene": "S#15 숫자 4 (Insert — 단톡방 '물결놀이터 엄마들', 10월 6일 화 밤 9:23)", "width": 800, "height": 760, "shot": "TXT · POV(하린) · 인물 없음", "screen": "단톡방 화면. 대화창 맨 아래에 쇼핑백 사진이 큰 썸네일로 붙는다(법전과 번들거리는 테이프). 방 이름 옆 인원 '5'(식자). 내레이션 상단 둘.", "summary": "단톡방 화면.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "단톡방 '물결놀이터 엄마들'을 열고 사진을 올렸다."}, {"type": "narration", "speaker": "내레이션", "text": "그리고 한 줄을 쳤다."}], "flags": [], "thumb": "thumbs/5-091.svg"}, {"id": "5-092", "chapter": "5화. 역관리", "scene": "S#15 숫자 4 (Insert — 단톡방 '물결놀이터 엄마들', 10월 6일 화 밤 9:23)", "width": 800, "height": 440, "shot": "TXT · POV(하린) · 인물 없음", "screen": "사진 아래 입력창, 엄지가 한 줄을 치고 전송한다. 새 말풍선 옆에 읽지 않은 사람 수 '4'가 노랗게 뜬다(식자).", "summary": "사진 아래 입력창, 엄지가 한 줄을 치고 전송한다.", "lines": [{"type": "dialogue", "speaker": "문자(하린→단톡방)", "text": "생일날 같이 열어요."}], "flags": [], "thumb": "thumbs/5-092.svg"}, {"id": "5-093", "chapter": "5화. 역관리", "scene": "S#15 숫자 4 (Insert — 단톡방 '물결놀이터 엄마들', 10월 6일 화 밤 9:23)", "width": 800, "height": 480, "shot": "INS · POV(하린) · 인물 없음", "screen": "가로 5분할. 같은 말풍선 옆 숫자가 칸마다 '4', '3', '2', '1'로 줄고 다섯째 칸에서 사라진다(식자, 노란색, 칸마다 초침 눈금 하나). 효과음 없이 내레이션이 다섯 칸 아래를 가로지른다.", "summary": "가로 5분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "읽지 않은 사람 수를 알리는 숫자 4가 3, 2, 1을 지나 사라지는 데 3초가 걸렸다."}], "flags": [], "thumb": "thumbs/5-093.svg"}, {"id": "5-094", "chapter": "5화. 역관리", "scene": "S#15 숫자 4 (Insert — 단톡방 '물결놀이터 엄마들', 10월 6일 화 밤 9:23)", "width": 800, "height": 1800, "shot": "INS · 하이 · 인물 없음", "screen": "회차 끝 훅. C2 상판 높이에서 본 책상: 스탠드의 노란 원 안에 테이프가 번들거리는 크림색 쇼핑백이 법전 옆에 봉한 채 서 있고, 그 앞 켜진 휴대폰에 숫자가 사라진 '생일날 같이 열어요' 말풍선. 뒤 창의 빗줄기가 굵어져 유리를 타고 흐르고, 위로 긴 어둠의 여백. 효과음은 붓 효과음(East Sea Dokdo) 대형, 내레이션은 아래 여백 한가운데.", "summary": "회차 끝 훅.", "lines": [{"type": "sfx", "speaker": "SFX(대형, 회색)", "text": "쏴아아—"}, {"type": "narration", "speaker": "내레이션", "text": "10월 16일까지 열흘이 남아 있었다."}], "flags": [], "thumb": "thumbs/5-094.svg"}, {"id": "6-001", "chapter": "6화. 생일", "scene": "S#1 비어 있는 칸 (지하 2층 주차장 B구역 검정 세단 운전석, 10월 16일 금 저녁 6:30)", "width": 800, "height": 1280, "shot": "LS · 아이레벨 · 도겸(후경·좌)", "screen": "B구역 통로 가운데(C2)에서 남쪽 출구 경사로를 본다. 경사로를 줄지어 내려오는 퇴근 차들의 헤드라이트가 주황 띠 두른 기둥을 하나씩 하얗게 훑고, 동쪽 벽 칸에 앞을 벽에 댄 로고 없는 검정 대형 세단 운전석에 작은 사람 그림자가 앉아 있다. 반들거리는 녹색 에폭시 바닥에 빛줄기가 길게 번지고, 효과음은 천장 제트팬 옆에 붓 효과음(East Sea Dokdo)으로 작게. 내레이션 박스 좌상과 우하.", "summary": "B구역 통로 가운데(C2)에서 남쪽 출구 경사로를 본다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "저녁 여섯 시 반, 지하 2층 B구역으로 퇴근 차들이 줄지어 내려오며 헤드라이트로 기둥을 하나씩 훑고 지나갔다."}, {"type": "sfx", "speaker": "SFX(작게, 회색)", "text": "웅웅—"}, {"type": "narration", "speaker": "내레이션", "text": "환풍기가 낮게 돌았고, 배기가스와 젖은 콘크리트 냄새 위로 열어 둔 트렁크의 향수 냄새가 얇게 떠 있었다."}], "flags": [], "thumb": "thumbs/6-001.svg"}, {"id": "6-002", "chapter": "6화. 생일", "scene": "S#1 비어 있는 칸 (지하 2층 주차장 B구역 검정 세단 운전석, 10월 16일 금 저녁 6:30)", "width": 800, "height": 1000, "shot": "MS · 측면 · 도겸(좌)", "screen": "가로 2분할. 좌: 운전석 옆 창 너머, 등받이에 깊이 기대 다리를 넓게 벌린 도겸의 무릎 위에 무광 블랙 메인폰과 무광 그레이 세컨폰이 나란히 놓였고, 지나가는 헤드라이트가 앞유리를 하얗게 쓸며 왼쪽 입꼬리만 올라간 옆얼굴을 한순간 비춘다. 우: 세컨폰 월간 캘린더(가상 UI, 글자는 식자), 10월 칸이 회색·버건디·민트·하늘색·금색 블록으로 빈틈없이 찼고 16일 금요일 19:00 칸 하나만 흰 칸으로 남아 있다(화면 아래에 왼손 엄지와 시계, 흉터). 내레이션 박스는 좌칸 상단에 둘, 우칸 하단에 하나.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "금요일 저녁 일곱 시는 요즘 그의 캘린더에서 유일하게 아무 색도 칠해지지 않은 칸이었다. 열 시에 콜을 잡기 전까지 세 시간의 공백."}, {"type": "narration", "speaker": "내레이션", "text": "한 달 내내 빈틈없이 꽉 찼던 캘린더에서 그 칸 하나만 살아남았다는 걸, 그는 이상하게 여기지 않았다. 인기란 원래 그런 거였다."}], "flags": [], "thumb": "thumbs/6-002.svg"}, {"id": "6-003", "chapter": "6화. 생일", "scene": "S#1 비어 있는 칸 (지하 2층 주차장 B구역 검정 세단 운전석, 10월 16일 금 저녁 6:30)", "width": 800, "height": 680, "shot": "INS · 하이 · 인물 없음", "screen": "가로 2분할. 좌: 무릎 위 세컨폰이 네 번 연달아 떨며 진동선이 네 겹 퍼지고, 반 박자 늦게 메인폰이 한 번 떤다(대시보드 시계 18:30, 식자). 우: 메인폰 메신저 화면(노란 말풍선 메신저 느낌의 가상 UI), 회색 #9A9EA3 테두리 말풍선 하나와 흐린 가족사진 프로필 썸네일, 메시지는 식자. 효과음은 붓 효과음(East Sea Dokdo), 좌칸에 네 개를 계단식으로, 하나는 떨어뜨려 작게.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "18시 30분. 세컨폰이 네 번 연달아 떨었다. 반 박자 늦게 메인폰이 한 번 떨었다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "지잉, 지잉, 지잉, 지잉… 지잉"}, {"type": "dialogue", "speaker": "문자(유진→도겸)", "text": "여보, 오늘 제 생일이에요. 일곱 시까지 집으로 와요. 지호는 외갓집에 보냈어요."}], "flags": [], "thumb": "thumbs/6-003.svg"}, {"id": "6-004", "chapter": "6화. 생일", "scene": "S#1 비어 있는 칸 (지하 2층 주차장 B구역 검정 세단 운전석, 10월 16일 금 저녁 6:30)", "width": 800, "height": 760, "shot": "INS · POV(도겸) · 인물 없음", "screen": "가로 2분할, 세컨폰 대화방 두 개(가상 UI). 좌: 대화방 상단에 그가 미란에게 보여 주는 와인 잔 사진 멀티프로필, 버건디 #7A1E2E 점이 붙은 말풍선. 우: 그가 세라에게 보여 주는 덤벨 사진 멀티프로필, 민트 #7FD1BE 점. 칸 경계를 넘는 엄지 잔상선, 메시지는 식자.", "summary": "가로 2분할, 세컨폰 대화방 두 개(가상 UI).", "lines": [{"type": "dialogue", "speaker": "문자(미란→도겸)", "text": "자기야, 오늘 내 생일. 일곱 시. 우리 집. 소이는 아빠한테 보냈어."}, {"type": "dialogue", "speaker": "문자(세라→도겸)", "text": "오빠 오늘 내 생일. 7시. 우리 집. 늦으면 플랭크 5분."}], "flags": [], "thumb": "thumbs/6-004.svg"}, {"id": "6-005", "chapter": "6화. 생일", "scene": "S#1 비어 있는 칸 (지하 2층 주차장 B구역 검정 세단 운전석, 10월 16일 금 저녁 6:30)", "width": 800, "height": 760, "shot": "INS · POV(도겸) · 인물 없음", "screen": "가로 2분할, 이어서. 좌: 책 사진 멀티프로필 대화방, 하늘색 #9CC7E8 점. 우: 골프장 사진 멀티프로필 대화방, 금색 #C9A45C 점. 엄지 잔상선이 같은 방향으로 한 번 더 지나가고, 메시지는 식자.", "summary": "가로 2분할, 이어서.", "lines": [{"type": "dialogue", "speaker": "문자(하린→도겸)", "text": "오빠, 오늘 제 생일이에요. 일곱 시에 와 주세요. 할 말 있어요."}, {"type": "dialogue", "speaker": "문자(혜숙→도겸)", "text": "얘, 오늘 내 생일이야. 일곱 시. 와인 따 놨어."}], "flags": [], "thumb": "thumbs/6-005.svg"}, {"id": "6-006", "chapter": "6화. 생일", "scene": "S#1 비어 있는 칸 (지하 2층 주차장 B구역 검정 세단 운전석, 10월 16일 금 저녁 6:30)", "width": 800, "height": 720, "shot": "CU · 아이레벨 · 도겸(좌)", "screen": "가로 2분할. 좌: 두 화면을 위아래로 겹쳐 든 도겸의 긴 눈이 위에서 아래로 내려갔다가 다시 처음으로 돌아간다(시선 화살표 두 줄, 무표정). 우: 메인폰 캘린더 5월 칸의 회색 반복 일정 블록 '유진 생일'(식자, 반복 아이콘). 내레이션 박스는 칸마다 하나.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그는 다섯 개를 차례로 읽었다. 한 번 더 읽었다."}, {"type": "narration", "speaker": "내레이션", "text": "메인폰 캘린더에서 유진의 생일은 5월이었다. 반복 일정, 회색."}], "flags": [], "thumb": "thumbs/6-006.svg"}, {"id": "6-007", "chapter": "6화. 생일", "scene": "S#1 비어 있는 칸 (지하 2층 주차장 B구역 검정 세단 운전석, 10월 16일 금 저녁 6:30)", "width": 800, "height": 1080, "shot": "BS · 아이레벨 · 도겸(중)", "screen": "엄지가 5월 칸 위에 한참 머물다가 화면을 닫는다. 위쪽 작은 인서트 칸에 3화와 같은 구도로 하린네 도어락 액정의 빛나는 네 칸이 스쳐 간다(숫자는 그리지 않는다). 아래 칸에서 도겸은 앞유리를 보며 이마의 머리 가닥을 넘긴다, 눈썹 사이가 아주 조금 좁아졌다 풀린다. 내레이션 박스 세 개를 위에서 아래로.", "summary": "엄지가 5월 칸 위에 한참 머물다가 화면을 닫는다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "오늘이 생일이라고 말하는 아내 앞에서 날짜를 따지는 남편은 없었다. 그건 관리가 아니라 자해였다."}, {"type": "narration", "speaker": "내레이션", "text": "하린네 도어락 번호가 생일이라는 건 알았지만, 그는 그 네 자리를 날짜로 읽어 본 적이 없었다. 숫자는 문을 여는 데 쓰는 것이었다."}, {"type": "narration", "speaker": "내레이션", "text": "나머지 셋에게는 물어본 적도 없었다. 물으면 자기 생일도 말해야 했다."}], "flags": [], "thumb": "thumbs/6-007.svg"}, {"id": "6-008", "chapter": "6화. 생일", "scene": "S#1 비어 있는 칸 (지하 2층 주차장 B구역 검정 세단 운전석, 10월 16일 금 저녁 6:30)", "width": 800, "height": 920, "shot": "CU · 측면 · 도겸(중)", "screen": "헤드라이트 한 줄기가 지나간 뒤의 어두운 운전석. 백미러에 짙은 일자 눈썹과 따뜻한 긴 눈이 비치고, 왼쪽 입꼬리가 천천히 올라간다. 내레이션 박스 좌상, 혼잣말 말풍선은 작게 우하.", "summary": "헤드라이트 한 줄기가 지나간 뒤의 어두운 운전석.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그의 생일은 3월이었다. 그건 진짜였다. 그가 가진 몇 안 되는 진짜 중 하나였다."}, {"type": "dialogue", "speaker": "도겸", "text": "우연이네."}], "flags": [], "thumb": "thumbs/6-008.svg"}, {"id": "6-009", "chapter": "6화. 생일", "scene": "S#2 관리란 동선 (지하 2층 주차장 B구역 검정 세단 트렁크, 10월 16일 금 저녁 6:36)", "width": 800, "height": 960, "shot": "FS · 아이레벨 · 도겸(중)", "screen": "운전석 문을 열고 내린 도겸이 세단 뒤로 돌아가 트렁크를 연다. 트렁크 실내등이 켜지며 그의 셔츠 앞섶과 시계를 노랗게 데우고, 등 뒤 기둥에 헤드라이트 한 줄이 지나간다. 효과음은 트렁크 모서리에 붓 효과음(East Sea Dokdo), 내레이션 박스 둘은 좌상과 우하.", "summary": "운전석 문을 열고 내린 도겸이 세단 뒤로 돌아가 트렁크를 연다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "소리 내어 말하자 정말 우연 같았다. 아내는 서운한 게 있어서 날짜를 당겨 온 것이고, 나머지 넷은 그냥 우연이었다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "덜컥"}, {"type": "narration", "speaker": "내레이션", "text": "그는 확률을 계산하지 않았다. 계산은 남들이 하는 일이었다."}], "flags": [], "thumb": "thumbs/6-009.svg"}, {"id": "6-010", "chapter": "6화. 생일", "scene": "S#2 관리란 동선 (지하 2층 주차장 B구역 검정 세단 트렁크, 10월 16일 금 저녁 6:36)", "width": 800, "height": 760, "shot": "INS · 로우 · 도겸(후경)", "screen": "트렁크 안쪽(C1) 바닥 높이에서 밖을 본다. 열린 공구함의 스펀지 홈에 렌치 대신 사각 유리병 다섯 개가 회색·버건디·민트·하늘색·금색 뚜껑을 나란히 하고 누워 있고, 그 옆에 포장도 뜯지 않은 로고 없는 선물 상자 다섯 개가 쌓여 있다. 공구함 너머로 손을 뻗는 도겸의 왼손(시계와 흉터)과 천장 직관등.", "summary": "트렁크 안쪽(C1) 바닥 높이에서 밖을 본다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-010.svg"}, {"id": "6-011", "chapter": "6화. 생일", "scene": "S#2 관리란 동선 (지하 2층 주차장 B구역 검정 세단 트렁크, 10월 16일 금 저녁 6:36)", "width": 800, "height": 760, "shot": "INS · 하이 · 도겸(중)", "screen": "가로 3분할. 1: 향수병을 재킷 양쪽 주머니에 나눠 쑤셔 넣자 주머니가 병 무게로 축 처진다. 2: 선물 상자 다섯 개를 양쪽 겨드랑이에 끼운다. 3: 그의 머릿속 동선도(그래픽), 단지 지도 위에 304→503→207→412→101 화살표와 '한 집에 8분'(식자). 효과음은 1칸에 붓 효과음(East Sea Dokdo) 작게.", "summary": "가로 3분할.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "짤랑"}, {"type": "narration", "speaker": "내레이션", "text": "머릿속에서 동선이 빠르게 그려졌다. 304동, 503동, 207동, 412동, 101동. 한 집에 8분."}], "flags": [], "thumb": "thumbs/6-011.svg"}, {"id": "6-012", "chapter": "6화. 생일", "scene": "S#2 관리란 동선 (지하 2층 주차장 B구역 검정 세단 트렁크, 10월 16일 금 저녁 6:36)", "width": 800, "height": 1120, "shot": "FS · 로우 · 도겸(중)", "screen": "바닥 높이 로우 앵글. 도겸이 팔꿈치로 트렁크를 닫고, 상자 다섯 개를 낀 채 B구역 북쪽 끝 동 연결통로 입구 쪽으로 달려 나간다. 처진 주머니가 허벅지를 치고 구두 뒤축이 녹색 바닥을 박차며 동작선이 길게 남는다. 효과음 둘은 붓 효과음(East Sea Dokdo), 내레이션 박스 상단.", "summary": "바닥 높이 로우 앵글.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "지하 연결 통로로 뛰면 엘리베이터 대기 시간을 줄일 수 있었다. 관리란 결국 동선이었다."}, {"type": "sfx", "speaker": "SFX(중간, 회색)", "text": "쿵"}, {"type": "sfx", "speaker": "SFX", "text": "타다닥"}], "flags": ["intimate"], "thumb": "thumbs/6-012.svg"}, {"id": "6-013", "chapter": "6화. 생일", "scene": "S#3 초는 아직 (304동 3호기 엘리베이터 → 12층 1204호 현관, 10월 16일 금 저녁 6:41)", "width": 800, "height": 600, "shot": "INS · 아이레벨 · 도겸(우)", "screen": "[트랙2] 가로 2분할. 좌: 3호기 층수 표시가 1에서 12까지 한 번도 서지 않고 치솟는 숫자 잔상(붉은 LED, 식자), 천장 돔 CCTV의 '고장' 스티커(식자). 우: 문이 열리자 거울 벽 앞에서 버건디 뚜껑 병을 손목에 한 번 뿌리는 도겸, 관자놀이 땀방울이 튀고 크림 #FFF4E0 플랫 배경에 집중선. 의상 색은 본편과 같다. 효과음은 코미디 고딕(Black Han Sans).", "summary": "[트랙2] 가로  엘리베이터 홀, 10월 16일 금 저녁 6:44~6:47)", "width": 800, "height": 600, "shot": "BS · 아이레벨 · 도겸(좌), 남정애(우)", "screen": "[트랙2] 가로 2분할 숏·리버스숏. 좌: 이마 가닥을 넘기며 왼손으로 귓불을 만지는 도겸, 공손하게 내리깐 눈과 관자놀이의 큰 땀방울, 귓불 옆에 반짝이 효과선. 우: 남정애가 한쪽 눈썹을 올리고 손가락을 하나, 둘 꼽는다(물음표 효과선). 말풍선 좌상, 우상.", "summary": "[트랙2] 가로 2분할 숏·리버스숏.", "lines": [{"type": "dialogue", "speaker": "도겸", "text": "어머니 심부름 왔습니다."}, {"type": "dialogue", "speaker": "남정애", "text": "어머니가 몇 분이세요?"}], "flags": ["intimate"], "thumb": "thumbs/6-020.svg"}, {"id": "6-021", "chapter": "6화. 생일", "scene": "S#4 어머니가 몇 분 (지하 2층 연결통로 → 503동 지하 엘리베이터 홀, 10월 16일 금 저녁 6:44~6:47)", "width": 800, "height": 840, "shot": "MS · 아이레벨 · 도겸(중), 고미숙(좌), 남정애(후경·중), 백지연(우)", "screen": "[트랙2] 엘리베이터 안. 문이 닫히고 도겸이 대답 없이 24 버튼을 누른다(버튼 불빛, 숫자는 식자). 양옆과 뒤에서 세 사람의 시선이 직선 효과선으로 꽂히고, 그는 닫힌 문만 보며 땀방울 셋을 흘린다. 문 위 층수 표시 B2에서 1, 2로(식자). 효과음 없이 숨 막히는 정적.", "summary": "[트랙2] 엘리베이터 안.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/6-021.svg"}, {"id": "6-022", "chapter": "6화. 생일", "scene": "S#5 화장 덜 한 여자 (503동 24층 엘리베이터 홀 → 2402호 현관, 10월 16일 금 저녁 6:49)", "width": 800, "height": 960, "shot": "FS · 아이레벨 · 도겸(중)", "screen": "24층 엘리베이터 홀 설정샷. 대리석 바닥과 회색 석재 타일 벽, 엘리베이터 문 위 붉은 층수(식자), 오른쪽 4m 앞 2402호 문. 그 앞에서 숨을 고르던 도겸이 금색 뚜껑 병을 목덜미에 뿌린다. 천장 센서등의 흰 링, 효과음은 붓 효과음(East Sea Dokdo). 내레이션 박스 좌상.", "summary": "24층 엘리베이터 홀 설정샷.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "18시 49분, 2402호 앞에서 그는 금색 뚜껑 병을 목덜미에 뿌렸다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "칙"}], "flags": [], "thumb": "thumbs/6-022.svg"}, {"id": "6-023", "chapter": "6화. 생일", "scene": "S#5 화장 덜 한 여자 (503동 24층 엘리베이터 홀 → 2402호 현관, 10월 16일 금 저녁 6:49)", "width": 800, "height": 1520, "shot": "FS · 아이레벨 · 혜숙(중), 도겸(전경·좌)", "screen": "문이 열리고 현관 다운라이트 아래 혜숙이 선다. 어깨를 드러낸 오프숄더 라인에서 시작된 금색 시퀸이 가슴의 굴곡을 따라 빛의 비늘처럼 일어섰다가, 허리에서 바짝 조여 엉덩이의 둥근 선을 그대로 본뜨고 무릎 아래까지 좁게 떨어진다. 진주 세 줄이 쇄골 위에 겹쳐 눕고, 낮게 틀어 올린 시뇽 아래 긴 목덜미에 몇 가닥이 흘러내린다. 뒤로 현관 콘솔의 백합과 금테 거울이 흐리다.", "summar
