<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>웹툰 킷 편집기</title>
<style>
:root{--bg:#F1F2F4;--panel:#fff;--text:#1C1F26;--muted:#5D6470;--line:#D3D7DD;--acc:#2F6FDE;--warn:#C93A46}
@media (prefers-color-scheme: dark){:root{--bg:#14171C;--panel:#1E2228;--text:#E8EAEE;--muted:#9AA1AC;--line:#343A44;--acc:#6F9BFF}}
*{box-sizing:border-box}body{margin:0;font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 12px 0 0}
button,select,input[type=file]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);cursor:pointer}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.app{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 54px)}
@media (max-width:820px){.app{grid-template-columns:1fr;height:auto}.list{max-height:40vh}}
.list{overflow:auto;border-right:1px solid var(--line);background:var(--panel)}
.item{display:grid;grid-template-columns:54px 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.item.on{background:color-mix(in srgb,var(--acc) 14%,transparent)}
.item img{width:54px;height:54px;object-fit:cover;border:1px solid var(--line);border-radius:4px;background:#fff}
.item b{font-size:13px}.item span{display:block;font-size:12px;color:var(--muted);line-height:1.35;max-height:2.7em;overflow:hidden}
.tag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:3px;background:var(--warn);color:#fff;margin-left:4px}
.main{overflow:auto;padding:16px}
.row{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:16px}
@media (max-width:1100px){.row{grid-template-columns:1fr}}
.imgs{display:flex;flex-direction:column;gap:10px}
.imgs figure{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px}
.imgs img{width:100%;display:block;background:#fff}
.imgs figcaption{font-size:12px;color:var(--muted);margin-top:4px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 4px}
textarea,input[type=text],input[type=number]{width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text)}
textarea{min-height:90px;line-height:1.5}
.flags label{display:inline-flex;gap:4px;align-items:center;margin-right:12px;color:var(--text);font-size:13px}
pre{white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:10px;font-size:12px;line-height:1.5;max-height:340px;overflow:auto}
.hint{font-size:12px;color:var(--muted)}
#toast{position:fixed;right:16px;bottom:16px;background:#1C1F26;color:#fff;padding:8px 12px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s}
</style>
</head>
<body>
<header>
<h1>웹툰 킷 편집기</h1>
<select id="chap"></select>
<select id="track"></select>
<button id="copy" class="pri">이 컷 프롬프트 복사</button>
<button id="dlTrack">트랙 전체 프롬프트(.md)</button>
<button id="dlJson">cuts.json 내려받기</button>
<label style="margin:0" class="hint">불러오기 <input type="file" id="load" accept=".json"></label>
</header>
<div class="app"><nav class="list" id="list"></nav><main class="main" id="main"><p class="hint">왼쪽에서 컷을 고르세요.</p></main></div>
<div id="toast"></div>
<script>
const KIT={"cuts": [{"id": "0-001", "chapter": "표지", "scene": "표지 (낙동강, 밤)", "width": 800, "height": 1600, "shot": "ELS · 부감 · 무진(중)", "screen": "밤의 낙동강. 상단 2/3는 남색(#1F2C46)에서 진청으로 내려오는 하늘과 보름달, 하단 1/3은 회청색(#5E7F99) 물결. 강 한가운데서 무진이 자유형으로 오른팔을 크게 뻗어 물을 가르고, 물 위로 나온 옆얼굴의 둥근 금속테 안경에 달빛이 흰 반사광으로 박힌다. 제목은 화면 왼쪽에 세 줄로 크게, 하단 오른쪽에 작은 고지 문구.", "summary": "밤의 낙동강.", "lines": [{"type": "caption", "speaker": "제목", "text": "낙동강을 헤엄쳐 나온 남자 (세 줄 배치, 마지막 줄 '남자'만 주황 #F2A33A)"}, {"type": "caption", "speaker": "고지문", "text": "인물과 병원 이름은 모두 지어낸 것이며, 실제 인물·기관과 관계없는 허구다."}], "flags": ["self_harm_theme", "violence"], "thumb": "thumbs/0-001.svg"}, {"id": "0-002", "chapter": "표지", "scene": "표지 (낙동강, 밤)", "width": 800, "height": 1200, "shot": "ELS · 하이 · 인물 없음", "screen": "달도 구름에 가려진 검은 강물만 화면을 채운다. 수면에 일그러진 다리 불빛 몇 줄이 주황으로 늘어져 있고, 물결은 일정한 방향으로만 흐르고, 수면에 사람의 흔적은 없다. 상단 1/3은 완전한 어둠으로 비워 둔다.", "summary": "달도 구름에 가려진 검은 강물만 화면을 채운다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["self_harm_theme", "violence"], "thumb": "thumbs/0-002.svg"}, {"id": "0-003", "chapter": "표지", "scene": "표지 (낙동강, 밤)", "width": 800, "height": 520, "shot": "ECU · 측면 · 무진(중)", "screen": "어둠 속 무진의 눈가만 가로로 길게 자른 컷. 안경 렌즈가 가로등 주황빛을 받아 하얗게 반사돼 눈동자가 보이지 않는다. 입은 화면 밖, 얼굴엔 땀 한 줄. 생각 풍선은 점선으로 렌즈 옆에 작게.", "summary": "어둠 속 무진의 눈가만 가로로 길게 자른 컷.", "lines": [{"type": "thought", "speaker": "무진(생각)", "text": "측두골. 중경막동맥."}], "flags": ["self_harm_theme", "violence"], "thumb": "thumbs/0-003.svg"}, {"id": "0-004", "chapter": "표지", "scene": "표지 (낙동강, 밤)", "width": 800, "height": 1360, "shot": "FS · 로우 · 무진(중·실루엣)", "screen": "빌라 계단참 아래, 계단 위 형광등 하나를 등진 완전 역광 실루엣. 무진이 오른손에 망치를 어깨 높이로 치켜든 정지 순간이며, 휘두르는 궤적이나 상대는 그리지 않는다. 망치 머리 윤곽에만 얇은 주황 림라이트, 배경에 방사형 집중선.", "summary": "빌라 계단참 아래, 계단 위 형광등 하나를 등진 완전 역광 실루엣.", "lines": [{"type": "narration", "speaker": "내레이션(밤)", "text": "의학 지식은 완벽했고, 판단력은 완벽하게 없었다."}], "flags": ["self_harm_theme", "violence"], "thumb": "thumbs/0-004.svg"}, {"id": "0-005", "chapter": "표지", "scene": "표지 (낙동강, 밤)", "width": 800, "height": 960, "shot": "INS · 하이 · 인물 없음", "screen": "새벽 안개 낀 강가 둔치 풀밭. 갈색 구두 한 켤레가 앞코를 강 쪽으로 향한 채 나란히 가지런히 놓여 있고, 그 위에 흰 편지 봉투 하나. 봉투 겉봉에 반듯한 손글씨(Nanum Pen Script)가 일부만 읽힌다. 화면 위쪽 1/4은 회색 물안개.", "summary": "새벽 안개 낀 강가 둔치 풀밭.", "lines": [{"type": "caption", "speaker": "손글씨", "text": "서희 씨와 부모님께."}, {"type": "narration", "speaker": "내레이션", "text": "유서에서조차 그는 예의 바른 사람이었다."}], "flags": ["self_harm_theme", "violence"], "thumb": "thumbs/0-005.svg"}, {"id": "0-006", "chapter": "표지", "scene": "표지 (낙동강, 밤)", "width": 800, "height": 640, "shot": "MS · 측면 · 무진(중·실루엣)", "screen": "물속 시점. 수면 위 달빛이 흔들리는 띠로 내려오고, 그 아래로 팔 하나가 물을 끌어당기는 스트로크 실루엣과 기포 줄기. 얼굴은 보이지 않고 안경테 한쪽만 반짝인다. 가로로 긴 속도선.", "summary": "물속 시점.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "무진은 고등학교 때 수영부였다."}], "flags": ["self_harm_theme", "violence"], "thumb": "thumbs/0-006.svg"}, {"id": "0-007", "chapter": "표지", "scene": "표지 (낙동강, 밤)", "width": 800, "height": 720, "shot": "TXT · 아이레벨 · 인물 없음", "screen": "검정 바탕 중앙에 흰 글자 한 줄씩 두 단으로. 아래쪽에 작은 망치 아이콘 하나를 회색 선화로 넣고, 그 아래 120px 여백 후 1장으로 전환.", "summary": "검정 바탕 중앙에 흰 글자 한 줄씩 두 단으로.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "망치 한 자루로 인생을 두 번 망치고, 두 번 일으킨 남자의 이야기다."}], "flags": ["self_harm_theme", "violence"], "thumb": "thumbs/0-007.svg"}, {"id": "1-001", "chapter": "1장. 당직실의 로맨스", "scene": "장 제목 · 화자 소개 (낙동대학교병원, 4월 새벽)", "width": 800, "height": 600, "shot": "TXT · 아이레벨 · 인물 없음", "screen": "남색 바탕에 장 제목을 Black Han Sans로 크게. 제목 아래 가는 선 위에 김 오르는 컵라면 하나와 반지 두 개를 작은 선화로 배치.", "summary": "남색 바탕에 장 제목을 Black Han Sans로 크게.", "lines": [{"type": "caption", "speaker": "제목", "text": "1장. 당직실의 로맨스"}], "flags": [], "thumb": "thumbs/1-001.svg"}, {"id": "1-002", "chapter": "1장. 당직실의 로맨스", "scene": "장 제목 · 화자 소개 (낙동대학교병원, 4월 새벽)", "width": 800, "height": 1280, "shot": "ELS · 앙각 · 인물 없음", "screen": "동트기 직전의 대학병원 외관을 정면 원경으로. 하늘은 남색에서 연보라로, 창문 대부분은 꺼져 있고 5층 몇 칸만 주황 불빛. 옥상에 물탱크와 헬기장 난간이 작게 보이고 건물 상단에 '낙동대학교병원' 글자 간판. 정문 앞 벚나무에 끝물 꽃잎.", "summary": "동트기 직전의 대학병원 외관을 정면 원경으로.", "lines": [{"type": "narration", "speaker": "내레이션(밤)", "text": "그해 4월, 나는 신경외과 인턴이었다."}], "flags": [], "thumb": "thumbs/1-002.svg"}, {"id": "1-003", "chapter": "1장. 당직실의 로맨스", "scene": "장 제목 · 화자 소개 (낙동대학교병원, 4월 새벽)", "width": 800, "height": 760, "shot": "MS · 하이 · 인턴(중)", "screen": "병동 복도 간이 의자에 인턴이 너무 큰 흰 가운을 입은 채 고개를 뒤로 젖히고 졸고 있다. 뻗친 곱슬머리, 짙은 다크서클, 반쯤 벌어진 입, 무릎 위에 떨어지기 직전의 처방전 묶음. 머리 위 형광등 하나가 깜빡인다.", "summary": "병동 복도 간이 의자에 인턴이 너무 큰 흰 가운을 입은 채 고개를 뒤로 젖히고 졸고 있다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "인턴에게 신경외과는 잠 못 자는 과였고,"}, {"type": "sfx", "speaker": "SFX(작게)", "text": "지직"}], "flags": [], "thumb": "thumbs/1-003.svg"}, {"id": "1-004", "chapter": "1장. 당직실의 로맨스", "scene": "장 제목 · 화자 소개 (낙동대학교병원, 4월 새벽)", "width": 800, "height": 880, "shot": "MS · 오버숄더(인턴 너머) · 무진(후경·중), 인턴(전경·좌)", "screen": "복도 끝 간호사실 불빛 아래 무진이 서서 차트를 넘기고 있다. 민트 수술복 위 흰 가운, 단정한 가르마, 안경 반사광, 허리에 삐삐. 벽시계는 4:10. 전경의 인턴은 흐릿한 뒤통수만. 무진은 피곤한 기색 없이 꼿꼿하다.", "summary": "복도 끝 간호사실 불빛 아래 무진이 서서 차트를 넘기고 있다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "권무진은 잠 안 자는 레지던트였다."}], "flags": [], "thumb": "thumbs/1-004.svg"}, {"id": "1-005", "chapter": "1장. 당직실의 로맨스", "scene": "첫 회진 — 함자 예절 교육 (신경외과 병동 복도, 오전 7시)", "width": 800, "height": 1040, "shot": "LS · 아이레벨 · 무진(좌), 인턴(우)", "screen": "아침 햇살이 창으로 비스듬히 드는 병동 복도. 차트 카트를 사이에 두고 무진과 인턴이 마주 섰다. 무진은 차트를 한 손에 든 채 고개를 살짝 숙여 인턴의 가슴께를 보고, 인턴은 펜을 쥔 채 차렷. 배경에 병실 문 번호판과 링거대.", "summary": "아침 햇살이 창으로 비스듬히 드는 병동 복도.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "첫 회진 날, 무진 선생은 내 명찰을 한참 보더니 물었다."}], "flags": [], "thumb": "thumbs/1-005.svg"}, {"id": "1-006", "chapter": "1장. 당직실의 로맨스", "scene": "첫 회진 — 함자 예절 교육 (신경외과 병동 복도, 오전 7시)", "width": 800, "height": 440, "shot": "INS · POV(무진) · 인턴(중)", "screen": "인턴 가운 왼쪽 가슴의 플라스틱 명찰 ECU. '인턴'이라는 글자만 또렷하고 이름 칸은 형광등 반사로 하얗게 날아갔다. 명찰 핀이 약간 비뚤다. 가는 시선선이 위에서 명찰로 꽂힌다.", "summary": "인턴 가운 왼쪽 가슴의 플라스틱 명찰 ECU.", "lines": [{"type": "dialogue", "s  "내레이션", "text": "그는 차트를 내려놓고 한숨을 쉬었다."}, {"type": "sfx", "speaker": "SFX", "text": "탁"}], "flags": [], "thumb": "thumbs/1-011.svg"}, {"id": "1-012", "chapter": "1장. 당직실의 로맨스", "scene": "첫 회진 — 함자 예절 교육 (신경외과 병동 복도, 오전 7시)", "width": 800, "height": 720, "shot": "CU · 아이레벨 · 무진(중)", "screen": "무진이 눈을 감고 콧날을 엄지와 검지로 집은 채 길게 숨을 내쉰다. 입 앞에 흰 한숨 효과선이 구불구불 퍼지고, 안경이 살짝 들려 있다.", "summary": "무진이 눈을 감고 콧날을 엄지와 검지로 집은 채 길게 숨을 내쉰다.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "하… 그게 아이고."}], "flags": [], "thumb": "thumbs/1-012.svg"}, {"id": "1-013", "chapter": "1장. 당직실의 로맨스", "scene": "첫 회진 — 함자 예절 교육 (신경외과 병동 복도, 오전 7시)", "width": 800, "height": 1200, "shot": "MS · 로우 · 무진(좌·전경), 인턴(우·후경)", "screen": "무진이 검지 하나를 세워 가르치는 자세. 상체를 반 걸음 앞으로 기울였고 안경 반사광이 번쩍인다. 후경의 인턴은 상대적으로 작게, 어깨를 움츠리고 받아 적을 듯 펜을 들었다. 말풍선은 길게 두 단으로.", "summary": "무진이 검지 하나를 세워 가르치는 자세.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "윗사람이 물을 때는 성은 빼고, 철자 수자, 이래 하는 기다."}], "flags": [], "thumb": "thumbs/1-013.svg"}, {"id": "1-014", "chapter": "1장. 당직실의 로맨스", "scene": "첫 회진 — 함자 예절 교육 (신경외과 병동 복도, 오전 7시)", "width": 800, "height": 560, "shot": "CU · 하이 · 인턴(중)", "screen": "인턴이 고개를 연신 끄덕이며 손바닥에 볼펜으로 무언가 적고 있다. 눈은 초점이 나갔고 입술이 소리 없이 달싹인다. 머리 위에 땀방울과 작은 '…' 기호.", "summary": "인턴이 고개를 연신 끄덕이며 손바닥에 볼펜으로 무언가 적고 있다.", "lines": [{"type": "dialogue", "speaker": "인턴", "text": "…"}], "flags": ["intimate"], "thumb": "thumbs/1-014.svg"}, {"id": "1-015", "chapter": "1장. 당직실의 로맨스", "scene": "첫 회진 — 함자 예절 교육 (신경외과 병동 복도, 오전 7시)", "width": 800, "height": 1040, "shot": "LS · 뒷모습 · 무진(후경·중), 인턴(전경·우)", "screen": "무진이 차트 카트를 밀고 복도 끝으로 멀어진다. 전경의 인턴은 그 등을 향해 허리를 90도로 꺾어 인사하는 중이다. 햇살이 복도 바닥에 사다리꼴로 떨어지고, 두 사람 사이 거리가 길다.", "summary": "무진이 차트 카트를 밀고 복도 끝으로 멀어진다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그날 나는 예절 교육을 받았다."}], "flags": [], "thumb": "thumbs/1-015.svg"}, {"id": "1-016", "chapter": "1장. 당직실의 로맨스", "scene": "화자의 회상 (병동 복도, 같은 날 — 현재 시점의 목소리)", "width": 800, "height": 1120, "shot": "FS · 뒷모습 · , {"id": "2-021", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 760, "shot": "INS · 부감 · 인물 없음", "screen": "바닥. 땀에 젖어 짙어진 민트 수술복 상의가 떨어져 구겨져 있고, 그 위로 흰 스타킹 한 짝이 흘러내리듯 겹쳐진다. 바닥에 초록 빛이 얇게 번진다.", "summary": "바닥.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "땀에 젖은 수술복 상의가 바닥에 떨어지고, 그녀의 하얀 스타킹이 그 위에 겹쳐졌다."}], "flags": ["intimate"], "thumb": "thumbs/2-021.svg"}, {"id": "2-022", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 640, "shot": "INS · 아이레벨 · 인물 없음", "screen": "꺼진 형광등 아래 캄캄한 방에서 문 아래 틈 하나만 빛난다. 문틈 너머로 복도 비상구 유도등의 초록 사각 표시판 아래쪽이 살짝 보이고, 초록 빛이 띠처럼 방 안으로 새어 든다.", "summary": "꺼진 형광등 아래 캄캄한 방에서 문 아래 틈 하나만 빛난다.", "lines": [{"type": "narration", "speaker": "내레이션(밤)", "text": "형광등을 끈 방 안에는 문틈으로 새어 드는 비상구 유도등의 초록 불빛뿐이었다."}], "flags": ["intimate"], "thumb": "thumbs/2-022.svg"}, {"id": "2-023", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 920, "shot": "BS · 뒷모습 · 서희(중)", "screen": "서희의 뒷모습, 어깨 위로만 프레이밍. 반쯤 풀린 포니테일이 목덜미에 걸려 있고, 맨어깨의 윤곽선이 초록 빛을 받아 희미하게 빛난다. 간호사 캡은 벗겨져 화면 구석 침대 머리맡에 놓였다.", "summary": "서희의 뒷모습, 어깨 위로만 프레이밍.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그 빛 아래서 서희의 맨어깨가 희미하게 빛났다."}], "flags": ["intimate"], "thumb": "thumbs/2-023.svg"}, {"id": "2-024", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 600, "shot": "CU · 측면 · 무진(좌), 서희(우)", "screen": "무진이 서희의 목 가까이 얼굴을 묻는다. 무진은 눈을 감았고 안경테 옆선만 보인다. 두 얼굴 사이로 소독약 냄새를 표현하는 가는 물결선과 다른 결의 부드러운 물결선이 섞여 오른다. 어깨 위 프레이밍.", "summary": "무진이 서희의 목 가까이 얼굴을 묻는다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "소독약 냄새 사이로 그녀의 살 냄새가 올라왔다."}], "flags": ["intimate"], "thumb": "thumbs/2-024.svg"}, {"id": "2-025", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 1400, "shot": "ECU · 측면 · 무진(좌), 서희(우)", "screen": "세로로 긴 추적 컷, 어깨 위 프레이밍. 화면 하단에서 무진의 입술이 서희의 쇄골에 닿고, 같은 컷 안에서 위로 갈수록 목선을 따라 점선 동선이 이어져 화면 상단의 귓불에 닿는다. 서희는 ight": 600, "shot": "CU · 측면 · 무진(좌·실루엣), 서희(우·실루엣)", "screen": "머리와 어깨만 보이는 실루엣. 서희가 무진의 어깨에 얼굴을 묻고 입을 대 소리를 막는다. 서희의 눈썹만 찡그린 모양으로 드러난다.", "summary": "머리와 어깨만 보이는 실루엣.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "서희는 소리가 새어 나가지 않도록 무진의 어깨를 깨물었다."}], "flags": ["intimate"], "thumb": "thumbs/2-030.svg"}, {"id": "2-031", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 400, "shot": "INS · 로우 · 인물 없음", "screen": "침대 밑 철제 스프링과 다리. 같은 간격으로 반복되는 짧은 움직임 선 세 줄.", "summary": "침대 밑 철제 스프링과 다리.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "삐걱… 삐걱…"}], "flags": ["intimate"], "thumb": "thumbs/2-031.svg"}, {"id": "2-032", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 720, "shot": "CU · 아이레벨 · 무진(좌·실루엣), 서희(우·실루엣)", "screen": "어둠 속 두 얼굴의 실루엣이 동시에 문 쪽으로 돌아간다. 무진의 안경 렌즈와 서희의 눈에 초록 점광 하나씩. 화면 오른쪽 끝에 문손잡이가 초록 빛을 받아 걸려 있다.", "summary": "어둠 속 두 얼굴의 실루엣이 동시에 문 쪽으로 돌아간다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "침대 스프링이 일정한 박자로 삐걱일 때마다 둘은 숨을 멈추고 문 쪽을 쳐다봤다가, 다시 서로를 끌어안았다."}], "flags": ["intimate"], "thumb": "thumbs/2-032.svg"}, {"id": "2-033", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 520, "shot": "INS · 아이레벨 · 인물 없음", "screen": "벽 단면 컷. 왼쪽 절반은 어두운 당직실 벽, 오른쪽 절반은 벽 너머 복도의 환자 모니터 화면. 알람 표시가 붉게 깜빡인다.", "summary": "벽 단면 컷.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "삐— 삐—"}, {"type": "narration", "speaker": "내레이션", "text": "벽 너머에서 모니터 알람이 두 번 울렸다."}], "flags": ["intimate"], "thumb": "thumbs/2-033.svg"}, {"id": "2-034", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 680, "shot": "CU · 측면 · 무진(좌·실루엣), 서희(우·실루엣)", "screen": "이마를 맞댄 두 실루엣. 둘 다 눈을 질끈 감았다. 화면 상단 가장자리에 알람 SFX 글자가 흐리게 잘려 나간다.", "summary": "이마를 맞댄 두 실루엣.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그날 밤만큼은 둘 다 듣지 못한 척했다."}], "flags": ["intimate"], "thumb": "thumbs/2-034.svg"}, {"id": "2-035", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 960, "shot": "MS · 부감 · 무진(중), 서희(중)", "screen": "모든 게 끝난 뒤. 담요가 두 사람의 어깨까지 덮여 있고, 서희는 무진의 가슴에 옆얼굴을 묻고 눈을 감았다. 무진은 천장을 보고 누워 한 손을 그녀의 머리칼 위에 얹었다. 안경은 머리맡 탁자에 접혀 있다. 시간이 흐름을 뜻하는 정지된 구도.", "summary": "모든 게 끝난 뒤.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "모든 게 끝난 뒤, 서희는 무진의 가슴에 얼굴을 묻고 한참을 움직이지 않았다."}], "flags": ["intimate"], "thumb": "thumbs/2-035.svg"}, {"id": "2-036", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 800, "shot": "INS · 아이레벨 · 무진(중)", "screen": "가로 2분할. 위: 무진의 맨어깨에 붉게 남은 반달 모양 잇자국 클로즈업. 아래: 탁자 위 믹스커피 두 잔. 김은 사라졌고 표면에 얇은 막이 생겼다.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "무진의 어깨에는 그녀의 잇자국이 붉게 남았다."}, {"type": "narration", "speaker": "내레이션", "text": "탁자 위의 믹스커피 두 잔은 손도 대지 않은 채 식어 있었다."}], "flags": ["intimate"], "thumb": "thumbs/2-036.svg"}, {"id": "2-037", "chapter": "2장. 불륜의 기술 (전반)", "scene": "첫 번째 밤 (당직실, 새벽)", "width": 800, "height": 600, "shot": "TXT · 아이레벨 · 인물 없음", "screen": "짙은 남색 바탕에 내레이션 박스 두 개만. 박스 사이에 작은 결혼반지 두 개 아이콘을 나란히 둔다.", "summary": "짙은 남색 바탕에 내레이션 박스 두 개만.", "lines": [{"type": "narration", "speaker": "내레이션(밤)", "text": "그날 이후 두 사람은 내연 관계가 됐다."}, {"type": "narration", "speaker": "내레이션(밤)", "text": "일주일에 두 번, 병원 안에서."}], "flags": ["intimate"], "thumb": "thumbs/2-037.svg"}, {"id": "2-038", "chapter": "2장. 불륜의 기술 (전반)", "scene": "당직표 짜는 담당 (신경외과 의국, 낮)", "width": 800, "height": 760, "shot": "LS · 아이레벨 · 인물 없음", "screen": "1990년대 의국. 서류가 쌓인 철제 책상들, 재떨이, 브라운관 모니터, 벽에 붙은 빈 당직표 양식과 달력. 창으로 낮 햇빛이 비스듬히 들어온다.", "summary": "1990년대 의국.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "문제는 시간을 맞추는 일이었다."}], "flags": [], "thumb": "thumbs/2-038.svg"}, {"id": "2-039", "chapter": "2장. 불륜의 기술 (전반)", "scene": "당직표 짜는 담당 (신경외과 의국, 낮)", "width": 800, "height": 880, "shot": "MS · 아이레벨 · 무진(우), 치프(좌·후경), 레지던트들(중)", "screen": "의국 회의. 레지던트들이 모두 서류나 창밖으로 시선을 피하고 있는데, 무진만 표정 없이 한 손을 반듯하게 든다. 안경에 반사광이 번 MS · 하이 · 이송요원(좌), 간호조무사(우)", "screen": "엘리베이터 ②. 빈 휠체어를 민 이송요원이 고개만 돌려 간호조무사에게 말한다. 간호조무사는 두 손을 입에 모으고 눈을 크게 뜬다.", "summary": "엘리베이터 ②.", "lines": [{"type": "dialogue", "speaker": "이송요원", "text": "신경외과라카대."}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-018.svg"}, {"id": "5-019", "chapter": "5장. 낙동강 유서", "scene": "소문 (병원 엘리베이터 세 번, 식당 두 번)", "width": 800, "height": 560, "shot": "MS · 하이 · 보호자(좌), 청소원(우)", "screen": "엘리베이터 ③. 보따리를 든 중년 여성 보호자가 대걸레를 든 청소원에게 몸을 기울여 말한다. 청소원은 대걸레 자루를 꼭 쥐고 고개를 끄덕인다.", "summary": "엘리베이터 ③.", "lines": [{"type": "dialogue", "speaker": "보호자", "text": "두부외상이라카대."}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-019.svg"}, {"id": "5-020", "chapter": "5장. 낙동강 유서", "scene": "소문 (병원 엘리베이터 세 번, 식당 두 번)", "width": 800, "height": 600, "shot": "MS · 아이레벨 · 직원들(중)", "screen": "식당 ①. 스테인리스 식판을 든 직원들이 배식대 앞에 줄 서 있다. 머리 위로 글자가 뭉개진 말풍선 대여섯 개가 겹겹이 엉켜 있다.", "summary": "식당 ①.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "웅성웅성"}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-020.svg"}, {"id": "5-021", "chapter": "5장. 낙동강 유서", "scene": "소문 (병원 엘리베이터 세 번, 식당 두 번)", "width": 800, "height": 760, "shot": "BS · 아이레벨 · 레지던트(좌), 간호사(우)", "screen": "식당 ②. 국그릇을 사이에 두고 마주 앉은 두 사람이 숟가락을 든 채 멈추고 서로를 본다. 둘 다 어깨를 살짝 으쓱하고 있고, 머리 위에 물음표가 하나씩 떠 있다.", "summary": "식당 ②.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "누가 다쳤고 누가 사라졌는지는 아무도 정확히 몰랐다."}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-021.svg"}, {"id": "5-022", "chapter": "5장. 낙동강 유서", "scene": "소문 (병원 엘리베이터 세 번, 식당 두 번)", "width": 800, "height": 960, "shot": "LS · 하이 · 인물 없음", "screen": "합쳐진 굵은 말풍선 덩어리가 복도 위로 둥실 떠가고, 그 밑에서 '진실'이라고 적힌 작은 여행 가방 하나가 떨어져 바닥에 굴러 있다. 말풍선은 뒤돌아보지 않고 화면 밖으로 빠져나간다.", "summary": "합쳐진 굵은 말풍선 덩어리가 복도 위로 둥실 떠가고, 그 밑에서 '진실'이라고 적힌 작은 여행 가방 하나가 ", "lines": [{"type": "narration", "speaker": "내레이션", "text": "소문에서 진실은 늘 가장 먼저 버려지는 짐이다."}, {"type": "sfx", "speaker": "SFX(작게)", "text": "툭"}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-022.svg"}, {"id": "5-023", , {"id": "5-028", "chapter": "5장. 낙동강 유서", "scene": "강물 속 (낙동강, 밤)", "width": 800, "height": 440, "shot": "INS · 아이레벨 · 무진(중)", "screen": "물속에서 늘어져 있던 무진의 긴 손가락 끝이 움찔한다. 손가락 주변에 작은 기포 세 개.", "summary": "물속에서 늘어져 있던 무진의 긴 손가락 끝이 움찔한다.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "움찔"}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-028.svg"}, {"id": "5-029", "chapter": "5장. 낙동강 유서", "scene": "강물 속 (낙동강, 밤)", "width": 800, "height": 1000, "shot": "MS · 측면(수중) · 무진(중)", "screen": "무진의 오른팔이 크게 원을 그리며 물을 가른다. 교과서처럼 정확한 자유형 스트로크이고, 손끝 궤적을 따라 기포 꼬리와 곡선 속도선이 생긴다. 얼굴은 눈을 감은 채 무표정이고 안경은 그대로다.", "summary": "무진의 오른팔이 크게 원을 그리며 물을 가른다.", "lines": [{"type": "narration", "speaker": "내레이션(밤)", "text": "팔이 저절로 물을 갈랐다."}, {"type": "sfx", "speaker": "SFX", "text": "촤악"}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-029.svg"}, {"id": "5-030", "chapter": "5장. 낙동강 유서", "scene": "강물 속 (낙동강, 밤)", "width": 800, "height": 600, "shot": "CU · 측면(수중) · 무진(중)", "screen": "맨발 두 짝이 위아래로 교차하며 플러터킥을 찬다. 발목에서 짧은 직선 효과선이 세 번 튄다.", "summary": "맨발 두 짝이 위아래로 교차하며 플러터킥을 찬다.", "lines": [{"type": "narration", "speaker": "내레이션(밤)", "text": "다리가 저절로 찼다."}, {"type": "sfx", "speaker": "SFX", "text": "팡 팡 팡"}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-030.svg"}, {"id": "5-031", "chapter": "5장. 낙동강 유서", "scene": "강물 속 (낙동강, 밤)", "width": 800, "height": 1200, "shot": "LS · 측면 · 무진(중·실루엣)", "screen": "수면 위 밤 원경. 넓은 강을 가로질러 작은 실루엣 하나가 일정한 리듬으로 물보라를 일으키며 오른쪽으로 나아간다. 강 건너편에는 검은 갈대밭 띠가 있고 하늘엔 보름달이 떠 있다.", "summary": "수면 위 밤 원경.", "lines": [{"type": "sfx", "speaker": "SFX(흰색)", "text": "첨벙 첨벙 첨벙"}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-031.svg"}, {"id": "5-032", "chapter": "5장. 낙동강 유서", "scene": "강물 속 (낙동강, 밤)", "width": 800, "height": 560, "shot": "BS · 측면 · 무진(중)", "screen": "숨 쉬는 순간. 무진이 고개를 옆으로 돌려 입만 수면 위로 내놓는다. 젖은 앞머리가 이마에 붙어 있고 안경에 달빛이 흰 사각형으로 반사되며, 표정은 여전히 비어 있다.", "summary": "숨 쉬는 순간.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "푸하"}], "flags": ["self_harm_theme"], "thumb": "thumbs/5-032.svg"}, {"id": "5-033", "chapter": "5장. 낙동강 유서", "scene": "건너편 갈대밭 (낙동강 건너편, 새벽)", "width": 800, "height": 1000, "shot": "LS · 부감 · 무진(중)", "screen": "푸르스름한 새벽빛. 강 건너편 갈대밭의 진흙 둔덕에 무진이 두 팔을 벌리고 엎드려 있다. 몸 주위의 갈대가 쓰러져 사람 모양의 자국이 나 있다.", "summary": "푸르스름한 새벽빛.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "정신을 차려 보니 그는 건너편 갈대밭에 엎드려 기침을 하고 있었다."}], "flags": [], "thumb": "thumbs/5-033.svg"}, {"id": "5-034", "chapter": "5장. 낙동강 유서", "scene": "건너편 갈대밭 (낙동강 건너편, 새벽)", "width": 800, "height": 640, "shot": "CU · 아이레벨 · 무진(중)", "screen": "땅에 붙은 무진의 얼굴. 뺨에 진흙이 묻었고 안경은 한쪽으로 비뚤어졌으며 입가로 물이 흘러나온다. 어깨가 들썩이는 짧은 진동선.", "summary": "땅에 붙은 무진의 얼굴.", "lines": [{"type": "sfx", "speaker": "SFX", "text": "콜록 콜록"}], "flags": [], "thumb": "thumbs/5-034.svg"}, {"id": "5-035", "chapter": "5장. 낙동강 유서", "scene": "건너편 갈대밭 (낙동강 건너편, 새벽)", "width": 800, "height": 480, "shot": "INS · 로우 · 무진(중)", "screen": "진흙에 반쯤 박힌 맨발 두 짝. 발가락이 한 번 꼼지락거린다. 컷 아래 짧은 박스 하나.", "summary": "진흙에 반쯤 박힌 맨발 두 짝.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "맨발로."}], "flags": [], "thumb": "thumbs/5-035.svg"}, {"id": "5-036", "chapter": "5장. 낙동강 유서", "scene": "건너편 갈대밭 (낙동강 건너편, 새벽)", "width": 800, "height": 960, "shot": "BS · 아이레벨 · 무진(중)", "screen": "무진이 상체를 일으켜 진흙 위에 주저앉아 강 쪽을 본다. 안경알 전체를 흰 반사광으로 덮어 눈은 보이지 않고, 입꼬리만 아래로 처져 있다. 머리에 갈대 이삭 하나가 붙어 있다.", "summary": "무진이 상체를 일으켜 진흙 위에 주저앉아 강 쪽을 본다.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "…씨, 이것도 안 되나."}], "flags": [], "thumb": "thumbs/5-036.svg"}, {"id": "5-037", "chapter": "5장. 낙동강 유서", "scene": "사흘 (갈대밭, 사흘간)", "width": 800, "height": 1040, "shot": "LS · 아이레벨 · 무진(중·실루엣)", "screen": "가로 3분할 몽타주. 첫 칸은 한낮 해 아래 갈대 속에 무릎을 안고 웅크린 무진, 둘째 칸은 달 아래 같은 자세의 실루엣, 셋째 칸은 동틀 녘에 점퍼가 말라 주름진 채 같은 자리에 앉은 무진이다. 세 칸 모두 같은 구도로 잡고 하늘색만 바꾼다.", "summary": "가로 3분할 몽타주.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그는 그대로 사흘을 숨어 지냈고,"}], "flags": [], "thumb": "thumbs/5-037.svg"}, {"id": "5-038", "chapter": "5장. 낙동강 유서", "scene": "자수 (경찰서 민원실, 나흘째 오전)", "width": 800, "height": 800, "shot": "LS · 아이레벨 · 인물 없음", "screen": "1990년대 2층 콘크리트 경찰서 외관. 현관 위에 '경찰서' 현판과 '민원실' 안내판이 있고, 앞에는 흰색·파란색 순찰차 한 대가 서 있다. 오전 햇빛이 정면에서 비친다.", "summary": "1990년대 2층 콘크리트 경찰서 외관.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "나흘째 되는 날"}], "flags": [], "thumb": "thumbs/5-038.svg"}, {"id": "5-039", "chapter": "5장. 낙동강 유서", "scene": "자수 (경찰서 민원실, 나흘째 오전)", "width": 800, "height": 600, "shot": "INS · 로우 · 무진(중)", "screen": "민원실 문턱. 회색 인조석 바닥에 진흙 묻은 맨발 하나가 들어서고, 뒤로 마른 진흙 발자국 두 개가 찍혀 있다. 열린 유리문 아래쪽만 보인다.", "summary": "민원실 문턱.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "경찰서 민원실에 맨발로 걸어 들어갔다."}], "flags": [], "thumb": "thumbs/5-039.svg"}, {"id": "5-040", "chapter": "5장. 낙동강 유서", "scene": "자수 (경찰서 민원실, 나흘째 오전)", "width": 800, "height": 640, "shot": "MS · 아이레벨 · 경찰관(중)", "screen": "철제 책상 앞의 중년 경찰관이 고개를 숙이고 볼펜으로 서류를 쓰고 있다. 책상 위에는 결재판, 도장, 유선전화가 있고, 옆에서 선풍기가 돈다. 책상 위로 사람 그림자가 드리운다.", "summary": "철제 책상 앞의 중년 경찰관이 고개를 숙이고 볼펜으로 서류를 쓰고 있다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/5-040.svg"}, {"id": "5-041", "chapter": "5장. 낙동강 유서", "scene": "자수 (경찰서 민원실, 나흘째 오전)", "width": 800, "height": 1000, "shot": "BS · 오버숄더(경찰관 너머) · 무진(중), 경찰관(좌·전경)", "screen": "무진이 두 손을 배 앞에 모으고 허리를 15도 숙여 인사한다. 갈색 점퍼는 젖었다 마른 자국으로 얼룩졌고 머리에는 아직 갈대 이삭이 붙어 있다. 안경은 깨끗이 닦여 반짝인다.", "summary": "무진이 두 손을 배 앞에 모으고 허리를 15도 숙여 인사한다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그리고 말했다."}, {"type": "dialogue", "speaker": "무진", "text": "수고하십니다."}], "flags": [], "thumb": "thumbs/5-041.svg"}, {"id": "5-042", "chapter": "5장. 낙동강 유서", "scene": "자수 (경찰서 민원실, 나흘째 오전)", "width": 800, "height": 560, "shot": "CU · 아이레벨 · 경찰관(중)", "screen": "경찰관이 고개를 들고, 시선이 무진의 얼굴에서 발끝으로 천천히 내려간다. 눈동자 이동선을 점선으로 넣는다.", "summary": "경찰관이 고개를 들고, 시선이 무진의 얼굴에서 발끝으로 천천히 내려간다.", "lines": [{"type": "dialogue", "speaker": "경찰관", "text": "…네?"}], "flags": [], "thumb": "thumbs/5-042.svg"}, {"id": "5-043", "chapter": "5장. 낙동강 유서", "scene": "자수 (경찰서 민원실, 나흘째 오전)", "width": 800, "height": 800, "shot": "BS · 아이레벨 · 무진(중)", "screen": "정면. 무진이 허리를 펴고 똑바로 선다. 안경 반사광으로 눈을 가리고 입은 일자로 다문다. 배경은 흰 평면.", "summary": "정면.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "박정만 씨 사건으로 자수하러 왔습니다."}], "flags": [], "thumb": "thumbs/5-043.svg"}, {"id": "5-044", "chapter": "5장. 낙동강 유서", "scene": "자수 (경찰서 민원실, 나흘째 오전)", "width": 800, "height": 440, "shot": "INS · 하이 · 경찰관(중)", "screen": "경찰관의 손에서 볼펜이 빠져 책상에 떨어진다. 손가락은 볼펜을 쥐던 모양 그대로 굳어 있다.", "summary": "경찰관의 손에서 볼펜이 빠져 책상에 떨어진다.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "딱"}], "flags": [], "thumb": "thumbs/5-044.svg"}, {"id": "5-045", "chapter": "5장. 낙동강 유서", "scene": "자수 (경찰서 민원실, 나흘째 오전)", "width": 800, "height": 1400, "shot": "FS · 아이레벨 · 무진(중), 경찰관(좌·전경)", "screen": "전경 왼쪽에 경찰관의 벌어진 입과 굳은 어깨가 크게 걸린다. 그 너머로 맨발의 무진이 민원실 한가운데 단정히 서 있고, 진흙 발자국이 문에서 그의 발까지 이어진다. 말풍선은 무진 머리 위에 담담하게 둔다.", "summary": "전경 왼쪽에 경찰관의 벌어진 입과 굳은 어깨가 크게 걸린다.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "신발은 강가에 있습니다."}], "flags": [], "thumb": "thumbs/5-045.svg"}, {"id": "6-001", "chapter": "6장. 만기출소", "scene": "장 타이틀 (검정 화면)", "width": 800, "height": 600, "shot": "TXT · 아이레벨 · 인물 없음", "screen": "남색 바탕 중앙에 흰 장 제목을 둔다. 제목 뒤로 쇠창살 세로줄 다섯 개를 옅은 회색으로 깐다.", "summary": "남색 바탕 중앙에 흰 장 제목을 둔다.", "lines": [{"type": "caption", "speaker": "제목", "text": "6장. 만기출소"}], "flags": [], "thumb": "thumbs/6-001.svg"}, {"id": "6-002", "chapter": "6장. 만기출소", "scene": "법정 (형사법정, 공판일)", "width": 800, "height": 1200, "shot": "ELS · 부감 · 판사들(후경), 검사(좌), 변호사(우), 무진(중·전경)", "screen": "목재 법대가 높이 솟은 형사법정 설정샷. 위쪽 법대에 법복 차림의 판사 셋이 앉아 있고, 아래 왼쪽은 검사석, 오른쪽은 변호인석이다. 가운데 피고인석에 수의 차림 무진의 뒷모습이 작게 보이고, 방청석은 반쯤 차 있다.", "summary": "목재 법대가 높이 솟은 형사법정 설정샷.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "죄명은 살인미수였다."}], "flags": [], "thumb": "thumbs/6-002.svg"}, {"id": "6-003", "chapter": "6장. 만기출소", "scene": "법정 (형사법정, 공판일)", "width": 800, "height": 800, "shot": "FS · 측면 · 무진(중), 교도관(우·후경)", "screen": "피고인석의 무진. 가슴에 4519 번호표를 단 수의를 입고, 등을 의자에 대지 않은 채 꼿꼿이 앉아 두 손을 무릎 위에 가지런히 올려 두었다. 뒤쪽에 교도관 한 명이 서 있다.", "summary": "피고인석의 무진.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-003.svg"}, {"id": "6-004", "chapter": "6장. 만기출소", "scene": "법정 (형사법정, 공판일)", "width": 800, "height": 1000, "shot": "BS · 로우 · 검사(중)", "screen": "검사가 일어선 채 왼손으로 서류를 들고 오른손 검지로 피고인석을 가리킨다. 눈매는 날카롭게 가늘고 입은 한쪽으로 당겨져 있다. 배경에 대각선 집중선을 옅게 넣는다.", "summary": "검사가 일어선 채 왼손으로 서류를 들고 오른손 검지로 피고인석을 가리킨다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "법정에서 검사가 물었다."}, {"type": "dialogue", "speaker": "검사", "text": "피고인은 의사로서 그 부위를 가격하면 사람이 죽을 수 있다는 걸 알았죠?"}], "flags": [], "thumb": "thumbs/6-004.svg"}, {"id": "6-005", "chapter": "6장. 만기출소", "scene": "법정 (형사법정, 공판일)", "width": 800, "height": 440, "shot": "CU · 아이레벨 · 무진(중)", "screen": "무진이 오른손 중지로 안경 브리지를 밀어 올린다. 안경알에 흰 반사광이 한 번 스친다.", "summary": "무진이 오른손 중지로 안경 브리지를 밀어 올린다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-005.svg"}, {"id": "6-006", "chapter": "6장. 만기출소", "scene": "법정 (형사법정, 공판일)", "width": 800, "height": 720, "shot": "BS · 아이레벨 · 무진(중)", "screen": "무진이 일어서서 검사 쪽으로 몸을 돌리고 고개를 정중하게 살짝 숙인다. 두 손은 바지 솔기에 붙였다.", "summary": "무진이 일어서서 검사 쪽으로 몸을 돌리고 고개를 정중하게 살짝 숙인다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "무진은 정중하게 답했다."}, {"type": "dialogue", "speaker": "무진", "text": "네."}], "flags": [], "thumb": "thumbs/6-006.svg"}, {"id": "6-007", "chapter": "6장. 만기출소", "scene": "법정 (형사법정, 공판일)", "width": 800, "height": 800, "shot": "CU · 아이레벨 · 무진(중)", "screen": "정면 클로즈업. 표정 변화 없이 입만 움직인다. 배경은 흰 평면이고 말풍선은 테두리가 얇은 담담한 원형이다.", "summary": "정면 클로즈업.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "그래서 한 번만 쳤습니다."}], "flags": [], "thumb": "thumbs/6-007.svg"}, {"id": "6-008", "chapter": "6장. 만기출소", "scene": "법정 (형사법정, 공판일)", "width": 800, "height": 1000, "shot": "LS · 하이 · 법정 전원(중~ 손만)", "screen": "가로 3분할 몽타주. 첫 칸은 당직실 책상에서 민트 수술복 소매의 손, 둘째 칸은 개인의원 진료실 책상에서 흰 가운 소매의 손, 셋째 칸은 군복 소매의 손이 각각 같은 양식의 종이에 서명한다. 세 칸의 볼펜 각도를 똑같이 맞춰 리듬을 만든다.", "summary": "가로 3분할 몽타주.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "의대 동기들이 줄줄이 서명했다."}], "flags": [], "thumb": "thumbs/6-013.svg"}, {"id": "6-014", "chapter": "6장. 만기출소", "scene": "탄원서 (각지 → 교도소 감방)", "width": 800, "height": 520, "shot": "INS · 부감 · 인물 없음", "screen": "탄원서 본문 한 줄 극단적 클로즈업. 굵고 투박한 필체다.", "summary": "탄원서 본문 한 줄 극단적 클로즈업.", "lines": [{"type": "caption", "speaker": "손글씨", "text": "사람은 착한 놈입니다."}], "flags": [], "thumb": "thumbs/6-014.svg"}, {"id": "6-015", "chapter": "6장. 만기출소", "scene": "탄원서 (각지 → 교도소 감방)", "width": 800, "height": 600, "shot": "INS · 부감 · 인물 없음", "screen": "다른 탄원서의 한 줄 극단적 클로즈업. 작고 빽빽한 필체이고 꾹꾹 눌러 써서 종이가 살짝 패어 있다.", "summary": "다른 탄원서의 한 줄 극단적 클로즈업.", "lines": [{"type": "caption", "speaker": "손글씨", "text": "당직 바꿔 달라면 군말 없이 바꿔 주던 놈입니다."}], "flags": [], "thumb": "thumbs/6-015.svg"}, {"id": "6-016", "chapter": "6장. 만기출소", "scene": "탄원서 (각지 → 교도소 감방)", "width": 800, "height": 1000, "shot": "INS · 부감 · 인물 없음", "screen": "부채꼴로 펼친 탄원서 묶음 위로 망치 모양 그림자가 길게 비스듬히 드리운다. 실제 망치는 그리지 않고 그림자만 둔다. 종이 위의 서명들은 그림자 속에서도 또렷하다.", "summary": "부채꼴로 펼친 탄원서 묶음 위로 망치 모양 그림자가 길게 비스듬히 드리운다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "망치를 든 사람에게 착하다는 평이 붙는 것, 그게 그 시절 의국의 의리였다."}], "flags": ["violence"], "thumb": "thumbs/6-016.svg"}, {"id": "6-017", "chapter": "6장. 만기출소", "scene": "탄원서 (각지 → 교도소 감방)", "width": 800, "height": 600, "shot": "INS · 아이레벨 · 무진(손)", "screen": "감방의 회색 시멘트 벽. 무진의 긴 손가락이 종이 모서리에 밥풀을 하나씩 눌러 붙인다. 손톱 끝까지 신중하다.", "summary": "감방의 회색 시멘트 벽.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "감형은 없었지만, 무진은 그 종이 묶음을 감방 벽에 붙여 두었다."}], "flags": [], "thumb": "thumbs/6-017.svg"}, {"id": "6-018", "chapter": "6장. 만기출소", "scene": "탄원서 (각지 → 교도소 감방)", "width": 800, "height": 960, "shot": "LS · 뒷모습 · 무진(중)", "screen": "탄원서 종이들이 벽 한 면을 가득 덮었고, 그 앞에 무진이 정좌한 뒷모습이 있다. 위쪽 쇠창살 창으로 들어온 사각형 빛이 종이 몇 장을 비춘다.", "summary": "탄원서 종이들이 벽 한 면을 가득 덮었고, 그 앞에 무진이 정좌한 뒷모습이 있다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-018.svg"}, {"id": "6-019", "chapter": "6장. 만기출소", "scene": "선생님 (교도소 감방, 낮)", "width": 800, "height": 1000, "shot": "LS · 하이 · 무진(중), 수감자들(좌·우)", "screen": "장판을 깐 좁은 감방 설정샷. 개어 쌓은 이불, 구석의 칸막이 화장실, 높은 곳의 쇠창살 창이 보인다. 수감자 일고여덟 명이 벽을 따라 앉아 있고, 가운데에 무진이 정좌해 있다.", "summary": "장판을 깐 좁은 감방 설정샷.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "교도소에서 그는 '선생님'으로 불렸다."}], "flags": ["intimate"], "thumb": "thumbs/6-019.svg"}, {"id": "6-020", "chapter": "6장. 만기출소", "scene": "선생님 (교도소 감방, 낮)", "width": 800, "height": 640, "shot": "MS · 아이레벨 · 수감자들(좌~우)", "screen": "무진 앞에 수감자 넷이 무릎 걸음으로 한 줄로 늘어서 있다. 각자 발, 엉덩이, 허리를 손으로 감싸 쥐고 간절한 눈빛을 보낸다.", "summary": "무진 앞에 수감자 넷이 무릎 걸음으로 한 줄로 늘어서 있다.", "lines": [{"type": "dialogue", "speaker": "수감자", "text": "선생님…"}], "flags": [], "thumb": "thumbs/6-020.svg"}, {"id": "6-021", "chapter": "6장. 만기출소", "scene": "선생님 (교도소 감방, 낮)", "width": 800, "height": 800, "shot": "MS · 측면 · 무진(좌), 수감자A(우)", "screen": "무좀. 무진이 한쪽 무릎을 꿇고 수감자A의 맨발을 두 손으로 받쳐 든 채, 발가락 사이를 벌려 표본을 보듯 들여다본다. 안경에 흰 반사광이 번쩍인다. 수감자A는 고개를 돌리고 부끄러워 볼을 붉힌다.", "summary": "무좀.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "감방 동료들의 무좀,"}], "flags": [], "thumb": "thumbs/6-021.svg"}, {"id": "6-022", "chapter": "6장. 만기출소", "scene": "선생님 (교도소 감방, 낮)", "width": 800, "height": 640, "shot": "CU · 아이레벨 · 무진(중)", "screen": "치질. 화면에는 무진의 진지한 얼굴만 있다. 시선은 컷 아래쪽 프레임 밖을 향하고, 전경에는 수감자들이 들고 선 담요 가림막의 가장자리가 걸린다. 가림막 너머에서 작은 땀방울이 튄다.", "summary": "치질.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "치질,"}, {"type": "dialogue", "speaker": "수감자B", "text": "아이고…"}], "flags": [], "thumb": "thumbs/6-022.svg"}, {"id": "6-023", "chapter": "6장. 만기출소", "scene": "선생님 (교도소 감방, 낮)", "width": 800, "height": 880, "shot": "MS · 하이 · 무진(중), 수감자C(전경)", "screen": "허리 디스크. 반듯이 누운 수감자C의 다리를 무진이 무릎을 편 채 천천히 들어 올린다(하지직거상검사). 수감자C는 이를 악물고 얼굴을 찡그린다. 무진은 다리 각도를 눈대중으로 재듯 고개를 기울인다.", "summary": "허리 디스크.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "허리 디스크를 봐 주었다."}, {"type": "dialogue", "speaker": "수감자C", "text": "아이고!"}], "flags": [], "thumb": "thumbs/6-023.svg"}, {"id": "6-024", "chapter": "6장. 만기출소", "scene": "선생님 (교도소 감방, 낮)", "width": 800, "height": 560, "shot": "MS · 아이레벨 · 무진(중), 수감자들(후경)", "screen": "무진이 무표정으로 안경을 밀어 올리고, 뒤의 수감자들은 일제히 두 손을 모으고 경외의 눈빛을 보낸다. 수감자들 머리 위에 작은 반짝이 효과.", "summary": "무진이 무표정으로 안경을 밀어 올리고, 뒤의 수감자들은 일제히 두 손을 모으고 경외의 눈빛을 보낸다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/6-024.svg"}, {"id": "6-025", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 960, "shot": "MS · 아이레벨 · 방주먹(우)", "screen": "감방 구석 벽에 등을 기대고 한쪽 무릎을 세워 앉은 40대 사내. 올백 머리에 하이라이트가 반사되고, 가슴에 7703 번호표를 단 수의를 입었다. 한쪽 입꼬리만 올라가 있고 눈은 반쯤 감겨 있다.", "summary": "감방 구석 벽에 등을 기대고 한쪽 무릎을 세워 앉은 40대 사내.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그중 사기 혐의로 들어온 방주먹이라는 사내가 있었다."}], "flags": [], "thumb": "thumbs/6-025.svg"}, {"id": "6-026", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 640, "shot": "INS · 아이레벨 · 인물 없음", "screen": "가로 2분할 도식. 왼쪽 칸에는 꽉 쥔 주먹 그림 위에 큰 X, 오른쪽 칸에는 고무줄로 묶은 지폐 뭉치 그림 위에 큰 O를 둔다. 단순한 아이콘풍으로 그린다.", "summary": "가로 2분할 도식.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "주먹은 손이 아니라 현금 뭉치를 가리키는 별명이었다."}], "flags": [], "thumb": "thumbs/6-026.svg"}, {"id": "6-027", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 800, "shot": "LS · 아이레벨 · 방주먹(좌), 무진(우)", "screen": "저녁 감방. 다른 수감자들은 이불을 덮고 누워 있고, 쇠창살 창 아래 벽에 방주먹과 무진만 나란히 기대앉아 있다. 천장의 작은 백열등 하나가 둘을 노랗게 비춘다.", "summary": "저녁 감방.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": ["intimate"], "thumb": "thumbs/6-027.svg"}, {"id": "6-028", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 640, "shot": "BS · 오버숄더(무진 너머) · 방주먹(중), 무진(우·전경)", "screen": "방주먹이 무진 쪽으로 고개를 돌리고 가벼운 웃음을 띤다. 전경 오른쪽에 무진의 어깨와 안경테 일부가 걸린다.", "summary": "방주먹이 무진 쪽으로 고개를 돌리고 가벼운 웃음을 띤다.", "lines": [{"type": "dialogue", "speaker": "방주먹", "text": "선생님, 나가면 뭐 하실 겁니까?"}], "flags": [], "thumb": "thumbs/6-028.svg"}, {"id": "6-029", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 640, "shot": "BS · 오버숄더(방주먹 너머) · 무진(중), 방주먹(좌·전경)", "screen": "리버스숏. 무진은 앞만 보고 무표정하게 답한다. 시선은 맞은편 벽에 붙은 탄원서들을 향한다.", "summary": "리버스숏.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "수련은 끝났다. 전문의는 글렀고."}], "flags": [], "thumb": "thumbs/6-029.svg"}, {"id": "6-030", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 480, "shot": "CU · 측면 · 무진(중)", "screen": "무진의 옆얼굴 클로즈업. 안경 너머 눈이 한 번 깜빡인다.", "summary": "무진의 옆얼굴 클로즈업.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "일반의지."}], "flags": [], "thumb": "thumbs/6-030.svg"}, {"id": "6-031", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 640, "shot": "CU · 아이레벨 · 방주먹(중)", "screen": "방주먹이 상체를 무진 쪽으로 기울인다. 눈썹 한쪽이 올라가고 입꼬리가 실룩인다.", "summary": "방주먹이 상체를 무진 쪽으로 기울인다.", "lines": [{"type": "dialogue", "speaker": "방주먹", "text": "일반의면 돈 됩니까?"}], "flags": [], "thumb": "thumbs/6-031.svg"}, {"id": "6-032", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 720, "shot": "BS · 아이레벨 · 무진(중)", "screen": "무진이 엄지와 검지로 턱을 짚고 시선을 천장 백열등 쪽으로 올린다. 말풍선 없이 생각하는 한 박자. 백열등 주위에 날벌레 하나가 맴돈다.", "summary": "무진이 엄지와 검지로 턱을 짚고 시선을 천장 백열등 쪽으로 올린다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "무진은 잠시 생각하고 답했다."}], "flags": [], "thumb": "thumbs/6-032.svg"}, {"id": "6-033", "chapter": "6장. 만기출소", "scene": "방주먹 (교도소 감방, 저녁)", "width": 800, "height": 800, "shot": "CU · 아이레벨 · 무진(중)", "screen": "무진의 정면 클로즈업. 안경알 전체가 흰 반사광으로 덮여 있고 입꼬리가 아주 조금, 1mm만 올라간다. 배경은 남색 평면.", "summary": "무진의 정면 클로즈업.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "얼굴이면 된다."}], "flags": [], "thumb": "thumbs/6-0 업.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "상철은 일찌감치 미용으로 자리를 잡아 보톡스와 필러로 건물을 올린 원장이었다."}], "flags": [], "thumb": "thumbs/7-003.svg"}, {"id": "7-004", "chapter": "7장. 2호점", "scene": "상철의 의원 (부산 번화가 대로변, 낮)", "width": 800, "height": 840, "shot": "FS · 아이레벨 · 무진(중)", "screen": "건물 앞 인도에 갈색 점퍼 차림의 무진이 혼자 서 있다. 오른손에 소지품이 든 얇은 비닐봉지 하나, 왼손은 옆구리에 붙였다. 고개를 들어 건물을 올려다보는데, 둥근 안경 렌즈에 건물 간판이 작게 비친다.", "summary": "건물 앞 인도에 갈색 점퍼 차림의 무진이 혼자 서 있다.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/7-004.svg"}, {"id": "7-005", "chapter": "7장. 2호점", "scene": "상철의 의원 (부산 번화가 대로변, 낮)", "width": 800, "height": 480, "shot": "INS · 아이레벨 · 인물 없음", "screen": "회상 인서트. 감방 회색 벽에 밥풀로 붙은 탄원서 묶음, 맨 위 서명란에 '오상철' 손글씨(Nanum Pen Script)가 가장 크게 적혀 있다. 색 바랜 세피아 톤, 컷 테두리를 흐리게 처리한다.", "summary": "회상 인서트.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "탄원서에 맨 먼저 서명한 사람도 상철이었다."}], "flags": [], "thumb": "thumbs/7-005.svg"}, {"id": "7-006", "chapter": "7장. 2호점", "scene": "상철의 의원 (부산 번화가 대로변, 낮)", "width": 800, "height": 1000, "shot": "MS · 아이레벨 · 상철(우), 무진(좌)", "screen": "의원 로비. 흰 가운 차림의 상철이 두 팔을 활짝 벌리고 오른쪽에서 달려 들어온다. 볼 홍조가 진하고 입을 크게 벌려 웃으며, 옆머리가 바람에 날린다. 배경에 방사형 꽃 톤과 속도선을 넣고, 무진은 비닐봉지를 든 채 허리를 15도 숙여 인사한다.", "summary": "의원 로비.", "lines": [{"type": "dialogue", "speaker": "상철", "text": "무진아!"}, {"type": "sfx", "speaker": "SFX", "text": "다다다"}], "flags": [], "thumb": "thumbs/7-006.svg"}, {"id": "7-007", "chapter": "7장. 2호점", "scene": "2호점 제안 (상철의 원장실, 낮)", "width": 800, "height": 720, "shot": "MS · 아이레벨 · 상철(좌), 무진(우)", "screen": "가죽 소파에 마주 앉은 두 사람. 유리 탁자 위에 김이 오르는 녹차 두 잔, 벽에는 의사 면허증과 학회 사진 액자가 걸려 있다. 상철은 몸을 앞으로 숙여 무진의 무릎 위 손을 내려다보고, 무진의 긴 손가락은 가지런히 포개져 있다.", "summary": "가죽 소파에 마주 앉은 두 사람.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/7-007.svg"}, {"id": "7-008", "chapter": "7장. 2호점", "scene": "2호점 제안 (상철의 원장실, 낮)", "width": 800, "height": 880, "shot": "BS · 오버숄더(무진 너머) · 상철(중), 무 umb": "thumbs/7-022.svg"}, {"id": "7-023", "chapter": "7장. 2호점", "scene": "1년 뒤 몽타주 (2호점, 낮)", "width": 800, "height": 1640, "shot": "INS · 부감 · 인물 없음", "screen": "세로 3단 분할 흐름도. 상단: 상철의 책상, 결재함은 비어 있고 상철의 손이 볼펜만 돌린다. 중단: 무진의 책상에 결재 서류가 높이 쌓이고, 긴 손가락이 도장을 찍는다. 하단: 방주먹의 금고 다이얼이 금빛으로 돌아가며 서류가 빨려 들어간다. 세 단을 금색 점선 화살표로 위에서 아래로 잇는다.", "summary": "세로 3단 분할 흐름도.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그런데 결재 서류는 전부 무진의 책상을 거쳐 방주먹의 금고로 갔다."}], "flags": [], "thumb": "thumbs/7-023.svg"}, {"id": "7-024", "chapter": "7장. 2호점", "scene": "상철의 깨달음 (2호점 원장실, 밤)", "width": 800, "height": 800, "shot": "MS · 아이레벨 · 상철(중)", "screen": "불 꺼진 의원, 원장실 스탠드만 켜져 있다. 상철이 책상 앞에 앉아 한 손에 자기 명함, 다른 손에 텅 빈 결재함을 들고 번갈아 본다. 얼굴 아래쪽에서 스탠드 빛이 올라온다.", "summary": "불 꺼진 의원, 원장실 스탠드만 켜져 있다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "상철은 늦게서야 깨달았다."}], "flags": [], "thumb": "thumbs/7-024.svg"}, {"id": "7-025", "chapter": "7장. 2호점", "scene": "상철의 깨달음 (2호점 원장실, 밤)", "width": 800, "height": 400, "shot": "ECU · 아이레벨 · 상철(중)", "screen": "상철의 눈. 동공이 점처럼 수축하고, 이마에서 땀 한 방울이 흘러내린다.", "summary": "상철의 눈.", "lines": [{"type": "sfx", "speaker": "SFX(작게)", "text": "꿀꺽"}], "flags": ["intimate"], "thumb": "thumbs/7-025.svg"}, {"id": "7-026", "chapter": "7장. 2호점", "scene": "상철의 깨달음 (2호점 원장실, 밤)", "width": 800, "height": 1040, "shot": "MS · 하이 · 상철(중)", "screen": "배경을 흰색으로 날리고, 상철 머리 주변에 물음표 여러 개와 식은땀 방울을 띄운다. 발밑 그림자가 텅 빈 양복바지 모양의 실루엣으로 길게 늘어진다. 상철은 명함을 든 채 굳어 있다.", "summary": "배경을 흰색으로 날리고, 상철 머리 주변에 물음표 여러 개와 식은땀 방울을 띄운다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "자기가 바지사장이었다는 것을."}], "flags": [], "thumb": "thumbs/7-026.svg"}, {"id": "7-027", "chapter": "7장. 2호점", "scene": "레이저실 (2호점 시술실, 낮)", "width": 800, "height": 920, "shot": "FS · 아이레벨 · 상철(좌), 무진(우·후경)", "screen": "시술실 문이 벌컥 열리고 상철이 서류 한 장을 구겨 쥔 채 문턱에 서 있다. 눈썹이 팔자로 처지고 홍조 대신 창백한 얼굴. 후경에서 흰 가운 차림의 무진이 레이저 기계 앞에 등을 보이고 서 있다.", "summary": "시술실 문이 벌컥 열리고 상철이 서류 한 장을 구겨 쥔 채 문턱에 서 있다.", "lines": [{"type": "dialogue" bs/7-032.svg"}, {"id": "7-033", "chapter": "7장. 2호점", "scene": "나는 내 편이다 (흰 바탕 상징 공간)", "width": 800, "height": 720, "shot": "BS · 아이레벨 · 방주먹(좌), 상철(우)", "screen": "가로 2분할. 왼쪽 칸은 검정 배경에 선글라스 쓴 방주먹, 오른쪽 칸은 분홍 배경에 홍조 띤 상철. 두 칸 사이 가운데 틈이 비어 있다. 아래쪽 내레이션 박스 두 개.", "summary": "가로 2분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "교도소 동기와 의대 동기."}, {"type": "narration", "speaker": "내레이션", "text": "무진은 둘 중 누구 편이었냐고 물으면 망설임 없이 답했다."}], "flags": [], "thumb": "thumbs/7-033.svg"}, {"id": "7-034", "chapter": "7장. 2호점", "scene": "나는 내 편이다 (흰 바탕 상징 공간)", "width": 800, "height": 800, "shot": "CU · 아이레벨 · 무진(중)", "screen": "무진의 얼굴 정면. 두 분할 칸이 좌우로 밀려나고 무진만 흰 바탕 가운데 남는다. 안경 양쪽 렌즈에 금빛 반사광, 표정은 담담하다. 말풍선을 크게.", "summary": "무진의 얼굴 정면.", "lines": [{"type": "dialogue", "speaker": "무진", "text": "나는 내 편이다."}], "flags": [], "thumb": "thumbs/7-034.svg"}, {"id": "7-035", "chapter": "7장. 2호점", "scene": "확장 (몽타주)", "width": 800, "height": 960, "shot": "FS · 로우 · 무진(중)", "screen": "2호점 간판 아래 흰 가운의 무진이 뒷짐을 지고 선다. 간판의 '오상철' 글자는 그대로인데 무진의 그림자가 간판을 덮는다.", "summary": "2호점 간판 아래 흰 가운의 무진이 뒷짐을 지고 선다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "그렇게 그는 병원을 먹었다."}], "flags": [], "thumb": "thumbs/7-035.svg"}, {"id": "7-036", "chapter": "7장. 2호점", "scene": "확장 (몽타주)", "width": 800, "height": 640, "shot": "LS · 아이레벨 · 인물 없음", "screen": "가로 3분할. 각 칸에 같은 디자인의 미용의원 간판이 하나씩, 지점 번호만 '2', '3', '4'로 다르다. 칸이 오른쪽으로 갈수록 건물이 더 높다.", "summary": "가로 3분할.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "3호점, 4호점이 생겼다."}], "flags": [], "thumb": "thumbs/7-036.svg"}, {"id": "7-037", "chapter": "7장. 2호점", "scene": "확장 (몽타주)", "width": 800, "height": 720, "shot": "INS · 부감 · 인물 없음", "screen": "부산 지적도 위에 필지가 하나씩 금색으로 칠해진다. 화면 가장자리에 시술 차트가 한 장씩 넘어가는 모습을 겹친다.", "summary": "부산 지적도 위에 필지가 하나씩 금색으로 칠해진다.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "시술 하나에 땅이 하나씩 늘었다."}], "flags": [], "thumb": "thumbs/7-037.svg"}, {"id": "7-038", "chapter": "7장. 2호점", "scene": "확장 (몽타주)", aker": "내레이션", "text": "쉰 살이 되던 해, 무진은 새장가를 갔다."}], "flags": [], "thumb": "thumbs/8-013.svg"}, {"id": "8-014", "chapter": "8장. 새장가", "scene": "쉰 살의 새장가 (무진의 집 거울 앞, 아침)", "width": 800, "height": 840, "shot": "MS · 하이 · 무진(좌), 신부(우)", "screen": "회상 컷(가장자리 흐림). 의원 시술실, 시술대에 누운 여성 고객의 얼굴 옆에서 흰 가운의 무진이 실 리프팅용 가는 바늘을 들고 각도를 잰다. 피부를 뚫는 장면은 그리지 않는다. 고객은 눈을 감고 편안하게 웃는다.", "summary": "회상 컷(가장자리 흐림).", "lines": [{"type": "narration", "speaker": "내레이션", "text": "신부는 그의 의원에서 실 리프팅을 받던 고객이었다."}], "flags": [], "thumb": "thumbs/8-014.svg"}, {"id": "8-015", "chapter": "8장. 새장가", "scene": "결혼식 (해운대 특급호텔 연회장, 오후)", "width": 800, "height": 1320, "shot": "ELS · 앙각 · 인물 없음", "screen": "해운대 바다를 등진 고층 호텔 외관. 실제 호텔 로고나 이름은 넣지 않는다. 맑은 하늘과 바다 반짝임, 정문 앞에 웨딩 화환이 줄지어 있다.", "summary": "해운대 바다를 등진 고층 호텔 외관.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "결혼식장은 해운대 특급호텔이었고,"}], "flags": [], "thumb": "thumbs/8-015.svg"}, {"id": "8-016", "chapter": "8장. 새장가", "scene": "결혼식 (해운대 특급호텔 연회장, 오후)", "width": 800, "height": 1000, "shot": "LS · 부감 · 인물 없음(하객들)", "screen": "연회장 전경. 샹들리에 세 개, 흰 꽃 장식, 원형 테이블들. 중앙 통로 끝에 단상이 있다. 하객들은 작은 실루엣으로만 처리한다.", "summary": "연회장 전경.", "lines": [{"type": "dialogue", "speaker": "", "text": "(무음)"}], "flags": [], "thumb": "thumbs/8-016.svg"}, {"id": "8-017", "chapter": "8장. 새장가", "scene": "결혼식 (해운대 특급호텔 연회장, 오후)", "width": 800, "height": 800, "shot": "MS · 아이레벨 · 방주먹(중)", "screen": "하객석 맨 앞줄 한가운데 앉은 방주먹. 올백 머리에 흰 기가 섞였고 금목걸이가 더 굵어졌다. 선글라스를 쓴 채 다리를 꼬고 앉아 연회장 안에서도 혼자 어둡다. 테이블 위 명패에 '본사'라고만 적혀 있다.", "summary": "하객석 맨 앞줄 한가운데 앉은 방주먹.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "하객석 맨 앞줄엔 방주먹이 앉았다."}], "flags": [], "thumb": "thumbs/8-017.svg"}, {"id": "8-018", "chapter": "8장. 새장가", "scene": "결혼식 (해운대 특급호텔 연회장, 오후)", "width": 800, "height": 640, "shot": "INS · 아이레벨 · 인물 없음", "screen": "둘째 줄 테이블의 빈 의자 하나. 의자 앞 이름표에 '오상철'. 양옆 의자에는 하객 팔꿈치만 걸려 있다.", "summary": "둘째 줄 테이블의 빈 의자 하나.", "lines": [{"type": "narration", "speaker": "내레이션", "text": "상철은 오지 않았다."}], const toast=t=>{const e=$('#toast');e.textContent=t;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,1600)};
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(D.cuts))}catch(e){}};
const linesToText=ls=>(ls||[]).map(l=>[l.type,l.speaker,l.text].join(' | ')).join('\n');
const textToLines=t=>t.split('\n').map(s=>s.trim()).filter(Boolean).map(s=>{const p=s.split('|').map(x=>x.trim());return p.length>=3?{type:p[0],speaker:p[1],text:p.slice(2).join(' | ')}:{type:'dialogue',speaker:'',text:s}});
const dur=c=>{const n=(c.lines||[]).reduce((a,l)=>a+l.text.length,0);return Math.round(Math.min(8,Math.max(1.5,1.2+n*0.075+(c.height||800)/1600))*10)/10};
const SC={ECU:'slow push-in (macro)',CU:'slow push-in',INS:'insert hold, rack focus',BS:'static hold, subtle parallax',MS:'static hold, subtle parallax',FS:'slow pan',LS:'slow tilt down',ELS:'slow tilt down',TXT:'hold, text fade'};
const camera=c=>{const t=c.screen||'';if(t.includes('집중선'))return'snap zoom + shake 4f';if(t.includes('분할'))return'cut sequence (split)';const m=(c.shot||'').match(/^\s*(ECU|CU|BS|MS|FS|LS|ELS|INS|TXT)\b/);if(m)return SC[m[1]];if(t.includes('클로즈업'))return'slow push-in';if(t.includes('집중선'))return'snap zoom + shake 4f';if(t.includes('원경')||(c.height||0)>=1100)return'slow tilt down';if(t.includes('분할'))return'cut sequence (split)';return'static hold, subtle parallax'};
function who(c){const txt=(c.screen||c.summary||'')+JSON.stringify(c.lines||[]);return D.characters.filter(h=>txt.includes(h.name)||(h.aliases||[]).some(a=>txt.includes(a))).map(h=>`- ${h.name}: ${h.look}`).join('\n')}
function neg(c){const T=D.tracks;let r=[...(T.global_negative||[])];const f=c.flags||[];if(f.includes('intimate'))r=r.concat(T.intimate_rule||[]);if(f.includes('violence'))r=r.concat(T.violence_rule||[]);if(f.includes('self_harm_theme'))r=r.concat(T.self_harm_rule||[]);return r.map(x=>'- '+x).join('\n')}
function prompt(tr,c){
  const t=(D.tracks.tracks||{})[tr]||{};const L=(c.lines||[]).map(l=>`  - [${l.type}] ${l.speaker?l.speaker+': ':''}${l.text}`).join('\n');
  const scr=c.screen||c.summary||'';const note=(c.notes||{})[tr]?`\n- 추가 지시: ${c.notes[tr]}`:'';
  const head=`## ${c.id} (${c.chapter||''}${c.scene?' / '+c.scene:''})\n`+(c.shot?`- 샷·앵글·인물: ${c.shot}\n`:'');
  if(tr==='webtoon_real'||tr==='webtoon_adult')return head+`**이미지 프롬프트**\n${t.style||''}\n- 캔버스: ${c.width||800}×${c.height||800} (세로 스크롤 컷)\n- 시대·장소: ${D.style.era||''}\n- 화면·연출: ${scr}\n- 등장인물(외형 고정값):\n${who(c)||'- (인물 없음 또는 실루엣)'}\n- 조명·색: ${D.style.palette_hint||''}\n- 말풍선·글자는 이미지에 넣지 말 것 (레터링은 후공정)${note}\n\n**레터링(후공정)**\n${L||'  - (없음)'}\n\n**금지·수위**\n${neg(c)}\n`;
  if(tr==='shorts')return head+`- 길이: ${dur(c)}초 / 9:16 (1080×1920)\n- 카메라: ${camera(c)}\n- 화면: ${scr}${note}\n- 자막·VO:\n${L||'  - (무음)'}\n- 금지·수위:\n${neg(c)}\n`;
  return head+`- 샷 길이: ${dur(c)}초 @24fps (${Math.round(dur(c)*24)}프레임)\n- 카메라: ${camera(c)}\n- 레이어: BG / 인물 / FX / 레터링\n- 연기·화면: ${scr}${note}\n- 대사(립싱크·VO):\n${L||'  - (없음)'}\n- 인물 시트:\n${who(c)||'- (없음)'}\n- 금지·수위:\n${neg(c)}\n`;
}
function initSelects(){
  const ch=[...new Set(D.cuts.map(c=>c.chapter))];$('#chap').innerHTML='<option value="">전체 장 ('+D.cuts.length+'컷)</option>'+ch.map(c=>`<option>${esc(c)}</option>`).join('');
  const tr=Object.entries((D.tracks||{}).tracks||{});$('#track').innerHTML=tr.map(([k,v])=>`<option value="${k}">${esc(v.title)}</option>`).join('')||'<option value="webtoon_real">실사 웹툰</option>';
}
function renderList(){
  const f=$('#chap').value;
  $('#list').innerHTML=D.cuts.filter(c=>!f||c.chapter===f).map(c=>`<div class="item${sel===c.id?' on':''}" data-id="${c.id}"><img src="../${esc(c.thumb)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"><div><b>${c.id}</b>${(c.flags||[]).includes('intimate')?'<i class="tag">19</i>':''}${(c.flags||[]).includes('violence')?'<i class="tag">폭력</i>':''}<span>${esc((c.shot?c.shot.split('·')[0].trim()+' · ':'')+(c.summary||c.screen))}</span></div></div>`).join('');
}
function renderMain(){
  const c=D.cuts.find(x=>x.id===sel);if(!c)return;const tr=$('#track').value;
  const renders=Object.keys((D.tracks||{}).tracks||{}).map(k=>`<figure><img src="../renders/${k}/${c.id}.png" alt="" onerror="this.parentElement.style.display='none'"><figcaption>${esc(D.tracks.tracks[k].title)} 결과 · renders/${k}/${c.id}.png</figcaption></figure>`).join('');
  $('#main').innerHTML=`<h2 style="margin:0 0 4px">${c.id} <small class="hint">${esc(c.chapter)} · ${c.width}×${c.height}</small></h2>
  <div class="row"><div class="imgs"><figure><img src="../${esc(c.thumb)}" alt="${esc(c.summary)}"><figcaption>콘티 썸네일 · ${esc(c.thumb)} (같은 이름의 파일로 교체하면 반영)</figcaption></figure>${renders}</div>
  <div>
  <label>장면</label><input type="text" id="f-scene" value="${esc(c.scene||'')}">
  <label>샷 · 앵글 · 인물(위치)  — 예: BS · 오버숄더(정만 너머) · 인턴(중), 정만(좌·전경)</label><input type="text" id="f-shot" value="${esc(c.shot||'')}">
  <label>한 줄 요약</label><input type="text" id="f-summary" value="${esc(c.summary)}">
  <label>세로 높이(px, 폭 800 기준)</label><input type="number" id="f-height" value="${c.height}">
  <label>화면·연출</label><textarea id="f-screen" rows="5">${esc(c.screen)}</textarea>
  <label>대사·내레이션·SFX — 한 줄에 하나, "종류 | 화자 | 내용" (종류: dialogue, narration, sfx, thought, whisper, caption)</label><textarea id="f-lines" rows="6">${esc(linesToText(c.lines))}</textarea>
  <div class="flags"><label>수위 태그</label>${['intimate','violence','self_harm_theme'].map(f=>`<label><input type="checkbox" data-flag="${f}" ${(c.flags||[]).includes(f)?'checked':''}>${f}</label>`).join('')}</div>
  <label>이 트랙 전용 추가 지시 (${esc(((D.tracks.tracks||{})[tr]||{}).title||tr)})</label><textarea id="f-note" rows="3">${esc((c.notes||{})[tr]||'')}</textarea>
  <label>미리보기 — 현재 트랙 프롬프트</label><pre id="pv"></pre>
  </div></div>`;
  const upd=()=>{c.scene=$('#f-scene').value;c.shot=$('#f-shot').value;c.summary=$('#f-summary').value;c.height=+$('#f-height').value||c.height;c.screen=$('#f-screen').value;c.lines=textToLines($('#f-lines').value);c.flags=[...document.querySelectorAll('[data-flag]:checked')].map(e=>e.dataset.flag);c.notes=c.notes||{};c.notes[tr]=$('#f-note').value;$('#pv').textContent=prompt(tr,c);persist();renderList()};
  $('#main').querySelectorAll('input,textarea').forEach(e=>e.addEventListener('input',upd));$('#main').querySelectorAll('[data-flag]').forEach(e=>e.addEventListener('change',upd));
  $('#pv').textContent=prompt(tr,c);
}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
$('#list').addEventListener('click',e=>{const it=e.target.closest('.item');if(!it)return;sel=it.dataset.id;renderList();renderMain()});
$('#chap').addEventListener('change',renderList);$('#track').addEventListener('change',renderMain);
$('#copy').addEventListener('click',async()=>{const c=D.cuts.find(x=>x.id===sel);if(!c)return toast('컷을 먼저 고르세요');try{await navigator.clipboard.writeText(prompt($('#track').value,c));toast('복사했습니다')}catch(e){toast('복사 실패: 미리보기에서 직접 복사하세요')}});
$('#dlTrack').addEventListener('click',()=>{const tr=$('#track').value;const t=((D.tracks.tracks||{})[tr]||{});download(`${tr}_ALL.md`,`# ${t.title||tr}\n\n${t.brief||''}\n\n`+D.cuts.map(c=>prompt(tr,c)).join('\n'),'text/markdown')});
$('#dlJson').addEventListener('click',()=>download('cuts.json',JSON.stringify(D.cuts,null,2),'application/json'));
$('#load').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());if(Array.isArray(j))D.cuts=j;else D={...D,...j};persist();initSelects();renderList();toast('불러왔습니다')}catch(err){toast('JSON을 읽지 못했습니다')}});
initSelects();renderList();
if(!D.cuts.length)$('#main').innerHTML='<p class="hint">데이터가 없습니다. 킷 폴더에서 <code>python kit.py editor</code>를 실행해 tools/editor_ready.html을 여시거나, 위의 “불러오기”로 data/cuts.json을 여세요.</p>';
</script>
</body>
</html>
